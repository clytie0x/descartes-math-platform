title = "หาค่ารากที่สองด้วยการแยกตัวประกอบ"
level = 2
type = "number"
answer = "36"
truth = "sqrt(1296)"
hints = ['แยกตัวประกอบเฉพาะของ $1296$ เริ่มจากหารด้วย $2$ ไปเรื่อยๆ', '$1296 = 2^4 \times 3^4$ แบ่งตัวประกอบเป็นสองชุดที่เหมือนกัน']
statement = '''
หาค่าของ $\sqrt{1296}$
'''
solution = '''
1. $1296 = 2 \times 2 \times 2 \times 2 \times 3 \times 3 \times 3 \times 3$
2. แบ่งเป็นสองชุดเท่ากัน ชุดละ $2 \times 2 \times 3 \times 3 = 36$ ได้ $1296 = 36 \times 36$
3. $\sqrt{1296} = 36$
'''

