title = "แปลงดอกไม้รูปสี่เหลี่ยมจัตุรัส"
level = 2
type = "number"
unit = "เมตร"
answer = "3.6"
truth = "Rational(round(sqrt(13) * 10), 10)"
hints = ['ด้านยาว $\sqrt{13}$ เมตร เริ่มจาก $3^2 = 9$ และ $4^2 = 16$', 'ลองยกกำลังสอง $3.6$ กับ $3.7$ แล้วดูว่า $\sqrt{13}$ อยู่ซีกไหนของ $3.65$']
statement = '''
ชมรมเกษตรจะทำแปลงดอกไม้รูปสี่เหลี่ยมจัตุรัส ให้มีพื้นที่ $13$ ตารางเมตร แปลงนี้ยาวด้านละประมาณกี่เมตร ตอบเป็นทศนิยมหนึ่งตำแหน่ง
'''
solution = '''
1. ด้านยาว $\sqrt{13}$ เมตร และ $9 < 13 < 16$ จึงได้ $3 < \sqrt{13} < 4$
2. $3.6^2 = 12.96$ และ $3.7^2 = 13.69$ จึงได้ $3.6 < \sqrt{13} < 3.7$
3. $3.65^2 = 13.3225$ มากกว่า $13$ จึงได้ $\sqrt{13} < 3.65$ ปัดเป็นทศนิยมหนึ่งตำแหน่งได้ $3.6$ เมตร
'''

[[wrong]]
answer = "3.7"
message = "3.65² = 13.3225 มากกว่า 13 แล้ว √13 จึงน้อยกว่า 3.65 ปัดได้ 3.6"

[[wrong]]
