title = "รากที่สามของทศนิยมลบ"
level = 2
type = "number"
answer = "-0.7"
truth = "real_root(Rational('-0.343'), 3)"
hints = ['$7^3 = 343$ ลองคิดว่า $0.7^3$ ได้ทศนิยมกี่ตำแหน่ง', 'จำนวนลบยกกำลังสามได้จำนวนลบ']
statement = '''
หาค่าของ $\sqrt[3]{-0.343}$
'''
solution = '''
1. $0.7^3 = 0.7 \times 0.7 \times 0.7 = 0.343$ ทศนิยมหนึ่งตำแหน่งยกกำลังสามได้สามตำแหน่ง
2. ลบคูณกันสามตัวได้ลบ $(-0.7)^3 = -0.343$
3. $\sqrt[3]{-0.343} = -0.7$
'''

