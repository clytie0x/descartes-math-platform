title = "ลำดับการหาตำแหน่ง √5 บนเส้นจำนวน"
level = 2
type = "order"
steps = [
  'เลือกด้านประกอบมุมฉากยาว $2$ และ $1$ หน่วย เพราะ $2^2 + 1^2 = 5$',
  'ที่จุด $2$ บนเส้นจำนวน สร้างเส้นตั้งฉากกับเส้นจำนวนยาว $1$ หน่วย',
  'ลากเส้นจากจุด $0$ ไปยังปลายของเส้นตั้งฉาก ได้ด้านตรงข้ามมุมฉากยาว $\sqrt{5}$ หน่วย',
  'กางวงเวียนยาวเท่าด้านตรงข้ามมุมฉาก ใช้จุด $0$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัดเส้นจำนวนทางขวา',
  'จุดที่ส่วนโค้งตัดเส้นจำนวนคือ $\sqrt{5}$ ซึ่งอยู่ระหว่าง $2$ กับ $3$',
]
hints = ['ต้องมีด้านตรงข้ามมุมฉากก่อน จึงจะกางวงเวียนให้ยาวเท่ากับมันได้', 'จะสร้างเส้นตั้งฉากที่จุดไหน ต้องรู้ก่อนว่าด้านประกอบมุมฉากยาวเท่าไร']
statement = '''
เรียงขั้นตอนการหาตำแหน่งของ $\sqrt{5}$ บนเส้นจำนวนด้วยวงเวียนและสันตรง
'''
solution = '''
1. เลือกด้านประกอบมุมฉาก $2$ กับ $1$ ตามทฤษฎีบทพีทาโกรัส ด้านตรงข้ามมุมฉากจะยาว $\sqrt{2^2 + 1^2} = \sqrt{5}$
2. สร้างเส้นตั้งฉากยาว $1$ หน่วยที่จุด $2$ ได้มุมฉากของรูปสามเหลี่ยม
3. ลากเส้นจาก $0$ ไปที่ปลายเส้นตั้งฉาก ได้ด้านตรงข้ามมุมฉากยาว $\sqrt{5}$
4. กางวงเวียนเท่าด้านนั้น ใช้ $0$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งลงมาตัดเส้นจำนวน
5. จุดตัดอยู่ห่าง $0$ เป็นระยะ $\sqrt{5} \approx 2.24$
'''

[[wrong]]
answer = [0, 1, 3, 2, 4]
message = "กางวงเวียนให้ยาวเท่าด้านตรงข้ามมุมฉากได้ก็ต่อเมื่อลากด้านนั้นแล้ว"

[[wrong]]
answer = [1, 0, 2, 3, 4]
