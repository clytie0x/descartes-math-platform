title = "รากที่สองอยู่ระหว่างจำนวนเต็มใด"
level = 1
type = "set"
answer = ["8", "9"]
truth = "[floor(sqrt(75)), floor(sqrt(75)) + 1]"
accept = ["9, 8"]
reject = ["8", "7, 8, 9"]
hints = ['หาจำนวนกำลังสองสมบูรณ์สองตัวที่อยู่ติดกัน ตัวหนึ่งน้อยกว่า $75$ อีกตัวมากกว่า $75$']
statement = '''
$\sqrt{75}$ อยู่ระหว่างจำนวนเต็มสองจำนวนใดที่อยู่ติดกัน ตอบทั้งสองจำนวน คั่นด้วยจุลภาค
'''
solution = '''
$8^2 = 64$ และ $9^2 = 81$ ได้ $64 < 75 < 81$ จึงได้ $8 < \sqrt{75} < 9$
'''

