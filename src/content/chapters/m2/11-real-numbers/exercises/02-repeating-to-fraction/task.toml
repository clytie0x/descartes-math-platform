title = "ทศนิยมซ้ำเป็นเศษส่วน"
level = 1
type = "number"
answer = "5/11"
truth = "Rational(45, 99)"
form = "fraction"
reject = ["45/99"]
hints = ['ให้ $N = 0.4545\ldots$ ชุดที่ซ้ำยาวสองตัว ลองคูณ $N$ ด้วย $100$', '$100N - N$ ทำให้หางที่ซ้ำหายไป']
statement = '''
เขียน $0.\dot{4}\dot{5}$ เป็นเศษส่วนอย่างต่ำ พิมพ์เศษส่วนแบบ `3/4`
'''
solution = '''
1. ให้ $N = 0.454545\ldots$ คูณด้วย $100$ ได้ $100N = 45.4545\ldots$
2. $100N - N = 45$ ได้ $99N = 45$
3. $N = \tfrac{45}{99} = \tfrac{5}{11}$ หลังหารทั้งเศษและส่วนด้วย $9$
'''

[[wrong]]
answer = "9/20"
message = "45/100 = 9/20 คือ 0.45 ที่จบแค่สองตำแหน่ง แต่ข้อนี้ 45 ซ้ำไม่รู้จบ ตัวส่วนต้องเป็น 99"

[[wrong]]
answer = "1/2"
message = "45/90 = 1/2 ใช้ตัวส่วน 90 เมื่อมีเลขไม่ซ้ำนำหน้าหนึ่งตัว ข้อนี้ซ้ำทั้งสองตัว ตัวส่วนจึงเป็น 99"
