title = "เทปพันกล่องพัสดุ"
level = 3
type = "number"
unit = "เซนติเมตร"
answer = "60"
truth = "4 * real_root(3375, 3)"
hints = ['หาความยาวด้านของกล่องก่อน จากปริมาตร $s^3 = 3375$', '$3375 = 3^3 \times 5^3$ แล้วเทปหนึ่งรอบผ่านกี่ด้าน']
statement = '''
กล่องพัสดุรูปลูกบาศก์มีปริมาตร $3375$ ลูกบาศก์เซนติเมตร ร้านจะพันเทปรอบกล่องหนึ่งรอบ ให้เทปพาดผ่านด้านข้างทั้งสี่ด้านพอดีโดยไม่ซ้อนกัน ต้องใช้เทปยาวกี่เซนติเมตร
'''
solution = '''
1. ให้ด้านยาว $s$ เซนติเมตร ได้ $s^3 = 3375$
2. $3375 = 3 \times 3 \times 3 \times 5 \times 5 \times 5 = (3 \times 5)^3 = 15^3$ จึงได้ $s = 15$
3. เทปหนึ่งรอบผ่านด้านข้างสี่ด้าน ยาว $4 \times 15 = 60$ เซนติเมตร
'''

[[wrong]]
answer = "15"
message = "15 คือความยาวด้านของกล่อง เทปพันรอบกล่องผ่านด้านข้างสี่ด้าน"

