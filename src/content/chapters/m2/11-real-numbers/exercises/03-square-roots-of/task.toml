title = "รากที่สองของ 0.49"
level = 1
type = "set"
answer = ["0.7", "-0.7"]
truth = "roots(x**2 - Rational(49, 100))"
accept = ["-0.7, 0.7", "7/10, -7/10"]
reject = ["0.7", "0.7, -0.7, 0"]
hints = ['หาจำนวนที่ยกกำลังสองแล้วได้ $0.49$ ตรวจด้วยการยกกำลังสองกลับ', 'จำนวนบวกมีรากที่สองสองจำนวน']
statement = '''
รากที่สองของ $0.49$ มีจำนวนใดบ้าง ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
$0.7^2 = 0.49$ และ $(-0.7)^2 = 0.49$ รากที่สองของ $0.49$ จึงมีสองจำนวน คือ $0.7$ และ $-0.7$


ระวังความต่างระหว่าง**รากที่สองของ** $0.49$ ซึ่งมีสองค่า กับ $\sqrt{0.49}$ ซึ่งหมายถึงรากที่เป็นบวกเท่านั้น มีค่าเดียวคือ $0.7$
'''

