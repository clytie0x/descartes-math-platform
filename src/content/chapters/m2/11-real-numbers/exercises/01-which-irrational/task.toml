title = "จำนวนใดเป็นจำนวนอตรรกยะ"
level = 1
type = "choice"
choices = ['$0.\dot{1}\dot{8}$', '$\sqrt{36}$', '$\sqrt{12}$', '$3.14$']
answer = 2
checks = [
  "Rational(18, 99) == Rational(2, 11)",
  "sqrt(36) == 6",
  "sqrt(12).is_rational == False",
  "Rational('3.14') == Rational(157, 50)",
]
hints = ['จำนวนตรรกยะเขียนเป็นทศนิยมรู้จบหรือทศนิยมซ้ำได้ ลองหาค่าของตัวที่มีเครื่องหมายกรณฑ์ก่อน']
statement = '''
จำนวนใดต่อไปนี้เป็นจำนวนอตรรกยะ
'''
solution = '''
- $0.\dot{1}\dot{8}$ เป็นทศนิยมซ้ำ เท่ากับ $\tfrac{18}{99} = \tfrac{2}{11}$ เป็นจำนวนตรรกยะ
- $\sqrt{36} = 6$ เป็นจำนวนตรรกยะ
- $12 = 2 \times 2 \times 3$ เลข $3$ ไม่มีคู่ $12$ จึงไม่ใช่จำนวนกำลังสองสมบูรณ์ $\sqrt{12}$ เป็นจำนวนอตรรกยะ
- $3.14$ เป็นทศนิยมรู้จบ เท่ากับ $\tfrac{314}{100}$ เป็นจำนวนตรรกยะ แม้จะใช้เป็นค่าประมาณของ $\pi$

จึงตอบ $\sqrt{12}$
'''

[[wrong]]
answer = 0
message = "ทศนิยมซ้ำทุกตัวเป็นจำนวนตรรกยะ 0.1̇8̇ = 18/99 = 2/11"

[[wrong]]
answer = 1
message = "36 = 6² จึงได้ √36 = 6 ซึ่งเป็นจำนวนเต็ม มีเครื่องหมายกรณฑ์ไม่ได้แปลว่าเป็นอตรรกยะ"

[[wrong]]
answer = 3
message = "3.14 เป็นแค่ค่าประมาณของ π ตัว 3.14 เองเป็นทศนิยมรู้จบ เท่ากับ 314/100 จึงเป็นจำนวนตรรกยะ"
