solution = '''
1. $B\hat{A}C = E\hat{D}C = 90^\circ$ (ทั้งคู่ตั้งฉากกับริมคลอง)
2. $AC = DC = 30$ เมตร (เดินวัดไว้)
3. $A\hat{C}B = D\hat{C}E$ (มุมตรงข้าม เพราะ $B$ $C$ $E$ อยู่ในแนวเดียวกัน)
4. $AC$ อยู่ระหว่างมุมที่ $A$ กับมุมที่ $C$ และ $DC$ อยู่ระหว่างมุมที่ $D$ กับมุมที่ $C$ จึงได้ $\triangle ABC \cong \triangle DEC$ (ม.ด.ม.)
5. $AB = DE$ (ด้านคู่ที่สมนัยกัน) และ $DE = 32 \times 0.6 = 19.2$ เมตร

คลองกว้าง $19.2$ เมตร
