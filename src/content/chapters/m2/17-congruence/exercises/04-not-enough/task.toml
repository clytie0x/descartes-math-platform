title = "ข้อมูลที่ยังไม่พอ"
level = 2
type = "choice"
choices = [
  '$AB = DE$ และ $\hat{B} = \hat{E}$ และ $BC = EF$',
  '$AB = DE$ และ $BC = EF$ และ $\hat{C} = \hat{F}$',
  '$\hat{A} = \hat{D}$ และ $AB = DE$ และ $\hat{B} = \hat{E}$',
  '$\hat{C} = \hat{F} = 90^\circ$ และ $AB = DE$ และ $BC = EF$',
]
answer = 1
hints = ['แต่ละชุด ดูว่ามุมที่ให้มาอยู่ระหว่างด้านที่ให้มาหรือไม่ หรือด้านอยู่ระหว่างมุมหรือไม่', 'ด้าน $AB$ กับ $BC$ มีตัวอักษรร่วมคือ $B$']
statement = '''
ข้อมูลชุดใด**สรุปไม่ได้**ว่า $\triangle ABC \cong \triangle DEF$
'''
solution = '''
- ชุดแรก $\hat{B}$ อยู่ระหว่าง $AB$ กับ $BC$ เป็น ด.ม.ด. สรุปได้
- ชุดที่สอง มุมในระหว่าง $AB$ กับ $BC$ คือ $\hat{B}$ แต่ที่ให้มาคือ $\hat{C}$ เป็น ด.ด.ม. **สรุปไม่ได้**
- ชุดที่สาม $AB$ อยู่ระหว่าง $\hat{A}$ กับ $\hat{B}$ เป็น ม.ด.ม. สรุปได้
- ชุดที่สี่ $AB$ อยู่ตรงข้ามมุมฉาก $\hat{C}$ จึงเป็นด้านตรงข้ามมุมฉาก และ $BC$ เป็นด้านประกอบมุมฉาก เป็น ฉ.ด.ด. สรุปได้
'''

