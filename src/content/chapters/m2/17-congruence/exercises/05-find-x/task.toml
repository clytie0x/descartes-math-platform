title = "หาค่า x จากด้านที่สมนัยกัน"
level = 2
type = "number"
label = '$x =$'
answer = "4"
truth = "solve(Eq(2*x + 3, 5*x - 9), x)[0]"
hints = ['$AB$ ใช้ตัวที่หนึ่งกับตัวที่สองของชื่อแรก ด้านคู่ของมันใช้ตัวที่หนึ่งกับตัวที่สองของชื่อหลัง', 'ตั้งสมการ $2x + 3 = 5x - 9$']
statement = '''
กำหนดให้ $\triangle ABC \cong \triangle PQR$ โดย $AB = 2x + 3$ เซนติเมตร $PR = x + 11$ เซนติเมตร และ $PQ = 5x - 9$ เซนติเมตร จงหาค่า $x$
'''
solution = '''
1. $A$ สมนัยกับ $P$ และ $B$ สมนัยกับ $Q$ ด้าน $AB$ จึงสมนัยกับ $PQ$ ได้ $2x + 3 = 5x - 9$
2. ย้ายข้าง $3 + 9 = 5x - 2x$ ได้ $12 = 3x$ จึงได้ $x = 4$
3. ตรวจ $AB = 2(4) + 3 = 11$ และ $PQ = 5(4) - 9 = 11$ ยาวเท่ากันจริง

ส่วน $PR$ สมนัยกับ $AC$ ซึ่งโจทย์ไม่ได้บอกความยาว จึงยังใช้ตั้งสมการไม่ได้
'''

[[wrong]]
answer = "8"
message = "x + 11 คือ PR ซึ่งสมนัยกับ AC ไม่ใช่ AB ด้านคู่ของ AB คือ PQ"

[[wrong]]
answer = "-4"
message = "2x + 3 = 5x − 9 ย้ายข้างได้ 3 + 9 = 5x − 2x คือ 12 = 3x ระวังเครื่องหมายตอนย้ายข้าง"
