message = "ด้านไม่อยู่ระหว่างมุมที่ให้มาก็ใช้ ม.ม.ด. ได้ เพราะหามุมคู่ที่สามแล้วเปลี่ยนเป็น ม.ด.ม. ได้"

[[wrong]]
