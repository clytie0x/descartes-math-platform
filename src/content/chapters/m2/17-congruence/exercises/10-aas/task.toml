title = "มุมสองคู่กับด้านนอกระหว่าง"
level = 2
type = "choice"
answer = "1"
hints = ['จับคู่ $A$ กับ $D$ $B$ กับ $E$ และ $C$ กับ $F$ ก่อน', 'ด้าน $AC$ อยู่ตรงข้ามมุม $B$ ไม่ใช่ด้านในระหว่างมุม $A$ กับ $B$']
choices = ['ยังสรุปไม่ได้เพราะด้านไม่อยู่ในระหว่างมุมที่กำหนด', 'เท่ากันทุกประการโดย ม.ม.ด.', 'เท่ากันทุกประการโดย ด.ม.ด.', 'เท่ากันทุกประการเพราะรู้มุมสองคู่เท่านั้น']
checks = ['180 - 42 - 73 == 65']
statement = '''
กำหนดให้ $\hat A = \hat D = 42^\circ$ $\hat B = \hat E = 73^\circ$ และ $AC = DF = 12$ เซนติเมตร ข้อใดอธิบายได้ตรงกับข้อมูลที่กำหนด
'''
solution = '''
ด้าน $AC$ กับ $DF$ สมนัยกันและอยู่ตรงข้ามมุม $B$ กับ $E$ ซึ่งมีขนาดเท่ากัน จึงใช้ ม.ม.ด. ได้

ถ้าจะตรวจผ่าน ม.ด.ม. ให้หามุม $C$ กับ $F$ ก่อน ได้เท่ากับ $180^\circ - 42^\circ - 73^\circ = 65^\circ$ แล้วใช้มุม $A$ ด้าน $AC$ มุม $C$ เทียบกับมุม $D$ ด้าน $DF$ มุม $F$
'''

[[wrong]]
