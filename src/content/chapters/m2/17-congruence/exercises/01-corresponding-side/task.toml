title = "ด้านที่สมนัยกัน"
level = 1
type = "choice"
choices = ['$XY$', '$YZ$', '$XZ$', '$PR$']
answer = 1
hints = ['$Q$ เป็นตัวที่สองและ $R$ เป็นตัวที่สามของชื่อแรก ด้านคู่ของ $QR$ คือตัวที่สองกับตัวที่สามของชื่อหลัง']
statement = '''
กำหนดให้ $\triangle PQR \cong \triangle XYZ$ ด้านใดยาวเท่ากับ $QR$ แน่นอน
'''
solution = '''
ประโยค $\triangle PQR \cong \triangle XYZ$ บอกว่า $P$ $Q$ $R$ สมนัยกับ $X$ $Y$ $Z$ ตามลำดับ $Q$ สมนัยกับ $Y$ และ $R$ สมนัยกับ $Z$ ด้าน $QR$ จึงสมนัยกับด้าน $YZ$ และ $QR = YZ$
'''

