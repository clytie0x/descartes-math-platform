statement = '''
กำหนดให้ $\triangle ABC \cong \triangle KLM$ ถ้า $\hat{A} = 48^\circ$ และ $\hat{B} = 77^\circ$ จงหาขนาดของ $\hat{M}$
'''
solution = '''
$M$ สมนัยกับ $C$ จึงได้ $\hat{M} = \hat{C}$ และ $\hat{C} = 180^\circ - 48^\circ - 77^\circ = 55^\circ$ ดังนั้น $\hat{M} = 55^\circ$
'''

