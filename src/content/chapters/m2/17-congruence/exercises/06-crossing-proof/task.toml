'''
solution = '''
1. $OA = OB$ (กำหนดให้)
2. $A\hat{O}C = B\hat{O}D$ (มุมตรงข้าม)
3. $OC = OD$ (กำหนดให้)
4. $\triangle AOC \cong \triangle BOD$ (ด.ม.ด.) โดย $A$ $O$ $C$ สมนัยกับ $B$ $O$ $D$
5. $AC = BD$ (ด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการ)

จะเริ่มจาก $OC = OD$ แล้วจึงเป็นมุม และ $OA = OB$ ก็ได้ เพราะยังเป็น ด้าน มุม ด้าน เหมือนเดิม
'''

