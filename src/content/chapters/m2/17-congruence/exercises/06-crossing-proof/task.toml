title = "เรียงการพิสูจน์ ด.ม.ด."
level = 2
type = "order"
steps = [
  '$OA = OB$ (กำหนดให้)',
  '$A\hat{O}C = B\hat{O}D$ (มุมตรงข้าม)',
  '$OC = OD$ (กำหนดให้)',
  '$\triangle AOC \cong \triangle BOD$ (ด.ม.ด.)',
  '$AC = BD$ (ด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการ)',
]
alternatives = [[2, 1, 0, 3, 4]]
hints = ['ขั้นที่บอกว่ารูปสามเหลี่ยมเท่ากันทุกประการ ต้องมาหลังข้อมูลครบสามอย่าง', 'ด.ม.ด. ให้เขียนมุมไว้ระหว่างด้านสองด้าน']
statement = '''
ในรูป $\overline{AB}$ กับ $\overline{CD}$ ตัดกันที่ $O$ โดย $OA = OB$ และ $OC = OD$ จงเรียงขั้นการพิสูจน์ว่า $AC = BD$ ให้ถูกลำดับ โดยเรียงข้อมูลสามอย่างตามลำดับ ด้าน มุม ด้าน ของชื่อเงื่อนไข

