title = "เทน้ำลงหม้อ"
level = 3
type = "number"
unit = "เซนติเมตร"
answer = "10"
truth = "1540 / (Rational(22, 7)*7**2)"
hints = ['เปลี่ยน $1.54$ ลิตรเป็นลูกบาศก์เซนติเมตรก่อน', 'น้ำในหม้อเป็นทรงกระบอก ปริมาตร $=$ พื้นที่ฐาน $\times$ ความสูงของน้ำ หาความสูงได้จากปริมาตร $\div$ พื้นที่ฐาน']
statement = '''
เทน้ำ $1.54$ ลิตรลงในหม้อทรงกระบอกที่มีเส้นผ่านศูนย์กลางด้านใน $14$ เซนติเมตร น้ำในหม้อจะสูงกี่เซนติเมตร ใช้ $\pi \approx \tfrac{22}{7}$
'''
solution = '''
1. ปริมาตรน้ำ $1.54 \times 1000 = 1540$ ลูกบาศก์เซนติเมตร
2. รัศมี $14 \div 2 = 7$ เซนติเมตร พื้นที่ฐาน $\pi r^2 \approx \tfrac{22}{7} \times 7 \times 7 = 154$ ตารางเซนติเมตร
3. ปริมาตร $=$ พื้นที่ฐาน $\times$ ความสูง จึงได้ $154 \times h = 1540$
4. ความสูงของน้ำ $h = 1540 \div 154 = 10$ เซนติเมตร
'''

