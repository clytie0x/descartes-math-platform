title = "ขยายรัศมีสามเท่า"
level = 3
type = "number"
unit = "เท่า"
answer = "9"
truth = "simplify(pi*(3*a)**2*h / (pi*a**2*h))"
hints = ['ให้ถังใบเดิมมีรัศมี $r$ ใบใหม่มีรัศมี $3r$ แล้วเขียนปริมาตรของทั้งสองใบ', '$(3r)^2 = 3r \times 3r$']
statement = '''
เทศบาลจะเปลี่ยนแท็งก์น้ำทรงกระบอกของหมู่บ้าน ใบใหม่สูงเท่าใบเดิม แต่มีรัศมีเป็น $3$ เท่าของใบเดิม ใบใหม่จุน้ำได้กี่เท่าของใบเดิม
'''
solution = '''
1. ให้ใบเดิมมีรัศมี $r$ สูง $h$ ปริมาตร $\pi r^2 h$
2. ใบใหม่มีรัศมี $3r$ สูง $h$ ปริมาตร $\pi(3r)^2 h = 9\pi r^2 h$
3. $9\pi r^2 h \div \pi r^2 h = 9$ ใบใหม่จุน้ำได้ $9$ เท่าของใบเดิม


รัศมีถูกยกกำลังสองในสูตร ขยายรัศมี $3$ เท่า พื้นที่ฐานจึงโตขึ้น $3 \times 3 = 9$ เท่า
'''

[[wrong]]
answer = "3"
message = "รัศมีอยู่ในสูตรแบบยกกำลังสอง π(3r)²h = 9πr²h ปริมาตรจึงไม่ได้เพิ่มแค่ 3 เท่า"

[[wrong]]
