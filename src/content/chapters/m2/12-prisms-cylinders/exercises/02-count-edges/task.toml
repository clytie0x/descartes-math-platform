title = "นับขอบของปริซึม"
level = 1
type = "number"
unit = "ขอบ"
answer = "18"
truth = "2*6 + 6"
hints = ['นับขอบของฐานทั้งสองฐานก่อน แล้วนับขอบข้างที่เชื่อมฐานทั้งสอง']
statement = '''
ดินสอแท่งหกเหลี่ยมที่ยังไม่ได้เหลามีรูปทรงเป็นปริซึมหกเหลี่ยม ปริซึมนี้มีขอบทั้งหมดกี่ขอบ
'''
solution = '''
1. ฐานแต่ละฐานเป็นรูปหกเหลี่ยม มี $6$ ขอบ สองฐานมี $12$ ขอบ
2. จุดยอดแต่ละจุดของฐานล่างมีขอบข้างเชื่อมขึ้นไปหาฐานบน ได้ขอบข้างอีก $6$ ขอบ
3. รวม $12 + 6 = 18$ ขอบ ตรงกับ $3n$ เมื่อ $n = 6$
'''

[[wrong]]
answer = "12"
message = "12 คือขอบของฐานสองฐาน ยังขาดขอบข้างที่เชื่อมฐานล่างกับฐานบนอีก 6 ขอบ"

[[wrong]]
answer = "8"
message = "8 คือจำนวนหน้า ฐาน 2 หน้ากับหน้าข้าง 6 หน้า ข้อนี้ถามจำนวนขอบ"

[[wrong]]
answer = "6"
message = "6 คือขอบของฐานฐานเดียว ปริซึมมีฐานสองฐาน และยังมีขอบข้างอีก"
