title = "ปริมาตรของทรงกระบอก"
level = 2
type = "number"
unit = "ลูกบาศก์เซนติเมตร"
answer = "200pi"
truth = "pi*5**2*8"
tolerance = 0.5
accept = ["200π", "628", "628.3", "628.32", "628.57"]
hints = ['$10$ เซนติเมตรเป็นเส้นผ่านศูนย์กลาง รัศมีคือครึ่งหนึ่ง', 'ปริมาตร $= \pi r^2 h$']
statement = '''
ขวดโหลทรงกระบอกมีเส้นผ่านศูนย์กลางด้านใน $10$ เซนติเมตร สูง $8$ เซนติเมตร จุของได้กี่ลูกบาศก์เซนติเมตร ตอบในรูป $\pi$ หรือตอบเป็นทศนิยมก็ได้

<p class="ex-tip">พิมพ์ π ด้วยคำว่า pi เช่น 50pi ถ้าตอบเป็นทศนิยม ใช้ π ≈ 3.14 หรือ 22/7 ก็ได้ เว็บยอมให้คลาดเคลื่อนได้เล็กน้อย</p>
'''
solution = '''
1. รัศมี $r = 10 \div 2 = 5$ เซนติเมตร
2. ปริมาตร $= \pi r^2 h = \pi \times 5^2 \times 8 = 200\pi$ ลูกบาศก์เซนติเมตร
3. ใช้ $\pi \approx 3.14$ ได้ $628$ ลูกบาศก์เซนติเมตร
'''

