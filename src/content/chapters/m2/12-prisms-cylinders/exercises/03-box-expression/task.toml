title = "พื้นที่ผิวเป็นนิพจน์"
level = 2
type = "expr"
label = 'พื้นที่ผิว $=$'
answer = "2x^2+20x"
truth = "2*x**2 + 20*x"
accept = ["20x+2x^2", "2x(x+10)", "2x^2 + 20x"]
hints = ['พื้นที่ฐานหนึ่งฐานคือ $x^2$ และความยาวรอบฐานคือ $4x$', 'พื้นที่ผิว $=$ ความยาวรอบฐาน $\times$ ความสูง $+ \, 2 \times$ พื้นที่ฐาน']
statement = '''
กล่องใบหนึ่งมีฐานเป็นรูปสี่เหลี่ยมจัตุรัสยาวด้านละ $x$ เซนติเมตร และสูง $5$ เซนติเมตร เขียนพื้นที่ผิวของกล่องเป็นนิพจน์ที่มีตัวแปร $x$ หน่วยเป็นตารางเซนติเมตร

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
1. พื้นที่ฐาน $= x \times x = x^2$ สองฐานได้ $2x^2$
2. ความยาวรอบฐาน $= 4x$ พื้นที่ผิวข้าง $= 4x \times 5 = 20x$
3. พื้นที่ผิว $= 2x^2 + 20x$ ตารางเซนติเมตร


ตรวจด้วยค่าจริง ถ้า $x = 5$ กล่องเป็นลูกบาศก์ยาวด้านละ $5$ มี $6$ หน้า หน้าละ $25$ รวม $150$ และ $2(5^2) + 20(5) = 150$ ตรงกัน
'''

[[wrong]]
answer = "x^2+20x"
message = "บวกพื้นที่ฐานแค่ฐานเดียว ปริซึมมีฐานสองฐาน จึงต้องเป็น 2x²"

[[wrong]]
answer = "5x^2"
message = "5x² คือพื้นที่ฐานคูณความสูง ซึ่งเป็นปริมาตร ข้อนี้ถามพื้นที่ผิว"

[[wrong]]
answer = "2x^2+5x"
message = "หน้าข้างมี 4 หน้า ความยาวรอบฐานคือ 4x พื้นที่ผิวข้างจึงเป็น 4x × 5 = 20x"
