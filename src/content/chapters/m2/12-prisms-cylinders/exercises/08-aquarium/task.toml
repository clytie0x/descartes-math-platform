title = "เติมน้ำในตู้ปลา"
level = 2
type = "number"
unit = "ลิตร"
answer = "63"
truth = "Rational(60*30*35, 1000)"
hints = ['น้ำสูงแค่ $35$ เซนติเมตร ไม่ได้เต็มตู้ ความสูงที่ใช้คิดจึงเป็น $35$', '$1$ ลิตร $= 1000$ ลูกบาศก์เซนติเมตร']
statement = '''
ตู้ปลาทรงสี่เหลี่ยมมุมฉากยาว $60$ เซนติเมตร กว้าง $30$ เซนติเมตร สูง $40$ เซนติเมตร เติมน้ำให้สูง $35$ เซนติเมตรจากก้นตู้ ต้องใช้น้ำกี่ลิตร
'''
solution = '''
1. น้ำในตู้เป็นปริซึมสี่เหลี่ยมมุมฉาก ฐาน $60 \times 30$ สูง $35$ เซนติเมตร
2. ปริมาตรน้ำ $= 60 \times 30 \times 35 = 63000$ ลูกบาศก์เซนติเมตร
3. $63000 \div 1000 = 63$ ลิตร
'''

