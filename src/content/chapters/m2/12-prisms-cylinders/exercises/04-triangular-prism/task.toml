title = "พื้นที่ผิวของปริซึมสามเหลี่ยม"
level = 2
type = "number"
unit = "ตารางเซนติเมตร"
answer = "336"
truth = "2*(Rational(1, 2)*6*8) + (6 + 8 + sqrt(6**2 + 8**2))*12"
hints = ['ความยาวรอบฐานต้องใช้ด้านทั้งสามด้านของรูปสามเหลี่ยม ด้านที่สามหาได้ด้วยทฤษฎีบทพีทาโกรัส', 'พื้นที่ฐานของรูปสามเหลี่ยมมุมฉากคือ $\tfrac{1}{2} \times 6 \times 8$']
statement = '''
ปริซึมสามเหลี่ยมมีฐานเป็นรูปสามเหลี่ยมมุมฉาก ด้านประกอบมุมฉากยาว $6$ เซนติเมตร และ $8$ เซนติเมตร ปริซึมสูง $12$ เซนติเมตร ปริซึมนี้มีพื้นที่ผิวเท่าใด
'''
solution = '''
1. ด้านตรงข้ามมุมฉากยาว $\sqrt{6^2 + 8^2} = \sqrt{100} = 10$ เซนติเมตร
2. ความยาวรอบฐาน $= 6 + 8 + 10 = 24$ เซนติเมตร พื้นที่ผิวข้าง $= 24 \times 12 = 288$ ตารางเซนติเมตร
3. พื้นที่ฐาน $= \tfrac{1}{2} \times 6 \times 8 = 24$ ตารางเซนติเมตร สองฐานได้ $48$ ตารางเซนติเมตร
4. พื้นที่ผิว $= 288 + 48 = 336$ ตารางเซนติเมตร
'''

[[wrong]]
answer = "312"
message = "บวกพื้นที่ฐานแค่ฐานเดียว ปริซึมมีฐานสามเหลี่ยมสองฐาน ต้องบวก 2 × 24 = 48"

