title = "ฐานของปริซึมที่วางนอน"
level = 1
type = "choice"
choices = [
  'หน้ารูปสามเหลี่ยมสองหน้าที่ปลายทั้งสองข้าง',
  'หน้ารูปสี่เหลี่ยมที่วางติดพื้น',
  'หน้ารูปสี่เหลี่ยมสองหน้าที่เอียงขึ้นไปชนกันเป็นสันหลังคา',
  'หน้าใดก็ได้ที่วางติดพื้น',
]
answer = 0
hints = ['ฐานของปริซึมต้องเป็นหน้าคู่ที่เท่ากันทุกประการและขนานกัน']
statement = '''
หลังคาบ้านตุ๊กตาเป็นปริซึมสามเหลี่ยม วางอยู่บนตัวบ้านโดยเอาหน้ารูปสี่เหลี่ยมหน้าหนึ่งลง ฐานของปริซึมนี้คือหน้าใด
'''
solution = '''
ฐานของปริซึมคือหน้าคู่ที่เท่ากันทุกประการและอยู่บนระนาบที่ขนานกัน หลังคานี้มีหน้าคู่แบบนั้นคู่เดียว คือรูปสามเหลี่ยมที่ปลายทั้งสองข้าง หน้าสี่เหลี่ยมทั้งสามหน้าเป็นหน้าข้าง ฐานจึงไม่จำเป็นต้องเป็นหน้าที่วางติดพื้น
'''

[[wrong]]
answer = 1
message = "หน้าที่ติดพื้นเป็นหน้าข้าง ไม่มีหน้าไหนที่เท่ากันและขนานกับมัน ฐานไม่จำเป็นต้องอยู่ข้างล่าง"

[[wrong]]
answer = 2
message = "สองหน้านี้เท่ากันก็จริง แต่ไม่ขนานกัน เพราะเอียงเข้าหากันจนชนกันที่สันหลังคา"

[[wrong]]
answer = 3
