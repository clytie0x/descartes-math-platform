title = "แผ่นโลหะทำกระป๋อง"
level = 2
type = "number"
unit = "ตารางเซนติเมตร"
answer = "748"
truth = "2*Rational(22, 7)*7*10 + 2*Rational(22, 7)*7**2"
hints = ['$14$ เซนติเมตรเป็นเส้นผ่านศูนย์กลาง หารสองก่อนจะได้รัศมี', 'กระป๋องปิดทั้งบนและล่าง พื้นที่ผิว $= 2\pi r h + 2\pi r^2$']
statement = '''
กระป๋องขนมทรงกระบอกมีฝาปิดและก้น เส้นผ่านศูนย์กลาง $14$ เซนติเมตร สูง $10$ เซนติเมตร ต้องใช้แผ่นโลหะทั้งหมดกี่ตารางเซนติเมตร ไม่นับส่วนที่พับทับกัน ใช้ $\pi \approx \tfrac{22}{7}$
'''
solution = '''
1. รัศมี $r = 14 \div 2 = 7$ เซนติเมตร
2. พื้นที่ผิวข้าง $2\pi r h \approx 2 \times \tfrac{22}{7} \times 7 \times 10 = 440$ ตารางเซนติเมตร
3. ฝากับก้น $2\pi r^2 \approx 2 \times \tfrac{22}{7} \times 7 \times 7 = 308$ ตารางเซนติเมตร
4. รวม $440 + 308 = 748$ ตารางเซนติเมตร
'''

