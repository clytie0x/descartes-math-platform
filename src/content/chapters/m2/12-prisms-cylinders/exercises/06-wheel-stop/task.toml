message = "10 × 16 × 10 × 50 คิดเหมือนกล่อง แต่ฐานเป็นสี่เหลี่ยมคางหมู ต้องหาพื้นที่ฐานด้วย ½ × (10 + 16) × 10 ก่อน"

[[wrong]]
