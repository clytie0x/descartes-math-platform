title = "แท่งกันล้อรถ"
level = 1
type = "number"
unit = "ลูกบาศก์เซนติเมตร"
answer = "6500"
truth = "Rational(1, 2)*(10 + 16)*10*50"
hints = ['ฐานของปริซึมคือหน้าตัดรูปสี่เหลี่ยมคางหมู ความสูงของปริซึมคือความยาวของแท่ง', 'พื้นที่สี่เหลี่ยมคางหมู $= \tfrac{1}{2} \times$ ผลบวกด้านคู่ขนาน $\times$ ความสูง']
statement = '''
แท่งคอนกรีตกันล้อรถในลานจอดรถเป็นปริซึมที่มีฐานเป็นรูปสี่เหลี่ยมคางหมู ด้านคู่ขนานยาว $10$ เซนติเมตร และ $16$ เซนติเมตร ความสูงของรูปสี่เหลี่ยมคางหมู $10$ เซนติเมตร แท่งยาว $50$ เซนติเมตร แท่งนี้มีปริมาตรเท่าใด
'''
solution = '''
1. พื้นที่ฐาน $= \tfrac{1}{2} \times (10 + 16) \times 10 = 130$ ตารางเซนติเมตร
2. ความสูงของปริซึมคือความยาวของแท่ง $50$ เซนติเมตร
3. ปริมาตร $= 130 \times 50 = 6500$ ลูกบาศก์เซนติเมตร
'''

[[wrong]]
answer = "13000"
message = "พื้นที่สี่เหลี่ยมคางหมูต้องคูณ ½ ด้วย พื้นที่ฐานคือ ½ × 26 × 10 = 130"

[[wrong]]
