title = "เอกนามที่คล้ายกัน"
level = 1
type = "choice"
choices = ['$3xy^2$', '$-7x^2y$', '$3x^2y^2$', '$3x^2$']
answer = 1
checks = [
  "Poly(-7*x**2*y, x, y).monoms() == Poly(3*x**2*y, x, y).monoms()",
  "Poly(3*x*y**2, x, y).monoms() != Poly(3*x**2*y, x, y).monoms()",
]
hints = ['เอกนามคล้ายกันเมื่อส่วนที่เป็นตัวแปรเหมือนกันทุกตัว ทั้งตัวแปรและเลขชี้กำลัง สัมประสิทธิ์ต่างกันได้']
statement = '''
เอกนามใดคล้ายกับ $3x^2y$
'''
solution = '''
ส่วนที่เป็นตัวแปรของ $3x^2y$ คือ $x^2y$ ตัวที่มี $x^2y$ เหมือนกันคือ $-7x^2y$ สัมประสิทธิ์ $-7$ ต่างจาก $3$ ได้ ไม่มีผล

ตัวอื่นเลขชี้กำลังไม่ตรง หรือขาดตัวแปรบางตัว จึงไม่คล้ายกัน
'''

[[wrong]]
answer = 0
message = "3xy² มีเลขชี้กำลังของ x เป็น 1 และของ y เป็น 2 สลับกับ 3x²y จึงไม่คล้ายกัน ถึงสัมประสิทธิ์จะเท่ากัน"

[[wrong]]
answer = 2
message = "3x²y² มี y² แต่ 3x²y มี y ยกกำลังหนึ่ง เลขชี้กำลังของ y ไม่เท่ากัน"

[[wrong]]
answer = 3
message = "3x² ไม่มีตัวแปร y ตัวแปรไม่ใช่ชุดเดียวกับ 3x²y"
