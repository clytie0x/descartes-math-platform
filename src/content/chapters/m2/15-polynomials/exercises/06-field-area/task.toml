title = "พื้นที่ลานกีฬาใหม่"
level = 2
type = "expr"
form = "expanded"
label = 'พื้นที่ $=$'
unit = "ตารางเมตร"
answer = "x^2+x-6"
truth = "expand((x + 3)*(x - 2))"
accept = ["x^2 + x - 6", "-6+x+x^2"]
reject = ["(x+3)(x-2)"]
hints = ['ด้านหนึ่งยาว $x + 3$ อีกด้านยาว $x - 2$ พื้นที่คือด้านคูณด้าน', 'คูณครบสี่คู่ แล้วรวม $-2x + 3x$']
statement = '''
ลานกีฬาของโรงเรียนเป็นรูปสี่เหลี่ยมจัตุรัสยาวด้านละ $x$ เมตร โรงเรียนปรับลานใหม่ ให้ด้านหนึ่งยาวขึ้น $3$ เมตร และอีกด้านหนึ่งสั้นลง $2$ เมตร ลานใหม่เป็นรูปสี่เหลี่ยมผืนผ้า มีพื้นที่กี่ตารางเมตร ตอบเป็นพหุนามในรูปที่กระจายวงเล็บแล้ว
'''
solution = '''
1. ลานใหม่กว้าง $x - 2$ เมตร ยาว $x + 3$ เมตร
2. พื้นที่ $(x + 3)(x - 2) = x^2 - 2x + 3x - 6 = x^2 + x - 6$ ตารางเมตร


ตรวจด้วย $x = 10$ ลานใหม่ $13 \times 8 = 104$ และ $100 + 10 - 6 = 104$ ตรงกัน
'''

[[wrong]]
answer = "x^2-6"
message = "ยังขาดสองคู่กลาง x × (−2) = −2x และ 3 × x = 3x รวมได้ x"

[[wrong]]
answer = "x^2-x-6"
message = "−2x + 3x = x เป็นบวก ตรวจเครื่องหมายของสองคู่กลางอีกครั้ง"

[[wrong]]
answer = "2x+1"
message = "นี่คือผลบวกของสองด้าน พื้นที่ต้องเอาสองด้านมาคูณกัน"
