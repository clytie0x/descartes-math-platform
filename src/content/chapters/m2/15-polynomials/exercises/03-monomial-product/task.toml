title = "คูณเอกนาม"
level = 1
type = "expr"
form = "expanded"
answer = "-12x^7y^4"
truth = "expand((-4*x**2*y**3)*(3*x**5*y))"
accept = ["-12y^4x^7", "-12x^7*y^4"]
hints = ['คูณตัวเลขกับตัวเลขก่อน แล้วคูณ $x$ กับ $x$ และ $y$ กับ $y$', 'ตัวแปรเดียวกันคูณกัน ให้บวกเลขชี้กำลัง $y$ ที่ไม่มีเลขชี้กำลังคือ $y^1$']
statement = '''
หาผลคูณ $(-4x^2y^3)(3x^5y)$

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> เช่น x^7y^4 ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
1. ตัวเลข $(-4)(3) = -12$
2. $x^2 \cdot x^5 = x^{2+5} = x^7$
3. $y^3 \cdot y = y^{3+1} = y^4$
4. ผลคูณคือ $-12x^7y^4$
'''

