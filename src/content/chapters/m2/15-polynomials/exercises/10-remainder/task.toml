title = "เศษจากการหาร"
level = 3
type = "number"
label = 'เศษ $=$'
answer = "13"
truth = "rem(x**3 - 2*x**2 + 4, x - 3)"
hints = ['ตัวตั้งไม่มีพจน์ $x$ ให้เขียนเป็น $x^3 - 2x^2 + 0x + 4$ ก่อน', 'หารจนผลลบมีดีกรีน้อยกว่า $x - 3$ คือเหลือแต่ค่าคงตัว']
statement = '''
หาร $x^3 - 2x^2 + 4$ ด้วย $x - 3$ ได้เศษเท่าใด
'''
solution = '''
1. เขียนตัวตั้งเป็น $x^3 - 2x^2 + 0x + 4$
2. $x^3 \div x = x^2$ คูณกลับ $x^3 - 3x^2$ ลบได้ $x^2$ ดึง $0x$ ลงมา ได้ $x^2 + 0x$
3. $x^2 \div x = x$ คูณกลับ $x^2 - 3x$ ลบได้ $3x$ ดึง $+4$ ลงมา ได้ $3x + 4$
4. $3x \div x = 3$ คูณกลับ $3x - 9$ ลบได้ $4 - (-9) = 13$
5. ผลหารคือ $x^2 + x + 3$ เศษ $13$


ตรวจ $(x - 3)(x^2 + x + 3) + 13 = x^3 - 2x^2 - 9 + 13 = x^3 - 2x^2 + 4$ ตรงกับตัวตั้ง
'''

[[wrong]]
answer = "-5"
message = "ขั้นสุดท้ายต้องลบ 3x − 9 ออกจาก 3x + 4 ได้ 4 − (−9) = 13 ลบด้วยจำนวนลบคือบวก"

[[wrong]]
answer = "7"
message = "4 กับ −3x ไม่ใช่พจน์ที่คล้ายกัน ลบรวมกันไม่ได้ ให้เติม 0x ในตัวตั้งจองที่ไว้ก่อน"

[[wrong]]
answer = "0"
message = "x − 3 หาร x³ − 2x² + 4 ไม่ลงตัว ลองคูณกลับ (x − 3)(x² + x + 3) ได้ x³ − 2x² − 9 ยังขาดอีก 13"
