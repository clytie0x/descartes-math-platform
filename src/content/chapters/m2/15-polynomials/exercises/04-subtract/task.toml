title = "ลบพหุนาม"
level = 2
type = "expr"
form = "expanded"
answer = "3x^2+3x+3"
truth = "expand((4*x**2 - 3*x + 5) - (x**2 - 6*x + 2))"
accept = ["3x^2 + 3x + 3", "3+3x+3x^2"]
hints = ['ถอดวงเล็บหลังโดยเปลี่ยนเครื่องหมายทุกพจน์ในวงเล็บนั้น', '$-(x^2 - 6x + 2) = -x^2 + 6x - 2$']
statement = '''
หา $(4x^2 - 3x + 5) - (x^2 - 6x + 2)$ ตอบในรูปผลสำเร็จ
'''
solution = '''
1. ถอดวงเล็บ $4x^2 - 3x + 5 - x^2 + 6x - 2$
2. รวมพจน์ที่คล้ายกัน $4x^2 - x^2 = 3x^2$ และ $-3x + 6x = 3x$ และ $5 - 2 = 3$
3. ได้ $3x^2 + 3x + 3$


ตรวจด้วยการแทน $x = 1$ โจทย์ได้ $6 - (-3) = 9$ คำตอบได้ $3 + 3 + 3 = 9$ ตรงกัน
'''

[[wrong]]
answer = "3x^2-9x+7"
message = "เปลี่ยนเครื่องหมายแค่พจน์แรกในวงเล็บหลัง −(−6x) ต้องเป็น +6x และ −(+2) ต้องเป็น −2"

[[wrong]]
answer = "3x^2+3x+7"
message = "−(+2) คือ −2 พจน์ค่าคงตัวจึงได้ 5 − 2 = 3 ไม่ใช่ 5 + 2"

[[wrong]]
answer = "5x^2-9x+7"
message = "นี่คือผลบวกของสองวงเล็บ โจทย์ให้ลบ ต้องเปลี่ยนเครื่องหมายทุกพจน์ของวงเล็บหลังก่อนรวม"
