title = "ความยาวลานจอดรถ"
level = 3
type = "expr"
form = "expanded"
label = 'ยาว $=$'
unit = "เมตร"
answer = "3x-1"
truth = "quo(6*x**2 + 7*x - 3, 2*x + 3)"
accept = ["-1+3x"]
hints = ['ความยาวคือพื้นที่หารด้วยความกว้าง ตั้งหารยาว $(6x^2 + 7x - 3) \div (2x + 3)$', 'ขั้นแรก $6x^2 \div 2x = 3x$ คูณกลับได้ $6x^2 + 9x$ แล้วลบออก']
statement = '''
ลานจอดรถจักรยานรูปสี่เหลี่ยมผืนผ้ามีพื้นที่ $6x^2 + 7x - 3$ ตารางเมตร และกว้าง $2x + 3$ เมตร ลานนี้ยาวกี่เมตร ตอบเป็นพหุนาม
'''
solution = '''
1. $6x^2 \div 2x = 3x$ คูณกลับ $3x(2x + 3) = 6x^2 + 9x$ ลบได้ $7x - 9x = -2x$ ดึง $-3$ ลงมา ได้ $-2x - 3$
2. $-2x \div 2x = -1$ คูณกลับ $-1(2x + 3) = -2x - 3$ ลบได้ $0$
3. ผลหารคือ $3x - 1$ ลานยาว $3x - 1$ เมตร


ตรวจ $(2x + 3)(3x - 1) = 6x^2 - 2x + 9x - 3 = 6x^2 + 7x - 3$ ตรงกับพื้นที่
'''

[[wrong]]
answer = "3x+1"
message = "ตรวจด้วยการคูณกลับ (2x + 3)(3x + 1) = 6x² + 11x + 3 ไม่ตรงกับพื้นที่ ผลลบในขั้นแรกคือ −2x จึงได้พจน์ถัดไปเป็น −1"

[[wrong]]
answer = "3x+8"
message = "7x − 9x = −2x ไม่ใช่ 16x ขั้นลบต้องเปลี่ยนเครื่องหมายของ 9x"

[[wrong]]
answer = "3x"
message = "ยังหารไม่จบ ผลลบ −2x − 3 ยังมีดีกรีเท่ากับตัวหาร ต้องหารต่ออีกรอบ"
