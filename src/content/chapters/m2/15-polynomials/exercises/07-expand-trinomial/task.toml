title = "คูณพหุนามสองพจน์กับสามพจน์"
level = 3
type = "expr"
form = "expanded"
answer = "2x^3-x^2-11x+12"
truth = "expand((2*x - 3)*(x**2 + x - 4))"
accept = ["2x^3 - x^2 - 11x + 12", "12-11x-x^2+2x^3"]
reject = ["(2x-3)(x^2+x-4)"]
hints = ['สองพจน์คูณสามพจน์ ต้องได้หกคู่ก่อนรวม', '$2x$ คูณสามพจน์ได้ $2x^3 + 2x^2 - 8x$ แล้ว $-3$ ก็ต้องคูณสามพจน์เหมือนกัน']
statement = '''
หา $(2x - 3)(x^2 + x - 4)$ ตอบในรูปผลสำเร็จ
'''
solution = '''
1. $2x$ คูณสามพจน์ $2x^3 + 2x^2 - 8x$
2. $-3$ คูณสามพจน์ $-3x^2 - 3x + 12$
3. รวมหกพจน์ $2x^3 + 2x^2 - 8x - 3x^2 - 3x + 12$
4. รวมพจน์ที่คล้ายกัน $2x^2 - 3x^2 = -x^2$ และ $-8x - 3x = -11x$ ได้ $2x^3 - x^2 - 11x + 12$
'''

[[wrong]]
answer = "2x^3-x^2-11x-12"
message = "(−3) × (−4) = +12 ลบคูณลบได้บวก"

[[wrong]]
answer = "2x^3+2x^2-8x-3"
message = "−3 ต้องคูณกับทุกพจน์ของวงเล็บหลังด้วย ไม่ใช่เขียนต่อท้ายเฉยๆ"

[[wrong]]
answer = "2x^3-x^2-5x+12"
message = "−8x − 3x = −11x ระวังเครื่องหมายตอนรวมพจน์ x"
