title = "คูณพหุนามสองพจน์"
level = 2
type = "expr"
form = "expanded"
answer = "x^2+3x-28"
truth = "expand((x - 4)*(x + 7))"
accept = ["x^2 + 3x - 28", "-28+3x+x^2"]
reject = ["(x-4)(x+7)", "(x+7)(x-4)"]
hints = ['สองพจน์คูณสองพจน์ ต้องได้สี่คู่ก่อนรวม', '$x \cdot x$ และ $x \cdot 7$ และ $(-4) \cdot x$ และ $(-4) \cdot 7$']
statement = '''
หา $(x - 4)(x + 7)$ ตอบในรูปที่กระจายวงเล็บแล้ว
'''
solution = '''
1. คูณครบสี่คู่ $x^2 + 7x - 4x - 28$
2. รวมพจน์ $x$ ได้ $7x - 4x = 3x$
3. ได้ $x^2 + 3x - 28$
'''

[[wrong]]
answer = "x^2-28"
message = "ยังขาดสองคู่กลาง x × 7 = 7x และ (−4) × x = −4x รวมได้ 3x"

[[wrong]]
answer = "x^2-3x-28"
message = "7x − 4x = 3x เป็นบวก ตรวจเครื่องหมายของสองคู่กลางอีกครั้ง"

[[wrong]]
answer = "x^2+3x+28"
message = "(−4) × 7 = −28 ลบคูณบวกได้ลบ"
