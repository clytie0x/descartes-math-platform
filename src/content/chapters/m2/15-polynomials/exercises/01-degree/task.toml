title = "ดีกรีของเอกนาม"
level = 1
type = "number"
answer = "5"
truth = "Poly(-5*x**3*y**2, x, y).total_degree()"
hints = ['ดีกรีของเอกนามคือผลบวกของเลขชี้กำลังของตัวแปรทุกตัว']
statement = '''
เอกนาม $-5x^3y^2$ มีดีกรีเท่าใด
'''
solution = '''
เลขชี้กำลังของ $x$ คือ $3$ ของ $y$ คือ $2$ ดีกรีจึงเป็น $3 + 2 = 5$ ส่วน $-5$ เป็นสัมประสิทธิ์ ไม่นับในดีกรี
'''

[[wrong]]
answer = "3"
message = "3 คือเลขชี้กำลังของ x ตัวเดียว ต้องบวกเลขชี้กำลังของ y ด้วย"

[[wrong]]
answer = "-5"
message = "−5 คือสัมประสิทธิ์ ดีกรีดูจากเลขชี้กำลังของตัวแปร"

[[wrong]]
answer = "6"
message = "ดีกรีคือผลบวกของเลขชี้กำลัง 3 + 2 ไม่ใช่ผลคูณ 3 × 2"
