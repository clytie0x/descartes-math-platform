title = "หมุนจุด 90° ทวนเข็มนาฬิกา"
level = 1
type = "point"
board = "c13-ex-rotate"
board_label = "ระนาบพิกัดที่มีจุด O ที่จุดกำเนิด จุด P ที่ 3 ลูกน้ำ 1 และจุดสีส้มที่ลากได้"
answer = "-1, 3"
truth = "tuple(Matrix([[0, -1], [1, 0]]) * Matrix([3, 1]))"
hints = ['จาก $O$ ไป $P$ คือไปทางขวา $3$ แล้วขึ้น $1$ หมุนทวนเข็มนาฬิกา $90^\circ$ แล้วทิศขวากลายเป็นทิศไหน', 'กฎคือ $(x, y) \to (-y, x)$']
statement = '''
หมุนจุด $P(3, 1)$ รอบจุดกำเนิด $O$ ทวนเข็มนาฬิกา $90^\circ$ ลากจุดสีส้มไปวางที่ภาพ $P'$
'''
solution = '''
ใช้กฎ $(x, y) \to (-y, x)$ ได้ $P'(-1, 3)$


คิดอีกแบบ จาก $O$ ไป $P$ คือขวา $3$ ขึ้น $1$ หมุนทวนเข็มนาฬิกา $90^\circ$ ทางขวากลายเป็นขึ้น ทางขึ้นกลายเป็นทางซ้าย จึงเป็นขึ้น $3$ และซ้าย $1$
'''

[[wrong]]
answer = "1, -3"
message = "(1, −3) คือหมุนตามเข็มนาฬิกา 90° ข้อนี้หมุนทวนเข็มนาฬิกา"

[[wrong]]
answer = "-3, 1"
message = "เปลี่ยนเครื่องหมายอย่างเดียวคือการสะท้อนข้ามแกน y หมุน 90° ต้องสลับที่สองพิกัดด้วย"

[[wrong]]
answer = "-3, -1"
message = "(−3, −1) คือหมุน 180° ข้อนี้หมุนแค่ 90°"
