title = "สะท้อนข้ามเส้นแนวนอน"
level = 2
type = "number"
label = '$y =$'
answer = "-4"
truth = "2*(-1) - 2"
hints = ['เส้น $y = -1$ เป็นเส้นนอน ภาพอยู่ในแนวตั้งเดียวกับ $P$', 'จุด $P$ อยู่เหนือเส้น $y = -1$ กี่หน่วย']
statement = '''
จุด $P(-6, 2)$ สะท้อนข้ามเส้น $y = -1$ ภาพ $P'$ มีพิกัด $y$ เท่าใด
'''
solution = '''
$P$ อยู่เหนือเส้น $y = -1$ ขึ้นไป $2 - (-1) = 3$ หน่วย ภาพจึงอยู่ใต้เส้นลงไป $3$ หน่วย คือ $y = -1 - 3 = -4$ ได้ $P'(-6, -4)$


ตรวจด้วยกฎ $y' = 2m - y = 2(-1) - 2 = -4$
'''

