statement = '''
สามเหลี่ยม $ABC$ มีจุดยอด $A(1, 1)$ $B(4, 1)$ และ $C(1, 3)$ ภาพจากการแปลงครั้งเดียวมีจุดยอด $A'(-1, 1)$ $B'(-1, 4)$ และ $C'(-3, 1)$ การแปลงนี้คือข้อใด
'''
solution = '''
ตรวจกฎ $(x, y) \to (-y, x)$ ของการหมุนทวนเข็มนาฬิกา $90^\circ$ กับทุกจุด $A(1, 1) \to (-1, 1)$ $B(4, 1) \to (-1, 4)$ $C(1, 3) \to (-3, 1)$ ตรงทั้งสามจุด


อีกทางหนึ่ง $AB$ อยู่ในแนวนอนชี้ไปทางขวา แต่ $A'B'$ อยู่ในแนวตั้งชี้ขึ้น ด้านหันไป $90^\circ$ จึงไม่ใช่การเลื่อนขนาน การสะท้อนข้ามแกน $y$ และการเลื่อนไปทางซ้าย $2$ หน่วยพา $A$ ไปที่ $(-1, 1)$ ได้ก็จริง แต่พา $B$ ไปไม่ถูก
'''

