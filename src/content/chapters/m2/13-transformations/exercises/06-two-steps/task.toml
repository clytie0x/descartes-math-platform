title = "หมุนแล้วเลื่อน"
level = 2
type = "point"
board = "c13-ex-compose"
board_label = "ระนาบพิกัดที่มีจุด O ที่จุดกำเนิด จุด P ที่ 1 ลูกน้ำ 3 และจุดสีส้มที่ลากได้"
answer = "-3, -1"
truth = "(-3, 1 - 2)"
hints = ['ทำทีละขั้นตามลำดับ หมุนก่อนด้วยกฎ $(x, y) \to (-y, x)$', 'ได้ $P^\prime$ แล้ว เลื่อน $P^\prime$ ลง $2$ หน่วย']
statement = '''
หมุนจุด $P(1, 3)$ รอบจุดกำเนิดทวนเข็มนาฬิกา $90^\circ$ ได้ $P'$ แล้วเลื่อนขนาน $P'$ ลง $2$ หน่วย ได้ $P''$ ลากจุดสีส้มไปวางที่ $P''$
'''
solution = '''
1. หมุนก่อน $P(1, 3) \to P'(-3, 1)$
2. แล้วเลื่อนลง $2$ $P'(-3, 1) \to P''(-3, -1)$


ถ้าเลื่อนก่อนแล้วค่อยหมุน จะได้ $(1, 1)$ แล้วได้ $(-1, 1)$ ซึ่งเป็นคนละจุด ลำดับของการแปลงจึงสำคัญ
'''

[[wrong]]
answer = "-1, 1"
message = "นี่คือคำตอบเมื่อเลื่อนก่อนแล้วค่อยหมุน โจทย์ให้หมุนก่อน แล้วจึงเลื่อนภาพที่ได้"

[[wrong]]
answer = "-3, 1"
message = "(−3, 1) คือ P′ หลังหมุน ยังต้องเลื่อนลงอีก 2 หน่วย"

[[wrong]]
answer = "3, -3"
message = "(3, −3) มาจากการหมุนตามเข็มนาฬิกา ข้อนี้หมุนทวนเข็มนาฬิกา ใช้กฎ (−y, x) ได้ P′(−3, 1) แล้วจึงเลื่อนลง 2"
