title = "สะท้อนข้ามเส้น x = 1"
level = 2
type = "point"
board = "c13-ex-reflect"
board_label = "สามเหลี่ยม ABC มีจุดยอด A ลบ 3 ลูกน้ำ 1 B ลบ 1 ลูกน้ำ 4 C 0 ลูกน้ำ 1 เส้นสะท้อน x เท่ากับ 1 สีม่วง และจุดสีส้มที่ลากได้"
answer = "3, 4"
truth = "(2*1 - (-1), 4)"
hints = ['$B$ อยู่ห่างจากเส้น $x = 1$ ไปทางซ้ายกี่หน่วย', 'ภาพต้องอยู่ทางขวาของเส้นเป็นระยะเท่ากัน ที่ความสูงเดิม']
statement = '''
สามเหลี่ยม $ABC$ มีจุดยอด $A(-3, 1)$ $B(-1, 4)$ และ $C(0, 1)$ สะท้อนสามเหลี่ยมนี้ข้ามเส้น $x = 1$ ลากจุดสีส้มไปวางที่ $B'$
'''
solution = '''
$B$ อยู่ที่ $x = -1$ ห่างจากเส้น $x = 1$ ไปทางซ้าย $2$ หน่วย ภาพจึงอยู่ทางขวาของเส้น $2$ หน่วย คือ $x = 3$ เส้นสะท้อนเป็นเส้นตั้ง พิกัด $y$ จึงเท่าเดิม ได้ $B'(3, 4)$


ตรวจด้วยกฎ $x' = 2m - x = 2(1) - (-1) = 3$
'''

[[wrong]]
answer = "1, 4"
message = "(1, 4) คือภาพจากการสะท้อนข้ามแกน y เส้นสะท้อนข้อนี้คือ x = 1 ต้องนับระยะจากเส้นนี้"

[[wrong]]
answer = "-1, -2"
message = "เส้น x = 1 เป็นเส้นตั้ง ภาพต้องอยู่ระดับเดียวกับ B พิกัด y ต้องเป็น 4 เท่าเดิม"

[[wrong]]
answer = "2, 4"
message = "B อยู่ห่างจากเส้น x = 1 สองหน่วย ภาพต้องห่างจากเส้นสองหน่วยเท่ากัน คือ x = 3"
