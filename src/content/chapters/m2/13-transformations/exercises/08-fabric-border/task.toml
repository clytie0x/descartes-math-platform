title = "ลายขอบผ้า"
level = 3
type = "number"
unit = "หน่วย"
answer = "6"
truth = "2*(4 - 1)"
hints = ['ลองหาภาพของจุดหนึ่งจุดบนลาย เช่น $(0, 0)$ ทีละครั้ง', 'สะท้อนข้ามเส้นขนานสองเส้นได้ผลเท่ากับการเลื่อนขนานสองเท่าของระยะห่างระหว่างเส้น']
statement = '''
ช่างออกแบบลายขอบผ้าบนจอคอมพิวเตอร์ที่มีเส้นตาราง วาดลายดอกไม้ต้นแบบไว้ แล้วสะท้อนลายข้ามเส้น $x = 1$ จากนั้นสะท้อนลายที่ได้ข้ามเส้น $x = 4$ ลายสุดท้ายหันทางเดียวกับลายต้นแบบ และอยู่ห่างจากลายต้นแบบไปทางขวากี่หน่วย
'''
solution = '''
1. สองเส้นขนานกันและห่างกัน $4 - 1 = 3$ หน่วย
2. สะท้อนข้ามเส้นขนานสองเส้นได้ผลเท่ากับการเลื่อนขนาน $2 \times 3 = 6$ หน่วย จากเส้นแรกไปหาเส้นที่สอง คือไปทางขวา
3. ตรวจกับจุด $(0, 0)$ สะท้อนข้าม $x = 1$ ได้ $(2, 0)$ สะท้อนข้าม $x = 4$ ได้ $(6, 0)$ เลื่อนไปทางขวา $6$ หน่วยจริง
'''

[[wrong]]
answer = "3"
message = "3 คือระยะห่างระหว่างสองเส้น ผลของการสะท้อนสองครั้งคือเลื่อนเป็นสองเท่าของระยะนี้"

[[wrong]]
answer = "5"
message = "ไม่ได้เอาตำแหน่งของสองเส้นมาบวกกัน ลองหาภาพของจุด (0, 0) ทีละครั้งดู"

[[wrong]]
answer = "-6"
message = "ทิศของการเลื่อนคือจากเส้นแรก x = 1 ไปหาเส้นที่สอง x = 4 ซึ่งเป็นทางขวา คำตอบจึงเป็นบวก"
