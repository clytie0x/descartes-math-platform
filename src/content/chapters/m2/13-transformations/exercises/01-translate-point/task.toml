title = "เลื่อนขนานจุด"
level = 1
type = "point"
board = "c13-ex-translate"
board_label = "ระนาบพิกัดที่มีจุด A อยู่ที่ ลบ 3 ลูกน้ำ 2 และจุดสีส้มหนึ่งจุด ลากไปวางที่ภาพ"
answer = "2, -1"
truth = "(-3 + 5, 2 - 3)"
hints = ['ไปทางขวาเปลี่ยนพิกัด $x$ ลงเปลี่ยนพิกัด $y$', 'ไปทางขวา $5$ คือบวก $5$ ลง $3$ คือลบ $3$']
statement = '''
เลื่อนขนานจุด $A(-3, 2)$ ไปทางขวา $5$ หน่วย และลง $3$ หน่วย ลากจุดสีส้มไปวางที่ภาพ $A'$ จุดจะติดอยู่บนจุดตัดของเส้นตาราง
'''
solution = '''
กฎของการเลื่อนนี้คือ $(x, y) \to (x + 5,\ y - 3)$ จึงได้ $A'(-3 + 5,\ 2 - 3) = A'(2, -1)$
'''

[[wrong]]
answer = "2, 5"
message = "ลง 3 หน่วยต้องลบ 3 ออกจากพิกัด y ได้ 2 − 3 = −1 ไม่ใช่บวก"

[[wrong]]
answer = "-8, -1"
message = "ไปทางขวาพิกัด x ต้องเพิ่มขึ้น −3 + 5 = 2"

[[wrong]]
answer = "-3, 4"
message = "ไปทางขวา 5 เปลี่ยนพิกัด x และลง 3 เปลี่ยนพิกัด y อย่าเอาตัวเลขไปใส่ผิดพิกัด"
