title = "เข็มสั้นของนาฬิกา"
level = 1
type = "number"
unit = "องศา"
answer = "120"
truth = "Rational(360, 12) * 4"
hints = ['เข็มสั้นหมุนครบรอบ $360^\circ$ ในกี่ชั่วโมง', 'หนึ่งชั่วโมงเข็มสั้นเดินจากเลขหนึ่งไปเลขถัดไป ซึ่งห่างกัน $\tfrac{360}{12}$ องศา']
statement = '''
นักเรียนเข้าห้องเรียนคาบแรกตอน 9.00 น. และเลิกเรียนคาบเช้าตอน 13.00 น. ในช่วงเวลานี้เข็มสั้นของนาฬิกาหมุนไปตามเข็มนาฬิกากี่องศา
'''
solution = '''
1. เข็มสั้นเดินครบรอบ $360^\circ$ ใน $12$ ชั่วโมง จึงหมุนชั่วโมงละ $\tfrac{360}{12} = 30^\circ$
2. จาก 9.00 น. ถึง 13.00 น. คือ $4$ ชั่วโมง เข็มสั้นเดินจากเลข 9 ไปเลข 1
3. หมุนไป $4 \times 30 = 120^\circ$ ตามเข็มนาฬิกา
'''

[[wrong]]
answer = "4"
message = "4 คือจำนวนชั่วโมง ข้อนี้ถามมุมที่เข็มสั้นหมุนเป็นองศา"

[[wrong]]
answer = "240"
message = "เข็มสั้นหมุนชั่วโมงละ 360 ÷ 12 = 30° ไม่ใช่ 60°"

[[wrong]]
