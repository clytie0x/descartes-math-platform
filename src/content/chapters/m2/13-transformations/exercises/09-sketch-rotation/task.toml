statement = '''
บนกระดาษตาราง วาดสามเหลี่ยม $ABC$ ที่มีจุดยอด $A(1, 1)$ $B(4, 1)$ และ $C(4, 3)$ แล้ววาดภาพของสามเหลี่ยมนี้จากการหมุนรอบจุด $A$ ตามเข็มนาฬิกา $90^\circ$ เขียนพิกัดของจุดยอดของภาพทุกจุด เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์
'''
solution = '''
<div class="figure"><div class="board" data-board="c13-sketch-check" role="img" aria-label="สามเหลี่ยม ABC กับภาพจากการหมุนรอบ A ตามเข็มนาฬิกา 90 องศา ภาพมีจุดยอด 1 ลูกน้ำ 1 1 ลูกน้ำ ลบ 2 และ 3 ลูกน้ำ ลบ 2"></div></div>

ตรวจรูปของตัวเองทีละข้อ ได้ครบสี่ข้อถือว่าผ่าน

- $A'$ อยู่ที่ $(1, 1)$ จุดเดียวกับ $A$ เพราะ $A$ เป็นจุดหมุน
- $B'$ อยู่ที่ $(1, -2)$ เพราะจาก $A$ ไป $B$ คือขวา $3$ หมุนตามเข็มนาฬิกา $90^\circ$ กลายเป็นลง $3$
- $C'$ อยู่ที่ $(3, -2)$ เพราะจาก $A$ ไป $C$ คือขวา $3$ ขึ้น $2$ หมุนแล้วกลายเป็นลง $3$ ขวา $2$
- $AB$ ยาว $3$ ในแนวนอน และ $A'B'$ ยาว $3$ ในแนวตั้ง ภาพมีขนาดเท่ารูปต้นแบบและไม่กลับด้าน
