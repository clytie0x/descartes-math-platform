title = "มุมฉากอยู่ที่ไหน"
level = 2
type = "choice"
choices = ['มุม $A$', 'มุม $B$', 'มุม $C$', 'ไม่มีมุมฉาก']
answer = 1
checks = ["20**2 + 21**2 == 29**2"]
hints = ['ตรวจก่อนว่า $20^2 + 21^2$ เท่ากับ $29^2$ หรือไม่', 'มุมฉากอยู่ตรงข้ามด้านที่ยาวที่สุด']
statement = '''
รูปสามเหลี่ยม $ABC$ มี $AB = 20$ $BC = 21$ และ $CA = 29$ เซนติเมตร มุมใดเป็นมุมฉาก
'''
solution = '''
1. ด้านที่ยาวที่สุดคือ $CA = 29$ ได้ $29^2 = 841$
2. $AB^2 + BC^2 = 400 + 441 = 841$ เท่ากัน จึงเป็นรูปสามเหลี่ยมมุมฉาก
3. มุมฉากอยู่ตรงข้ามด้าน $CA$ ด้านนี้ไม่มีตัว $B$ มุมฉากจึงอยู่ที่มุม $B$
'''

