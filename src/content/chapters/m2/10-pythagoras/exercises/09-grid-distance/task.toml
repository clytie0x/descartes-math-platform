title = "ระยะระหว่างจุดบนระนาบพิกัด"
level = 2
type = "number"
unit = "หน่วย"
answer = "13"
truth = "sqrt((7 - 2)**2 + (9 - (-3))**2)"
hints = ['ลากเส้นแนวนอนผ่าน $P$ กับเส้นแนวตั้งผ่าน $Q$ ให้พบกันเป็นมุมฉาก', 'ระยะแนวนอนคือ $7 - 2$ ระยะแนวตั้งคือ $9 - (-3)$']
statement = '''
จงหาระยะระหว่างจุด $P(2, -3)$ กับจุด $Q(7, 9)$
'''
solution = '''
1. เส้นแนวนอนผ่าน $P$ กับเส้นแนวตั้งผ่าน $Q$ พบกันที่ $(7, -3)$ เป็นมุมฉาก
2. ระยะแนวนอน $7 - 2 = 5$ หน่วย ระยะแนวตั้ง $9 - (-3) = 12$ หน่วย
3. $PQ^2 = 5^2 + 12^2 = 25 + 144 = 169$ ได้ $PQ = 13$ หน่วย
'''

[[wrong]]
answer = "17"
message = "5 + 12 = 17 คือระยะเมื่อเดินตามเส้นตาราง ระยะตรงระหว่างสองจุดต้องใช้ 5² + 12²"

