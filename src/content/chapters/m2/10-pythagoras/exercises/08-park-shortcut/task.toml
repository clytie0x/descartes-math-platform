title = "ทางลัดในสวนสาธารณะ"
level = 2
type = "number"
unit = "เมตร"
answer = "20"
truth = "24 + 70 - sqrt(24**2 + 70**2)"
hints = ['เส้นทแยงมุมของสนามเป็นด้านตรงข้ามมุมฉาก', 'หาความยาวเส้นทแยงมุมก่อน แล้วเทียบกับการเดินตามขอบสองด้าน']
statement = '''
สนามหญ้าในสวนสาธารณะเป็นรูปสี่เหลี่ยมผืนผ้ากว้าง $24$ เมตร ยาว $70$ เมตร เดินจากมุมหนึ่งไปมุมตรงข้ามโดยตัดสนามตามแนวเส้นทแยงมุม จะเดินน้อยกว่าเดินตามขอบสนามสองด้านกี่เมตร
'''
solution = '''
1. เส้นทแยงมุม $d$ เป็นด้านตรงข้ามมุมฉาก $d^2 = 24^2 + 70^2 = 576 + 4{,}900 = 5{,}476$
2. $74^2 = 5{,}476$ เส้นทแยงมุมยาว $74$ เมตร
3. เดินตามขอบ $24 + 70 = 94$ เมตร
4. ตัดสนามเดินน้อยกว่า $94 - 74 = 20$ เมตร
'''

[[wrong]]
answer = "74"
message = "74 เมตรคือระยะทางเมื่อเดินตัดสนาม ข้อนี้ถามว่าเดินน้อยลงกี่เมตร"

