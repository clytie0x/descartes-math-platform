title = "ความสูงของหลังคาจั่ว"
level = 3
type = "number"
unit = "เมตร"
tolerance = 0.01
answer = "4.47"
truth = "Rational(round(float(sqrt(6**2 - 4**2)) * 100), 100)"
accept = ["sqrt(20)", "4.472"]
hints = ['ลากเส้นจากยอดจั่วตั้งฉากลงมาที่ฐาน เส้นนี้แบ่งฐานเป็นสองส่วนเท่ากัน', 'ในรูปสามเหลี่ยมมุมฉากที่ได้ ขอบหลังคา $6$ เมตรเป็นด้านตรงข้ามมุมฉาก ฐานยาว $4$ เมตร', 'ได้ความสูงยกกำลังสองแล้ว ใช้เครื่องคิดเลขหารากที่สอง']
statement = '''
ด้านหน้าของหลังคาจั่วเป็นรูปสามเหลี่ยมหน้าจั่ว ฐานกว้าง $8$ เมตร ขอบหลังคาสองข้างยาวข้างละ $6$ เมตร ยอดจั่วสูงจากฐานประมาณกี่เมตร ใช้เครื่องคิดเลขและตอบเป็นทศนิยมสองตำแหน่ง
'''
solution = '''
1. ลากเส้นจากยอดจั่วตั้งฉากลงมาที่ฐาน แบ่งฐาน $8$ เมตรเป็นสองส่วน ส่วนละ $4$ เมตร
2. ในรูปสามเหลี่ยมมุมฉากที่ได้ ขอบหลังคา $6$ เมตรเป็นด้านตรงข้ามมุมฉาก จึงลบ $h^2 = 6^2 - 4^2 = 36 - 16 = 20$
3. $4^2 = 16$ กับ $5^2 = 25$ ดังนั้น $h$ อยู่ระหว่าง $4$ กับ $5$
4. เครื่องคิดเลขให้ $\sqrt{20} = 4.4721\ldots$ ยอดจั่วสูงประมาณ $4.47$ เมตร

เรื่องรากที่สองอย่าง $\sqrt{20}$ จะเรียนละเอียดในบทที่ 11
'''

