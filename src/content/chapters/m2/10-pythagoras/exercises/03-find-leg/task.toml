title = "หาด้านประกอบมุมฉาก"
level = 1
type = "number"
unit = "เซนติเมตร"
answer = "15"
truth = "sqrt(17**2 - 8**2)"
hints = ['ด้านที่ยาว $17$ เซนติเมตรเป็นด้านตรงข้ามมุมฉาก ด้านที่หาจึงต้องสั้นกว่า $17$', 'ด้านที่หายไปเป็นด้านประกอบมุมฉาก ใช้ $b^2 = c^2 - a^2$']
statement = '''
รูปสามเหลี่ยมมุมฉากมีด้านตรงข้ามมุมฉากยาว $17$ เซนติเมตร และด้านประกอบมุมฉากด้านหนึ่งยาว $8$ เซนติเมตร ด้านประกอบมุมฉากอีกด้านยาวเท่าใด
'''
solution = '''
1. ด้านที่หาเป็นด้านประกอบมุมฉาก จึงลบ $17^2 - 8^2 = 289 - 64 = 225$
2. $15^2 = 225$ ด้านที่หายาว $15$ เซนติเมตร
3. ตรวจ $15$ สั้นกว่า $17$ ถูกต้อง
'''

[[wrong]]
answer = "sqrt(353)"
message = "17² + 8² ใช้เมื่อหาด้านตรงข้ามมุมฉาก แต่ข้อนี้ 17 เป็นด้านตรงข้ามมุมฉากอยู่แล้ว ต้องลบ 17² − 8²"

