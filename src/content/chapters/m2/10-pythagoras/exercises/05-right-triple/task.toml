]
hints = ['ยกกำลังสองด้านที่ยาวที่สุด แล้วเทียบกับผลบวกกำลังสองของอีกสองด้าน']
statement = '''
ความยาวด้านชุดใดเป็นความยาวด้านของรูปสามเหลี่ยมมุมฉาก
'''
solution = '''
| ด้าน | ผลบวกกำลังสองของด้านสั้น | กำลังสองของด้านยาวที่สุด |
|---|---|---|
| $5, 6, 7$ | $25 + 36 = 61$ | $49$ |
| $4, 5, 6$ | $16 + 25 = 41$ | $36$ |
| $8, 15, 17$ | $64 + 225 = 289$ | $289$ |
| $10, 24, 25$ | $100 + 576 = 676$ | $625$ |

มีแค่ $8, 15, 17$ ที่เท่ากัน ตามบทกลับของทฤษฎีบทพีทาโกรัส ชุดนี้จึงเป็นรูปสามเหลี่ยมมุมฉาก
'''

