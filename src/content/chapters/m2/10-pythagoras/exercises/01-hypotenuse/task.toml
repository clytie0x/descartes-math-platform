title = "หาด้านตรงข้ามมุมฉาก"
level = 1
type = "number"
label = '$c =$'
unit = "เซนติเมตร"
answer = "10"
truth = "sqrt(6**2 + 8**2)"
hints = ['ด้านที่หาเป็นด้านตรงข้ามมุมฉาก ใช้ $c^2 = a^2 + b^2$']
statement = '''
รูปสามเหลี่ยมมุมฉากมีด้านประกอบมุมฉากยาว $6$ และ $8$ เซนติเมตร ด้านตรงข้ามมุมฉากยาวเท่าใด
'''
solution = '''
1. $c^2 = 6^2 + 8^2 = 36 + 64 = 100$
2. $10^2 = 100$ จึงได้ $c = 10$ เซนติเมตร

ชุด $6, 8, 10$ คือ $3, 4, 5$ คูณ $2$
'''

