title = "เรียงการพิสูจน์ด้วยการย้ายชิ้น"
level = 2
type = "order"
steps = [
  'วาดสี่เหลี่ยมจัตุรัสด้านยาว $a + b$ แล้ววางรูปสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉาก $a$ และ $b$ สี่รูปไว้ที่มุมทั้งสี่',
  'ช่องที่เหลือตรงกลางเป็นสี่เหลี่ยมจัตุรัสด้านยาว $c$ มีพื้นที่ $c^2$',
  'ย้ายรูปสามเหลี่ยมทั้งสี่มาจับคู่เป็นรูปสี่เหลี่ยมผืนผ้าสองรูปในกรอบเดิม',
  'ช่องที่เหลือตอนนี้เป็นสี่เหลี่ยมจัตุรัสด้าน $a$ กับด้าน $b$ มีพื้นที่รวม $a^2 + b^2$',
  'กรอบกับรูปสามเหลี่ยมทั้งสี่มีพื้นที่เท่าเดิม พื้นที่ที่เหลือจึงเท่ากัน ได้ $c^2 = a^2 + b^2$',
]
alternatives = [[2, 3, 0, 1, 4]]
hints = ['พื้นที่ที่เหลือของการวางแต่ละแบบต้องบอกหลังจากวางรูปสามเหลี่ยมแบบนั้นแล้ว', 'ข้อสรุป $c^2 = a^2 + b^2$ ต้องรู้พื้นที่ที่เหลือของทั้งสองแบบก่อน']
statement = '''
เรียงขั้นตอนการพิสูจน์ทฤษฎีบทพีทาโกรัสด้วยการย้ายรูปสามเหลี่ยมในสี่เหลี่ยมจัตุรัสด้าน $a + b$ แบบในหน้า 10.1
'''
solution = '''
1. วาดกรอบสี่เหลี่ยมจัตุรัสด้าน $a + b$ แล้ววางรูปสามเหลี่ยมสี่รูปที่มุม
2. ช่องตรงกลางมีพื้นที่ $c^2$
3. ย้ายรูปสามเหลี่ยมมาเป็นรูปสี่เหลี่ยมผืนผ้าสองรูป
4. ช่องที่เหลือมีพื้นที่ $a^2 + b^2$
5. กรอบเท่าเดิม รูปสามเหลี่ยมเท่าเดิม พื้นที่ที่เหลือจึงเท่ากัน

จะทำการวางแบบที่สองก่อนแบบแรกก็ได้ ขอให้บอกพื้นที่ที่เหลือหลังวางแต่ละแบบ แล้วสรุปเป็นขั้นสุดท้าย
'''

[[wrong]]
answer = [0, 2, 1, 3, 4]
message = "พื้นที่ c² เป็นของช่องตรงกลางตอนที่รูปสามเหลี่ยมยังอยู่ที่มุม ต้องบอกก่อนย้ายรูปสามเหลี่ยม"

[[wrong]]
answer = [0, 1, 2, 4, 3]
message = "จะสรุปว่า c² = a² + b² ได้ ต้องรู้ก่อนว่าพื้นที่ที่เหลือหลังย้ายเท่ากับ a² + b²"
