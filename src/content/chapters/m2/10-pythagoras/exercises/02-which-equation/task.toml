title = "เขียนสมการให้ถูกด้าน"
level = 1
type = "choice"
choices = ['$PR^2 = PQ^2 + QR^2$', '$PQ^2 = PR^2 + QR^2$', '$QR^2 = PQ^2 + PR^2$', '$PR = PQ + QR$']
answer = 0
hints = ['ด้านตรงข้ามมุมฉากคือด้านที่ไม่มีตัว $Q$ อยู่ในชื่อ']
statement = '''
รูปสามเหลี่ยม $PQR$ มีมุม $Q$ เป็นมุมฉาก ข้อใดถูกต้องตามทฤษฎีบทพีทาโกรัส
'''
solution = '''
มุม $Q$ เป็นมุมฉาก ด้านที่ไม่มีตัว $Q$ คือ $PR$ จึงเป็นด้านตรงข้ามมุมฉาก และต้องอยู่ข้างหนึ่งของสมการเพียงตัวเดียว ได้ $PR^2 = PQ^2 + QR^2$
'''

[[wrong]]
answer = 1
message = "PQ มีตัว Q อยู่ จึงเป็นแขนของมุมฉาก ไม่ใช่ด้านตรงข้ามมุมฉาก"

[[wrong]]
answer = 2
message = "QR มีตัว Q อยู่ จึงเป็นแขนของมุมฉาก ด้านที่อยู่ข้างเดียวต้องเป็นด้านตรงข้ามมุม Q คือ PR"

[[wrong]]
answer = 3
message = "ทฤษฎีบทพูดถึงกำลังสองของด้าน ไม่ใช่ความยาวบวกกัน และ PQ + QR ยาวกว่า PR เสมอ"
