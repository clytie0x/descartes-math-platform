title = "บันไดติดตั้งแอร์"
level = 2
type = "number"
unit = "เมตร"
answer = "2.4"
truth = "sqrt(Rational('2.5')**2 - Rational('0.7')**2)"
accept = ["12/5"]
hints = ['วาดรูป ผนัง พื้น และบันได บันไดเป็นด้านไหนของรูปสามเหลี่ยมมุมฉาก', 'ความสูงเป็นด้านประกอบมุมฉาก จึงต้องลบ $2.5^2 - 0.7^2$']
statement = '''
ช่างติดตั้งแอร์พาดบันไดยาว $2.5$ เมตรกับผนังห้อง เท้าบันไดห่างจากผนัง $0.7$ เมตร ยอดบันไดแตะผนังที่ความสูงกี่เมตรจากพื้น
'''
solution = '''
1. ผนังตั้งฉากกับพื้น บันไดเป็นด้านตรงข้ามมุมฉาก ความสูงเป็นด้านประกอบมุมฉาก
2. $h^2 = 2.5^2 - 0.7^2 = 6.25 - 0.49 = 5.76$
3. $2.4^2 = 5.76$ ยอดบันไดสูง $2.4$ เมตร

ชุด $0.7, 2.4, 2.5$ คือ $7, 24, 25$ หารด้วย $10$
'''

