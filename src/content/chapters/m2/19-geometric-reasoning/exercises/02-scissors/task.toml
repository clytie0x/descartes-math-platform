title = "มุมของกรรไกร"
level = 1
type = "number"
unit = "องศา"
answer = "60"
truth = "(5*x - 20).subs(x, solve(Eq(3*x + 12, 5*x - 20), x)[0])"
hints = ['ใบมีดสองใบเป็นเส้นตรงสองเส้นที่ตัดกันที่หมุด มุมระหว่างด้ามจับกับมุมระหว่างปลายใบมีดเป็นมุมคู่แบบไหน', 'มุมตรงข้ามมีขนาดเท่ากัน จึงได้สมการ $3x + 12 = 5x - 20$']
statement = '''
กรรไกรที่กางอยู่ ใบมีดกับด้ามจับแต่ละข้างเป็นเส้นตรงเดียวกัน และเส้นตรงทั้งสองตัดกันที่หมุด มุมระหว่างด้ามจับทั้งสองมีขนาด $(3x + 12)^\circ$ และมุมระหว่างปลายใบมีดทั้งสองมีขนาด $(5x - 20)^\circ$ มุมระหว่างปลายใบมีดมีขนาดกี่องศา
'''
solution = '''
1. มุมระหว่างด้ามจับกับมุมระหว่างปลายใบมีดอยู่ตรงข้ามกันที่หมุด จึงเป็นมุมตรงข้าม มีขนาดเท่ากัน
2. $3x + 12 = 5x - 20$ ได้ $32 = 2x$ จึงได้ $x = 16$
3. มุมระหว่างปลายใบมีดคือ $5(16) - 20 = 60$ องศา ตรวจ $3(16) + 12 = 60$ เท่ากัน
'''

[[wrong]]
answer = "16"
message = "16 คือค่า x ยังต้องแทนกลับใน 5x − 20 เพื่อหาขนาดของมุม"

