title = "รั้วรอบที่ดิน"
level = 2
type = "number"
unit = "เมตร"
answer = "50"
truth = "2*((3*x - 2).subs(x, solve(Eq(3*x - 2, x + 10), x)[0]) + 9)"
hints = ['ด้านตรงข้ามของรูปสี่เหลี่ยมด้านขนานยาวเท่ากัน จึงได้ $3x - 2 = x + 10$', 'อย่าลืมว่า $AD$ ยาวเท่ากับ $BC$ ด้วย']
statement = '''
ที่ดินแปลงหนึ่งเป็นรูปสี่เหลี่ยมด้านขนาน $ABCD$ วัดด้าน $AB$ ได้ $3x - 2$ เมตร ด้าน $DC$ ได้ $x + 10$ เมตร และด้าน $BC$ ยาว $9$ เมตร ต้องใช้รั้วล้อมรอบที่ดินแปลงนี้ยาวกี่เมตร
'''
solution = '''
1. $AB$ กับ $DC$ เป็นด้านตรงข้ามของรูปสี่เหลี่ยมด้านขนาน จึงยาวเท่ากัน $3x - 2 = x + 10$ ได้ $x = 6$
2. $AB = DC = 3(6) - 2 = 16$ เมตร และ $AD = BC = 9$ เมตร
3. รั้วยาว $16 + 9 + 16 + 9 = 50$ เมตร
'''

[[wrong]]
answer = "6"
message = "6 คือค่า x ยังต้องแทนกลับเพื่อหาความยาวด้าน แล้วรวมทั้งสี่ด้าน"

[[wrong]]
