title = "จุดบนเส้นแบ่งครึ่งตั้งฉาก"
level = 2
type = "order"
steps = [
  '$AM = BM$ เพราะ $M$ เป็นจุดกึ่งกลางของ $\overline{AB}$',
  '$P\hat{M}A = P\hat{M}B = 90^\circ$ เพราะเส้นตรง $l$ ตั้งฉากกับ $\overline{AB}$',
  '$PM = PM$ เพราะเป็นด้านร่วม',
  '$\triangle PMA \cong \triangle PMB$ แบบ ด.ม.ด.',
  '$PA = PB$ เพราะเป็นด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการ',
]
alternatives = [[0, 2, 1, 3, 4], [1, 0, 2, 3, 4], [1, 2, 0, 3, 4], [2, 0, 1, 3, 4], [2, 1, 0, 3, 4]]
hints = ['$PA$ อยู่ใน $\triangle PMA$ และ $PB$ อยู่ใน $\triangle PMB$ ต้องแสดงก่อนว่ารูปสามเหลี่ยมสองรูปนี้เท่ากันทุกประการ', 'ส่วนที่เท่ากันสามคู่จะเรียงลำดับไหนก็ได้ แต่ต้องมาก่อนการสรุปว่าเท่ากันทุกประการ']
statement = '''
เส้นตรง $l$ ตั้งฉากกับ $\overline{AB}$ ที่จุดกึ่งกลาง $M$ และจุด $P$ อยู่บนเส้นตรง $l$ โดย $P\ne M$ เรียงขั้นการพิสูจน์ว่า $PA = PB$

<figure class="figure">
<svg class="fig" viewBox="0 0 320 230" role="img" aria-label="เส้นตรง l ตั้งฉากกับ AB ที่จุดกึ่งกลาง M จุด P อยู่บนเส้น l">
  <line class="dash" x1="160" y1="20" x2="160" y2="215" />
  <line class="line" x1="60" y1="180" x2="260" y2="180" />
  <line class="line" x1="160" y1="55" x2="60" y2="180" />
  <line class="line" x1="160" y1="55" x2="260" y2="180" />
  <line class="teal" x1="160" y1="55" x2="160" y2="180" />
  <line class="line" x1="110" y1="174" x2="110" y2="186" />
  <line class="line" x1="210" y1="174" x2="210" y2="186" />
  <path class="thin" d="M172 180 L172 168 L160 168" />
  <circle class="dot" cx="160" cy="55" r="3" />
  <circle class="dot" cx="160" cy="180" r="3" />
  <text class="label-math" x="48" y="186" text-anchor="middle">A</text>
  <text class="label-math" x="272" y="186" text-anchor="middle">B</text>
  <text class="label-math" x="148" y="200" text-anchor="middle">M</text>
  <text class="label-math" x="146" y="51" text-anchor="middle">P</text>
  <text class="label-math" x="172" y="32" text-anchor="middle">l</text>
</svg>
<figcaption>เส้นประ l ตั้งฉากกับ AB ที่จุดกึ่งกลาง M</figcaption>
</figure>
'''
solution = '''
| ข้อความ | เหตุผล |
|---|---|
| (1) $AM = BM$ | $M$ เป็นจุดกึ่งกลางของ $\overline{AB}$ |
| (2) $P\hat{M}A = P\hat{M}B = 90^\circ$ | $l$ ตั้งฉากกับ $\overline{AB}$ |
| (3) $PM = PM$ | เป็นด้านร่วม |
| (4) $\triangle PMA \cong \triangle PMB$ | ด.ม.ด. จาก (1) (2) (3) |
| (5) $PA = PB$ | ด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการยาวเท่ากัน |

สามบรรทัดแรกสลับกันได้ สำหรับกรณี $P=M$ ที่ไม่ได้ใช้สามเหลี่ยมข้างต้น ก็ได้ $PA=MA=MB=PB$ จากการเป็นจุดกึ่งกลางโดยตรง ผลจึงครอบคลุมทุกจุดบนเส้นแบ่งครึ่งตั้งฉากของ $\overline{AB}$ ว่าอยู่ห่างจาก $A$ และ $B$ เท่ากัน ซึ่งเป็นเหตุผลที่การสร้างเส้นแบ่งครึ่งตั้งฉากด้วยวงเวียนตอน ม.1 ใช้ได้
'''

[[wrong]]
answer = [0, 1, 2, 4, 3]
message = "PA = PB ได้มาจากรูปสามเหลี่ยมที่เท่ากันทุกประการ จึงต้องสรุปว่ารูปสามเหลี่ยมเท่ากันทุกประการก่อน"

[[wrong]]
