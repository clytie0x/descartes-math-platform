solution = '''
| ข้อความ | เหตุผล |
|---|---|
| (1) $DB = EC$ | ครึ่งหนึ่งของ $AB$ เท่ากับครึ่งหนึ่งของ $AC$ เพราะ $AB = AC$ |
| (2) $D\hat{B}C = E\hat{C}B$ | มุมที่ฐานของรูปสามเหลี่ยมหน้าจั่วมีขนาดเท่ากัน |
| (3) $BC = CB$ | เป็นด้านร่วม |
| (4) $\triangle DBC \cong \triangle ECB$ | ด.ม.ด. จาก (1) (2) (3) |
| (5) $CD = BE$ | ด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการยาวเท่ากัน |

สามบรรทัดแรกสลับกันได้ บรรทัด (2) ใช้ทฤษฎีบทมุมที่ฐานที่พิสูจน์แล้ว ไม่ต้องพิสูจน์ซ้ำ
'''

