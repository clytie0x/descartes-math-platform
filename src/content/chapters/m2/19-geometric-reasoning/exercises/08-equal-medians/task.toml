hints = ['$CD$ อยู่ใน $\triangle DBC$ และ $BE$ อยู่ใน $\triangle ECB$ สองรูปนี้มีด้าน $BC$ ร่วมกัน', 'มุมที่ $B$ กับมุมที่ $C$ ของสองรูปนี้คือมุมที่ฐานของ $\triangle ABC$']
statement = '''
$\triangle ABC$ มี $AB = AC$ จุด $D$ และ $E$ เป็นจุดกึ่งกลางของ $\overline{AB}$ และ $\overline{AC}$ ตามลำดับ เรียงขั้นการพิสูจน์ว่า $CD = BE$

