title = "เส้นจากจุดกึ่งกลางยาวเท่ากัน"
level = 2
type = "order"
steps = [
  '$DB = EC$ เพราะ $AB = AC$ และ $D$ กับ $E$ แบ่งครึ่ง $\overline{AB}$ กับ $\overline{AC}$',
  '$D\hat{B}C = E\hat{C}B$ เพราะเป็นมุมที่ฐานของรูปสามเหลี่ยมหน้าจั่ว $ABC$',
  '$BC = CB$ เพราะเป็นด้านร่วม',
  '$\triangle DBC \cong \triangle ECB$ แบบ ด.ม.ด.',
  '$CD = BE$ เพราะเป็นด้านคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการ',
]
