answer = 0
hints = ['สิ่งที่กำหนดให้คือส่วนที่อยู่หลังคำว่า ถ้า']
statement = '''
ข้อความ "ถ้ารูปสามเหลี่ยมมีด้านยาวเท่ากันทั้งสามด้าน แล้วมุมทุกมุมมีขนาด $60^\circ$" ข้อใดคือสิ่งที่กำหนดให้
'''
solution = '''
ในข้อความ "ถ้า $p$ แล้ว $q$" ส่วน $p$ หลังคำว่า ถ้า คือสิ่งที่กำหนดให้ ส่วน $q$ หลังคำว่า แล้ว คือสิ่งที่ต้องพิสูจน์

ข้อนี้สิ่งที่กำหนดให้คือ รูปสามเหลี่ยมมีด้านยาวเท่ากันทั้งสามด้าน ส่วนสิ่งที่ต้องพิสูจน์คือ มุมทุกมุมมีขนาด $60^\circ$ ซึ่งพิสูจน์ไว้ในตัวอย่าง 3 ของหน้า 19.4
'''

[[wrong]]
answer = 1
