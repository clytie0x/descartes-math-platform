title = "เส้นขนานในรูปสามเหลี่ยมหน้าจั่ว"
level = 3
type = "order"
steps = [
  '$A\hat{B}C = A\hat{C}B$ เพราะ $AB = AC$ มุมที่ฐานของรูปสามเหลี่ยมหน้าจั่วมีขนาดเท่ากัน',
  '$A\hat{D}E = A\hat{B}C$ เพราะ $\overline{DE} \parallel \overline{BC}$ มี $\overleftrightarrow{AB}$ เป็นเส้นตัด เป็นมุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด',
  '$A\hat{E}D = A\hat{C}B$ เพราะ $\overline{DE} \parallel \overline{BC}$ มี $\overleftrightarrow{AC}$ เป็นเส้นตัด เป็นมุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด',
  '$A\hat{D}E = A\hat{E}D$ เพราะสิ่งที่เท่ากับสิ่งเดียวกันย่อมเท่ากัน',
  '$AD = AE$ เพราะถ้ามุมสองมุมของรูปสามเหลี่ยมมีขนาดเท่ากัน ด้านที่อยู่ตรงข้ามมุมทั้งสองยาวเท่ากัน',
]
alternatives = [[0, 2, 1, 3, 4], [1, 0, 2, 3, 4], [1, 2, 0, 3, 4], [2, 0, 1, 3, 4], [2, 1, 0, 3, 4]]
hints = ['เป้าหมายคือ $AD = AE$ ใน $\triangle ADE$ ถ้ารู้ว่ามุมสองมุมของ $\triangle ADE$ เท่ากัน จะใช้บทกลับของทฤษฎีบทมุมที่ฐานได้', 'มุมที่ $D$ กับมุมที่ $E$ ของ $\triangle ADE$ เท่ากับมุมไหนของ $\triangle ABC$ เพราะ $DE \parallel BC$']
statement = '''
$\triangle ABC$ มี $AB = AC$ ส่วนของเส้นตรง $DE$ ขนานกับ $BC$ โดย $D$ อยู่บน $\overline{AB}$ และ $E$ อยู่บน $\overline{AC}$ เรียงขั้นการพิสูจน์ว่า $\triangle ADE$ เป็นรูปสามเหลี่ยมหน้าจั่ว คือ $AD = AE$

<figure class="figure">
<svg class="fig" viewBox="0 0 320 250" role="img" aria-label="รูปสามเหลี่ยม ABC มี AB ยาวเท่ากับ AC ส่วนของเส้นตรง DE ขนานกับ BC โดย D อยู่บน AB และ E อยู่บน AC">
  <line class="line" x1="160" y1="30" x2="50" y2="215" />
  <line class="line" x1="160" y1="30" x2="270" y2="215" />
  <line class="line" x1="50" y1="215" x2="270" y2="215" />
  <line class="accent" x1="121.5" y1="94.8" x2="198.5" y2="94.8" />
  <line class="line" x1="110.2" y1="125.6" x2="99.8" y2="119.4" />
  <line class="line" x1="220.2" y1="119.4" x2="209.8" y2="125.6" />
  <circle class="dot" cx="121.5" cy="94.8" r="3" />
  <circle class="dot" cx="198.5" cy="94.8" r="3" />
  <text class="label-math" x="160" y="20" text-anchor="middle">A</text>
  <text class="label-math" x="38" y="231" text-anchor="middle">B</text>
  <text class="label-math" x="282" y="231" text-anchor="middle">C</text>
  <text class="label-math" x="107.5" y="94.8" text-anchor="middle">D</text>
  <text class="label-math" x="212.5" y="94.8" text-anchor="middle">E</text>
</svg>
<figcaption>DE สีส้มขนานกับฐาน BC</figcaption>
</figure>
'''
solution = '''
| ข้อความ | เหตุผล |
|---|---|
| (1) $A\hat{B}C = A\hat{C}B$ | $AB = AC$ มุมที่ฐานของรูปสามเหลี่ยมหน้าจั่วมีขนาดเท่ากัน |
| (2) $A\hat{D}E = A\hat{B}C$ | $DE \parallel BC$ มุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด $AB$ |
| (3) $A\hat{E}D = A\hat{C}B$ | $DE \parallel BC$ มุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด $AC$ |
| (4) $A\hat{D}E = A\hat{E}D$ | จาก (1) (2) (3) สิ่งที่เท่ากับสิ่งเดียวกันย่อมเท่ากัน |
| (5) $AD = AE$ | บทกลับของทฤษฎีบทมุมที่ฐาน ด้านที่อยู่ตรงข้ามมุมที่เท่ากันยาวเท่ากัน |

สามบรรทัดแรกสลับกันได้ ข้อนี้ใช้ทั้งทฤษฎีบทมุมที่ฐานในบรรทัด (1) และบทกลับของมันในบรรทัด (5) โดยไม่ต้องใช้รูปสามเหลี่ยมที่เท่ากันทุกประการเลย
'''

