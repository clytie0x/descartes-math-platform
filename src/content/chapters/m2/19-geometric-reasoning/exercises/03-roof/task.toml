title = "หลังคาทรงจั่ว"
level = 1
type = "number"
unit = "องศา"
answer = "35"
truth = "Rational(180 - 110, 2)"
hints = ['ไม้จันทันสองท่อนกับคานเป็นรูปสามเหลี่ยมหน้าจั่ว มุมที่ไม้จันทันทำกับคานคือมุมที่ฐาน', 'มุมที่ฐานสองมุมเท่ากัน และมุมทั้งสามรวมกันได้ $180^\circ$']
statement = '''
โครงหลังคาทรงจั่วทำจากไม้จันทันสองท่อนยาวเท่ากัน ปลายบนชนกันที่ยอดจั่ว ปลายล่างวางบนคานแนวนอน ถ้ามุมที่ยอดจั่วมีขนาด $110^\circ$ ไม้จันทันแต่ละท่อนทำมุมกับคานกี่องศา
'''
solution = '''
ไม้จันทันสองท่อนยาวเท่ากัน รูปสามเหลี่ยมที่เกิดจากไม้จันทันกับคานจึงเป็นรูปสามเหลี่ยมหน้าจั่ว มุมที่ฐานเท่ากัน ให้เป็นมุมละ $x$ องศา

$110 + x + x = 180$ ได้ $2x = 70$ จึงได้ $x = 35$ ไม้จันทันแต่ละท่อนทำมุม $35^\circ$ กับคาน
'''

[[wrong]]
