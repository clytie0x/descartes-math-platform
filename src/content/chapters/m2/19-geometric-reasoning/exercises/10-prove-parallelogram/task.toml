title = "เขียนพิสูจน์รูปสี่เหลี่ยมด้านขนาน"
level = 3
type = "self"
hints = ['ลากเส้นทแยงมุม $AC$ แล้วหามุมแย้งจาก $AB \parallel DC$', 'เป้าหมายคือ $AD \parallel BC$ ถ้าได้มุมแย้ง $D\hat{A}C = B\hat{C}A$ จะใช้บทกลับในบทที่ 18 ได้']
statement = '''
รูปสี่เหลี่ยม $ABCD$ มี $\overline{AB} \parallel \overline{DC}$ และ $AB = DC$ จงพิสูจน์ว่า $ABCD$ เป็นรูปสี่เหลี่ยมด้านขนาน

เขียนสิ่งที่กำหนดให้ สิ่งที่ต้องพิสูจน์ และการพิสูจน์แบบตารางข้อความกับเหตุผลลงในกระดาษ เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์

<figure class="figure">
<svg class="fig" viewBox="0 0 340 225" role="img" aria-label="รูปสี่เหลี่ยม ABCD มี AB ขนานกับ DC และ AB ยาวเท่ากับ DC ลากเส้นทแยงมุม AC">
  <line class="line" x1="50" y1="190" x2="230" y2="190" />
  <line class="line" x1="230" y1="190" x2="290" y2="60" />
  <line class="line" x1="290" y1="60" x2="110" y2="60" />
  <line class="line" x1="110" y1="60" x2="50" y2="190" />
  <line class="dash" x1="50" y1="190" x2="290" y2="60" />
  <line class="line" x1="140" y1="184" x2="140" y2="196" />
  <line class="line" x1="200" y1="54" x2="200" y2="66" />
  <text class="label-math" x="38" y="206" text-anchor="middle">A</text>
  <text class="label-math" x="242" y="206" text-anchor="middle">B</text>
  <text class="label-math" x="302" y="54" text-anchor="middle">C</text>
  <text class="label-math" x="98" y="54" text-anchor="middle">D</text>
</svg>
<figcaption>ด้านที่มีขีดยาวเท่ากัน และ AB ขนานกับ DC</figcaption>
</figure>
'''
solution = '''
**กำหนดให้** รูปสี่เหลี่ยม $ABCD$ มี $\overline{AB} \parallel \overline{DC}$ และ $AB = DC$

**ต้องการพิสูจน์ว่า** $\overline{AD} \parallel \overline{BC}$ ซึ่งทำให้ $ABCD$ มีด้านตรงข้ามขนานกันสองคู่

ลากเส้นทแยงมุม $\overline{AC}$

| ข้อความ | เหตุผล |
|---|---|
| (1) $AB = CD$ | กำหนดให้ |
| (2) $B\hat{A}C = D\hat{C}A$ | $\overline{AB} \parallel \overline{DC}$ มี $\overline{AC}$ เป็นเส้นตัด มุมแย้งมีขนาดเท่ากัน |
| (3) $AC = CA$ | เป็นด้านร่วม |
| (4) $\triangle BAC \cong \triangle DCA$ | ด.ม.ด. จาก (1) (2) (3) |
| (5) $B\hat{C}A = D\hat{A}C$ | มุมคู่ที่สมนัยกันของรูปสามเหลี่ยมที่เท่ากันทุกประการมีขนาดเท่ากัน |
| (6) $\overline{AD} \parallel \overline{BC}$ | มี $\overline{AC}$ เป็นเส้นตัด และมุมแย้ง $D\hat{A}C$ กับ $B\hat{C}A$ มีขนาดเท่ากัน จาก (5) |
| (7) $ABCD$ เป็นรูปสี่เหลี่ยมด้านขนาน | มีด้านตรงข้ามขนานกันสองคู่ จากที่กำหนดให้และ (6) ตามบทนิยาม |

ตรวจของตัวเองทีละข้อ ได้ครบห้าข้อถือว่าผ่าน

- เขียนสิ่งที่กำหนดให้และสิ่งที่ต้องพิสูจน์ด้วยชื่อจุดในรูป และรู้ว่าต้องไปจบที่ $AD \parallel BC$
- ลากเส้นทแยงมุมเพื่อสร้างรูปสามเหลี่ยมสองรูป
- ได้ส่วนที่เท่ากันครบสามคู่พร้อมเหตุผล และมุมที่ใช้ใน ด.ม.ด. อยู่ระหว่างด้านสองคู่นั้นจริง
- เขียนชื่อจุดของรูปสามเหลี่ยมสองรูปให้คู่กันถูกต้อง เช่น $\triangle BAC \cong \triangle DCA$ ไม่ใช่ $\triangle ABC \cong \triangle ADC$
- สรุปเรื่องขนานด้วยมุมแย้งที่เท่ากัน ไม่ใช่อ้างว่าดูจากรูป

ถ้าเลือกใช้เส้นทแยงมุม $\overline{BD}$ แทน ก็พิสูจน์ได้แบบเดียวกัน ข้อนี้ต่างจากข้อความของแนนในหน้า 19.5 เพราะด้านคู่ที่ขนานกันกับด้านคู่ที่ยาวเท่ากันเป็นคู่เดียวกัน
'''
