answer = 2
hints = ['เขียนบทกลับของแต่ละข้อก่อน โดยสลับส่วนหลังคำว่า ถ้า กับส่วนหลังคำว่า แล้ว', 'บทกลับที่ไม่จริงจะมีตัวอย่างค้าน ลองหาตัวอย่างค้านของแต่ละข้อ']
statement = '''
ข้อความทุกข้อต่อไปนี้เป็นจริง ข้อใดมีบทกลับที่เป็นจริงด้วย
'''
solution = '''
บทกลับของข้อที่ถูกคือ "ถ้ารูปสามเหลี่ยมมีมุมสองมุมขนาดเท่ากัน แล้วด้านที่อยู่ตรงข้ามมุมทั้งสองยาวเท่ากัน" ซึ่งพิสูจน์ไว้ในหน้า 19.4 ด้วย ม.ด.ม.

ข้ออื่นมีตัวอย่างค้านของบทกลับ

- รูปสามเหลี่ยมที่มีด้านยาว 5 5 และ 8 เซนติเมตร เป็นรูปสามเหลี่ยมหน้าจั่ว แต่ไม่เป็นรูปสามเหลี่ยมด้านเท่า
- มุมฉากสองมุมที่อยู่คนละที่ มีขนาดเท่ากัน แต่ไม่เป็นมุมตรงข้าม
- $x = -5$ ทำให้ $x^2 = 25$ แต่ $x \neq 5$
'''

