title = "บทกลับที่จริง"
level = 2
type = "choice"
choices = [
  'ถ้ารูปสามเหลี่ยมเป็นรูปสามเหลี่ยมด้านเท่า แล้วเป็นรูปสามเหลี่ยมหน้าจั่ว',
  'ถ้ามุมสองมุมเป็นมุมตรงข้าม แล้วมุมสองมุมนั้นมีขนาดเท่ากัน',
  'ถ้ารูปสามเหลี่ยมมีด้านยาวเท่ากันสองด้าน แล้วมุมที่อยู่ตรงข้ามด้านทั้งสองมีขนาดเท่ากัน',
  'ถ้า $x = 5$ แล้ว $x^2 = 25$',
