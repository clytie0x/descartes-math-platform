answer = 2
hints = ['ตัวอย่างค้านต้องทำให้ส่วนหลังคำว่า ถ้า เป็นจริง แต่ส่วนหลังคำว่า แล้ว ไม่จริง']
statement = '''
ข้อความ "ถ้ารูปสี่เหลี่ยมมีเส้นทแยงมุมยาวเท่ากัน แล้วรูปสี่เหลี่ยมนั้นเป็นรูปสี่เหลี่ยมจัตุรัส" ไม่เป็นจริง รูปใดเป็นตัวอย่างค้านของข้อความนี้
'''
solution = '''
ตัวอย่างค้านต้องมีเส้นทแยงมุมยาวเท่ากัน แต่ไม่เป็นรูปสี่เหลี่ยมจัตุรัส

รูปสี่เหลี่ยมผืนผ้ากว้าง 4 เซนติเมตร ยาว 6 เซนติเมตร มีเส้นทแยงมุมยาวเท่ากันทั้งสองเส้น เพราะเส้นทแยงมุมแต่ละเส้นเป็นด้านตรงข้ามมุมฉากของรูปสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว 4 และ 6 เซนติเมตรเหมือนกัน แต่ด้านของรูปยาวไม่เท่ากัน จึงไม่เป็นรูปสี่เหลี่ยมจัตุรัส

ข้อความนี้คือบทกลับของ "ถ้ารูปสี่เหลี่ยมเป็นรูปสี่เหลี่ยมจัตุรัส แล้วเส้นทแยงมุมยาวเท่ากัน" ซึ่งเป็นจริง
'''

