choices = [
  'รูปสี่เหลี่ยมจัตุรัสที่มีด้านยาว 5 เซนติเมตร',
  'รูปสี่เหลี่ยมขนมเปียกปูนที่ไม่มีมุมฉาก',
  'รูปสี่เหลี่ยมผืนผ้ากว้าง 4 เซนติเมตร ยาว 6 เซนติเมตร',
  'รูปสี่เหลี่ยมด้านขนานที่ไม่มีมุมฉาก',
