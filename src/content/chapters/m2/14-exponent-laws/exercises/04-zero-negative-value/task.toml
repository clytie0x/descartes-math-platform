title = "เลขชี้กำลังศูนย์และลบ"
level = 1
type = "number"
answer = "9/8"
truth = "Integer(5)**0 + Integer(2)**-3"
accept = ["1.125"]
hints = ['$a^0 = 1$ เมื่อ $a \neq 0$', '$2^{-3} = \dfrac{1}{2^3}$']
statement = '''
$5^0 + 2^{-3}$ มีค่าเท่าใด ตอบเป็นเศษส่วนหรือทศนิยมก็ได้
'''
solution = '''
1. $5^0 = 1$
2. $2^{-3} = \dfrac{1}{2^3} = \dfrac{1}{8}$
3. $1 + \dfrac{1}{8} = \dfrac{9}{8}$ หรือ $1.125$
'''

