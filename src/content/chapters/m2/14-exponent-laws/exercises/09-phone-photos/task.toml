title = "ที่ว่างในโทรศัพท์"
level = 2
type = "number"
unit = "รูป"
answer = "16000"
truth = "Rational('6.4') * 10**10 / (4 * 10**6)"
accept = ["1.6*10^4", "1.6×10^4"]
hints = ['จำนวนรูปคือ $\dfrac{6.4 \times 10^{10}}{4 \times 10^6}$', 'หาร $6.4 \div 4$ แยกจาก $10^{10} \div 10^6$ ซึ่งต้องลบเลขชี้กำลัง']
statement = '''
โทรศัพท์เครื่องหนึ่งมีหน่วยความจำว่าง $6.4 \times 10^{10}$ ไบต์ ถ้ารูปถ่ายแต่ละรูปใช้ที่ $4 \times 10^6$ ไบต์ จะเก็บรูปเพิ่มได้อีกกี่รูป
'''
solution = '''
1. หารส่วนหน้า $6.4 \div 4 = 1.6$
2. หารสิบยกกำลัง $10^{10} \div 10^6 = 10^{10 - 6} = 10^4$
3. ได้ $1.6 \times 10^4 = 16{,}000$ รูป
'''

