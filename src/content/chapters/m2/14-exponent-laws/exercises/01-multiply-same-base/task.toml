title = "คูณเลขยกกำลังที่ฐานเท่ากัน"
level = 1
type = "expr"
answer = "a^8"
form = "simplified"
truth = "a**3 * a**4 * a"
hints = ['ฐานเป็น $a$ ทุกตัว ใช้ $a^m \times a^n = a^{m + n}$', '$a$ ตัวสุดท้ายไม่มีเลขชี้กำลังกำกับ แต่มันคือ $a^1$']
statement = '''
เขียน $a^3 \times a^4 \times a$ ในรูปเลขยกกำลังอย่างง่าย

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> เช่น a^5 ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
ฐานเท่ากันหมด จึงบวกเลขชี้กำลัง $a$ ตัวสุดท้ายคือ $a^1$

$$
a^3 \times a^4 \times a^1 = a^{3 + 4 + 1} = a^8
$$
'''

[[wrong]]
answer = "a^7"
message = "a ตัวสุดท้ายคือ a¹ ต้องนับเลขชี้กำลัง 1 ด้วย ได้ 3 + 4 + 1 = 8"

[[wrong]]
answer = "a^12"
message = "คูณเลขยกกำลังที่ฐานเท่ากันให้บวกเลขชี้กำลัง ไม่ใช่คูณ a³ × a⁴ คือ a คูณกัน 3 + 4 ตัว"
