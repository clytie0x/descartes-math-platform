title = "หารเลขยกกำลัง"
level = 1
type = "expr"
answer = "4x^8"
form = "simplified"
truth = "12*x**10 / (3*x**2)"
accept = ["4*x^8"]
hints = ['หารตัวเลขข้างหน้ากันตามปกติ แยกจากตัวแปร', 'ส่วนของตัวแปรใช้ $x^m \div x^n = x^{m - n}$']
statement = '''
ทำ $\dfrac{12x^{10}}{3x^2}$ ให้เป็นรูปอย่างง่าย เมื่อ $x \neq 0$
'''
solution = '''
1. ตัวเลข $12 \div 3 = 4$
2. ตัวแปร $x^{10} \div x^2 = x^{10 - 2} = x^8$
3. ได้ $4x^8$
'''

[[wrong]]
answer = "4x^5"
message = "หารเลขยกกำลังให้ลบเลขชี้กำลัง 10 − 2 = 8 ไม่ใช่ 10 ÷ 2"

[[wrong]]
answer = "9x^8"
message = "ส่วนของ x ถูกแล้ว แต่ตัวเลขข้างหน้าต้องหารกัน 12 ÷ 3 = 4 ไม่ใช่ลบกัน"

[[wrong]]
answer = "4x^12"
message = "นี่คือการคูณ x¹⁰ กับ x² การหารต้องลบเลขชี้กำลัง"
