title = "ยกกำลังทั้งวงเล็บ"
level = 2
type = "expr"
answer = "4x^6"
form = "simplified"
truth = "(2*x**3)**2"
accept = ["4*x^6"]
hints = ['ทุกตัวในวงเล็บต้องยกกำลังสอง ทั้ง $2$ และ $x^3$', '$(x^3)^2$ คือ $x^3 \times x^3$ เลขชี้กำลังรวมเป็นเท่าไร']
statement = '''
ทำ $(2x^3)^2$ ให้เป็นรูปอย่างง่าย
'''
solution = '''
1. ใช้ $(ab)^n = a^n b^n$ ได้ $(2x^3)^2 = 2^2 \times (x^3)^2$
2. $2^2 = 4$ และ $(x^3)^2 = x^{3 \times 2} = x^6$
3. ได้ $4x^6$
'''

[[wrong]]
answer = "2x^6"
message = "เลข 2 ในวงเล็บต้องยกกำลังสองด้วย 2² = 4"

[[wrong]]
answer = "4x^5"
message = "(x³)² คือ x³ คูณกันสองก้อน เลขชี้กำลังคูณกัน 3 × 2 = 6 ไม่ใช่ 3 + 2"

[[wrong]]
answer = "4x^9"
message = "(x³)² เลขชี้กำลังคูณกัน 3 × 2 = 6 ไม่ใช่ 3² = 9"
