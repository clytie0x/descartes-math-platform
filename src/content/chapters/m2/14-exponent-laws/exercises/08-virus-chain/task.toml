title = "เรียงไวรัสต่อกัน"
level = 2
type = "number"
unit = "เมตร"
answer = "0.006"
truth = "Rational('1.2') * Integer(10)**-7 * 5 * Integer(10)**4"
accept = ["6*10^(-3)", "6×10^-3", "3/500"]
hints = ['ความยาวทั้งแถวคือ $(1.2 \times 10^{-7}) \times (5 \times 10^4)$', 'คูณ $1.2 \times 5$ แยกจาก $10^{-7} \times 10^4$ ซึ่งต้องบวกเลขชี้กำลัง']
statement = '''
ไวรัสชนิดหนึ่งยาวประมาณ $1.2 \times 10^{-7}$ เมตร ถ้านำไวรัสชนิดนี้ $5 \times 10^4$ ตัวมาเรียงต่อกันเป็นแถว แถวนี้ยาวกี่เมตร ตอบเป็นทศนิยมหรือสัญกรณ์วิทยาศาสตร์ก็ได้

<p class="ex-tip">พิมพ์สัญกรณ์วิทยาศาสตร์แบบนี้ 2.5*10^(-4)</p>
'''
solution = '''
1. คูณส่วนหน้า $1.2 \times 5 = 6$
2. คูณสิบยกกำลัง $10^{-7} \times 10^4 = 10^{-7 + 4} = 10^{-3}$
3. ได้ $6 \times 10^{-3}$ เมตร คือ $0.006$ เมตร หรือ $6$ มิลลิเมตร ไวรัสห้าหมื่นตัวเรียงกันยังยาวไม่ถึงหนึ่งเซนติเมตร
'''

[[wrong]]
answer = "6*10^(-28)"
message = "คำตอบเล็กเกินไปมาก 10⁻⁷ × 10⁴ ต้องบวกเลขชี้กำลัง −7 + 4 = −3 ไม่ใช่คูณกันได้ −28 หรือคิดเครื่องหมายผิดได้ −11"

