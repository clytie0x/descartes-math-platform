hints = ['จำนวนที่น้อยกว่า $1$ ต้องมีเลขชี้กำลังติดลบ', 'เลข $4$ อยู่ตำแหน่งที่เท่าไรหลังจุดทศนิยม']
statement = '''
ข้อใดเป็นการเขียน $0.00042$ ในรูปสัญกรณ์วิทยาศาสตร์
'''
solution = '''
ตัวเลขตัวแรกที่ไม่ใช่ศูนย์คือ $4$ วางจุดหลัง $4$ ได้ $A = 4.2$ เลข $4$ อยู่ตำแหน่งที่สี่หลังจุดทศนิยม จึงได้ $n = -4$ และ $0.00042 = 4.2 \times 10^{-4}$
'''

