title = "ขนาดของเม็ดเลือดแดง"
level = 1
type = "number"
label = '$n =$'
answer = "-6"
truth = "log(Rational('0.0000075') / Rational('7.5'), 10)"
hints = ['จำนวนที่น้อยกว่า $1$ จะได้ $n$ ติดลบ', 'นับว่าเลข $7$ อยู่ตำแหน่งที่เท่าไรหลังจุดทศนิยม']
statement = '''
เม็ดเลือดแดงของคนมีเส้นผ่านศูนย์กลางประมาณ $0.0000075$ เมตร เมื่อเขียนความยาวนี้ในรูปสัญกรณ์วิทยาศาสตร์ $7.5 \times 10^n$ ค่า $n$ เป็นเท่าใด
'''
solution = '''
วางจุดทศนิยมหลังเลข $7$ ซึ่งเป็นตัวเลขตัวแรกที่ไม่ใช่ศูนย์ ได้ $A = 7.5$ เลข $7$ อยู่ตำแหน่งที่หกหลังจุดทศนิยม จึงได้ $n = -6$ และ $0.0000075 = 7.5 \times 10^{-6}$
'''

[[wrong]]
answer = "6"
message = "7.5 × 10⁶ คือ 7,500,000 จำนวนที่น้อยกว่า 1 ต้องมี n ติดลบ"

[[wrong]]
answer = "-5"
message = "หลังจุดมีศูนย์ห้าตัวก็จริง แต่เลข 7 อยู่ตำแหน่งที่หก n จึงเป็น −6"

[[wrong]]
answer = "-7"
message = "นับเลยไปถึงเลข 5 ตัวสุดท้าย จุดใหม่ต้องอยู่หลังเลข 7 ซึ่งอยู่ตำแหน่งที่หก"
