title = "ใช้หลายสมบัติในข้อเดียว"
level = 3
type = "expr"
answer = "12x^4"
form = "simplified"
truth = "(2*x**-1)**3 * 6*x**5 / (4*x**-2)"
accept = ["12*x^4"]
hints = ['เริ่มจากวงเล็บ $(2x^{-1})^3$ ยกกำลังสามทั้ง $2$ และ $x^{-1}$', 'หารด้วย $x^{-2}$ คือลบเลขชี้กำลังด้วย $-2$ ใส่วงเล็บกันพลาด', 'คำตอบควรมีเลขชี้กำลังเป็นบวก']
statement = '''
ทำ $\dfrac{(2x^{-1})^3 \times 6x^5}{4x^{-2}}$ ให้เป็นรูปอย่างง่าย เมื่อ $x \neq 0$
'''
solution = '''
1. $(2x^{-1})^3 = 2^3 x^{(-1) \times 3} = 8x^{-3}$
2. คูณในเศษ $8x^{-3} \times 6x^5 = 48x^{-3 + 5} = 48x^2$
3. หาร $\dfrac{48x^2}{4x^{-2}} = 12x^{2 - (-2)} = 12x^4$
'''

