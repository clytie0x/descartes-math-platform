solution = '''
1. $\hat{3}$ กับ $\hat{6}$ เป็นมุมแย้ง และเส้นทั้งสองขนานกัน จึงได้ $2x + 15 = 4x - 35$
2. $15 + 35 = 4x - 2x$ ได้ $50 = 2x$ จึงได้ $x = 25$
3. ตรวจ $\hat{3} = 2(25) + 15 = 65^\circ$ และ $\hat{6} = 4(25) - 35 = 65^\circ$ เท่ากัน
'''

