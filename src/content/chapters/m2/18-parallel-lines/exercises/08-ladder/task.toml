title = "บันไดพาดกำแพง"
level = 1
type = "number"
unit = "องศา"
answer = "22"
truth = "180 - 90 - 68"
hints = ['บันได พื้น และกำแพง ประกอบกันเป็นรูปสามเหลี่ยมมุมฉาก', 'มุมภายในทั้งสามมุมรวมกันได้ $180^\circ$ และมุมที่พื้นชนกำแพงเป็นมุมฉาก']
statement = '''
พี่วางบันไดพาดกำแพงเพื่อเปลี่ยนหลอดไฟ กำแพงตั้งฉากกับพื้น บันไดทำมุม $68^\circ$ กับพื้น บันไดทำมุมกับกำแพงกี่องศา
'''
solution = '''
บันได พื้น และกำแพงเป็นรูปสามเหลี่ยม มีมุมฉากตรงที่พื้นชนกำแพง มุมภายในทั้งสามรวมกันได้ $180^\circ$

มุมระหว่างบันไดกับกำแพง $= 180^\circ - 90^\circ - 68^\circ = 22^\circ$
'''

[[wrong]]
answer = "112"
message = "180° − 68° คือมุมที่อยู่ติดกับมุม 68° บนพื้น ยังไม่ได้หักมุมฉากที่พื้นชนกำแพงออก"

[[wrong]]
