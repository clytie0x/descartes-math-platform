  <path class="line" d="M236 44 L244 50 L236 56" />
  <path class="line" d="M236 174 L244 180 L236 186" />
  <text class="label-math" x="140" y="35" text-anchor="middle">A</text>
  <text class="label-math" x="46" y="193" text-anchor="middle">B</text>
  <text class="label-math" x="314" y="193" text-anchor="middle">C</text>
  <circle class="dot" cx="40" cy="50" r="3.5" />
  <circle class="dot" cx="320" cy="50" r="3.5" />
  <text class="label-math" x="40" y="37" text-anchor="middle">D</text>
  <text class="label-math" x="320" y="37" text-anchor="middle">E</text>
</svg>
</figure>
'''
solution = '''
1. ลากเส้นช่วยก่อน คือ $\overleftrightarrow{DE}$ ผ่าน $A$ ขนานกับ $\overline{BC}$
2. $\overline{AB}$ เป็นเส้นตัด ได้มุมแย้ง $D\hat{A}B = A\hat{B}C$
3. $\overline{AC}$ เป็นเส้นตัด ได้มุมแย้ง $E\hat{A}C = A\hat{C}B$
4. มุมสามมุมที่ $A$ บน $\overleftrightarrow{DE}$ รวมกันได้ $180^\circ$
5. แทนมุมแย้งลงในขั้นที่ 4 ได้ $A\hat{B}C + B\hat{A}C + A\hat{C}B = 180^\circ$

ขั้นที่ 2 ถึง 4 สลับลำดับกันได้ เพราะไม่ได้ใช้ผลของกันและกัน
'''

[[wrong]]
answer = [1, 2, 0, 3, 4]
message = "มุม DAB กับมุม EAC มีได้ก็ต่อเมื่อลากเส้น DE แล้ว ต้องลากเส้นช่วยก่อน"

