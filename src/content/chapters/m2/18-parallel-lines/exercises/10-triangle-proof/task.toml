title = "เรียงบทพิสูจน์มุมภายในของรูปสามเหลี่ยม"
level = 2
type = "order"
steps = [
  'ลาก $\overleftrightarrow{DE}$ ผ่านจุด $A$ ให้ขนานกับ $\overline{BC}$',
  '$D\hat{A}B = A\hat{B}C$ เพราะเป็นมุมแย้ง',
  '$E\hat{A}C = A\hat{C}B$ เพราะเป็นมุมแย้ง',
  '$D\hat{A}B + B\hat{A}C + E\hat{A}C = 180^\circ$ เพราะประกอบกันเป็นมุมตรง',
  'แทนค่า ได้ $A\hat{B}C + B\hat{A}C + A\hat{C}B = 180^\circ$',
]
alternatives = [[0, 2, 1, 3, 4], [0, 3, 1, 2, 4], [0, 3, 2, 1, 4], [0, 1, 3, 2, 4], [0, 2, 3, 1, 4]]
hints = ['มุม $D\hat{A}B$ ยังไม่มีจนกว่าจะลากเส้น $DE$', 'ขั้นแทนค่าต้องรู้ทั้งผลบวกที่จุด $A$ และมุมแย้งทั้งสองคู่ก่อน']
statement = '''
เรียงขั้นตอนพิสูจน์ว่ามุมภายในทั้งสามมุมของรูปสามเหลี่ยม $ABC$ รวมกันได้ $180^\circ$

<figure class="figure">
<svg class="fig" viewBox="0 0 360 205" role="img" aria-label="รูปสามเหลี่ยม ABC มีเส้นประ DE ผ่านจุด A ขนานกับ BC มุม DAB กับมุม ABC ระบายสีส้ม มุม EAC กับมุม ACB ระบายสีเขียว มุม BAC ระบายสีม่วง">
  <path class="fill-accent" d="M60 180 L90 180 A30 30 0 0 0 75.7 154.5 Z" />
  <path class="fill-teal" d="M300 180 L276.7 161.1 A30 30 0 0 0 270 180 Z" />
  <path class="fill-violet" d="M140 50 L126.4 72.1 A26 26 0 0 0 160.2 66.4 Z" />
  <path class="fill-accent" d="M140 50 L110 50 A30 30 0 0 0 124.3 75.5 Z" />
  <path class="fill-teal" d="M140 50 L163.3 68.9 A30 30 0 0 0 170 50 Z" />
