answer = "130"
truth = "180 - 50"
hints = ['รางทั้งสองขนานกัน ถนนเป็นเส้นตัด', 'ที่รางที่ 2 มุมที่อยู่ตำแหน่งเดียวกับมุม $50^\circ$ คือมุมขวาบน มุม $x$ อยู่ติดกับมุมไหน']
statement = '''
รางรถไฟสองรางขนานกัน ถนนสายหนึ่งตัดผ่านทั้งสองราง ทำมุม $50^\circ$ กับรางที่ 1 ดังรูป มุม $x$ ที่รางที่ 2 มีขนาดกี่องศา

<figure class="figure">
<svg class="fig" viewBox="0 0 360 220" role="img" aria-label="รางรถไฟสองรางขนานกัน ถนนตัดผ่านทั้งสองราง ทำมุม 50 องศากับรางที่ 1 ทางขวาบน ต้องการหามุม x ทางขวาล่างที่รางที่ 2">
  <path class="fill-accent" d="M190 70 L220 70 A30 30 0 0 0 209.3 47 Z" />
  <path class="fill-teal" d="M122.9 150 L104.9 171.4 A28 28 0 0 0 150.9 150 Z" />
  <line class="line" x1="20" y1="70" x2="340" y2="70" />
  <line class="line" x1="20" y1="150" x2="340" y2="150" />
  <line class="line" x1="228.6" y1="24" x2="84.3" y2="196" />
  <text class="label" x="233.5" y="54.7" text-anchor="middle">50°</text>
  <text class="label-math" x="140.6" y="193.1" text-anchor="middle">x</text>
  <text class="label" x="24" y="62" text-anchor="start">รางที่ 1</text>
  <text class="label" x="24" y="142" text-anchor="start">รางที่ 2</text>
  <text class="label" x="236.6" y="33" text-anchor="start">ถนน</text>
</svg>
</figure>
'''
solution = '''
1. รางทั้งสองเป็นเส้นขนาน ถนนเป็นเส้นตัด
2. มุมขวาบนที่รางที่ 2 อยู่ตำแหน่งเดียวกับมุม $50^\circ$ ที่รางที่ 1 เป็นมุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด จึงมีขนาด $50^\circ$
3. มุม $x$ อยู่ใต้รางที่ 2 ติดกับมุมนั้นบนเส้นตรง จึงได้ $x = 180^\circ - 50^\circ = 130^\circ$
'''

