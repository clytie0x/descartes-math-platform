'''
solution = '''
1. ลาก $\overleftrightarrow{EF}$ ผ่าน $E$ ให้ขนานกับ $\overleftrightarrow{AB}$ โดยให้ $F$ อยู่ทางขวาของ $E$ จะได้ $\overleftrightarrow{EF} \parallel \overleftrightarrow{CD}$ ด้วย
2. $A\hat{E}F = B\hat{A}E = 38^\circ$ เพราะเป็นมุมแย้ง มี $\overleftrightarrow{AE}$ เป็นเส้นตัด
3. $F\hat{E}C = D\hat{C}E = 47^\circ$ เพราะเป็นมุมแย้ง มี $\overleftrightarrow{CE}$ เป็นเส้นตัด
4. $A\hat{E}C = 38^\circ + 47^\circ = 85^\circ$
'''

