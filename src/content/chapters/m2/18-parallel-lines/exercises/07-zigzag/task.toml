truth = "38 + 47"
hints = ['ลากเส้นผ่าน $E$ ให้ขนานกับ $\overleftrightarrow{AB}$', 'เส้นที่ลากแบ่ง $A\hat{E}C$ เป็นสองส่วน แต่ละส่วนเป็นมุมแย้งกับมุมที่กำหนดให้']
statement = '''
จากรูป $\overleftrightarrow{AB} \parallel \overleftrightarrow{CD}$ จุด $E$ อยู่ระหว่างเส้นทั้งสอง $B\hat{A}E = 38^\circ$ และ $D\hat{C}E = 47^\circ$ จงหาขนาดของ $A\hat{E}C$

