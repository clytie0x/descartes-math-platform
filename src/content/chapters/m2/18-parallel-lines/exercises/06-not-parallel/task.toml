solution = '''
- $\hat{3} = \hat{6}$ เป็นมุมแย้งที่เท่ากัน สรุปได้ว่าขนาน
- $\hat{1} = \hat{5}$ เป็นมุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัดที่เท่ากัน สรุปได้ว่าขนาน
- $\hat{4} + \hat{6} = 180^\circ$ เป็นมุมภายในที่อยู่บนข้างเดียวกันของเส้นตัดที่รวมกันได้ $180^\circ$ สรุปได้ว่าขนาน
- $\hat{3} = \hat{5}$ เป็นมุมภายในที่อยู่บนข้างเดียวกันของเส้นตัด แต่โจทย์บอกแค่ว่าเท่ากัน ไม่ได้บอกว่ารวมกันได้ $180^\circ$ เช่น มุมละ $70^\circ$ รวมได้ $140^\circ$ เส้นไม่ขนาน ข้อนี้จึงสรุปไม่ได้
'''
