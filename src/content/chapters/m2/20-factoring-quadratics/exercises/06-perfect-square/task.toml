title = "กำลังสองสมบูรณ์"
level = 2
type = "expr"
form = "factored"
answer = "(2x-5)^2"
truth = "4*x**2 - 20*x + 25"
accept = ["(2x-5)(2x-5)", "(5-2x)^2", "(2x - 5)^2"]
reject = ["4x^2-20x+25", "(2x)^2-20x+25"]
hints = ['$4x^2 = (2x)^2$ และ $25 = 5^2$', 'ตรวจพจน์กลางว่าเท่ากับ $2 \times 2x \times 5$ หรือไม่ แล้วดูเครื่องหมาย']
statement = '''
แยกตัวประกอบของ $4x^2 - 20x + 25$
'''
solution = '''
$4x^2 = (2x)^2$ และ $25 = 5^2$ ได้ $A = 2x$ $B = 5$ ตรวจ $2AB = 2(2x)(5) = 20x$ พจน์กลางเป็น $-20x$ จึงเป็นกำลังสองสมบูรณ์แบบมีเครื่องหมายลบ


$4x^2 - 20x + 25 = (2x - 5)^2$
'''

[[wrong]]
answer = "(2x+5)^2"
message = "(2x + 5)² ได้พจน์กลาง +20x แต่โจทย์เป็น −20x ในวงเล็บต้องเป็นลบ"

[[wrong]]
answer = "(4x-5)^2"
message = "(4x)² = 16x² ไม่ใช่ 4x² รากที่สองของ 4x² คือ 2x"

[[wrong]]
answer = "(2x+5)(2x-5)"
message = "(2x + 5)(2x − 5) = 4x² − 25 เป็นผลต่างของกำลังสอง ไม่มีพจน์กลาง"
