title = "เรียงขั้นการแยกพจน์กลาง"
level = 2
type = "order"
steps = [
  '$ac = 2 \times 12 = 24$',
  'สองจำนวนที่คูณกันได้ $24$ และบวกกันได้ $11$ คือ $3$ กับ $8$',
  '$2x^2 + 11x + 12 = 2x^2 + 3x + 8x + 12$',
  '$= x(2x + 3) + 4(2x + 3)$',
  '$= (2x + 3)(x + 4)$',
]
hints = ['ก่อนจะแยกพจน์กลางได้ ต้องรู้ก่อนว่าแยกเป็นสองจำนวนไหน', 'ดึงวงเล็บที่เหมือนกันออกเป็นขั้นสุดท้าย']
statement = '''
เรียงขั้นตอนการแยกตัวประกอบของ $2x^2 + 11x + 12$ ด้วยวิธีแยกพจน์กลางให้ถูกลำดับ
'''
solution = '''
1. คูณ $a$ กับ $c$ ได้ $24$
2. หาสองจำนวนที่คูณกันได้ $24$ บวกกันได้ $11$ ได้ $3$ กับ $8$
3. แยก $11x$ เป็น $3x + 8x$
4. จัดกลุ่ม $x(2x + 3) + 4(2x + 3)$
5. ดึง $(2x + 3)$ ออก ได้ $(2x + 3)(x + 4)$ ตรวจ $(2x + 3)(x + 4) = 2x^2 + 8x + 3x + 12$
'''

[[wrong]]
answer = [0, 2, 1, 3, 4]
message = "จะแยก 11x เป็น 3x + 8x ได้ ต้องรู้ก่อนว่าใช้ 3 กับ 8 จึงต้องหาสองจำนวนก่อนแยกพจน์กลาง"

[[wrong]]
answer = [1, 0, 2, 3, 4]
message = "สองจำนวน 3 กับ 8 ได้มาจากการหาคู่ที่คูณกันได้ ac = 24 จึงต้องคำนวณ ac ก่อน"
