title = "หาสองจำนวน"
level = 1
type = "expr"
form = "factored"
answer = "(x+3)(x+5)"
truth = "x**2 + 8*x + 15"
accept = ["(x+5)(x+3)", "(x + 3)(x + 5)", "(3+x)(5+x)"]
reject = ["x^2+8x+15", "x(x+8)+15"]
hints = ['หาสองจำนวนที่คูณกันได้ $15$ และบวกกันได้ $8$', 'คู่ที่คูณกันได้ $15$ มี $1, 15$ และ $3, 5$']
statement = '''
แยกตัวประกอบของ $x^2 + 8x + 15$

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
คู่ที่คูณกันได้ $15$ คือ $1, 15$ กับ $3, 5$ ผลบวกเป็น $16$ และ $8$ จึงใช้ $3$ กับ $5$


$x^2 + 8x + 15 = (x + 3)(x + 5)$ ตรวจ $(x + 3)(x + 5) = x^2 + 5x + 3x + 15 = x^2 + 8x + 15$
'''

[[wrong]]
answer = "(x+1)(x+15)"
message = "1 × 15 = 15 ถูก แต่ 1 + 15 = 16 ไม่ใช่ 8 ลองคู่ 3 กับ 5"

[[wrong]]
answer = "(x-3)(x-5)"
message = "(x − 3)(x − 5) ได้พจน์กลาง −8x แต่โจทย์เป็น +8x สองจำนวนต้องบวกทั้งคู่"

[[wrong]]
answer = "(x+2)(x+6)"
message = "2 + 6 = 8 ถูก แต่ 2 × 6 = 12 ไม่ใช่ 15 ไล่จากคู่ที่คูณกันได้ 15 ก่อน"
