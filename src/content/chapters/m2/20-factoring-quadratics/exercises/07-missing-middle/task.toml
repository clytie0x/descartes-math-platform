title = "พจน์กลางที่หายไป"
level = 2
type = "set"
label = '$b =$'
answer = ["12", "-12"]
truth = "sorted(solve(b**2 - 4*36, b))"
accept = ["-12, 12", "-12,12"]
reject = ["12", "12, -12, 6"]
hints = ['$36 = 6^2$ พหุนามต้องเป็น $(x + 6)^2$ หรือ $(x - 6)^2$', 'กระจายทั้งสองแบบแล้วดูพจน์กลาง']
statement = '''
ถ้า $x^2 + bx + 36$ เป็นกำลังสองสมบูรณ์ $b$ มีค่าเท่าใดได้บ้าง ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
$36 = 6^2$ จึงต้องเป็น $(x + 6)^2 = x^2 + 12x + 36$ หรือ $(x - 6)^2 = x^2 - 12x + 36$ ได้ $b = 12$ หรือ $b = -12$
'''

[[wrong]]
answer = ["12"]
message = "ยังขาดอีกค่า (x − 6)² = x² − 12x + 36 ก็มีพจน์ท้าย 36 เหมือนกัน"

[[wrong]]
answer = ["6", "-6"]
message = "6 คือรากที่สองของ 36 พจน์กลางของ (x + 6)² คือ 2 × 6 × x = 12x"

[[wrong]]
answer = ["18", "-18"]
message = "18 คือครึ่งหนึ่งของ 36 แต่ 36 ต้องเท่ากับกำลังสองของครึ่งหนึ่งของ b ครึ่งหนึ่งของ b จึงเป็น 6 หรือ −6"
