title = "ผลต่างของกำลังสอง"
level = 1
type = "expr"
form = "factored"
answer = "(3x+8)(3x-8)"
truth = "9*x**2 - 64"
accept = ["(3x-8)(3x+8)", "(3x + 8)(3x - 8)", "(8+3x)(3x-8)"]
reject = ["9x^2-64", "(3x)^2-64"]
hints = ['$9x^2 = (3x)^2$ และ $64 = 8^2$', 'ใช้ $A^2 - B^2 = (A + B)(A - B)$']
statement = '''
แยกตัวประกอบของ $9x^2 - 64$
'''
solution = '''
$9x^2 - 64 = (3x)^2 - 8^2 = (3x + 8)(3x - 8)$ ตรวจ $(3x + 8)(3x - 8) = 9x^2 - 24x + 24x - 64 = 9x^2 - 64$
'''

[[wrong]]
