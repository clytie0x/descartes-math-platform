title = "ความยาวของที่ดิน"
level = 3
type = "expr"
label = 'ด้านยาว'
unit = "เมตร"
answer = "x+3"
truth = "cancel((2*x**2 + 7*x + 3) / (2*x + 1))"
accept = ["3+x", "x + 3"]
hints = ['พื้นที่เท่ากับด้านกว้างคูณด้านยาว จึงต้องแยกตัวประกอบของพื้นที่ให้มี $2x + 1$ เป็นตัวประกอบหนึ่ง', '$ac = 6$ หาสองจำนวนที่คูณกันได้ $6$ และบวกกันได้ $7$']
statement = '''
ที่ดินแปลงหนึ่งเป็นรูปสี่เหลี่ยมผืนผ้า มีพื้นที่ $2x^2 + 7x + 3$ ตารางเมตร ด้านกว้างยาว $2x + 1$ เมตร ด้านยาวยาวกี่เมตร ตอบเป็นนิพจน์ของ $x$
'''
solution = '''
1. แยกตัวประกอบของพื้นที่ $ac = 6$ สองจำนวนที่คูณกันได้ $6$ บวกกันได้ $7$ คือ $1$ กับ $6$
2. $2x^2 + 7x + 3 = 2x^2 + x + 6x + 3 = x(2x + 1) + 3(2x + 1) = (2x + 1)(x + 3)$
3. ด้านกว้างคือ $2x + 1$ ด้านยาวจึงเป็น $x + 3$ เมตร
'''

[[wrong]]
answer = "2x+3"
message = "(2x + 1)(2x + 3) = 4x² + 8x + 3 ไม่ใช่พื้นที่ในโจทย์ ลองแยกตัวประกอบของ 2x² + 7x + 3 ด้วยวิธีแยกพจน์กลาง"

[[wrong]]
answer = "x+1"
message = "(2x + 1)(x + 1) = 2x² + 3x + 1 พจน์ท้ายต้องได้ 3"

[[wrong]]
answer = "2x+6"
message = "(2x + 1)(2x + 6) = 4x² + 14x + 6 เป็นสองเท่าของพื้นที่ในโจทย์ ด้านยาวคูณกับ 2x + 1 แล้วต้องได้ 2x² + 7x + 3 พอดี"
