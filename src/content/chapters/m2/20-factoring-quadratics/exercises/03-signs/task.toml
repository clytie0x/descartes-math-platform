title = "ระวังเครื่องหมาย"
level = 2
type = "expr"
form = "factored"
answer = "(x-6)(x+4)"
truth = "x**2 - 2*x - 24"
accept = ["(x+4)(x-6)", "(x - 6)(x + 4)"]
reject = ["x^2-2x-24", "x(x-2)-24"]
hints = ['$c = -24$ ติดลบ สองจำนวนต้องมีเครื่องหมายต่างกัน', 'หาคู่ที่คูณกันได้ $24$ และต่างกัน $2$ แล้วให้ตัวที่ค่าสัมบูรณ์มากกว่าเป็นลบ เพราะ $b = -2$']
statement = '''
แยกตัวประกอบของ $x^2 - 2x - 24$
'''
solution = '''
1. $c = -24$ ติดลบ สองจำนวนต่างเครื่องหมาย และ $b = -2$ ตัวที่ค่าสัมบูรณ์มากกว่าจึงเป็นลบ
2. คู่ที่คูณกันได้ $24$ และต่างกัน $2$ คือ $4$ กับ $6$ จึงใช้ $-6$ กับ $4$
3. $x^2 - 2x - 24 = (x - 6)(x + 4)$
'''

[[wrong]]
answer = "(x+6)(x-4)"
message = "(x + 6)(x − 4) ได้พจน์กลาง +2x แต่โจทย์เป็น −2x ตัวที่ค่าสัมบูรณ์มากกว่าต้องเป็นลบ"

[[wrong]]
answer = "(x-6)(x-4)"
message = "(−6) × (−4) = +24 แต่โจทย์มี −24 สองจำนวนต้องมีเครื่องหมายต่างกัน"

[[wrong]]
answer = "(x-8)(x+3)"
message = "−8 × 3 = −24 ถูก แต่ −8 + 3 = −5 ไม่ใช่ −2"
