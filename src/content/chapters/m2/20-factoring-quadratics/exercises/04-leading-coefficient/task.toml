title = "เมื่อ a ไม่เท่ากับ 1"
level = 2
type = "expr"
form = "factored"
answer = "(3x-1)(x+2)"
truth = "3*x**2 + 5*x - 2"
accept = ["(x+2)(3x-1)", "(3x - 1)(x + 2)"]
reject = ["3x^2+5x-2", "3x^2+6x-x-2"]
hints = ['$ac = 3 \times (-2) = -6$ หาสองจำนวนที่คูณกันได้ $-6$ และบวกกันได้ $5$', 'ได้ $6$ กับ $-1$ แยกพจน์กลางเป็น $3x^2 + 6x - x - 2$ แล้วจัดกลุ่ม']
statement = '''
แยกตัวประกอบของ $3x^2 + 5x - 2$
'''
solution = '''
1. $ac = 3 \times (-2) = -6$ สองจำนวนที่คูณกันได้ $-6$ บวกกันได้ $5$ คือ $6$ กับ $-1$
2. $3x^2 + 5x - 2 = 3x^2 + 6x - x - 2$
3. จัดกลุ่ม $3x(x + 2) - 1(x + 2) = (x + 2)(3x - 1)$
4. ตรวจ $(3x - 1)(x + 2) = 3x^2 + 6x - x - 2 = 3x^2 + 5x - 2$
'''

[[wrong]]
answer = "(3x+1)(x-2)"
message = "(3x + 1)(x − 2) ได้พจน์กลาง −6x + x = −5x เครื่องหมายกลับกับโจทย์"

[[wrong]]
answer = "(3x-2)(x+1)"
message = "พจน์หน้ากับพจน์ท้ายถูก แต่พจน์กลางได้ 3x − 2x = x ไม่ใช่ 5x ลองสลับตำแหน่งตัวเลข"

[[wrong]]
answer = "(x+2)(x-1/3)"
message = "ค่านี้เป็นแค่หนึ่งในสามของโจทย์ เพราะพจน์ x² มีสัมประสิทธิ์ 1 ไม่ใช่ 3 ใช้วิธีแยกพจน์กลางด้วย ac = −6"
