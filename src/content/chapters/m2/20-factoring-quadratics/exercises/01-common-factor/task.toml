title = "ดึงตัวร่วมให้ครบ"
level = 1
type = "choice"
choices = ['$3x(2x - 3)$', '$3(2x^2 - 3x)$', '$x(6x - 9)$', '$3x(2x - 9)$']
answer = 0
checks = [
  "expand(3*x*(2*x - 3)) == 6*x**2 - 9*x",
  "expand(3*(2*x**2 - 3*x)) == 6*x**2 - 9*x",
  "expand(x*(6*x - 9)) == 6*x**2 - 9*x",
  "expand(3*x*(2*x - 9)) != 6*x**2 - 9*x",
]
hints = ['ตัวร่วมที่ครบใช้ ห.ร.ม. ของ $6$ กับ $9$ และ $x$ ที่มีในทั้งสองพจน์']
statement = '''
ข้อใดเป็นการแยกตัวประกอบของ $6x^2 - 9x$ ได้ครบแล้ว
'''
solution = '''
ห.ร.ม. ของ $6$ กับ $9$ คือ $3$ และทั้งสองพจน์มี $x$ ตัวร่วมที่ครบจึงเป็น $3x$ หารได้ $6x^2 \div 3x = 2x$ และ $-9x \div 3x = -3$ จึงได้ $6x^2 - 9x = 3x(2x - 3)$


ตัวเลือก $3(2x^2 - 3x)$ กับ $x(6x - 9)$ คูณกลับแล้วถูก แต่ในวงเล็บยังดึง $x$ หรือ $3$ ออกได้อีก จึงยังไม่ครบ
'''

[[wrong]]
answer = 1
message = "คูณกลับแล้วได้โจทย์จริง แต่ 2x² − 3x ยังดึง x ออกได้อีก ตัวร่วมที่ครบคือ 3x"

[[wrong]]
answer = 2
message = "คูณกลับแล้วได้โจทย์จริง แต่ 6x − 9 ยังดึง 3 ออกได้อีก ตัวร่วมที่ครบคือ 3x"

[[wrong]]
answer = 3
message = "3x × (−9) = −27x ไม่ใช่ −9x ต้องหาร −9x ด้วย 3x ได้ −3"
