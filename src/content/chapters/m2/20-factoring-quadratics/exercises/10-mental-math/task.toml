title = "คิดค่าเสื้อกีฬาสีในใจ"
level = 2
type = "number"
unit = "บาท"
answer = "9975"
truth = "105*95"
hints = ['$105$ กับ $95$ อยู่ห่างจาก $100$ เท่ากัน', '$105 \times 95 = (100 + 5)(100 - 5)$']
statement = '''
โรงเรียนสั่งเสื้อกีฬาสี $95$ ตัว ราคาตัวละ $105$ บาท ใช้ผลต่างของกำลังสองคิดในใจว่าต้องจ่ายทั้งหมดกี่บาท
'''
solution = '''
$105 \times 95 = (100 + 5)(100 - 5) = 100^2 - 5^2 = 10000 - 25 = 9975$ บาท
'''

