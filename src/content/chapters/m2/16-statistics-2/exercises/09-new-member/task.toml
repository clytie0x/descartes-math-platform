title = "สมาชิกใหม่ของชมรม"
level = 3
type = "number"
unit = "กิโลกรัม"
answer = "62"
truth = "7*50 - 6*48"
hints = ['ค่าเฉลี่ยคูณจำนวนคนได้น้ำหนักรวม หาน้ำหนักรวมก่อนและหลังมีสมาชิกใหม่', 'น้ำหนักของคนใหม่คือน้ำหนักรวมที่เพิ่มขึ้น']
statement = '''
ชมรมยกน้ำหนักมีสมาชิก 6 คน น้ำหนักตัวเฉลี่ย 48 กิโลกรัม พอมีสมาชิกใหม่เข้ามาอีก 1 คน น้ำหนักเฉลี่ยของทั้ง 7 คนกลายเป็น 50 กิโลกรัม สมาชิกใหม่หนักกี่กิโลกรัม
'''
solution = '''
1. น้ำหนักรวมของ 6 คนเดิม $6 \times 48 = 288$ กิโลกรัม
2. น้ำหนักรวมของ 7 คน $7 \times 50 = 350$ กิโลกรัม
3. สมาชิกใหม่หนัก $350 - 288 = 62$ กิโลกรัม

ทำไมคนใหม่ต้องหนักกว่า 50 ถึง 12 กิโลกรัม ทั้งที่ค่าเฉลี่ยเพิ่มแค่ 2 เพราะต้องยกค่าเฉลี่ยของ 6 คนเดิมขึ้นคนละ 2 กิโลกรัม รวม $6 \times 2 = 12$ กิโลกรัม ตรวจได้ว่า $62 - 50 = 12$
'''

