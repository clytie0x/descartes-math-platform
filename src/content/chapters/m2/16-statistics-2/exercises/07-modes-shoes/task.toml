statement = '''
ร้านกีฬาจดเบอร์รองเท้าของนักกีฬาวอลเลย์บอลโรงเรียน 12 คน ได้ดังนี้

38 40 39 41 40 38 42 39 40 38 41 37

หาฐานนิยมของเบอร์รองเท้า ถ้ามีหลายค่า ให้ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
