title = "ยอดขายเฉลี่ย"
level = 1
type = "number"
unit = "จาน"
answer = "50"
truth = "Rational(42 + 55 + 38 + 61 + 47 + 57, 6)"
hints = ['บวกยอดขายทั้งหกวัน แล้วหารด้วยจำนวนวัน']
statement = '''
ร้านข้าวมันไก่จดยอดขายหกวันได้ 42 55 38 61 47 และ 57 จาน ร้านนี้ขายได้เฉลี่ยวันละกี่จาน
'''
solution = '''
ผลรวม $42 + 55 + 38 + 61 + 47 + 57 = 300$ จาน ค่าเฉลี่ย $\tfrac{300}{6} = 50$ จานต่อวัน
'''

