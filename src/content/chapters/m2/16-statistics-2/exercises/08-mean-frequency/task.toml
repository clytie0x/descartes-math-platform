title = "ค่าเฉลี่ยจากตารางความถี่"
level = 2
type = "number"
unit = "คะแนน"
answer = "3.2"
truth = "Rational(1*2 + 2*3 + 3*7 + 4*5 + 5*3, 2 + 3 + 7 + 5 + 3)"
hints = ['คูณแต่ละคะแนนกับจำนวนคนที่ได้คะแนนนั้นก่อน แล้วบวกกันเป็นผลรวมของคะแนนทั้งห้อง', 'หารด้วยจำนวนนักเรียนทั้งหมด ไม่ใช่จำนวนช่องในตาราง']
statement = '''
ผลสอบย่อยเต็ม 5 คะแนนของนักเรียนห้องหนึ่งเป็นดังตาราง หาค่าเฉลี่ยเลขคณิตของคะแนน

| คะแนน | 1 | 2 | 3 | 4 | 5 |
|---|---|---|---|---|---|
| จำนวนคน | 2 | 3 | 7 | 5 | 3 |
'''
solution = '''
1. จำนวนนักเรียน $N = 2 + 3 + 7 + 5 + 3 = 20$ คน
2. ผลรวมของคะแนน $1(2) + 2(3) + 3(7) + 4(5) + 5(3) = 2 + 6 + 21 + 20 + 15 = 64$ คะแนน
3. ค่าเฉลี่ย $\tfrac{64}{20} = 3.2$ คะแนน
'''

[[wrong]]
answer = "3"
message = "(1 + 2 + 3 + 4 + 5) ÷ 5 ไม่ได้ใช้จำนวนคน คะแนน 3 มีถึง 7 คน แต่คะแนน 1 มีแค่ 2 คน ต้องคูณจำนวนคนก่อน"

