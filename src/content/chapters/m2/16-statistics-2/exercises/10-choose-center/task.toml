title = "เลือกค่ากลาง"
level = 2
type = "choice"
choices = ['ค่าเฉลี่ยเลขคณิต ซึ่งเท่ากับ 25 นาที', 'มัธยฐาน ซึ่งเท่ากับ 18 นาที', 'ฐานนิยม ซึ่งมีสองค่าคือ 15 และ 20 นาที', 'ค่ามากที่สุด ซึ่งเท่ากับ 93 นาที']
answer = 1
checks = [
  "Rational(sum([10, 12, 15, 15, 18, 20, 20, 22, 93]), 9) == 25",
  "sorted([10, 12, 15, 15, 18, 20, 20, 22, 93])[4] == 18",
  "len([v for v in [10, 12, 15, 15, 18, 20, 20, 22, 93] if v > 25]) == 1",
]
hints = ['มีค่าไหนอยู่ห่างจากกลุ่มมากไหม ค่านั้นดึงค่ากลางตัวไหนได้มาก']
statement = '''
เวลาที่เพื่อน 9 คนใช้เดินทางมาโรงเรียนคือ 10 12 15 15 18 20 20 22 และ 93 นาที คนที่ใช้ 93 นาทีบ้านอยู่อีกอำเภอหนึ่ง ถ้าต้องบอกด้วยตัวเลขตัวเดียวว่าเพื่อนกลุ่มนี้ใช้เวลาเดินทางประมาณเท่าไร ควรใช้ค่าใด
'''
solution = '''
ค่า 93 นาทีอยู่ห่างจากกลุ่มมาก ค่าเฉลี่ย $\tfrac{225}{9} = 25$ นาทีจึงถูกดึงขึ้นไปจนมากกว่าเวลาของ 8 คนจาก 9 คน ส่วนมัธยฐานคือตัวที่ 5 หลังเรียง ได้ 18 นาที ไม่สนว่าค่าที่ปลายแถวจะไกลแค่ไหน จึงบอกเวลาของคนส่วนใหญ่ได้ดีกว่า

ฐานนิยมมีสองค่าและแต่ละค่ามีแค่ 2 คน ไม่ได้บอกภาพรวมมากนัก ส่วนค่ามากที่สุดเป็นค่าของคนคนเดียว ไม่ใช่ค่ากลาง
'''

