title = "มัธยฐานของเวลาวิ่ง"
level = 2
type = "number"
unit = "วินาที"
answer = "14.05"
truth = "(Rational('13.9') + Rational('14.2')) / 2"
hints = ['เรียงข้อมูลจากน้อยไปมากก่อน', 'ข้อมูลมี 8 ตัว ตรงกลางคือตัวที่ 4 กับตัวที่ 5']
statement = '''
นักกีฬาของโรงเรียน 8 คนวิ่ง 100 เมตร ได้เวลาเป็นวินาทีดังนี้

14.2 13.5 15.1 12.8 13.9 16.0 14.6 13.1

หามัธยฐานของเวลาวิ่ง
'''
solution = '''
1. เรียงจากน้อยไปมาก 12.8 13.1 13.5 13.9 14.2 14.6 15.1 16.0
2. $N = 8$ เป็นจำนวนคู่ ตรงกลางคือตัวที่ 4 กับตัวที่ 5 คือ 13.9 กับ 14.2
3. มัธยฐาน $\tfrac{13.9 + 14.2}{2} = 14.05$ วินาที
'''

