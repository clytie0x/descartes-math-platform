title = "ความกว้างของอันตรภาคชั้น"
level = 1
type = "number"
unit = "ปี"
answer = "7"
truth = "Rational(27 + 28, 2) - Rational(20 + 21, 2)"
hints = ['ความกว้างคือ ขอบบน ลบ ขอบล่าง ไม่ใช่ขีดจำกัดบนลบขีดจำกัดล่าง', 'ขอบล่างของชั้น 21 ถึง 27 อยู่กึ่งกลางระหว่าง 20 กับ 21 ขอบบนอยู่กึ่งกลางระหว่าง 27 กับ 28']
statement = '''
ตารางแจกแจงความถี่ของอายุผู้ร่วมวิ่งการกุศลของตำบลหนึ่ง

| อายุ (ปี) | ความถี่ |
|:---:|:---:|
| 21 ถึง 27 | 12 |
| 28 ถึง 34 | 18 |
| 35 ถึง 41 | 15 |
| 42 ถึง 48 | 9 |

อันตรภาคชั้นในตารางนี้กว้างชั้นละกี่ปี
'''
solution = '''
ชั้น 21 ถึง 27 มีขอบล่าง $\tfrac{20 + 21}{2} = 20.5$ และขอบบน $\tfrac{27 + 28}{2} = 27.5$ ความกว้าง $27.5 - 20.5 = 7$ ปี

ตรวจด้วยการนับ ชั้นนี้มีอายุ 21 22 23 24 25 26 27 รวม 7 ค่า หรือดูขีดจำกัดล่างของสองชั้นที่ติดกัน $28 - 21 = 7$
'''

[[wrong]]
answer = "6"
message = "27 − 21 = 6 ขาดไปหนึ่ง เพราะทั้ง 21 และ 27 อยู่ในชั้นนี้ ลองนับอายุ 21 ถึง 27 ดูว่ามีกี่ค่า"

[[wrong]]
