solution = '''
อย่างน้อย 2 ครั้งคือ 2 ครั้งขึ้นไป นับจุดเหนือ 2 ได้ 4 จุด เหนือ 3 ได้ 2 จุด เหนือ 4 ได้ 1 จุด เหนือ 5 ไม่มี และเหนือ 6 ได้ 1 จุด รวม $4 + 2 + 1 + 1 = 8$ คน

ตรวจอีกทาง คนที่มาสายน้อยกว่า 2 ครั้งมี $7 + 5 = 12$ คน จึงเหลือ $20 - 12 = 8$ คน
'''

