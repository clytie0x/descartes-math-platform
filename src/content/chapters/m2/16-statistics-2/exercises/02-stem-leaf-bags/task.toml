title = "แผนภาพต้นใบที่เป็นทศนิยม"
level = 1
type = "number"
unit = "ใบ"
answer = "5"
truth = "len([v for v in [Rational(10*s + l, 10) for s, l in [(2,8),(2,9),(3,0),(3,4),(3,5),(3,7),(4,1),(4,2),(4,2),(4,6),(4,9),(5,0),(5,3),(5,5),(6,4),(7,1)]] if v >= 5])"
hints = ['ตัวกำกับบอกว่า $3 \mid 4$ คือ 3.4 กิโลกรัม ต้นจึงเป็นหลักหน่วย ใบเป็นทศนิยมตำแหน่งแรก', 'ตั้งแต่ 5 กิโลกรัมขึ้นไป คือทุกใบในแถวต้น 5 6 และ 7']
statement = '''
ชั่งกระเป๋านักเรียน 16 ใบ ได้น้ำหนักเป็นกิโลกรัม เขียนเป็นแผนภาพต้นใบได้ดังนี้ ($3 \mid 4$ หมายถึง 3.4 กิโลกรัม)

| ต้น | ใบ |
|:---:|:---|
| 2 | 8 9 |
| 3 | 0 4 5 7 |
| 4 | 1 2 2 6 9 |
| 5 | 0 3 5 |
| 6 | 4 |
| 7 | 1 |

ครูแนะนำว่ากระเป๋าไม่ควรหนักถึง 5 กิโลกรัม มีกระเป๋ากี่ใบที่หนักตั้งแต่ 5 กิโลกรัมขึ้นไป
'''
solution = '''
ตั้งแต่ 5 กิโลกรัมขึ้นไปคือแถวต้น 5 6 และ 7 ได้แก่ 5.0 5.3 5.5 6.4 และ 7.1 กิโลกรัม รวม $3 + 1 + 1 = 5$ ใบ ใบ 5.0 นับด้วย เพราะหนัก 5 กิโลกรัมพอดี
'''

[[wrong]]
answer = "3"
message = "นับแค่แถวต้น 5 ยังขาดแถวต้น 6 กับ 7 ซึ่งหนักกว่า 5 กิโลกรัมเช่นกัน"

