title = '''ตรวจคู่อันดับ'''
level = 1
type = "number"
statement = '''ใน $(0,5),(1,3),(2,2),(3,-1)$ มีกี่คู่ที่ทำให้ $2x+y=5$ เป็นจริง'''
solution = '''แทนทีละคู่ ได้ 5,5,6,5 จึงมี 3 คู่'''
hints = ['''แทนทั้ง x และ y ในแต่ละคู่ ไม่ตรวจเพียงตัวเดียว''']
answer = '''3'''
truth = '''sum(1 for a,b in [(0,5),(1,3),(2,2),(3,-1)] if 2*a+b==5)'''

