title = '''กราฟและตรวจคำตอบ'''
level = 3
type = "self"
statement = '''วาดกราฟ $x+y=6$ และ $x-y=2$ แล้วแก้ระบบด้วยพีชคณิตเพื่อตรวจจุดตัด'''
solution = '''เส้นแรกผ่าน (0,6),(6,0) เส้นที่สองผ่าน (0,−2),(2,0) จุดตัดคือ (4,2) บวกสมการได้ 2x=8 จึง x=4 และ y=2 ตรวจ 4+2=6 กับ 4−2=2 ครบทั้งสองสมการ'''
hints = ['''หาอย่างน้อยสองจุดต่อเส้น แล้วตรวจจุดตัดในสมการทั้งสอง''']
checks = ['''solve([x+y-6,x-y-2],(x,y))=={x:4,y:2}''']
