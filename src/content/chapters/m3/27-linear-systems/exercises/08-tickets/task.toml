title = '''ตั๋วกีฬาสี'''
level = 3
type = "number"
statement = '''ขายตั๋วผู้ใหญ่ใบละ 40 บาทและนักเรียนใบละ 25 บาท รวม 30 ใบ ได้เงิน 900 บาท ขายตั๋วผู้ใหญ่กี่ใบ'''
solution = '''$x+y=30$ และ $40x+25y=900$ ลบสมการแรกคูณ 25 ได้ $15x=150$ จึงขายผู้ใหญ่ 10 ใบ นักเรียน 20 ใบ'''
hints = ['''เขียนสมการจำนวนตั๋วกับสมการยอดเงิน แล้วกำจัดตัวแปรนักเรียน''']
answer = '''10'''
truth = '''solve([x+y-30,40*x+25*y-900],(x,y))[x]'''

[[wrong]]
answer = '''20'''
message = '''20 คือจำนวนนักเรียน'''
