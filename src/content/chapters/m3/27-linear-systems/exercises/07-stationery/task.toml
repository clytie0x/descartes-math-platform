title = '''ซื้อเครื่องเขียน'''
level = 2
type = "number"
statement = '''ซื้อสมุดและปากการวม 12 ชิ้น สมุดเล่มละ 20 บาท ปากกาด้ามละ 8 บาท จ่าย 156 บาท ซื้อสมุดกี่เล่ม'''
solution = '''ให้สมุด $x$ ปากกา $y$ ได้ $x+y=12$ และ $20x+8y=156$ ลบสมการแรกคูณ 8 ได้ $12x=60$ จึงสมุด 5 เล่ม ปากกา 7 ด้าม'''
hints = ['''ให้ x เป็นจำนวนสมุด y เป็นจำนวนปากกา แยกสมการชิ้นกับสมการเงิน''']
answer = '''5'''
truth = '''solve([x+y-12,20*x+8*y-156],(x,y))[x]'''

[[wrong]]
answer = '''7'''
message = '''7 คือจำนวนปากกา ต้องตอบตัวแปรที่แทนสมุด'''
