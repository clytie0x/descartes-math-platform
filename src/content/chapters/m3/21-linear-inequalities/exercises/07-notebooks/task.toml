title = '''ซื้อสมุด'''
level = 2
type = "number"
statement = '''มีเงิน 250 บาท ต้องจ่ายค่าปากกา 35 บาทก่อน สมุดเล่มละ 18 บาท ซื้อสมุดได้มากที่สุดกี่เล่ม'''
solution = '''ให้ซื้อ $n$ เล่ม ได้ $35+18n\le250$ ดังนั้น $n\le215/18$ ซื้อได้ 11 เล่ม ตรวจ $35+18(11)=233$ แต่ 12 เล่มใช้ 251 บาท'''
hints = ['''หักค่าปากกาก่อน แล้วหารเงินที่เหลือด้วยราคาสมุด''']
answer = '''11'''
truth = '''floor(Rational(250-35,18))'''

[[wrong]]
answer = '''12'''
message = '''จำนวนเล่มต้องเป็นจำนวนเต็มที่ไม่เกินขอบ ปัดขึ้นแล้วเงินไม่พอ'''
