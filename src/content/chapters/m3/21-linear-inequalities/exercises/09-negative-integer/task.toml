title = '''จำนวนเต็มติดลบ'''
level = 3
type = "number"
statement = '''จำนวนเต็มที่มากที่สุดที่ทำให้ $4-3x>14$ เป็นจริงคือเท่าใด'''
solution = '''$-3x>10$ หารด้วย $-3$ ได้ $x<-10/3$ จำนวนเต็มมากที่สุดที่เล็กกว่า $-3.333\ldots$ คือ $-4$'''
hints = ['''แก้อสมการก่อน แล้วเลือกจำนวนเต็มทางซ้ายของขอบ''']
answer = '''-4'''
truth = '''floor(Rational(-10,3))'''

[[wrong]]
answer = '''-3'''
message = '''−3 อยู่ทางขวาของ −10/3 แทนกลับจะไม่ผ่าน'''
