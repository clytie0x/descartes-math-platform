title = "คว่ำลงและแคบกว่า"
level = 1
type = "choice"
choices = ['$y = -3x^2$', '$y = -\tfrac{1}{2}x^2$', '$y = 2x^2$', '$y = (-2x)^2$']
answer = 0
hints = ['กราฟคว่ำลงเมื่อ $a < 0$ และแคบกว่า $y = x^2$ เมื่อ $|a| > 1$']
statement = '''
กราฟของฟังก์ชันใดคว่ำลง และแคบกว่ากราฟของ $y = x^2$
'''
solution = '''
คว่ำลงต้องมี $a < 0$ เหลือ $y = -3x^2$ กับ $y = -\tfrac{1}{2}x^2$ ส่วน $y = (-2x)^2 = 4x^2$ มี $a = 4$ เปิดขึ้น ในสองตัวที่คว่ำลง ตัวที่แคบกว่า $y = x^2$ ต้องมี $|a| > 1$ จึงตอบ $y = -3x^2$
'''

[[wrong]]
answer = 1
message = "กราฟนี้คว่ำลงจริง แต่ |a| = ½ น้อยกว่า 1 จึงกว้างกว่า y = x²"

[[wrong]]
answer = 2
message = "a = 2 เป็นบวก กราฟจึงเปิดขึ้น"

[[wrong]]
answer = 3
message = "(−2x)² = 4x² ค่า a เป็นบวก กราฟจึงเปิดขึ้น"
