title = "ลากจุดไปที่จุดยอด"
level = 2
type = "point"
board = "ex-drag-point"
board_label = "ระนาบพิกัดที่มีจุดหนึ่งจุด ลากไปวางที่จุดยอด"
answer = "1, 4"
truth = "vertex(-x**2 + 2*x + 3)"
hints = ['ใช้ทางลัด $h = -\tfrac{b}{2a}$ โดย $a = -1$ และ $b = 2$', 'ได้ $h$ แล้ว แทน $x = h$ ในฟังก์ชันเพื่อหา $k$']
statement = '''
ลากจุดสีส้มไปวางที่จุดยอดของกราฟ $y = -x^2 + 2x + 3$ จุดจะติดอยู่บนจุดตัดของเส้นตาราง
'''
solution = '''
$a = -1$ $b = 2$ ได้ $h = -\tfrac{2}{2(-1)} = 1$ แทน $x = 1$ ได้ $k = -1 + 2 + 3 = 4$ จุดยอดคือ $(1, 4)$


ตรวจด้วยกำลังสองสมบูรณ์ $y = -(x^2 - 2x) + 3 = -\big[(x - 1)^2 - 1\big] + 3 = -(x - 1)^2 + 4$
'''

[[wrong]]
answer = "-1, 4"
message = "h = −b/(2a) = −2/(2 × (−1)) = 1 ระวังเครื่องหมายลบสองตัว"

[[wrong]]
answer = "0, 3"
message = "(0, 3) คือจุดตัดแกน y ไม่ใช่จุดยอด ลองหา h = −b/(2a) ก่อน"
