แกนสมมาตรของกราฟ $y = 3(x + 2)^2 - 5$ คือเส้นใด
'''
solution = '''
$x + 2 = x - (-2)$ จึงได้ $h = -2$ แกนสมมาตรคือเส้นตั้งที่ผ่านจุดยอด คือ $x = -2$
'''

