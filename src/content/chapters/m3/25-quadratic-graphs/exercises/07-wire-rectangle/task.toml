title = "ลวดดัดเป็นสี่เหลี่ยม"
level = 2
type = "number"
unit = "ตารางเซนติเมตร"
answer = "36"
truth = "vertex(x*(12 - x))[1]"
hints = ['ความยาวรอบรูป 24 เซนติเมตร ด้านกว้างกับด้านยาวรวมกันได้เท่าไร', 'ถ้าด้านกว้างยาว $x$ ด้านยาวคือ $12 - x$ พื้นที่คือ $x(12 - x)$']
statement = '''
ลวดเส้นหนึ่งยาว 24 เซนติเมตร ดัดเป็นรูปสี่เหลี่ยมผืนผ้าโดยใช้ลวดหมดพอดี พื้นที่ของรูปสี่เหลี่ยมนี้มากที่สุดเท่าใด
'''
solution = '''
1. ด้านกว้าง $x$ เซนติเมตร ด้านยาว $12 - x$ เซนติเมตร เพราะ $2x + 2(12 - x) = 24$
2. พื้นที่ $A = x(12 - x) = -x^2 + 12x = -(x - 6)^2 + 36$
3. $a = -1 < 0$ จึงมีค่าสูงสุด $36$ ตารางเซนติเมตร เมื่อ $x = 6$ คือรูปสี่เหลี่ยมจัตุรัสด้านยาว 6 เซนติเมตร
'''

[[wrong]]
answer = "144"
message = "รอบรูป 24 คือกว้าง + ยาว + กว้าง + ยาว ด้านกว้างกับด้านยาวรวมกันได้ 12 ไม่ใช่ 24"

