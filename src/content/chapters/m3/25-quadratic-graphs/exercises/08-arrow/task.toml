title = "ยิงลูกธนูขึ้นฟ้า"
level = 3
type = "number"
unit = "เมตร"
answer = "47"
truth = "vertex(2 + 30*t - 5*t**2)[1]"
hints = ['เรียงใหม่เป็น $h = -5t^2 + 30t + 2$ แล้วหาจุดยอด', 'ทางลัด $t = -\tfrac{30}{2(-5)}$']
statement = '''
ยิงลูกธนูขึ้นไปตรงๆ จากความสูง 2 เมตร ความสูงของลูกธนูเมื่อเวลาผ่านไป $t$ วินาทีคือ $h = 2 + 30t - 5t^2$ เมตร ลูกธนูขึ้นไปได้สูงที่สุดกี่เมตร
'''
solution = '''
1. $h = -5t^2 + 30t + 2$ มี $a = -5 < 0$ จึงมีค่าสูงสุด
2. $h = -5(t^2 - 6t) + 2 = -5\big[(t - 3)^2 - 9\big] + 2 = -5(t - 3)^2 + 47$
3. สูงที่สุด 47 เมตร เมื่อเวลาผ่านไป 3 วินาที
'''

[[wrong]]
answer = "3"
message = "3 วินาทีคือเวลาที่ลูกธนูขึ้นไปถึงจุดสูงสุด ข้อนี้ถามว่าสูงกี่เมตร"

