title = "จัดรูปด้วยกำลังสองสมบูรณ์"
level = 2
type = "expr"
label = '$y =$'
form = "vertex"
answer = "(x+3)^2-4"
truth = "x**2 + 6*x + 5"
accept = ["(x + 3)^2 - 4", "-4+(x+3)^2", "1(x+3)^2-4"]
reject = ["x^2+6x+5", "(x+1)(x+5)"]
hints = ['ครึ่งหนึ่งของ $6$ คือ $3$ ต้องเติมอะไรให้ $x^2 + 6x$ เป็น $(x + 3)^2$', '$x^2 + 6x + 5 = (x^2 + 6x + 9) - 9 + 5$']
statement = '''
เขียน $y = x^2 + 6x + 5$ ให้อยู่ในรูป $y = a(x - h)^2 + k$

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
1. ครึ่งหนึ่งของ $6$ คือ $3$ และ $(x + 3)^2 = x^2 + 6x + 9$
2. $y = (x^2 + 6x + 9) - 9 + 5$
3. $y = (x + 3)^2 - 4$ จุดยอดคือ $(-3, -4)$
'''

[[wrong]]
answer = "(x-3)^2-4"
message = "(x − 3)² กระจายได้ x² − 6x + 9 เครื่องหมายหน้า 6x ไม่ตรงกับโจทย์"

[[wrong]]
answer = "(x+3)^2+5"
message = "(x + 3)² มี 9 เกินมา ต้องลบ 9 ออกด้วย ได้ 5 − 9"

[[wrong]]
answer = "(x+3)^2+4"
message = "เกือบแล้ว 5 − 9 ได้ −4 ไม่ใช่ 4"
