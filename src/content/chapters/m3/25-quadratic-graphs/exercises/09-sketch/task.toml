title = "วาดกราฟในกระดาษ"
level = 2
type = "self"
checks = [
  "vertex(-(x - 1)**2 + 4) == (1, 4)",
  "(-(x - 1)**2 + 4).subs(x, 0) == 3",
  "roots(-(x - 1)**2 + 4) == [-1, 3]",
]
hints = ['เริ่มจากจุดยอดกับแกนสมมาตร แล้วหาจุดตัดแกน $y$ และจุดสะท้อนของมัน']
statement = '''
วาดกราฟของ $y = -(x - 1)^2 + 4$ ในกระดาษ ให้กราฟแสดงจุดยอด แกนสมมาตร จุดตัดแกน $y$ และจุดตัดแกน $x$ ทุกจุด เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์
'''
solution = '''
<div class="figure"><div class="board" data-board="sketch-check" role="img" aria-label="กราฟคว่ำลง จุดยอดที่ 1 ลูกน้ำ 4 ตัดแกน x ที่ ลบ 1 และ 3 ตัดแกน y ที่ 3"></div></div>

ตรวจกราฟของตัวเองทีละข้อ ได้ครบห้าข้อถือว่าผ่าน

- กราฟคว่ำลง เพราะ $a = -1$
- จุดยอดอยู่ที่ $(1, 4)$ และเป็นจุดสูงสุด
- แกนสมมาตรเป็นเส้นประ $x = 1$
- ตัดแกน $y$ ที่ $(0, 3)$ และมีจุดสะท้อน $(2, 3)$
- ตัดแกน $x$ ที่ $(-1, 0)$ และ $(3, 0)$ จาก $-(x - 1)^2 + 4 = 0$ ได้ $(x - 1)^2 = 4$ คือ $x - 1 = \pm 2$
'''
