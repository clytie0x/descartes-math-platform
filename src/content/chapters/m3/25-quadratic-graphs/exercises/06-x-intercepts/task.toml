title = "จุดตัดแกน x"
level = 2
type = "set"
label = '$x =$'
answer = ["-2", "4"]
truth = "roots(x**2 - 2*x - 8)"
accept = ["4, -2", "-2,4"]
reject = ["4", "-2, 4, 1"]
hints = ['กราฟตัดแกน $x$ ตรงที่ $y = 0$ จึงต้องแก้สมการ $x^2 - 2x - 8 = 0$', 'หาสองจำนวนที่คูณกันได้ $-8$ และบวกกันได้ $-2$']
statement = '''
กราฟของ $y = x^2 - 2x - 8$ ตัดแกน $x$ ที่ $x$ เท่าใดบ้าง ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
ให้ $y = 0$ ได้ $x^2 - 2x - 8 = (x - 4)(x + 2) = 0$ จึงได้ $x = 4$ หรือ $x = -2$


ตรวจด้วยแกนสมมาตร $h = -\tfrac{-2}{2(1)} = 1$ จุดตัดแกน $x$ ทั้งสองต้องห่างจาก $x = 1$ เท่ากัน ซึ่ง $4$ กับ $-2$ ห่าง $3$ หน่วยทั้งคู่
'''

[[wrong]]
answer = ["2", "-4"]
message = "x² − 2x − 8 = (x − 4)(x + 2) วงเล็บเป็นศูนย์เมื่อ x = 4 หรือ x = −2 ระวังเครื่องหมาย"

[[wrong]]
answer = ["-8"]
message = "−8 คือจุดตัดแกน y ได้จากการแทน x = 0 จุดตัดแกน x ได้จากการให้ y = 0"
