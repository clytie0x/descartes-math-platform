title = "ผลบวกของกำลังสาม"
level = 2
type = "expr"
form = "factored"
answer = "(2x+1)(4x^2-2x+1)"
truth = "8*x**3 + 1"
accept = ["(2x + 1)(4x^2 - 2x + 1)", "(4x^2-2x+1)(2x+1)", "(1+2x)(1-2x+4x^2)"]
reject = ["8x^3+1", "(2x)^3+1"]
hints = ['$8x^3 = (2x)^3$ และ $1 = 1^3$', 'ใช้ $A^3 + B^3 = (A + B)(A^2 - AB + B^2)$ โดย $A = 2x$']
statement = '''
แยกตัวประกอบของ $8x^3 + 1$
'''
solution = '''
$8x^3 = (2x)^3$ และ $1 = 1^3$ จึงเป็นผลบวกของกำลังสามโดย $A = 2x$ และ $B = 1$


$A^2 = 4x^2$ และ $AB = 2x$ และ $B^2 = 1$ ได้ $8x^3 + 1 = (2x + 1)(4x^2 - 2x + 1)$
'''

[[wrong]]
answer = "(2x+1)(4x^2+2x+1)"
message = "ผลบวกของกำลังสาม พจน์กลางของวงเล็บที่สองต้องตรงข้ามกับโจทย์ จึงเป็น −2x"

[[wrong]]
answer = "(2x+1)(4x^2-4x+1)"
message = "พจน์กลางของวงเล็บที่สองคือ AB = 2x ไม่ใช่ 2AB = 4x"

[[wrong]]
answer = "(8x+1)(64x^2-8x+1)"
message = "8x³ = (2x)³ ค่า A คือ 2x ไม่ใช่ 8x"

[[wrong]]
answer = "(2x+1)^3"
message = "(2x + 1)³ มีพจน์ 12x² และ 6x เกินมา A³ + B³ ไม่เท่ากับ (A + B)³"
