title = "วงเล็บไหนแยกต่อได้"
level = 2
type = "choice"
choices = ['$x^2 + 9$', '$x^2 + 3x + 9$', '$x^2 + 6x + 9$', '$x^2 - 3x + 9$']
answer = 2
checks = [
  "factor(x**2 + 9) == x**2 + 9",
  "factor(x**2 + 3*x + 9) == x**2 + 3*x + 9",
  "factor(x**2 + 6*x + 9) == (x + 3)**2",
  "factor(x**2 - 3*x + 9) == x**2 - 3*x + 9",
]
hints = ['หาสองจำนวนที่คูณกันได้ $9$ แล้วดูว่าบวกกันได้สัมประสิทธิ์ของ $x$ หรือไม่']
statement = '''
นักเรียนแยกตัวประกอบมาจนเหลือวงเล็บดีกรีสองสี่แบบ วงเล็บใดยังแยกตัวประกอบต่อได้
'''
solution = '''
คู่ที่คูณกันได้ $9$ คือ $1$ กับ $9$ และ $3$ กับ $3$ รวมทั้งคู่ที่ติดลบ ผลบวกเป็น $10$ $6$ $-10$ และ $-6$ เท่านั้น


$x^2 + 6x + 9$ มีสัมประสิทธิ์ของ $x$ เป็น $6$ จึงแยกได้ $(x + 3)^2$ ส่วน $x^2 + 3x + 9$ กับ $x^2 - 3x + 9$ เป็นวงเล็บที่สองของ $x^3 - 27$ และ $x^3 + 27$ ซึ่งแยกต่อไม่ได้ และ $x^2 + 9$ เป็นผลบวกของกำลังสอง แยกไม่ได้
'''

[[wrong]]
answer = 0
message = "x² + 9 เป็นผลบวกของกำลังสอง แยกไม่ได้ (x + 3)(x − 3) = x² − 9"

[[wrong]]
answer = 1
message = "ไม่มีสองจำนวนที่คูณกันได้ 9 และบวกกันได้ 3 วงเล็บนี้มาจาก x³ − 27 ซึ่งแยกต่อไม่ได้"

[[wrong]]
answer = 3
message = "ไม่มีสองจำนวนที่คูณกันได้ 9 และบวกกันได้ −3 วงเล็บนี้มาจาก x³ + 27 ซึ่งแยกต่อไม่ได้"
