title = "กำลังสองสมบูรณ์ที่ซ่อนอยู่"
level = 1
type = "expr"
form = "factored"
answer = "(x^2+5)^2"
truth = "x**4 + 10*x**2 + 25"
accept = ["(x^2 + 5)^2", "(5+x^2)^2", "(x^2+5)(x^2+5)"]
reject = ["x^4+10x^2+25", "(x^2)^2+10x^2+25"]
hints = ['ให้ $A = x^2$ จะได้ $A^2 + 10A + 25$', '$A^2 + 10A + 25$ เป็นกำลังสองสมบูรณ์ เพราะ $25 = 5^2$ และ $10A = 2(A)(5)$']
statement = '''
แยกตัวประกอบของ $x^4 + 10x^2 + 25$

<p class="ex-tip">พิมพ์ยกกำลังด้วยปุ่ม <kbd>^</kbd> ถ้าใช้มือถือ แตะที่ช่องแล้วใช้แป้นพิมพ์คณิตศาสตร์ที่ขึ้นมา</p>
'''
solution = '''
1. ให้ $A = x^2$ ได้ $A^2 + 10A + 25$
2. $25 = 5^2$ และ $10A = 2(A)(5)$ จึงได้ $(A + 5)^2$
3. แทนกลับได้ $(x^2 + 5)^2$ และ $x^2 + 5$ เป็นผลบวก แยกต่อไม่ได้
'''

[[wrong]]
answer = "(x+5)^2"
message = "(x + 5)² = x² + 10x + 25 เป็นดีกรีสอง แต่โจทย์ดีกรีสี่ ตัวที่ยกกำลังสองต้องเป็น x² + 5"

[[wrong]]
answer = "(x^2-5)^2"
message = "(x² − 5)² ให้พจน์กลาง −10x² แต่โจทย์เป็น +10x²"

[[wrong]]
answer = "(x^2+5)(x^2-5)"
message = "(x² + 5)(x² − 5) = x⁴ − 25 ไม่มีพจน์กลาง โจทย์มี +10x² จึงเป็นกำลังสองสมบูรณ์"
