title = "ดึงตัวร่วมแล้วอย่าหยุด"
level = 2
type = "expr"
form = "factored"
answer = "3(x-2)(x^2+2x+4)"
truth = "3*x**3 - 24"
accept = ["3(x - 2)(x^2 + 2x + 4)", "3(x^2+2x+4)(x-2)", "(x-2)*3*(x^2+2x+4)"]
reject = ["3x^3-24", "3(x^3-8)", "(3x-6)(x^2+2x+4)", "(x-2)(3x^2+6x+12)"]
hints = ['ดึงตัวร่วม $3$ ออกก่อน ในวงเล็บจะเหลือ $x^3 - 8$', '$8 = 2^3$ ใช้ผลต่างของกำลังสามต่อ']
statement = '''
แยกตัวประกอบของ $3x^3 - 24$
'''
solution = '''
1. ดึงตัวร่วมก่อน $3x^3 - 24 = 3(x^3 - 8)$
2. $x^3 - 8 = x^3 - 2^3 = (x - 2)(x^2 + 2x + 4)$
3. ได้ $3x^3 - 24 = 3(x - 2)(x^2 + 2x + 4)$ วงเล็บ $x^2 + 2x + 4$ แยกต่อไม่ได้


ถ้าตอบ $3(x^3 - 8)$ ยังไม่ครบ เพราะ $x^3 - 8$ แยกต่อได้ และถ้าตอบ $(3x - 6)(x^2 + 2x + 4)$ ก็ยังไม่ครบ เพราะ $3x - 6$ ยังดึง $3$ ออกได้
'''

[[wrong]]
answer = "(x-2)(x^2+2x+4)"
message = "นี่คือ x³ − 8 อย่าลืมคูณ 3 ที่ดึงออกมาตอนแรก"

[[wrong]]
answer = "3(x-2)(x^2+4x+4)"
message = "พจน์กลางของวงเล็บที่สองคือ AB = 2x ไม่ใช่ 2AB = 4x"

[[wrong]]
answer = "3(x-2)^3"
message = "(x − 2)³ = x³ − 6x² + 12x − 8 ไม่เท่ากับ x³ − 8"

[[wrong]]
answer = "3(x-8)(x^2+8x+64)"
message = "24 ÷ 3 = 8 และ 8 = 2³ ค่า B คือ 2 ไม่ใช่ 8"
