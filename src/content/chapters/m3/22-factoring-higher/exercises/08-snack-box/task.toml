title = "กล่องขนมเปี๊ยะ"
level = 2
type = "number"
unit = "เซนติเมตร"
answer = "12"
truth = "8 - min(roots(x**3 + 7*x**2 + 12*x))"
hints = ['ปริมาตรคือผลคูณของความยาวสามด้าน แยกตัวประกอบของ $x^3 + 7x^2 + 12x$ ให้เป็นสามวงเล็บ', 'ดึง $x$ ออกก่อน แล้วหาสองจำนวนที่คูณกันได้ $12$ และบวกกันได้ $7$']
statement = '''
ร้านขนมทำกล่องใส่ขนมเปี๊ยะเป็นทรงสี่เหลี่ยมมุมฉาก ปริมาตร $x^3 + 7x^2 + 12x$ ลูกบาศก์เซนติเมตร ด้านที่สั้นที่สุดยาว $x$ เซนติเมตร และอีกสองด้านยาวกว่า $x$ เป็นจำนวนเต็มเซนติเมตร ถ้าด้านที่สั้นที่สุดยาว $8$ เซนติเมตร ด้านที่ยาวที่สุดของกล่องยาวกี่เซนติเมตร
'''
solution = '''
1. $x^3 + 7x^2 + 12x = x(x^2 + 7x + 12)$
2. $3 \times 4 = 12$ และ $3 + 4 = 7$ จึงได้ $x(x + 3)(x + 4)$
3. ด้านทั้งสามยาว $x$ $x + 3$ และ $x + 4$ เซนติเมตร เมื่อ $x = 8$ ได้ $8$ $11$ และ $12$ เซนติเมตร ด้านที่ยาวที่สุดยาว $12$ เซนติเมตร
4. ตรวจ $8 \times 11 \times 12 = 1056$ และ $8^3 + 7(8^2) + 12(8) = 512 + 448 + 96 = 1056$
'''

