title = "แยกได้ครบหรือยัง"
level = 1
type = "choice"
choices = ['$2x(x^2 - 4)$', '$2x(x + 2)(x - 2)$', '$(2x^2 + 4x)(x - 2)$', '$2x(x - 2)^2$']
answer = 1
checks = [
  "expand(2*x*(x**2 - 4)) == 2*x**3 - 8*x",
  "expand(2*x*(x + 2)*(x - 2)) == 2*x**3 - 8*x",
  "expand((2*x**2 + 4*x)*(x - 2)) == 2*x**3 - 8*x",
  "expand(2*x*(x - 2)**2) != 2*x**3 - 8*x",
]
hints = ['ดึงตัวร่วมให้ครบก่อน แล้วดูว่าวงเล็บที่เหลือแยกต่อได้ไหม']
statement = '''
ข้อใดเป็นการแยกตัวประกอบของ $2x^3 - 8x$ ได้ครบแล้ว
'''
solution = '''
ดึงตัวร่วม $2x$ ออกได้ $2x(x^2 - 4)$ แล้ว $x^2 - 4$ เป็นผลต่างของกำลังสอง แยกต่อได้ $(x + 2)(x - 2)$ คำตอบที่ครบจึงเป็น $2x(x + 2)(x - 2)$


ตัวเลือก $2x(x^2 - 4)$ กับ $(2x^2 + 4x)(x - 2)$ คูณกลับแล้วได้โจทย์ แต่ยังมีวงเล็บที่แยกต่อได้
'''

[[wrong]]
answer = 0
message = "คูณกลับแล้วได้โจทย์จริง แต่ x² − 4 ยังเป็นผลต่างของกำลังสอง แยกต่อได้อีก"

[[wrong]]
answer = 2
message = "คูณกลับแล้วได้โจทย์จริง แต่ 2x² + 4x ยังดึง 2x ออกได้อีก"

[[wrong]]
answer = 3
message = "(x − 2)² = x² − 4x + 4 ไม่ใช่ x² − 4 คูณกลับแล้วไม่ได้โจทย์"
