title = "ผลต่างของกำลังสาม"
level = 1
type = "expr"
form = "factored"
answer = "(x-3)(x^2+3x+9)"
truth = "x**3 - 27"
accept = ["(x - 3)(x^2 + 3x + 9)", "(x^2+3x+9)(x-3)", "(x-3)(9+3x+x^2)"]
reject = ["x^3-27", "x^3-3^3"]
hints = ['$27 = 3^3$ จึงได้ $A = x$ และ $B = 3$', 'ใช้ $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$']
statement = '''
แยกตัวประกอบของ $x^3 - 27$
'''
solution = '''
$27 = 3^3$ จึงเป็นผลต่างของกำลังสามโดย $A = x$ และ $B = 3$


$x^3 - 27 = (x - 3)(x^2 + 3x + 9)$ วงเล็บที่สองแยกต่อไม่ได้
'''

[[wrong]]
answer = "(x-3)^3"
message = "(x − 3)³ = x³ − 9x² + 27x − 27 มีพจน์กลางเกินมา A³ − B³ ไม่เท่ากับ (A − B)³"

[[wrong]]
answer = "(x-3)(x^2+6x+9)"
message = "พจน์กลางของวงเล็บที่สองคือ AB = 3x ไม่ใช่ 2AB = 6x"

[[wrong]]
answer = "(x-3)(x^2-3x+9)"
message = "ผลต่างของกำลังสาม พจน์กลางของวงเล็บที่สองต้องเป็นบวก จำว่า เหมือน ตรงข้าม บวกเสมอ"

[[wrong]]
answer = "(x+3)(x^2-3x+9)"
message = "วงเล็บแรกต้องมีเครื่องหมายเหมือนโจทย์ โจทย์เป็นผลต่าง จึงเป็น x − 3"
