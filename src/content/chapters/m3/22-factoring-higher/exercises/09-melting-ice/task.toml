title = "น้ำแข็งละลาย"
level = 2
type = "number"
unit = "ลูกบาศก์เซนติเมตร"
answer = "1197"
truth = "13**3 - 10**3"
hints = ['ปริมาตรที่หายไปคือ $13^3 - 10^3$', 'ใช้ $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$ โดย $A = 13$ และ $B = 10$ จะคิดในใจได้ง่ายกว่า']
statement = '''
น้ำแข็งก้อนหนึ่งเป็นลูกบาศก์ยาวด้านละ $13$ เซนติเมตร วางไว้สักพักละลายจนเหลือเป็นลูกบาศก์ยาวด้านละ $10$ เซนติเมตร ปริมาตรของน้ำแข็งหายไปกี่ลูกบาศก์เซนติเมตร
'''
solution = '''
ปริมาตรที่หายไปคือ $13^3 - 10^3$ ใช้ผลต่างของกำลังสามโดย $A = 13$ และ $B = 10$


$13^3 - 10^3 = (13 - 10)(13^2 + 13 \times 10 + 10^2) = 3(169 + 130 + 100) = 3 \times 399 = 1197$


ตรวจ $13^3 = 2197$ และ $2197 - 1000 = 1197$
'''

