title = "เรียงขั้นการแยกตัวประกอบ"
level = 2
type = "order"
steps = [
  'ดึงตัวร่วม $3$ ออก ได้ $3(x^4 - 16)$',
  'มอง $x^4 - 16$ เป็น $(x^2)^2 - 4^2$ ได้ $3(x^2 + 4)(x^2 - 4)$',
  'แยก $x^2 - 4$ ต่อ ได้ $3(x^2 + 4)(x + 2)(x - 2)$',
  'ตรวจว่า $x^2 + 4$ เป็นผลบวกของกำลังสอง แยกต่อไม่ได้ จึงแยกครบแล้ว',
]
checks = [
  "expand(3*(x**4 - 16)) == 3*x**4 - 48",
  "expand(3*(x**2 + 4)*(x**2 - 4)) == 3*x**4 - 48",
  "expand(3*(x**2 + 4)*(x + 2)*(x - 2)) == 3*x**4 - 48",
  "factor(x**2 + 4) == x**2 + 4",
]
hints = ['ขั้นไหนต้องมีวงเล็บของขั้นก่อนหน้าอยู่แล้วจึงจะทำได้']
statement = '''
เรียงขั้นตอนการแยกตัวประกอบของ $3x^4 - 48$ ให้ถูกลำดับ
'''
solution = '''
1. ดึงตัวร่วมก่อน $3x^4 - 48 = 3(x^4 - 16)$
2. $x^4 - 16$ เป็นผลต่างของกำลังสอง ได้ $3(x^2 + 4)(x^2 - 4)$
3. $x^2 - 4$ ยังเป็นผลต่างของกำลังสอง ได้ $3(x^2 + 4)(x + 2)(x - 2)$
4. ตรวจวงเล็บสุดท้าย $x^2 + 4$ แยกไม่ได้ จึงจบ
'''

[[wrong]]
answer = [1, 0, 2, 3]
message = "x⁴ − 16 จะปรากฏหลังดึง 3 ออกแล้วเท่านั้น ต้องดึงตัวร่วมก่อน"

[[wrong]]
answer = [0, 2, 1, 3]
message = "วงเล็บ x² − 4 เกิดจากการแยก x⁴ − 16 ต้องได้วงเล็บนี้ก่อนจึงแยกต่อได้"

[[wrong]]
answer = [0, 1, 3, 2]
message = "ตรวจว่าแยกครบเป็นขั้นสุดท้าย ตอนนั้น x² − 4 ยังแยกต่อได้อยู่"
