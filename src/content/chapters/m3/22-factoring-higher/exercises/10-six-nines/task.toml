title = "แยก 999 999 ในใจ"
level = 3
type = "number"
answer = "37"
truth = "max(factorint(999999))"
hints = ['$999\,999 = 10^6 - 1 = (10^3)^2 - 1^2$ ใช้ผลต่างของกำลังสองก่อน', 'ได้ $999 \times 1001$ แล้วแยกแต่ละตัวต่อด้วยผลต่างและผลบวกของกำลังสาม']
statement = '''
ใช้การแยกตัวประกอบเขียน $999\,999$ ให้เป็นผลคูณของจำนวนเฉพาะ แล้วตอบจำนวนเฉพาะที่มากที่สุด
'''
solution = '''
1. $999\,999 = 10^6 - 1 = (10^3 + 1)(10^3 - 1) = 1001 \times 999$
2. $1001 = 10^3 + 1^3 = (10 + 1)(100 - 10 + 1) = 11 \times 91 = 7 \times 11 \times 13$
3. $999 = 10^3 - 1^3 = (10 - 1)(100 + 10 + 1) = 9 \times 111 = 3^3 \times 37$
4. ได้ $999\,999 = 3^3 \times 7 \times 11 \times 13 \times 37$ จำนวนเฉพาะที่มากที่สุดคือ $37$
'''

[[wrong]]
answer = "1001"
message = "1001 = 7 × 11 × 13 ยังไม่ใช่จำนวนเฉพาะ"

[[wrong]]
answer = "13"
message = "13 มาจาก 1001 อีกครึ่งคือ 999 = 27 × 37 ยังมี 37 ที่มากกว่า"

[[wrong]]
answer = "111"
message = "111 = 3 × 37 ยังแยกต่อได้ จึงไม่ใช่จำนวนเฉพาะ"
