title = '''ไซน์จากด้าน'''
level = 1
type = "number"
statement = '''สามเหลี่ยมมุมฉากมีด้านตรงข้ามมุม A ยาว 3 ด้านประชิดยาว 4 ด้านตรงข้ามมุมฉากยาว 5 หา $\sin A$'''
solution = '''$\sin A=\text{ข้าม}/\text{ฉาก}=3/5$'''
answer = '''3/5'''
truth = '''Rational(3,5)'''
hints = ['''sin ใช้ด้านข้ามหารด้านฉาก''']

[[wrong]]
answer = '''3/4'''
message = '''3/4 คือ tan A ส่วน sin ต้องหารด้วยด้านตรงข้ามมุมฉาก'''
