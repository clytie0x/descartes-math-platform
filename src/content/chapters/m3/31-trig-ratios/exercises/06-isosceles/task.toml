title = '''มุมสี่สิบห้า'''
level = 2
type = "number"
statement = '''สามเหลี่ยมมุมฉากมีมุมแหลม $45^\circ$ และด้านประกอบมุมฉากด้านหนึ่งยาว 6 ด้านฉากยาวเท่าใด'''
solution = '''อีกด้านประกอบมุมฉากยาว 6 เช่นกัน พีทาโกรัสได้ $\sqrt{6^2+6^2}=6\sqrt2$'''
answer = '''6*sqrt(2)'''
truth = '''sqrt(6**2+6**2)'''
hints = ['''สามเหลี่ยมมุมฉากที่มีมุมแหลม 45 มีขาสองด้านเท่ากัน''']

