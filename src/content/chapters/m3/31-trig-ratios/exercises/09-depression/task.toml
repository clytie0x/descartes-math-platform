title = '''มุมก้มจากอาคาร'''
level = 3
type = "number"
statement = '''มองจากดาดฟ้าสูง 18 เมตรลงไปยังจุดบนพื้นด้วยมุมก้ม $30^\circ$ ระยะราบจากฐานอาคารถึงจุดนั้นเท่าใด'''
solution = '''มุมเงยที่พื้นเท่ากับมุมก้ม ได้ $\tan30^\circ=18/d$ จึง $d=18\sqrt3$ เมตร'''
answer = '''18*sqrt(3)'''
truth = '''simplify(18/tan(pi/6))'''
hints = ['''มุมก้มเท่ากับมุมเงยที่จุดบนพื้น ให้ระยะราบเป็นตัวส่วนของ tan''']

[[wrong]]
answer = '''6*sqrt(3)'''
message = '''จัดรูป d = 18 ÷ tan 30 ไม่ใช่คูณ tan 30'''
