title = '''บันไดพาดกำแพง'''
level = 3
type = "number"
statement = '''บันไดยาว 8 เมตร พาดกำแพงทำมุม $60^\circ$ กับพื้น ปลายล่างห่างกำแพงกี่เมตร'''
solution = '''บันไดเป็นด้านฉาก ระยะบนพื้นเป็นประชิด ได้ $d=8\cos60^\circ=4$ เมตร'''
answer = '''4'''
truth = '''8*cos(pi/3)'''
hints = ['''ระยะพื้นเป็นด้านประชิด และบันไดเป็นด้านฉาก''']

[[wrong]]
answer = '''4*sqrt(3)'''
message = '''4√3 คือความสูงที่ปลายบันไดถึง ไม่ใช่ระยะพื้น'''
