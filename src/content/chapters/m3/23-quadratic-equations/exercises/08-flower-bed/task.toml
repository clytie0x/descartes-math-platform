title = "แปลงดอกไม้หน้าเสาธง"
level = 2
type = "number"
label = 'ด้านกว้าง'
unit = "เมตร"
answer = "5"
truth = "max(roots(x*(x + 3) - 40))"
hints = ['ให้ด้านกว้างยาว $x$ เมตร ด้านยาวคือ $x + 3$ เมตร', 'ได้สมการ $x(x + 3) = 40$ จัดให้ข้างหนึ่งเป็นศูนย์แล้วแยกตัวประกอบ']
statement = '''
แปลงดอกไม้หน้าเสาธงของโรงเรียนเป็นรูปสี่เหลี่ยมผืนผ้า ด้านยาวยาวกว่าด้านกว้าง 3 เมตร และมีพื้นที่ 40 ตารางเมตร ด้านกว้างของแปลงยาวกี่เมตร
'''
solution = '''
1. ให้ด้านกว้าง $x$ เมตร ด้านยาว $x + 3$ เมตร
2. $x(x + 3) = 40$ ได้ $x^2 + 3x - 40 = 0$
3. $(x + 8)(x - 5) = 0$ ได้ $x = -8$ หรือ $x = 5$
4. ความยาวติดลบไม่ได้ ด้านกว้างยาว 5 เมตร ด้านยาว 8 เมตร ตรวจ $5 \times 8 = 40$
'''

[[wrong]]
answer = "8"
message = "8 เมตรคือด้านยาว ข้อนี้ถามด้านกว้าง ซึ่งสั้นกว่าด้านยาว 3 เมตร"

[[wrong]]
answer = "-8"
message = "x = −8 เป็นคำตอบของสมการ แต่ความยาวด้านติดลบไม่ได้ ต้องตัดทิ้ง"

[[wrong]]
answer = "37"
message = "ด้านกว้างคูณด้านยาวต้องได้ 40 ไม่ใช่ด้านกว้างบวก 3 ได้ 40 ลองตั้งสมการ x(x + 3) = 40"
