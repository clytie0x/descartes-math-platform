title = "อย่าหารด้วย x"
level = 1
type = "set"
label = '$x =$'
answer = ["0", "5"]
truth = "roots(2*x**2 - 10*x)"
accept = ["5, 0"]
reject = ["5"]
hints = ['ย้าย $10x$ ไปข้างซ้ายให้ข้างขวาเป็นศูนย์', 'ดึงตัวร่วม $2x$ ออก']
statement = '''
แก้สมการ $2x^2 = 10x$ ตอบทุกคำตอบ คั่นด้วยจุลภาค
'''
solution = '''
1. ย้ายข้าง $2x^2 - 10x = 0$
2. ดึงตัวร่วม $2x(x - 5) = 0$
3. $2x = 0$ ได้ $x = 0$ หรือ $x - 5 = 0$ ได้ $x = 5$

ถ้าหารทั้งสองข้างด้วย $2x$ จะได้แค่ $x = 5$ และคำตอบ $x = 0$ หายไป ตรวจ $x = 0$ ได้ $2(0)^2 = 10(0)$ เป็นจริง
'''

[[wrong]]
answer = ["5"]
message = "ขาดไปหนึ่งคำตอบ ลองแทน x = 0 ดู การหารด้วย x ทำให้คำตอบนี้หาย ให้ดึงตัวร่วม 2x แทน"

[[wrong]]
answer = ["0", "-5"]
message = "2x(x − 5) = 0 ได้ x − 5 = 0 คือ x = 5 ไม่ใช่ −5"
