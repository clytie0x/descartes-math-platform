title = "การ์ดอวยพรปีใหม่"
level = 2
type = "number"
unit = "คน"
answer = "30"
truth = "max(roots(x*(x - 1) - 870))"
hints = ['ถ้าห้องมี $n$ คน แต่ละคนเขียนการ์ดให้เพื่อนคนอื่นกี่ใบ', 'ได้สมการ $n(n - 1) = 870$ หาสองจำนวนที่คูณกันได้ $-870$ บวกกันได้ $-1$']
statement = '''
ก่อนปิดเทอม นักเรียนทุกคนในห้องหนึ่งเขียนการ์ดอวยพรปีใหม่ให้เพื่อนร่วมห้องทุกคนคนละหนึ่งใบ ไม่เขียนให้ตัวเอง นับการ์ดทั้งหมดได้ 870 ใบ ห้องนี้มีนักเรียนกี่คน
'''
solution = '''
1. ให้ห้องมีนักเรียน $n$ คน แต่ละคนเขียนการ์ดให้เพื่อน $n - 1$ ใบ
2. การ์ดทั้งหมด $n(n - 1) = 870$ ได้ $n^2 - n - 870 = 0$
3. $30 \times 29 = 870$ จึงแยกได้ $(n - 30)(n + 29) = 0$ ได้ $n = 30$ หรือ $n = -29$
4. จำนวนคนติดลบไม่ได้ ห้องนี้มีนักเรียน 30 คน
'''

[[wrong]]
answer = "29"
message = "29 คือจำนวนการ์ดที่แต่ละคนเขียน ถ้าห้องมี 29 คน จะได้การ์ด 29 × 28 = 812 ใบ"

[[wrong]]
