title = "ลูกบอลตกถึงพื้น"
level = 3
type = "number"
label = '$t \approx$'
unit = "วินาที"
answer = "(12+sqrt(174))/10"
truth = "max(roots(Rational(3, 2) + 12*t - 5*t**2))"
tolerance = 0.01
accept = ["2.52", "2.519"]
hints = ['ลูกบอลถึงพื้นเมื่อ $h = 0$ ได้ $5t^2 - 12t - 1.5 = 0$ คูณด้วย $2$ ให้หมดทศนิยม', 'ใช้สูตรกับ $10t^2 - 24t - 3 = 0$ แล้วเลือกคำตอบที่เป็นบวก']
statement = '''
โยนลูกบอลขึ้นจากมือที่ความสูง 1.5 เมตร ความสูงของลูกบอลเมื่อเวลาผ่านไป $t$ วินาทีคือ $h = 1.5 + 12t - 5t^2$ เมตร ลูกบอลตกถึงพื้นเมื่อเวลาผ่านไปกี่วินาที ตอบเป็นทศนิยมสองตำแหน่ง
'''
solution = '''
1. ถึงพื้นเมื่อ $h = 0$ ได้ $1.5 + 12t - 5t^2 = 0$ คูณด้วย $-2$ ได้ $10t^2 - 24t - 3 = 0$
2. $b^2 - 4ac = (-24)^2 - 4(10)(-3) = 576 + 120 = 696$
3. $t = \dfrac{24 \pm \sqrt{696}}{20}$ ได้ $t \approx \dfrac{24 + 26.38}{20} \approx 2.52$ หรือ $t \approx \dfrac{24 - 26.38}{20} \approx -0.12$
4. เวลาที่ติดลบคือก่อนโยน ใช้ไม่ได้ ลูกบอลตกถึงพื้นเมื่อเวลาผ่านไปประมาณ 2.52 วินาที
'''

