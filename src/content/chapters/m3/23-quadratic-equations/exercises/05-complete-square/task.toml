title = "เติมให้เป็นกำลังสองสมบูรณ์"
level = 2
type = "choice"
choices = ['$(x - 3)^2 = 11$', '$(x - 3)^2 = 2$', '$(x + 3)^2 = 11$', '$(x - 6)^2 = 38$']
answer = 0
checks = [
  "expand((x - 3)**2 - 11) == x**2 - 6*x - 2",
  "expand((x - 3)**2 - 2) != x**2 - 6*x - 2",
  "expand((x + 3)**2 - 11) != x**2 - 6*x - 2",
  "expand((x - 6)**2 - 38) != x**2 - 6*x - 2",
]
hints = ['ย้าย $-2$ ไปข้างขวาก่อน ได้ $x^2 - 6x = 2$', 'ครึ่งหนึ่งของ $-6$ คือ $-3$ ต้องเติม $9$ ทั้งสองข้าง']
statement = '''
ทำสมการ $x^2 - 6x - 2 = 0$ ให้อยู่ในรูป $(x + p)^2 = q$ จะได้สมการใด
'''
solution = '''
1. ย้ายค่าคงตัว $x^2 - 6x = 2$
2. ครึ่งหนึ่งของ $-6$ คือ $-3$ ยกกำลังสองได้ $9$ เติมทั้งสองข้าง $x^2 - 6x + 9 = 11$
3. ได้ $(x - 3)^2 = 11$ ต่อไปจะแก้ได้ $x = 3 \pm \sqrt{11}$
'''

[[wrong]]
answer = 1
message = "เติม 9 ข้างซ้ายแล้วต้องเติม 9 ข้างขวาด้วย ได้ 2 + 9 = 11"

[[wrong]]
answer = 2
message = "(x + 3)² กระจายได้ x² + 6x + 9 แต่โจทย์มี −6x ครึ่งหนึ่งของ −6 คือ −3"

[[wrong]]
answer = 3
message = "ต้องใช้ครึ่งหนึ่งของสัมประสิทธิ์ของ x คือ −3 ไม่ใช่ −6 ทั้งตัว"
