title = "มีคำตอบเดียว"
level = 3
type = "number"
label = '$k =$'
answer = "9"
truth = "solve((-6)**2 - 4*1*k, k)[0]"
hints = ['สมการมีคำตอบเดียวเมื่อ $b^2 - 4ac = 0$', 'ในที่นี้ $a = 1$ $b = -6$ $c = k$']
statement = '''
หาค่า $k$ ที่ทำให้สมการ $x^2 - 6x + k = 0$ มีคำตอบเพียงคำตอบเดียว
'''
solution = '''
1. มีคำตอบเดียวเมื่อ $b^2 - 4ac = 0$
2. $(-6)^2 - 4(1)(k) = 0$ ได้ $36 - 4k = 0$ จึงได้ $k = 9$
3. ตรวจ $x^2 - 6x + 9 = (x - 3)^2 = 0$ มีคำตอบเดียวคือ $x = 3$
'''

