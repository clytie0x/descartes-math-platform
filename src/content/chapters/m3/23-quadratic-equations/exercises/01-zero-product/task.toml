title = "ผลคูณเป็นศูนย์"
level = 1
type = "set"
label = '$x =$'
answer = ["-4", "1/2"]
truth = "roots((x + 4)*(2*x - 1))"
accept = ["1/2, -4", "-4, 0.5"]
reject = ["-4", "-4, 1/2, 0"]
hints = ['ผลคูณเป็นศูนย์ ตัวประกอบตัวใดตัวหนึ่งต้องเป็นศูนย์', 'แก้ $x + 4 = 0$ กับ $2x - 1 = 0$ ทีละสมการ']
statement = '''
แก้สมการ $(x + 4)(2x - 1) = 0$ ตอบทุกคำตอบ คั่นด้วยจุลภาค
'''
solution = '''
ผลคูณเป็นศูนย์ จึงได้ $x + 4 = 0$ หรือ $2x - 1 = 0$

- $x + 4 = 0$ ได้ $x = -4$
- $2x - 1 = 0$ ได้ $2x = 1$ จึงได้ $x = \tfrac{1}{2}$

คำตอบคือ $-4$ และ $\tfrac{1}{2}$
'''

[[wrong]]
answer = ["4", "-1/2"]
message = "x + 4 = 0 ต้องย้าย 4 ไปเป็น −4 ได้ x = −4 และ 2x − 1 = 0 ได้ x = ½ เครื่องหมายกลับกันทั้งคู่"

[[wrong]]
answer = ["-4", "1"]
message = "2x − 1 = 0 ได้ 2x = 1 ยังต้องหารด้วย 2 อีกครั้ง ได้ x = ½"
