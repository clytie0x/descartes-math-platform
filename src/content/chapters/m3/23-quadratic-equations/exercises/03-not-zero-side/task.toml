message = "ผลคูณเท่ากับ 14 ไม่ได้แปลว่าแต่ละวงเล็บเท่ากับ 14 ลองแทน x = 16 ได้ 14 × 19 ไม่ใช่ 14 ต้องย้ายข้างให้อีกข้างเป็นศูนย์ก่อน"

