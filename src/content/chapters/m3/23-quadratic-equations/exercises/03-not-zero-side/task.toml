title = "ผลคูณไม่เป็นศูนย์"
level = 2
type = "set"
label = '$x =$'
answer = ["-5", "4"]
truth = "roots((x - 2)*(x + 3) - 14)"
accept = ["4, -5"]
reject = ["4", "-5, 4, 2"]
hints = ['สมบัติผลคูณใช้ได้เมื่อผลคูณเท่ากับศูนย์เท่านั้น ต้องกระจายแล้วย้าย $14$ ไปข้างซ้ายก่อน', 'ได้ $x^2 + x - 20 = 0$ หาสองจำนวนที่คูณกันได้ $-20$ บวกกันได้ $1$']
statement = '''
แก้สมการ $(x - 2)(x + 3) = 14$ ตอบทุกคำตอบ คั่นด้วยจุลภาค
'''
solution = '''
1. กระจาย $x^2 + x - 6 = 14$
2. ย้ายข้าง $x^2 + x - 20 = 0$
3. แยกตัวประกอบ $(x + 5)(x - 4) = 0$ ได้ $x = -5$ หรือ $x = 4$

ตรวจ $x = 4$ ได้ $2 \times 7 = 14$ และ $x = -5$ ได้ $(-7)(-2) = 14$ ถูกทั้งคู่
'''

[[wrong]]
