title = "ถอดรากทั้งก้อน"
level = 2
type = "set"
label = '$x =$'
answer = ["-1+sqrt(7)", "-1-sqrt(7)"]
truth = "roots((x + 1)**2 - 7)"
accept = ["-1-sqrt(7), -1+sqrt(7)", "sqrt(7)-1, -sqrt(7)-1"]
reject = ["-1+sqrt(7)", "6, -8"]
hints = ['ถอดรากที่สองทั้งสองข้าง อย่าลืม $\pm$', '$x + 1 = \pm\sqrt{7}$ แล้วย้าย $1$ ไปอีกข้าง']
statement = '''
แก้สมการ $(x + 1)^2 = 7$ ตอบทุกคำตอบ คั่นด้วยจุลภาค

<p class="ex-tip">พิมพ์รากที่สองเป็น <kbd>sqrt(7)</kbd> เช่น <kbd>-1+sqrt(7)</kbd></p>
'''
solution = '''
1. ถอดรากที่สองทั้งสองข้าง $x + 1 = \pm\sqrt{7}$
2. ย้าย $1$ ไปข้างขวา $x = -1 + \sqrt{7}$ หรือ $x = -1 - \sqrt{7}$

ประมาณได้ $x \approx 1.65$ หรือ $x \approx -3.65$
'''

[[wrong]]
answer = ["1+sqrt(7)", "1-sqrt(7)"]
message = "x + 1 = ±√7 ย้าย 1 ไปอีกข้างเป็น −1 ได้ x = −1 ± √7"

[[wrong]]
answer = ["-1+sqrt(7)"]
message = "ขาดไปหนึ่งคำตอบ ถอดรากที่สองต้องได้ทั้ง +√7 และ −√7"

[[wrong]]
answer = ["6", "-8"]
message = "(x + 1)² = 7 ถอดรากได้ x + 1 = ±√7 ไม่ใช่ ±7 ลองแทน x = 6 ได้ 7² = 49 ไม่ใช่ 7"
