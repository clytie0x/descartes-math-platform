title = "ใช้สูตรสมการกำลังสอง"
level = 2
type = "set"
label = '$x =$'
answer = ["(-3+sqrt(17))/4", "(-3-sqrt(17))/4"]
truth = "roots(2*x**2 + 3*x - 1)"
accept = ["(-3-sqrt(17))/4, (-3+sqrt(17))/4", "-3/4+sqrt(17)/4, -3/4-sqrt(17)/4"]
reject = ["(-3+sqrt(17))/4"]
hints = ['จัดให้ข้างหนึ่งเป็นศูนย์ก่อน $2x^2 + 3x - 1 = 0$ แล้วเขียน $a$ $b$ $c$', '$b^2 - 4ac = 3^2 - 4(2)(-1)$ ระวังเครื่องหมายของ $c$']
statement = '''
แก้สมการ $2x^2 = 1 - 3x$ ตอบทุกคำตอบ คั่นด้วยจุลภาค

<p class="ex-tip">พิมพ์รากที่สองเป็น <kbd>sqrt(17)</kbd> และใส่วงเล็บตัวเศษ เช่น <kbd>(-3+sqrt(17))/4</kbd></p>
'''
solution = '''
1. จัดรูป $2x^2 + 3x - 1 = 0$ ได้ $a = 2$ $b = 3$ $c = -1$
2. $b^2 - 4ac = 9 - 4(2)(-1) = 9 + 8 = 17$
3. $x = \dfrac{-3 \pm \sqrt{17}}{2(2)} = \dfrac{-3 \pm \sqrt{17}}{4}$

ประมาณได้ $x \approx 0.28$ หรือ $x \approx -1.78$
'''

[[wrong]]
answer = ["(3+sqrt(17))/4", "(3-sqrt(17))/4"]
message = "สูตรขึ้นต้นด้วย −b เมื่อ b = 3 ตัวเศษจึงเป็น −3 ± √17"

[[wrong]]
answer = ["(-3+sqrt(17))/2", "(-3-sqrt(17))/2"]
message = "ตัวส่วนคือ 2a = 2 × 2 = 4 ไม่ใช่ 2"

[[wrong]]
answer = ["-1/2", "-1"]
message = "c = −1 ทำให้ −4ac = −4(2)(−1) = +8 ได้ b² − 4ac = 9 + 8 = 17 ไม่ใช่ 9 − 8 = 1"
