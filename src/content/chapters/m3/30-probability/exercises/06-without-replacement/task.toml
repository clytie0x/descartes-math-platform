title = '''หยิบไม่คืน'''
level = 2
type = "number"
statement = '''ถุงมีลูกบอลแดง 3 ขาว 2 หยิบสองลูกทีละลูกโดยไม่ใส่คืน ความน่าจะเป็นได้แดงทั้งคู่เท่าใด'''
solution = '''ครั้งแรกแดง $3/5$ ถัดมาเหลือแดง 2 จากทั้งหมด 4 จึง $(3/5)(2/4)=3/10$'''
answer = '''3/10'''
truth = '''Rational(3,5)*Rational(2,4)'''
hints = ['''หลังหยิบแดงครั้งแรก เหลือแดงกี่ลูกจากทั้งหมดกี่ลูก''']

[[wrong]]
answer = '''9/25'''
message = '''ไม่ใส่คืน จำนวนแดงและจำนวนทั้งหมดเปลี่ยนก่อนหยิบครั้งที่สอง'''
