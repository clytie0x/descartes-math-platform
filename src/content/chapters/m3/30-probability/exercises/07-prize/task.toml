title = '''บัตรจับรางวัล'''
level = 2
type = "number"
statement = '''ร้านค้ามีบัตร 40 ใบ มีรางวัล 6 ใบ สุ่มหนึ่งใบ ความน่าจะเป็นไม่ได้รางวัลเท่าใด'''
solution = '''ไม่มีรางวัล $40-6=34$ ใบ จึง $34/40=17/20$'''
