title = '''ทดลองกับทฤษฎี'''
level = 2
type = "self"
hints = ['''ความถี่สัมพัทธ์ใช้จำนวนหัวหารจำนวนครั้ง ส่วนค่าทฤษฎีมาจากแบบจำลอง''']
statement = '''โยนเหรียญเที่ยงตรง 100 ครั้งได้หัว 57 ครั้ง เขียนความถี่สัมพัทธ์ และอธิบายว่าพิสูจน์ว่าเหรียญไม่เที่ยงตรงได้หรือไม่'''
solution = '''ความถี่สัมพัทธ์ $57/100=0.57$ ต่างจากโอกาสเชิงทฤษฎี 0.5 อยู่ 0.07 การทดลองจำกัดครั้งแกว่งได้ จึงยังสรุปเด็ดขาดว่าเหรียญไม่เที่ยงตรงไม่ได้ ต้องมีหลักฐานเพิ่ม การโยนครั้งถัดไปยังมีโอกาสหัว 1/2'''
checks = ['''Rational(57,100)-Rational(1,2)==Rational(7,100)''']
