title = '''เกมกีฬาสี'''
level = 3
type = "number"
statement = '''เกมทอยลูกเต๋าให้ผู้เล่นชนะเมื่อได้แต้มมากกว่า 4 ผู้จัดชนะกรณีอื่น โอกาสผู้จัดชนะเท่าใด'''
solution = '''ผู้จัดชนะแต้ม 1,2,3,4 รวม 4 จาก 6 จึง $2/3$ โอกาสทั้งสองฝ่ายไม่เท่ากัน'''
answer = '''2/3'''
truth = '''Rational(4,6)'''
hints = ['''ผู้จัดชนะกี่แต้มจากหกแต้มที่มีโอกาสเท่ากัน''']

