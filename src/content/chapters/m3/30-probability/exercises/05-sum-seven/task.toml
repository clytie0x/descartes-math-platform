title = '''ผลรวมเจ็ด'''
level = 2
type = "number"
statement = '''ทอยลูกเต๋าเที่ยงตรงสองลูก ความน่าจะเป็นที่ผลรวมเป็น 7 เท่าใด'''
solution = '''มี 36 คู่อันดับ คู่ที่เข้าเงื่อนไข (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) รวม 6 จึง $1/6$'''
answer = '''1/6'''
truth = '''Rational(sum(1 for a in range(1,7) for b in range(1,7) if a+b==7),36)'''
hints = ['''เขียนคู่อันดับของแต้มลูกแรกกับลูกที่สองที่รวมได้ 7''']

[[wrong]]
answer = '''1/11'''
message = '''ผลรวม 2 ถึง 12 ไม่ได้มีโอกาสเท่ากัน ต้องนับคู่อันดับ'''
