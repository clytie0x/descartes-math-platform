title = '''ผิวพีระมิด'''
level = 2
type = "number"
statement = '''พีระมิดตรงฐานจัตุรัสด้าน 10 สูงตั้งฉาก 12 มีพื้นที่ผิวทั้งหมดเท่าใด'''
solution = '''สูงเอียงหน้าสามเหลี่ยม $\sqrt{12^2+5^2}=13$ ผิวข้าง $4(10)(13)/2=260$ รวมฐาน 100 ได้ 360'''
answer = '''360'''
truth = '''4*Rational(1,2)*10*sqrt(12**2+5**2)+100'''
hints = ['''สูงเอียงของหน้าสามเหลี่ยมใช้ครึ่งด้านฐานกับสูงตั้งฉาก''']

[[wrong]]
answer = '''340'''
message = '''พื้นที่หน้าสามเหลี่ยมต้องใช้สูงเอียง 13 ไม่ใช่สูงตั้งฉาก 12'''
