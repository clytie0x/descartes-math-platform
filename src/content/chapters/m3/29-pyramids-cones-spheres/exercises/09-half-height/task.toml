title = '''น้ำครึ่งความสูง'''
level = 3
type = "number"
statement = '''กรวยหงายให้ยอดอยู่ล่าง สูง 12 รัศมีปาก 6 มีน้ำลึก 6 ปริมาตรน้ำกี่เท่าของ $\pi$'''
solution = '''น้ำเป็นกรวยคล้ายอัตราส่วนความยาว $1/2$ รัศมีน้ำ 3 จึง $V=\frac13\pi(3^2)(6)=18\pi$'''
answer = '''18'''
truth = '''Rational(1,3)*3**2*6'''
hints = ['''รัศมีผิวน้ำเป็นครึ่งของรัศมีปากกรวยด้วย''']

