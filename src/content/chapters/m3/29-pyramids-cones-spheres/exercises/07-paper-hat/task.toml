title = '''หมวกกระดาษ'''
level = 2
type = "number"
statement = '''ทำหมวกกรวยไม่มีฐาน รัศมี 7 สูงเอียง 10 เซนติเมตร ใช้ $\pi=22/7$ ต้องใช้กระดาษอย่างน้อยกี่ตารางเซนติเมตร ไม่นับส่วนซ้อน'''
solution = '''ใช้เฉพาะผิวข้าง $\pi rl=(22/7)(7)(10)=220$'''
answer = '''220'''
truth = '''Rational(22,7)*7*10'''
hints = ['''หมวกเปิดฐานจึงใช้เฉพาะผิวข้าง''']

