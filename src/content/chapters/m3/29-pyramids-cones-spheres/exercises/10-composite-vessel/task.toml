title = '''ออกแบบภาชนะ'''
level = 2
type = "self"
hints = ['''รวมปริมาตรทรงกระบอกกับครึ่งทรงกลม และระบุว่าขนาดภายใน''']
statement = '''ภาชนะประกอบด้วยทรงกระบอกรัศมี 3 สูง 8 และครึ่งทรงกลมรัศมี 3 ติดเป็นก้น จงหาปริมาตรภายในในรูป $\pi$ และบอกสมมติฐาน'''
solution = '''ถือว่าความยาวเป็นขนาดภายในและผนังบาง ปริมาตรทรงกระบอก $72\pi$ ครึ่งทรงกลม $18\pi$ รวม $90\pi$ บวกเฉพาะปริมาตรส่วนที่ไม่ซ้อนกัน ไม่หักวงกลมรอยต่อออกเพราะวงกลมมีพื้นที่แต่ไม่มีปริมาตร'''
checks = ['''3**2*8+Rational(2,3)*3**3==90''']
