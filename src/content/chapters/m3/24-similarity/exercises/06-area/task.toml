title = '''พื้นที่รูปคล้าย'''
level = 2
type = "number"
statement = '''รูปเล็กพื้นที่ 20 ตารางเซนติเมตร ขยายความยาวทุกด้านเป็น 3 เท่า พื้นที่ใหม่เท่าใด'''
solution = '''พื้นที่คูณ $3^2=9$ ได้ $20(9)=180$'''
hints = ['''เมื่อทั้งกว้างและยาวเพิ่ม 3 เท่า พื้นที่เปลี่ยนด้วยตัวคูณใด''']
answer = '''180'''
truth = '''20*3**2'''

[[wrong]]
answer = '''60'''
message = '''ความกว้างและความยาวต่างคูณ 3 พื้นที่จึงคูณ 9'''
