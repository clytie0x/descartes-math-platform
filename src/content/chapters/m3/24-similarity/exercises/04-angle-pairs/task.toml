title = '''มุมสองคู่'''
level = 2
type = "choice"
statement = '''สามเหลี่ยมแรกมีมุม $40^\circ,70^\circ$ รูปที่สองมีมุม $70^\circ,70^\circ$ ข้อใดถูก'''
solution = '''รูปแรกมีมุมที่สาม $180-40-70=70$ รูปที่สองมีมุมที่สาม $40^\circ$ จับคู่ได้ครบ'''
hints = ['''หามุมที่สามด้วยผลบวกมุมสามเหลี่ยมก่อน''']
answer = 0
choices = ['''คล้ายกัน เพราะมุมที่สามของรูปแรกเป็น 70 องศา''', '''ไม่คล้าย เพราะมุมสองคู่ที่ให้ไม่เหมือนกัน''', '''ต้องรู้ด้านก่อนเสมอ''']
checks = ['''180-40-70==70''', '''180-70-70==40''']

