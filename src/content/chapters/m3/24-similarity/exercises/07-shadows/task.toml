title = '''วัดด้วยเงา'''
level = 2
type = "number"
statement = '''เวลาเดียวกันบนพื้นราบ ไม้ตั้งตรงสูง 1.5 เมตรมีเงายาว 2 เมตร ต้นไม้เงายาว 12 เมตร ต้นไม้สูงกี่เมตร'''
solution = '''แสงแดดทำมุมเท่ากันและทั้งคู่ตั้งฉากพื้น จึงได้สามเหลี่ยมคล้าย $h/12=1.5/2$ ได้ $h=9$ เมตร'''
hints = ['''ตั้งอัตราส่วนความสูงต่อเงาให้เหมือนกันทั้งสองต้น''']
answer = '''9'''
truth = '''12*Rational(15,10)/2'''

