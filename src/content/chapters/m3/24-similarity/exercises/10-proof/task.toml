title = '''อธิบายการจับคู่'''
level = 3
type = "self"
statement = '''สามเหลี่ยม ABC มีด้าน 3,4,5 และ DEF มีด้าน 6,8,10 ตามลำดับ เขียนเหตุผลว่าคล้ายและหาอัตราส่วนพื้นที่รูปใหญ่ต่อรูปเล็ก'''
solution = '''ตรวจอัตราส่วน $6/3=8/4=10/5=2$ ทั้งสามคู่ จึงคล้ายตามเกณฑ์ด้านสามคู่ อัตราส่วนพื้นที่ $2^2=4$ ต้องระบุว่าใหญ่ต่อเล็ก'''
hints = ['''ตรวจอัตราส่วนด้านสามคู่ แล้วใช้กำลังสองของตัวคูณกับพื้นที่''']
checks = ['''Rational(6,3)==Rational(8,4)==Rational(10,5)==2''', '''2**2==4''']
