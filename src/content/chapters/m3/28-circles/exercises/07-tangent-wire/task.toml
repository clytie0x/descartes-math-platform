statement = '''หน้าตัดถังน้ำเป็นวงกลมรัศมี 3 เมตร จุด P อยู่ห่างศูนย์กลาง 5 เมตร ขึงลวดตรงจาก P ให้สัมผัสถังที่ T ลวดยาวกี่เมตร'''
