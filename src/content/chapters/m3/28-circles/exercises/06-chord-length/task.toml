title = '''คอร์ดกับระยะตั้งฉาก'''
level = 2
type = "number"
statement = '''วงกลมรัศมี 13 คอร์ดอยู่ห่างศูนย์กลาง 5 จงหาความยาวคอร์ด'''
solution = '''เส้นจากศูนย์กลางตั้งฉากคอร์ดแบ่งคอร์ดครึ่งหนึ่ง ครึ่งคอร์ด $\sqrt{13^2-5^2}=12$ จึงคอร์ดยาว 24'''
answer = '''24'''
truth = '''2*sqrt(13**2-5**2)'''
hints = ['''เส้นตั้งฉากจากศูนย์กลางแบ่งคอร์ดครึ่งหนึ่ง''']

