title = "นิเสธของ และ"
level = 2
type = "choice"
statement = "นิเสธของ ร้านนี้มีชานมและมีขนมปังปิ้ง คือข้อใด"
solution = '''ให้ $p$ แทน มีชานม และ $q$ แทน มีขนมปังปิ้ง ประโยคเดิมคือ $p\wedge q$ ใช้กฎของเดอมอร์แกน $\sim(p\wedge q)\equiv\sim p\vee\sim q$ เปลี่ยน และ เป็น หรือ แล้วปฏิเสธทั้งสองท่อน ได้ ร้านนี้ไม่มีชานม หรือไม่มีขนมปังปิ้ง คือขาดอย่างน้อยหนึ่งอย่าง ส่วนตัวเลือก ไม่มีทั้งสองอย่าง คือ $\sim p\wedge\sim q$ ลองกรณีที่ร้านมีชานมแต่ไม่มีขนมปังปิ้ง ประโยคเดิมเท็จ นิเสธจึงต้องจริง แต่ $\sim p\wedge\sim q=F\wedge T=F$ จึงไม่ใช่นิเสธ'''
choices = ["ร้านนี้ไม่มีชานมและไม่มีขนมปังปิ้ง", "ร้านนี้ไม่มีชานมหรือไม่มีขนมปังปิ้ง", "ร้านนี้มีชานมหรือมีขนมปังปิ้ง"]
checks = ["all(Not(And(p,q))==Or(Not(p),Not(q)) for p in [true,false] for q in [true,false])", "And(true,false)==false and And(Not(true),Not(false))==false"]
answer = 1
track = "adv"
hints = ["นิเสธต้องจริงพอดีในกรณีที่ประโยคเดิมเท็จ", "กฎของเดอมอร์แกน เปลี่ยน และ เป็น หรือ แล้วปฏิเสธทุกท่อน"]

