statement = "ให้ $p=T$ และ $q=F$ รูปแบบใดเป็นจริง"
solution = '''ตรวจทีละตัวเลือก $p\vee q$ ขอแค่อย่างน้อยหนึ่งตัวจริง $p$ จริงแล้วจึงได้ $T\vee F=T$ ส่วน $p\wedge q$ ต้องจริงทั้งคู่ แต่ $q$ เท็จ จึงได้ $T\wedge F=F$ และ $\sim p$ กลับค่าของ $p$ ที่จริง จึงได้ $F$ ข้อที่จริงคือ $p\vee q$'''
choices = ['''$p\vee q$''', '''$p\wedge q$''', '''$\sim p$''']
