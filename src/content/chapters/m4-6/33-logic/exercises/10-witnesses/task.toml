title = "นับพยาน"
level = 2
type = "number"
statement = '''เมื่อ $U=\{-2,-1,0,1,2,3\}$ มีค่า $x$ ที่ทำให้ $x^2<4$ กี่ค่า'''
solution = '''$U$ มีหกตัว ยกกำลังสองทีละตัว $-2,-1,0,1,2,3$ ได้ $4,1,0,1,4,9$ เงื่อนไขคือน้อยกว่า $4$ อย่างเดียว ไม่รวมเท่ากับ ค่าที่ผ่านคือ $-1,0,1$ ส่วน $\pm2$ ให้เท่ากับ $4$ และ $3$ ให้ $9$ จึงไม่ผ่าน ได้ $3$ ค่า'''
answer = "3"
truth = "len([v for v in [-2,-1,0,1,2,3] if v*v<4])"
track = "adv"
hints = ["ยกกำลังสองสมาชิกใน U ทีละตัว", "เครื่องหมายน้อยกว่าไม่รวมค่าที่กำลังสองเท่ากับสี่"]

[[wrong]]
answer = "5"
message = "อสมการใช้เครื่องหมายน้อยกว่า จึงไม่รวมค่าที่กำลังสองเท่ากับสี่"
