title = "ตรวจเหตุผลเรื่องรถ"
level = 2
type = "self"
statement = "ถ้ารถติดแล้วต้นจะมาสาย วันนี้ต้นมาสาย จึงสรุปว่ารถติด จงอธิบายว่าข้ออ้างนี้สมเหตุสมผลหรือไม่ พร้อมกรณีค้าน"
solution = "ไม่สมเหตุสมผล ให้รถไม่ติดแต่ต้นมาสายเพราะตื่นสาย เหตุ ถ้ารถติดแล้วมาสาย ยังจริง และมาสายจริง แต่ข้อสรุปรถติดเท็จ เกณฑ์ตรวจคือระบุเหตุจริงครบและผลเท็จชัดเจน"
checks = ["Implies(false,true)==true"]
hints = ["ลองให้รถไม่ติดแต่ต้นยังมาสายเพราะสาเหตุอื่น", "ตรวจว่าเหตุทั้งสองยังจริงแต่ผลรถติดเท็จได้หรือไม่"]
