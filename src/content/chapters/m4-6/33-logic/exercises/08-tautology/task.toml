solution = '''สัจนิรันดร์ต้องจริงทุกแถว แทน $p=T$ ใน $p\vee\sim p$ ได้ $T\vee F=T$ แทน $p=F$ ได้ $F\vee T=T$ จริงทั้งสองแถว จึงเป็นสัจนิรันดร์ ส่วน $p\wedge\sim p$ ได้ $T\wedge F$ กับ $F\wedge T$ เท็จทุกแถว และ $p\to q$ เท็จในแถว $p=T$ $q=F$ จึงไม่เป็นสัจนิรันดร์'''
