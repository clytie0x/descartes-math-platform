title = "ลูกศรที่เป็นเท็จ"
level = 1
type = "choice"
statement = '''ถ้า $p\to q$ เป็นเท็จ คู่ค่าความจริงของ $p,q$ คือข้อใด'''
solution = '''ลูกศรเปรียบเหมือนคำสัญญา ถ้า $p$ แล้ว $q$ ผิดสัญญาได้กรณีเดียว คือเงื่อนไข $p$ เกิดขึ้นจริงแต่ $q$ ไม่เกิด ไล่ทั้งสี่คู่ คู่ T,T ทำตามสัญญา คู่ F,T และ F,F เงื่อนไขไม่เกิดจึงไม่ผิดสัญญา เหลือคู่ $p=T$ $q=F$ เพียงคู่เดียวที่ทำให้ $p\to q$ เท็จ'''
choices = ["T,T", "T,F", "F,T", "F,F"]
checks = ["Implies(true,false)==false"]
answer = 1
hints = ["ลูกศรผิดเพียงกรณีที่เหตุจริงแต่ผลเท็จ"]

[[wrong]]
answer = 0
message = "เมื่อผลจริง ลูกศรจริง ไม่ว่าเหตุจะจริงหรือเท็จ"
