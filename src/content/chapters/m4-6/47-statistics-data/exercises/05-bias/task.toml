title = "วิจารณ์วิธีเก็บ"
level = 1
type = "self"
hints = ['พิจารณากลุ่มที่ไม่มีโอกาสถูกเลือกเข้าในการสำรวจ']
statement = '''
สำรวจความเห็นเรื่องรถโรงเรียนจากผู้ที่ขึ้นรถโรงเรียนเท่านั้น แล้วสรุปว่านักเรียนทั้งโรงเรียนพอใจ จงระบุปัญหา
'''
solution = '''
**กรอบตัวอย่างไม่ครอบคลุมประชากร** ประชากรคือนักเรียนทั้งโรงเรียน แต่ถามเฉพาะคนที่ขึ้นรถโรงเรียน นักเรียนที่ไม่ใช้รถไม่มีโอกาสถูกถามเลย

**กลุ่มที่ถูกตัดออกอาจต่างอย่างเป็นระบบ** บางคนเลิกใช้รถเพราะไม่พอใจ เช่นรถมาสายหรือแพง คนกลุ่มนี้หายไปจากข้อมูล ผลจึงเอียงไปทางพอใจ และเพิ่มจำนวนผู้ตอบจากบนรถเท่าไรก็ไม่แก้

**วิธีแก้** ใช้รายชื่อนักเรียนทั้งโรงเรียนเป็นกรอบตัวอย่าง แล้วสุ่มอย่างง่ายหรือแบบชั้นภูมิ (เช่นแบ่งชั้นเป็นผู้ใช้รถกับผู้ไม่ใช้รถ) และถามคำถามที่ใช้ได้กับทั้งสองกลุ่ม
'''
