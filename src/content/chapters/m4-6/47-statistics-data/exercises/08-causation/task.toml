title = "ความสัมพันธ์และเหตุผล"
level = 3
type = "self"
hints = ['มองหาความแตกต่างเดิมระหว่างผู้เลือกเข้าชมรมกับผู้ไม่เข้า']
statement = '''
พบผู้เข้าชมรมวิทยาศาสตร์คะแนนสูงกว่าผู้ไม่เข้า อธิบายว่าทำไมจึงยังสรุปเหตุและผลไม่ได้
'''
solution = '''
ข้อมูลชุดนี้เป็นข้อมูลจากการสังเกต นักเรียน**เลือกเอง**ว่าจะเข้าชมรมหรือไม่ ไม่ได้ถูกสุ่มจัดกลุ่ม

คนที่เลือกเข้าชมรมวิทยาศาสตร์อาจชอบเรียนวิทยาศาสตร์อยู่แล้ว มีพื้นฐานดีกว่า หรือมีเวลาทบทวนมากกว่าตั้งแต่ก่อนเข้าชมรม สิ่งเหล่านี้เป็นตัวแปรแทรกซ้อนที่ทำให้คะแนนสูงได้แม้ชมรมไม่มีผลอะไรเลย

ข้อมูลจึงบอกได้แค่ว่ามีความสัมพันธ์ ถ้าจะตอบเรื่องเหตุและผล ต้องออกแบบใหม่ เช่นสุ่มนักเรียนที่สนใจเข้าร่วมกิจกรรมของชมรม แล้ววัดคะแนนก่อนและหลังเทียบกับกลุ่มที่ไม่ได้ร่วม
'''
