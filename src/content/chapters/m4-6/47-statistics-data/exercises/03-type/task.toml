choices = ['''เลขประจำตัว''', '''จำนวนหนังสือ''', '''เวลาเดินทาง''']
answer = 2
hints = ['พิจารณาว่าข้อมูลเกิดจากการนับหรือการวัด']
statement = '''
ข้อใดเป็นข้อมูลเชิงปริมาณต่อเนื่อง
'''
solution = '''
ดูทีละตัวเลือกว่าข้อมูลเป็นรหัส เกิดจากการนับ หรือเกิดจากการวัด

- เลขประจำตัวเป็นรหัสแยกตัวคน บวกหรือเฉลี่ยแล้วไม่มีความหมาย จึงเป็นข้อมูลเชิงคุณภาพ
- จำนวนหนังสือได้จากการนับ ค่าเป็น $0, 1, 2, \ldots$ ไม่มีค่าระหว่างกลาง จึงเป็นเชิงปริมาณไม่ต่อเนื่อง
- เวลาเดินทางได้จากการวัด ค่าระหว่างกลางเกิดได้ทั้งหมด เช่น $12.5$ นาที จึงเป็นเชิงปริมาณต่อเนื่อง

คำตอบคือเวลาเดินทาง
'''

[[wrong]]
answer = 1
