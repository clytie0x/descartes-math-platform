title = "ข้อมูลโรงอาหาร"
level = 2
type = "number"
answer = "10"
truth = '''Rational(5,50)*100'''
hints = ['หารจำนวนผู้ไม่ตอบด้วยจำนวนที่ต้องเก็บทั้งหมด']
statement = '''
เก็บค่าอาหารจาก $50$ คน มีข้อมูลถูกต้อง $45$ คน อีก $5$ คนไม่ตอบ ร้อยละข้อมูลขาดหายเท่าไร
'''
solution = '''
ข้อมูลขาดหายคือคนที่ต้องเก็บแต่ไม่ได้ค่ามา ตัวหารจึงเป็นจำนวนที่ต้องเก็บทั้งหมด $50$ คน

ร้อยละข้อมูลขาดหาย $= \dfrac{5}{50} \times 100 = 10\%$

ห้ามบันทึกผู้ไม่ตอบเป็น $0$ บาท เพราะจะกลายเป็นข้อมูลว่าใช้จ่ายศูนย์บาท ทั้งที่ผู้ไม่ตอบไม่ได้ให้ค่าใช้จ่ายเป็นศูนย์ การเติมศูนย์อาจดึงค่าเฉลี่ยลงโดยไม่มีข้อมูลรองรับ หากรายงานค่าเฉลี่ยจาก $45$ คนที่ตอบ ต้องระบุว่าค่านี้สรุปเฉพาะผู้ตอบ และรายงานว่าขาดหาย $10\%$ โดยยังไม่สรุปแทนทั้งกลุ่มจนกว่าจะพิจารณาสาเหตุการไม่ตอบ
'''

[[wrong]]
answer = "0"
message = "ไม่ตอบต้องบันทึกเป็นข้อมูลขาดหาย ไม่แทนด้วยศูนย์"
