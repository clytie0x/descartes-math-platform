title = "สัดส่วนตัวอย่าง"
level = 1
type = "number"
answer = "0.35"
truth = '''Rational(28,80)'''
hints = ['หารจำนวนผู้ใช้รถด้วยขนาดตัวอย่าง']
statement = '''
สุ่ม $80$ คน พบใช้รถรับส่ง $28$ คน สัดส่วนตัวอย่างเท่าไร
'''
solution = '''
ตัวหารของสัดส่วนตัวอย่างคือขนาดตัวอย่าง เพราะเรารู้คำตอบเฉพาะคนที่สุ่มได้ $80$ คน

สัดส่วนตัวอย่าง $= \dfrac{28}{80} = \dfrac{7}{20} = 0.35$

ค่านี้เป็นค่าสถิติ ใช้ประมาณสัดส่วนของประชากรได้ แต่ไม่ใช่สัดส่วนของประชากรที่รู้แน่นอน
'''

[[wrong]]
answer = "0.28"
message = "ต้องหารด้วยขนาดตัวอย่างแปดสิบ ไม่ใช่หนึ่งร้อย"
