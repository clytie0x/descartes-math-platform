title = "ตัวอย่างแต่ละชั้น"
level = 2
type = "number"
answer = "40"
truth = '''Rational(400,1000)*100'''
hints = ['แบ่งตัวอย่างตามสัดส่วนของแต่ละชั้นต่อทั้งหมด']
statement = '''
โรงเรียนมีนักเรียนสองชั้น $400$ กับ $600$ คน ต้องการสุ่ม $100$ คนตามสัดส่วน ชั้นแรกควรมีกี่คน
'''
solution = '''
แบ่งตามสัดส่วนคือให้แต่ละชั้นได้ตัวอย่างเป็นสัดส่วนเดียวกับขนาดชั้นในประชากร

จำนวนทั้งหมด $400 + 600 = 1000$ คน ชั้นแรกมีสัดส่วน $\dfrac{400}{1000} = 0.4$

ชั้นแรกได้ $100 \times 0.4 = 40$ คน และชั้นที่สองได้ $100 \times 0.6 = 60$ คน ตรวจผลรวม $40 + 60 = 100$ ครบตามที่ต้องการ
'''

[[wrong]]
answer = "50"
message = "จำนวนแต่ละชั้นไม่เท่ากัน การจัดเท่ากันไม่ใช่ตามสัดส่วน"
