title = "สุ่มแบบมีระบบ"
level = 2
type = "number"
label = 'เลขที่'
answer = "133"
truth = '''7 + Rational(360, 40)*(15 - 1)'''
hints = ['หาช่วงห่าง $k = \dfrac{N}{n}$ ก่อน', 'คนแรกคือเลข $7$ คนที่สองคือ $7 + k$ คนที่ $m$ จึงเป็น $7 + k(m - 1)$']
statement = '''
รายชื่อนักเรียนชุมนุมกีฬามี $360$ คน เรียงตามเลขที่ $1$ ถึง $360$ ต้องการตัวอย่าง $40$ คนด้วยการสุ่มแบบมีระบบ จับฉลากได้จุดเริ่มต้นเป็นเลขที่ $7$ คนที่ $15$ ที่ถูกเลือกคือเลขที่เท่าไร
'''
solution = '''
ช่วงห่าง $k = \dfrac{360}{40} = 9$ จุดเริ่มต้น $7$ อยู่ระหว่าง $1$ ถึง $9$ จึงใช้ได้

คนที่ถูกเลือกคือ $7$ $16$ $25$ ไปเรื่อยๆ คนที่ $m$ อยู่ห่างจากคนแรก $m - 1$ ช่วง จึงเป็นเลขที่ $7 + 9(m - 1)$

คนที่ $15$ คือ $7 + 9 \times 14 = 7 + 126 = 133$

ตรวจว่าได้ครบ $40$ คน คนสุดท้ายคือ $7 + 9 \times 39 = 358$ ไม่เกิน $360$
'''

