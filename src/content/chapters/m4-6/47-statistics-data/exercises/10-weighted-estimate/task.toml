title = "รวมผลจากชั้นภูมิที่สุ่มเท่ากัน"
level = 3
type = "number"
unit = "%"
answer = "34"
truth = '''(300*Rational(5, 25) + 200*Rational(8, 25) + 100*Rational(20, 25)) / 600 * 100'''
hints = ['แต่ละชั้นมีนักเรียนไม่เท่ากัน แต่สุ่มมาชั้นละ $25$ คนเท่ากัน จึงรวมตัวอย่างดิบๆ ไม่ได้', 'ประมาณจำนวนผู้เรียนพิเศษในแต่ละชั้นก่อน ด้วยสัดส่วนในตัวอย่างคูณจำนวนนักเรียนของชั้นนั้น']
statement = '''
โรงเรียนมีนักเรียน ม.4 $300$ คน ม.5 $200$ คน และ ม.6 $100$ คน สุ่มมาชั้นละ $25$ คนเท่ากัน ถามว่าเรียนพิเศษวันเสาร์หรือไม่ พบผู้เรียนพิเศษ $5$ คน $8$ คน และ $20$ คนตามลำดับ

ประมาณร้อยละของนักเรียน ม.4 ถึง ม.6 ทั้งหมดที่เรียนพิเศษวันเสาร์
'''
solution = '''
สัดส่วนในตัวอย่างของแต่ละชั้นคือ $\dfrac{5}{25} = 0.2$ $\dfrac{8}{25} = 0.32$ และ $\dfrac{20}{25} = 0.8$

ประมาณจำนวนผู้เรียนพิเศษในแต่ละชั้น
- ม.4 $0.2 \times 300 = 60$ คน
- ม.5 $0.32 \times 200 = 64$ คน
- ม.6 $0.8 \times 100 = 80$ คน

รวมประมาณ $60 + 64 + 80 = 204$ คน จากนักเรียนทั้งหมด $600$ คน คิดเป็น $\dfrac{204}{600} \times 100 = 34\%$

ถ้ารวมตัวอย่างดิบๆ จะได้ $\dfrac{5 + 8 + 20}{75} \times 100 = 44\%$ ซึ่งสูงเกินไป เพราะ ม.6 มีนักเรียนแค่ $100$ คน แต่ได้น้ำหนักในตัวอย่างเท่ากับ ม.4 ที่มี $300$ คน และ ม.6 เป็นชั้นที่เรียนพิเศษมากที่สุด
'''

[[wrong]]
answer = "44"
message = "44% มาจากการรวมตัวอย่างทั้ง 75 คนโดยไม่ถ่วงน้ำหนัก แต่ละชั้นมีนักเรียนไม่เท่ากัน ต้องประมาณจำนวนในแต่ละชั้นก่อนแล้วจึงรวม"

