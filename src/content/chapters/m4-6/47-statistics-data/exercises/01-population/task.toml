'''
solution = '''
คำถามต้องการรู้เวลานอนของ**นักเรียน ม.6 ทั้งโรงเรียน** ประชากรจึงต้องเป็นทุกคนในกลุ่มนี้ ไม่ว่าเราจะเก็บข้อมูลได้ครบหรือไม่

ผู้ตอบแบบสอบถามเป็นเพียงส่วนที่เก็บข้อมูลได้จริง จึงเป็นตัวอย่าง ส่วนนักเรียนห้องผู้สำรวจเป็นแค่ส่วนหนึ่งของ ม.6 ถ้าใช้เป็นประชากรก็เท่ากับเปลี่ยนคำถามเป็นเรื่องของห้องเดียว

คำตอบคือนักเรียน ม.6 ทั้งโรงเรียน
'''

