title = "ประชากร"
level = 1
type = "choice"
choices = ['''ผู้ตอบแบบสอบถาม''', '''นักเรียน ม.6 ทั้งโรงเรียน''', '''นักเรียนเฉพาะห้องผู้สำรวจ''']
answer = 1
hints = ['ประชากรต้องครอบคลุมทุกหน่วยที่คำถามต้องการรู้']
statement = '''
ต้องการรู้เวลานอนของนักเรียน ม.6 ทั้งโรงเรียน ประชากรคือใคร
'''
solution = '''
คำถามต้องการรู้เวลานอนของ**นักเรียน ม.6 ทั้งโรงเรียน** ประชากรจึงต้องเป็นทุกคนในกลุ่มนี้ ไม่ว่าเราจะเก็บข้อมูลได้ครบหรือไม่

ผู้ตอบแบบสอบถามคือกลุ่มที่เก็บข้อมูลได้จริง ถ้าเก็บได้เพียงบางส่วนของนักเรียน ม.6 กลุ่มนั้นจึงเป็นตัวอย่าง แต่ถ้าตอบครบทุกคนก็เป็นการเก็บข้อมูลทั้งประชากร คำว่าผู้ตอบเพียงอย่างเดียวจึงไม่ได้ระบุประชากรเป้าหมาย ส่วนนักเรียนห้องผู้สำรวจเป็นแค่ส่วนหนึ่งของ ม.6 ถ้าใช้เป็นประชากรก็เท่ากับเปลี่ยนคำถามเป็นเรื่องของห้องเดียว

คำตอบคือนักเรียน ม.6 ทั้งโรงเรียน
'''

[[wrong]]
answer = 0
message = "ประชากรเป้าหมายกำหนดจากคำถาม คือ ม.6 ทั้งโรงเรียน ผู้ตอบอาจมีเพียงบางส่วนหรือครบทุกคนก็ได้ จึงต้องระบุกลุ่มเป้าหมายให้ชัด"
