title = "อัตราตอบกลับ"
level = 2
type = "number"
answer = "80"
truth = '''Rational(200,250)*100'''
hints = ['ใช้จำนวนชุดที่ได้คืนหารจำนวนที่แจก']
statement = '''
แจกแบบสอบถาม $250$ ชุด ได้คืน $200$ ชุด อัตราตอบกลับร้อยละเท่าไร
'''
solution = '''
อัตราตอบกลับใช้จำนวนชุดที่ได้คืนเป็นตัวเศษ และจำนวนชุดที่แจกเป็นตัวหาร

อัตราตอบกลับ $= \dfrac{200}{250} \times 100 = 80\%$

อีก $20\%$ คือผู้ไม่ตอบ ควรรายงานคู่กันเพื่อให้ผู้อ่านรู้ว่าผลอาจเอียงถ้าผู้ไม่ตอบต่างจากผู้ตอบ
'''

