type = "number"
statement = "หา $81^{3/4}$"
solution = '''ตัวส่วน $4$ บอกให้ถอดรากที่สี่ ตัวเศษ $3$ บอกให้ยกกำลังสาม ถอดรากก่อนตัวเลขจะเล็ก $\sqrt[4]{81}=3$ เพราะ $3^4=81$ แล้วยกกำลังสาม $3^3=27$ จึงได้ $81^{3/4}=27$'''
answer = "27"
truth = "81**Rational(3,4)"
hints = ["หารากที่สี่ของแปดสิบเอ็ดก่อน แล้วยกกำลังสาม"]

