title = "ลดราคาต่อเนื่อง"
level = 2
type = "number"
statement = "กระเป๋าราคา $800$ บาท ลดสองครั้ง ครั้งละ $25$ เปอร์เซ็นต์ หลังลดเหลือเท่าไร"
solution = '''ลด $25$ เปอร์เซ็นต์คือเหลือ $75$ เปอร์เซ็นต์ของราคาก่อนลดรอบนั้น แต่ละครั้งจึงคูณ $\tfrac34$ สองครั้งคือคูณซ้ำ ได้ $800\left(\tfrac34\right)^2=800\times\tfrac{9}{16}=450$ บาท ตรวจทีละรอบ $800\to600\to450$ รอบสองลดแค่ $150$ บาทเพราะคิดจากราคา $600$'''
answer = "450"
truth = "800*Rational(3,4)**2"
hints = ["ลดหนึ่งรอบให้คูณด้วยสามส่วนสี่", "สองรอบให้คูณตัวคูณเดิมสองครั้ง"]

