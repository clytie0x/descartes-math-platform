title = "รวมพจน์ที่มีราก"
level = 2
type = "number"
form = "radical"
statement = '''ทำ $\sqrt{48}+\sqrt{27}-\sqrt{12}$ ให้อยู่ในรูปอย่างง่าย ตอบในรูป $k\sqrt{n}$'''
solution = '''ถอดกำลังสองสมบูรณ์ที่ใหญ่ที่สุดออกจากทุกพจน์ก่อน $48=16(3)$ $27=9(3)$ $12=4(3)$ จึงได้ $4\sqrt3+3\sqrt3-2\sqrt3$ ทุกพจน์มี $\sqrt3$ เป็นพจน์คล้าย รวมสัมประสิทธิ์ $4+3-2=5$ ได้ $5\sqrt3$'''
answer = "5sqrt(3)"
reject = ["sqrt(75)", "sqrt(48)+sqrt(27)-sqrt(12)", "4sqrt(3)+3sqrt(3)-2sqrt(3)", "10sqrt(3)/2", "1*5sqrt(3)"]
truth = "sqrt(48)+sqrt(27)-sqrt(12)"
hints = ['หากำลังสองสมบูรณ์ที่ใหญ่ที่สุดที่หาร $48$ $27$ และ $12$ ลงตัว', 'จัดรูปแล้วทุกพจน์มี $\sqrt3$ รวมสัมประสิทธิ์ได้เหมือน $4x+3x-2x$']

[[wrong]]
answer = "sqrt(63)"
message = "บวกลบตัวเลขในรากตรงๆ ไม่ได้ √a + √b ไม่เท่ากับ √(a + b) ต้องจัดรูปให้เป็นพจน์คล้ายก่อน"

[[wrong]]
answer = "9sqrt(3)"
message = "พจน์สุดท้ายเป็นลบ 4 + 3 − 2 = 5 ไม่ใช่ 4 + 3 + 2"
