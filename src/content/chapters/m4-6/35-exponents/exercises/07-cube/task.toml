title = "ขยายกล่อง"
level = 2
type = "number"
statement = "กล่องลูกบาศก์ใบเล็กด้านยาว $5$ เซนติเมตร ใบใหญ่มีปริมาตรเป็น $8$ เท่า ใบใหญ่ด้านยาวเท่าไร"
solution = '''ให้อัตราส่วนด้านเป็น $k$ ปริมาตรเป็น $k^3$ เท่า จึงได้ $k^3=8$ ย้อนด้วยรากที่สาม $k=8^{1/3}=2$ ด้านใบใหญ่ยาว $5\times2=10$ เซนติเมตร ตรวจ $10^3=1000$ และ $5^3=125$ ซึ่ง $1000\div125=8$'''
answer = "10"
truth = "5*8**Rational(1,3)"
hints = ["ปริมาตรเป็นกำลังสามของด้าน", "ถอดรากที่สามของอัตราส่วนปริมาตรก่อนคูณด้านเดิม"]

[[wrong]]
answer = "40"
message = "แปดเท่าเป็นปริมาตร ต้องถอดรากที่สามก่อนคูณความยาว"
