title = "กฎรากที่ต้องมีเงื่อนไข"
level = 2
type = "self"
statement = '''อธิบายว่าเหตุใดจึงแยก $\sqrt{(-4)(-9)}$ เป็น $\sqrt{-4}\sqrt{-9}$ ในจำนวนจริงไม่ได้ แล้วหาค่าเดิม'''
solution = '''นิพจน์เดิมเท่ากับ $\sqrt{36}=6$ แต่รากที่สองของ $-4$ และ $-9$ ไม่อยู่ในจำนวนจริง เกณฑ์ตรวจคือระบุว่าปัญหาอยู่ที่โดเมนของรากย่อยและให้คำตอบเดิมถูก ไม่ใช้กฎผลคูณนอกเงื่อนไข'''
checks = ["sqrt((-4)*(-9))==6"]
hints = ["คำนวณผลคูณในรากเดิมก่อน", "ตรวจว่ารากย่อยของจำนวนลบมีค่าในจำนวนจริงหรือไม่"]
