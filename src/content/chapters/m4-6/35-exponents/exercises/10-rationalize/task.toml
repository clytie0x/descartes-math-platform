title = "ทำส่วนให้ไม่มีราก"
level = 2
type = "number"
form = "radical"
statement = '''เขียน $\dfrac{10}{\sqrt7+\sqrt2}$ ให้ส่วนไม่มีรากและจัดให้อยู่ในรูปอย่างง่าย'''
solution = '''ส่วนเป็น $\sqrt7+\sqrt2$ จึงคูณทั้งเศษและส่วนด้วย $\sqrt7-\sqrt2$ ซึ่งเท่ากับคูณด้วย $1$ ส่วนกลายเป็นผลต่างกำลังสอง $(\sqrt7)^2-(\sqrt2)^2=7-2=5$ เศษเป็น $10(\sqrt7-\sqrt2)$ หารด้วย $5$ ได้ $2(\sqrt7-\sqrt2)=2\sqrt7-2\sqrt2$'''
answer = "2sqrt(7)-2sqrt(2)"
truth = "10/(sqrt(7)+sqrt(2))"
accept = ["2(sqrt(7)-sqrt(2))"]
reject = ["10/(sqrt(7)+sqrt(2))", "10(sqrt(7)-sqrt(2))/5", "sqrt(28)-sqrt(8)", "sqrt(7)+sqrt(7)-sqrt(2)-sqrt(2)", "4sqrt(7)/2-4sqrt(2)/2"]
hints = ['คูณทั้งเศษและส่วนด้วย $\sqrt7-\sqrt2$', 'ใช้ $(p+q)(p-q)=p^2-q^2$ ส่วนจะเหลือ $7-2$']

[[wrong]]
answer = "2sqrt(7)+2sqrt(2)"
message = "ต้องคูณด้วย √7 − √2 ซึ่งมีเครื่องหมายตรงข้ามกับส่วน ถ้าคูณด้วย √7 + √2 ส่วนจะยังมีราก"

[[wrong]]
answer = "10(sqrt(7)-sqrt(2))/9"
message = "ส่วนคือ (√7)² − (√2)² = 7 − 2 = 5 ผลต่างกำลังสองใช้การลบ ไม่ใช่ 7 + 2"
