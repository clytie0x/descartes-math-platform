title = "รากหลัก"
level = 1
type = "number"
statement = '''หา $\sqrt[4]{625}$'''
solution = '''แยกตัวประกอบ $625=5\times5\times5\times5=5^4$ รากที่สี่ของ $625$ จึงมี $5$ กับ $-5$ เพราะ $(-5)^4=625$ ด้วย แต่สัญลักษณ์ $\sqrt[4]{625}$ หมายถึงรากหลักอันดับคู่ ซึ่งเลือกค่าที่ไม่ติดลบ จึงได้ $5$'''
answer = "5"
truth = "625**Rational(1,4)"
hints = ["หาจำนวนบวกที่ยกกำลังสี่แล้วได้หกร้อยยี่สิบห้า"]

[[wrong]]
answer = "-5"
message = "รากหลักอันดับคู่เลือกค่าที่ไม่ติดลบ แม้ −5 ยกกำลังสี่ก็ได้ 625"
