title = "เลือกกฎให้ตรง"
level = 1
type = "choice"
statement = "เมื่อ $a>0$ นิพจน์ใดเท่ากับ $a^{1/2}a^{1/3}$"
solution = '''ฐานเดียวกันคูณกันให้บวกเลขชี้กำลัง ทำส่วนให้เท่ากันก่อน $\tfrac12+\tfrac13=\tfrac36+\tfrac26=\tfrac56$ จึงได้ $a^{5/6}$ ตัวเลือก $a^{1/6}$ มาจากการคูณเลขชี้กำลัง ซึ่งใช้กับการยกกำลังซ้อน ส่วน $a^{2/5}$ มาจากการบวกเศษกับเศษและส่วนกับส่วนตรงๆ ซึ่งไม่ใช่การบวกเศษส่วน'''
choices = ["$a^{1/6}$", "$a^{5/6}$", "$a^{2/5}$"]
checks = ["Rational(1,2)+Rational(1,3)==Rational(5,6)"]
answer = 1
hints = ["ฐานเดียวกันคูณกันให้บวกเลขชี้กำลัง", "ทำส่วนสองกับส่วนสามให้เท่ากันก่อนบวก"]

[[wrong]]
answer = 0
message = "การคูณค่ากำลังใช้บวกเลขชี้กำลัง ส่วนคูณเลขชี้กำลังใช้เมื่อยกกำลังซ้อน"
