title = "มัธยฐาน"
level = 1
type = "number"
answer = "5"
truth = '''Rational(4+6,2)'''
hints = ['เรียงก่อนแล้วดูว่าจำนวนข้อมูลคู่หรือคี่']
statement = '''
หามัธยฐานของ $9,1,4,6$
'''
solution = '''
1. มัธยฐานต้องเรียงข้อมูลก่อน ได้ $1,4,6,9$
2. มีข้อมูล $4$ ตัวซึ่งเป็นจำนวนคู่ จึงไม่มีตัวกลางตัวเดียว ต้องใช้สองตัวกลางคือตัวที่ $2$ และ $3$ ได้ $4$ กับ $6$
3. มัธยฐาน $=\tfrac{4+6}{2}=5$ ค่านี้ไม่ได้อยู่ในข้อมูลก็ได้
'''

[[wrong]]
answer = "4"
message = "ข้อมูลมีจำนวนคู่ ต้องเฉลี่ยสองค่ากลาง"
