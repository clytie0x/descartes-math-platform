title = "คะแนนวิชาฟิสิกส์"
level = 2
type = "number"
answer = "1.5"
truth = '''Rational(82-70,8)'''
hints = ['ลบค่าเฉลี่ยจากคะแนนแล้วหารส่วนเบี่ยงเบนมาตรฐาน']
statement = '''
คะแนนฟิสิกส์ $82$ ค่าเฉลี่ย $70$ ส่วนเบี่ยงเบนมาตรฐาน $8$ คะแนนมาตรฐานเท่าไร
'''
solution = '''
1. ระยะจากค่าเฉลี่ย $82-70=12$ คะแนน
2. หารด้วยส่วนเบี่ยงเบนมาตรฐานเพื่อเปลี่ยนเป็นจำนวนเท่าของส่วนเบี่ยงเบนมาตรฐาน $z=\tfrac{12}{8}=1.5$
3. คะแนนนี้สูงกว่าค่าเฉลี่ยหนึ่งจุดห้าเท่าของส่วนเบี่ยงเบนมาตรฐาน
'''

[[wrong]]
answer = "12"
message = "สิบสองคือระยะคะแนนดิบ ต้องหารส่วนเบี่ยงเบนมาตรฐาน"
