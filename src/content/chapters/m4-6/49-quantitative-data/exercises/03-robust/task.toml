title = "เลือกค่ากลาง"
level = 1
type = "choice"
choices = ['''ค่าเฉลี่ย''', '''มัธยฐาน''']
answer = 1
hints = ['พิจารณาว่าการเปลี่ยนค่าสุดโต่งดึงค่ากลางใดมากกว่า']
statement = '''
ข้อมูลค่าใช้จ่ายมีค่าสูงสุดโต่งหนึ่งค่า ค่ากลางใดมักทนต่อค่านั้นได้ดีกว่า
'''
solution = '''
ค่าเฉลี่ยใช้ขนาดของข้อมูลทุกตัว ถ้าค่าสุดโต่งใหญ่ขึ้น ผลรวมก็ใหญ่ขึ้น ค่าเฉลี่ยจึงถูกดึงตาม

มัธยฐานใช้แค่ตำแหน่งกลางหลังเรียง ค่าสุดโต่งอยู่ปลายแถวอยู่แล้ว จะใหญ่ขึ้นเท่าไรก็ยังอยู่ปลายแถว ตัวกลางจึงไม่เปลี่ยน เช่น $40,45,45,50,220$ มีค่าเฉลี่ย $80$ แต่มัธยฐาน $45$ ตรงกับคนส่วนใหญ่มากกว่า

ดังนั้นมัธยฐานทนต่อค่าสุดโต่งได้ดีกว่า
'''

