title = "ความแปรปรวนตัวอย่าง"
level = 2
type = "number"
answer = "4"
truth = '''Rational((1-3)**2+(3-3)**2+(5-3)**2,2)'''
hints = ['หาผลรวมกำลังสองระยะจากค่าเฉลี่ยแล้วหาร n ลบหนึ่ง']
statement = '''
ข้อมูลตัวอย่าง $1,3,5$ มีความแปรปรวนตัวอย่างเท่าไร
'''
solution = '''
1. ค่าเฉลี่ย $\bar x=\tfrac{1+3+5}{3}=3$
2. ระยะจากค่าเฉลี่ย $-2,0,2$ ยกกำลังสองได้ $4,0,4$ รวม $8$
3. ข้อมูลเป็นตัวอย่าง จึงหารด้วย $n-1=3-1=2$ ไม่ใช่ $n=3$
4. ได้ $s^2=\tfrac{8}{2}=4$
'''

[[wrong]]
answer = "8/3"
message = "ตัวหาร n ใช้กับความแปรปรวนประชากร ตัวอย่างต้องหาร n − 1"
