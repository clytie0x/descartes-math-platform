title = "ผลไม้ชนิดไหนขนาดไม่สม่ำเสมอ"
level = 3
type = "number"
unit = "เปอร์เซ็นต์"
tolerance = 0.01
answer = "9.47"
truth = '''Rational(round(float(Rational(9,95)*100)*100),100)'''
accept = ["9.474"]
hints = ['ส่วนเบี่ยงเบนมาตรฐานมากกว่าไม่ได้แปลว่ากระจายสัมพัทธ์มากกว่า ต้องเทียบกับขนาดของค่าเฉลี่ย', 'หาสัมประสิทธิ์การแปรผัน σ ÷ μ × 100 ของทั้งสองชุดแล้วเลือกชุดที่มากกว่า']
statement = '''
แม่ค้าชั่งผลไม้ทุกลูกในร้าน กล้วยหอมหนักเฉลี่ย $140$ กรัม ส่วนเบี่ยงเบนมาตรฐาน $12$ กรัม ส้มหนักเฉลี่ย $95$ กรัม ส่วนเบี่ยงเบนมาตรฐาน $9$ กรัม ผลไม้ชนิดที่มีขนาดไม่สม่ำเสมอมากกว่าเมื่อเทียบกับน้ำหนักของตัวเอง มีสัมประสิทธิ์การแปรผันกี่เปอร์เซ็นต์ ตอบเป็นทศนิยมสองตำแหน่ง
'''
solution = '''
1. ส่วนเบี่ยงเบนมาตรฐานของกล้วยหอม $12$ กรัมมากกว่าของส้ม $9$ กรัม แต่กล้วยหอมก็หนักกว่าด้วย จึงต้องเทียบการกระจายกับค่าเฉลี่ยของแต่ละชนิด
2. กล้วยหอม $\text{CV}=\tfrac{12}{140}\times100\approx 8.57$ เปอร์เซ็นต์
3. ส้ม $\text{CV}=\tfrac{9}{95}\times100\approx 9.47$ เปอร์เซ็นต์
4. ส้มมีสัมประสิทธิ์การแปรผันมากกว่า จึงมีขนาดไม่สม่ำเสมอมากกว่าเมื่อเทียบกับน้ำหนักของตัวเอง คำตอบคือ $9.47$ เปอร์เซ็นต์
'''

