title = "การเลื่อนข้อมูล"
level = 1
type = "self"
checks = ['''expand((x+5)-(a+5))==x-a''']
hints = ['ลองลบค่าเฉลี่ยหลังเลื่อนข้อมูลด้วยค่าคงที่เท่ากัน']
statement = '''
ถ้าทุกคนสอบเพิ่มคนละห้าคะแนน ค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานเปลี่ยนอย่างไร
'''
solution = '''
ให้คะแนนเดิมเป็น $x_i$ และค่าเฉลี่ยเดิมเป็น $\bar x$ เมื่อทุกคนได้เพิ่มห้าคะแนน คะแนนใหม่คือ $x_i+5$

1. ผลรวมใหม่เพิ่มขึ้น $5n$ หารด้วย $n$ จึงได้ค่าเฉลี่ยใหม่ $\bar x+5$ ค่าเฉลี่ยเพิ่มห้า
2. ระยะจากค่าเฉลี่ยใหม่คือ $(x_i+5)-(\bar x+5)=x_i-\bar x$ เท่าเดิมทุกตัว
3. ส่วนเบี่ยงเบนมาตรฐานคำนวณจากระยะเหล่านี้เท่านั้น จึงคงเดิม

การเลื่อนข้อมูลทั้งชุดย้ายตำแหน่ง แต่ไม่เปลี่ยนว่าข้อมูลห่างกันเท่าไร
'''
