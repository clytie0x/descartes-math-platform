title = "รวมคะแนนสองห้อง"
level = 2
type = "number"
answer = "65"
truth = '''Rational(10*50+30*70,40)'''
hints = ['กู้คืนผลรวมคะแนนแต่ละห้องก่อนหารจำนวนรวม']
statement = '''
ห้อง ก $10$ คนเฉลี่ย $50$ ห้อง ข $30$ คนเฉลี่ย $70$ ค่าเฉลี่ยรวมเท่าไร
'''
solution = '''
1. ค่าเฉลี่ยคูณจำนวนคนได้ผลรวมคะแนน ห้อง ก รวม $10(50)=500$ ห้อง ข รวม $30(70)=2100$
2. ผลรวมคะแนนสองห้อง $500+2100=2600$
3. จำนวนคนรวม $10+30=40$
4. ค่าเฉลี่ยรวม $\tfrac{2600}{40}=65$ ใกล้ $70$ มากกว่า $50$ เพราะห้อง ข มีจำนวนคนเป็นสามเท่าของห้อง ก
'''

[[wrong]]
answer = "60"
message = "ขนาดห้องต่างกัน ต้องถ่วงน้ำหนักด้วยจำนวนคน"
