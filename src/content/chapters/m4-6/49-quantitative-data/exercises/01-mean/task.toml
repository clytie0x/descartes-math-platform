truth = '''Rational(3+5+7+9,4)'''
hints = ['บวกข้อมูลทุกตัวแล้วหารจำนวนตัว']
statement = '''
หาค่าเฉลี่ยของ $3,5,7,9$
'''
solution = '''
1. ค่าเฉลี่ยคือผลรวมของข้อมูลหารด้วยจำนวนข้อมูล
2. ผลรวม $3+5+7+9=24$
3. มีข้อมูล $4$ ตัว จึงได้ $\bar x=\tfrac{24}{4}=6$
4. ตรวจด้วยระยะจากค่าเฉลี่ย $-3,-1,1,3$ รวมกันได้ $0$ ตามสมบัติของค่าเฉลี่ย
'''

