title = "ค่าเฉลี่ยจากตารางแจกแจงความถี่"
level = 2
type = "number"
unit = "ชั่วโมง"
answer = "3.5"
truth = '''Rational(5*1+8*3+4*5+3*7,20)'''
accept = ["7/2"]
hints = ['หาจุดกึ่งกลางของแต่ละช่วงก่อน', 'คูณความถี่กับจุดกึ่งกลางแต่ละช่วงแล้วรวม จากนั้นหารด้วยจำนวนคนทั้งหมด ไม่ใช่จำนวนช่วง']
statement = '''
สำรวจนักเรียน ม.6 จำนวน $20$ คนว่าออกกำลังกายสัปดาห์ละกี่ชั่วโมง ได้ผลดังตาราง จงประมาณค่าเฉลี่ยของเวลาออกกำลังกาย

| เวลา (ชั่วโมง) | ความถี่ |
|---|---|
| $0\le x<2$ | $5$ |
| $2\le x<4$ | $8$ |
| $4\le x<6$ | $4$ |
| $6\le x<8$ | $3$ |
'''
solution = '''
1. ไม่รู้ค่ารายคน จึงให้ทุกคนในช่วงมีค่าเท่ากับจุดกึ่งกลางของช่วง ได้ $1,3,5,7$ ชั่วโมง
2. คูณความถี่กับจุดกึ่งกลางเพื่อประมาณผลรวมของแต่ละช่วง $5(1)=5$ $8(3)=24$ $4(5)=20$ $3(7)=21$
3. รวมกัน $\sum f_ix_i=5+24+20+21=70$ ชั่วโมง
4. หารด้วยจำนวนคน $N=5+8+4+3=20$ ได้ $\bar x\approx\tfrac{70}{20}=3.5$ ชั่วโมง
5. ตรวจ ค่าเฉลี่ยอยู่ในช่วง $2\le x<4$ ซึ่งมีคนมากที่สุด จึงสมเหตุสมผล
'''

[[wrong]]
