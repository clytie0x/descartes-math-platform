title = "อิสระกับไม่เกิดร่วม"
level = 1
type = "self"
track = "adv"
checks = ['''Rational(1,6)*Rational(1,6)>0''']
hints = ['เทียบโอกาสส่วนร่วมกับผลคูณโอกาสแต่ละเหตุการณ์']
statement = '''
อธิบายว่าทำไมเหตุการณ์ที่ไม่เกิดร่วมกันและแต่ละเหตุการณ์มีโอกาสบวกจึงไม่เป็นอิสระ
'''
solution = '''
1. ไม่เกิดร่วมกันแปลว่า $A\cap B=\varnothing$ จึงได้ $P(A\cap B)=0$
2. โจทย์ให้ $P(A)>0$ และ $P(B)>0$ ผลคูณ $P(A)P(B)$ จึงมากกว่าศูนย์
3. นิยามของความเป็นอิสระต้องการ $P(A\cap B)=P(A)P(B)$ แต่ข้างซ้ายเป็นศูนย์ ข้างขวาเป็นบวก จึงไม่เท่ากัน
4. อธิบายด้วยเงื่อนไขก็ได้ เมื่อรู้ว่า $B$ เกิด $A$ เกิดไม่ได้อีก $P(A\mid B)=0$ ไม่เท่ากับ $P(A)$ การรู้ข้อมูลเปลี่ยนโอกาส จึงไม่เป็นอิสระ เช่นทอยลูกเต๋าได้หนึ่งกับได้สอง $P=0$ แต่ $\tfrac16\cdot\tfrac16=\tfrac1{36}$
'''
