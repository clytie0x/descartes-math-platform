title = "รถสองเที่ยว"
level = 2
type = "number"
track = "adv"
answer = "9/25"
truth = '''1-Rational(4,5)**2'''
form = "fraction"
hints = ['หาโอกาสรถทั้งสองเที่ยวไม่สายแล้วใช้ส่วนเติมเต็ม']
statement = '''
แบบจำลองกำหนดให้รถสองเที่ยวมาสายเป็นอิสระ แต่ละเที่ยวมีโอกาส $1/5$ โอกาสมีอย่างน้อยหนึ่งเที่ยวมาสายเท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. อย่างน้อยหนึ่งเที่ยวมาสาย ส่วนเติมเต็มคือไม่สายทั้งสองเที่ยว
2. แต่ละเที่ยวไม่สายด้วยโอกาส $1-\tfrac15=\tfrac45$
3. สองเที่ยวเป็นอิสระกัน จึงคูณได้ ไม่สายทั้งสองเที่ยวมีโอกาส $\left(\tfrac45\right)^2=\tfrac{16}{25}$
4. ได้ $1-\tfrac{16}{25}=\tfrac{9}{25}$
5. ตรวจด้วยกฎการบวก $\tfrac15+\tfrac15-\tfrac15\cdot\tfrac15=\tfrac{10}{25}-\tfrac{1}{25}=\tfrac{9}{25}$ ตรงกัน
'''

[[wrong]]
answer = "2/5"
message = "บวกโอกาสตรงๆ จะนับกรณีสายทั้งคู่ซ้ำ"
