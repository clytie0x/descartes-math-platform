answer = "17/20"
truth = '''1-Rational(3,20)'''
form = "fraction"
hints = ['นับจำนวนสลากที่ไม่ใช่รางวัล']
statement = '''
กล่องมีสลาก $20$ ใบ เป็นรางวัล $3$ ใบ สุ่มหยิบหนึ่งใบ โอกาสไม่ได้รางวัลเท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. สลากทุกใบมีโอกาสถูกหยิบเท่ากัน ผลลัพธ์ทั้งหมด $20$ แบบ
2. ให้ $E$ เป็นได้รางวัล $P(E)=\tfrac{3}{20}$
3. ไม่ได้รางวัลคือ $E'$ ได้ $P(E')=1-\tfrac{3}{20}=\tfrac{17}{20}$
4. ตรวจด้วยการนับตรง สลากที่ไม่ใช่รางวัลมี $20-3=17$ ใบ ได้ $\tfrac{17}{20}$ ตรงกัน
'''

[[wrong]]
answer = "3/20"
message = "โจทย์ถามไม่ได้รางวัล ต้องใช้ส่วนเติมเต็ม"
