title = "ลูกเต๋า"
level = 1
type = "number"
answer = "1/3"
truth = '''Rational(2,6)'''
form = "fraction"
hints = ['นับหน้าที่เป็นเลขห้าหรือหกจากหกหน้า']
statement = '''
ทอยลูกเต๋ายุติธรรม โอกาสได้เลขมากกว่า $4$ เท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. ลูกเต๋ายุติธรรมมีผลลัพธ์ $S=\{1,2,3,4,5,6\}$ ทั้งหกหน้ามีโอกาสเท่ากัน จึงใช้ $P(E)=n(E)/n(S)$ ได้
2. เลขมากกว่า $4$ คือ $5$ กับ $6$ ไม่รวม $4$ เพราะ $4$ ไม่มากกว่าตัวเอง ได้ $E=\{5,6\}$ และ $n(E)=2$
3. $P(E)=\tfrac{2}{6}=\tfrac{1}{3}$
'''

[[wrong]]
answer = "1/2"
message = "มีเลข 5 กับ 6 เท่านั้นที่มากกว่า 4"
