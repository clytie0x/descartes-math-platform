title = "คัดกรองสายตา"
level = 3
type = "number"
track = "adv"
answer = "1/2"
truth = '''Rational(1,10)*Rational(9,10) / (Rational(1,10)*Rational(9,10) + Rational(9,10)*Rational(1,10))'''
form = "fraction"
hints = ['สมมตินักเรียน 1000 คน แล้วเติมตารางสายตาสั้นกับผลคัดกรอง', 'ตัวส่วนคือทุกคนที่ผลคัดกรองบอกว่าสายตาสั้น ไม่ใช่ทุกคนที่สายตาสั้น']
statement = '''
โรงเรียนหนึ่งมีนักเรียนสายตาสั้น $10\%$ แบบทดสอบคัดกรองสายตาบอกว่าสายตาสั้นได้ถูกต้อง $90\%$ ของคนที่สายตาสั้นจริง แต่ก็บอกว่าสายตาสั้นผิดๆ กับ $10\%$ ของคนที่สายตาปกติ สุ่มนักเรียนหนึ่งคนที่ผลคัดกรองบอกว่าสายตาสั้น โอกาสที่เขาสายตาสั้นจริงเท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. สมมตินักเรียน $1000$ คน สายตาสั้น $100$ คน สายตาปกติ $900$ คน
2. ในคนสายตาสั้น ผลคัดกรองบอกว่าสั้น $90\%$ ของ $100$ คือ $90$ คน
3. ในคนสายตาปกติ ผลคัดกรองบอกว่าสั้นผิดๆ $10\%$ ของ $900$ คือ $90$ คน
4. รู้แล้วว่าผลบอกว่าสั้น กลุ่มอ้างอิงคือ $90+90=180$ คน ในนั้นสายตาสั้นจริง $90$ คน
5. $P(\text{สั้นจริง}\mid\text{ผลบอกว่าสั้น})=\tfrac{90}{180}=\tfrac12$ แม้แบบทดสอบถูก $90\%$ เพราะคนสายตาปกติมีมากกว่าเก้าเท่า ผลผิดจากกลุ่มใหญ่จึงมีจำนวนเท่ากับผลถูกจากกลุ่มเล็ก
'''

[[wrong]]
