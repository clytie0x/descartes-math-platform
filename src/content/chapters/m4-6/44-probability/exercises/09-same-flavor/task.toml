title = "ลูกอมรสเดียวกัน"
level = 2
type = "number"
answer = "7/15"
truth = '''Rational(binomial(4,2)+binomial(2,2), binomial(6,2))'''
form = "fraction"
hints = ['สองลูกรสเดียวกันแยกเป็นส้มทั้งคู่กับมะนาวทั้งคู่', 'นับทั้งเศษและส่วนด้วยการจัดหมู่']
statement = '''
ถุงมีลูกอมรสส้ม $4$ เม็ด รสมะนาว $2$ เม็ด ขนาดและห่อเหมือนกัน สุ่มหยิบสองเม็ดพร้อมกัน โอกาสได้สองเม็ดรสเดียวกันเท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. หยิบพร้อมกันไม่สนลำดับ คู่ทั้งหมดมี $\binom62=15$ คู่
2. รสเดียวกันมีสองกรณีที่ไม่เกิดร่วมกัน คือส้มทั้งคู่ $\binom42=6$ คู่ และมะนาวทั้งคู่ $\binom22=1$ คู่
3. รวมได้ $6+1=7$ คู่ โอกาส $\tfrac{7}{15}$
4. ตรวจด้วยส่วนเติมเต็ม คู่ต่างรสมี $4\times2=8$ คู่ และ $7+8=15$ ครบพอดี
'''

[[wrong]]
answer = "2/5"
message = "6/15 นับแค่ส้มทั้งคู่ ลืมกรณีมะนาวทั้งคู่"

[[wrong]]
answer = "8/15"
message = "8 คู่คือคู่ที่ต่างรสกัน โจทย์ถามรสเดียวกัน"
