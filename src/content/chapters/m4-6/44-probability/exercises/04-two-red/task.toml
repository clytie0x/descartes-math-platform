title = "หยิบไม่คืน"
level = 2
type = "number"
answer = "2/5"
truth = '''binomial(4,2)/binomial(6,2)'''
form = "fraction"
hints = ['นับคู่ทั้งหมดกับคู่แดงด้วยการจัดหมู่เหมือนกัน']
statement = '''
มีแดง $4$ น้ำเงิน $2$ สุ่มหยิบสองลูกไม่คืน โอกาสแดงทั้งคู่เท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. ไม่สนลำดับ นับคู่ทั้งหมดด้วยการจัดหมู่ $\binom62=15$ คู่
2. คู่แดงทั้งคู่เลือกสองลูกจากแดงสี่ลูก $\binom42=6$ คู่
3. โอกาส $\tfrac{6}{15}=\tfrac25$
4. ตรวจด้วยการหยิบทีละลูก ครั้งแรกแดง $\tfrac46$ ครั้งที่สองเหลือแดง $3$ จาก $5$ ได้ $\tfrac46\cdot\tfrac35=\tfrac{12}{30}=\tfrac25$ ตรงกัน
'''

[[wrong]]
answer = "4/9"
message = "หลังหยิบไม่คืน โอกาสครั้งที่สองเปลี่ยน"
