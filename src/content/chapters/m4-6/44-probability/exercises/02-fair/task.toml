statement = '''
ข้อใดมีผลลัพธ์พื้นฐานโอกาสเท่ากันตามเงื่อนไขที่ให้
'''
solution = '''
1. ลูกเต๋ายุติธรรมให้แต่ละหน้ามีโอกาสเท่ากัน ผลลัพธ์ $1$ ถึง $6$ จึงมีโอกาส $\tfrac16$ เท่ากันทุกตัว
2. จำนวนหัวจากสองเหรียญมีสามค่า แต่หนึ่งหัวเกิดจาก HT และ TH สองผลลัพธ์ ส่วนศูนย์หัวกับสองหัวเกิดจากอย่างละผลลัพธ์ น้ำหนักจึงเป็น $1:2:1$ ไม่เท่ากัน
3. จำนวนคนขึ้นรถไม่มีเงื่อนไขใดรับรองว่าแต่ละค่ามีโอกาสเท่ากัน ช่วงเช้าเร่งด่วนอาจมีคนมากกว่าช่วงบ่ายมาก
4. จึงตอบข้อลูกเต๋ายุติธรรม
'''

[[wrong]]
answer = 1
