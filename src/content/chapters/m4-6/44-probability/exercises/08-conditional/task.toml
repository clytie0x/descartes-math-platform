title = "ข้อมูลชมรม"
level = 3
type = "number"
track = "adv"
answer = "1/4"
truth = '''Rational(3,12)'''
form = "fraction"
hints = ['กลุ่มอ้างอิงใหม่คือผู้เล่นกีฬาเท่านั้น']
statement = '''
ในนักเรียน $30$ คน มีผู้เล่นกีฬา $12$ คน ในกลุ่มนี้เล่นดนตรี $3$ คน เมื่อรู้ว่าเล่นกีฬา โอกาสเล่นดนตรีเท่าไร ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. ให้ $A$ เป็นเล่นกีฬา $B$ เป็นเล่นดนตรี โจทย์ถาม $P(B\mid A)$
2. รู้แล้วว่าเล่นกีฬา คนที่ไม่เล่นกีฬาถูกตัดออก กลุ่มอ้างอิงเหลือ $12$ คน
3. ในกลุ่มนั้นเล่นดนตรีด้วย $3$ คน ได้ $P(B\mid A)=\tfrac{3}{12}=\tfrac14$
4. ตรวจด้วยสูตร $P(B\mid A)=\dfrac{P(A\cap B)}{P(A)}=\dfrac{3/30}{12/30}=\tfrac14$ ตรงกัน
'''

