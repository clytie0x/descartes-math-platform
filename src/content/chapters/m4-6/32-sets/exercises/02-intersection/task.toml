title = "สมาชิกที่อยู่ทั้งสองเซต"
level = 1
type = "set"
statement = '''ให้ $A=\{1,2,4,6\}$ และ $B=\{2,3,4\}$ หา $A\cap B$ ตอบสมาชิกทุกตัว'''
solution = '''ไล่สมาชิกของ $B$ ทีละตัวว่าอยู่ใน $A$ ด้วยหรือไม่ $2\in A$ $3\notin A$ และ $4\in A$ จึงได้ $A\cap B=\{2,4\}$ ส่วน $1$ กับ $6$ อยู่เฉพาะใน $A$ และ $3$ อยู่เฉพาะใน $B$ จึงไม่อยู่ในอินเตอร์เซกชัน'''
answer = ["2", "4"]
truth = "[2,4]"
hints = ["วงสมาชิกใน A ที่ปรากฏใน B ด้วย", "อย่ารวมสมาชิกที่อยู่เพียงเซตเดียว"]

[[wrong]]
answer = ["1", "2", "3", "4", "6"]
message = "นี่คือยูเนียน อินเตอร์เซกชันเก็บเฉพาะสมาชิกที่อยู่ทั้งคู่"
