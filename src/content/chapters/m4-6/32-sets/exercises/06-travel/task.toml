title = "วิธีเดินทาง"
level = 2
type = "number"
statement = "สำรวจคนที่เคยใช้รถเมล์และรถไฟ มีคนเคยใช้รถเมล์ $32$ คน เคยใช้รถไฟ $21$ คน และเคยใช้ทั้งสอง $12$ คน มีกี่คนที่เคยใช้เพียงวิธีเดียว"
solution = "เพียงวิธีเดียวต้องตัดส่วนที่เคยใช้ทั้งสองออกจากยอดของแต่ละวิธี รถเมล์อย่างเดียว $32-12=20$ คน รถไฟอย่างเดียว $21-12=9$ คน สองบริเวณนี้ไม่ซ้อนกัน จึงบวกได้ $20+9=29$ คน ตรวจ $29+12=41=32+21-12$ คือจำนวนคนที่เคยใช้อย่างน้อยหนึ่งวิธี"
answer = "29"
truth = "32+21-2*12"
hints = ["หาจำนวนคนในแต่ละชมรมอย่างเดียว โดยลบคนสมัครทั้งคู่จากแต่ละยอด", "รวมสองบริเวณที่ไม่ซ้อนกันแล้ว"]

