title = "วิชาเรียนเสริมสามวิชา"
level = 3
type = "number"
statement = '''นักเรียน $50$ คน เลือกเรียนเสริมได้สามวิชา เรียนดนตรี $22$ คน ศิลปะ $18$ คน คอมพิวเตอร์ $25$ คน เรียนทั้งดนตรีและศิลปะ $8$ คน ทั้งดนตรีและคอมพิวเตอร์ $10$ คน ทั้งศิลปะและคอมพิวเตอร์ $7$ คน และเรียนทั้งสามวิชา $4$ คน มีนักเรียนกี่คนที่ไม่เรียนเสริมวิชาใดเลย'''
solution = '''เติมจากตรงกลาง ทั้งสามวิชา $4$ คน หักออกจากจุดตัดเป็นคู่ได้ ดนตรีกับศิลปะเท่านั้น $8-4=4$ ดนตรีกับคอมพิวเตอร์เท่านั้น $10-4=6$ ศิลปะกับคอมพิวเตอร์เท่านั้น $7-4=3$

วิชาเดียว ดนตรีอย่างเดียว $22-4-6-4=8$ ศิลปะอย่างเดียว $18-4-3-4=7$ คอมพิวเตอร์อย่างเดียว $25-6-3-4=12$

เรียนอย่างน้อยหนึ่งวิชา $8+7+12+4+6+3+4=44$ คน ตรงกับสูตร $22+18+25-8-10-7+4=44$ จึงไม่เรียนเลย $50-44=6$ คน'''
answer = "6"
truth = "50-(22+18+25-8-10-7+4)"
hints = ['เริ่มเติมบริเวณที่เรียนทั้งสามวิชาก่อน แล้วหักออกจากจุดตัดแต่ละคู่', 'หาจำนวนคนที่เรียนอย่างน้อยหนึ่งวิชา แล้วนำไปลบออกจาก 50']

