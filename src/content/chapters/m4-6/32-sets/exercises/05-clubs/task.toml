title = "สมาชิกชมรม"
level = 2
type = "number"
statement = "นักเรียน $45$ คน สมัครวาดภาพ $26$ คน สมัครดนตรี $20$ คน สมัครทั้งสอง $8$ คน มีคนไม่สมัครชมรมใดเลยในสองชมรมนี้กี่คน"
solution = "สมัครอย่างน้อยหนึ่ง $26+20-8=38$ คน จึงไม่สมัครเลย $45-38=7$ คน"
answer = "7"
truth = "45-(26+20-8)"
hints = ["หาจำนวนคนที่สมัครอย่างน้อยหนึ่งชมรมด้วยการบวกยอดแล้วลบส่วนซ้อน", "นำจำนวนทั้งหมดลบจำนวนในยูเนียน"]

[[wrong]]
answer = "-1"
message = "บวกยอดชมรมตรงๆ นับคนสมัครทั้งสองซ้ำ ต้องลบส่วนซ้อนก่อน"
