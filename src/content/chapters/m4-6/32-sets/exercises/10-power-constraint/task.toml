title = "สับเซตที่มีเงื่อนไข"
level = 2
type = "number"
statement = '''ให้ $A=\{1,2,3,4,5,6\}$ สับเซตของ $A$ ที่มี $2$ และ $3$ อยู่ด้วย แต่ไม่มี $6$ มีกี่เซต'''
solution = '''$2$ กับ $3$ ถูกบังคับให้อยู่ และ $6$ ถูกห้าม สามตัวนี้จึงมีทางเดียว ไม่มีทางเลือก

สมาชิกที่เหลือคือ $1,4,5$ แต่ละตัวใส่หรือไม่ใส่ได้อิสระ ตัวละสองทาง จึงได้ $2^3=8$ เซต

ตรวจขอบเขต สับเซตที่เล็กที่สุดคือ $\{2,3\}$ ใหญ่ที่สุดคือ $\{1,2,3,4,5\}$ ทั้งคู่ผ่านเงื่อนไขและถูกนับอยู่ใน $8$ เซตนี้'''
answer = "8"
truth = "2**(6-3)"
track = "adv"
hints = ['สมาชิกที่ถูกบังคับหรือถูกห้ามมีทางเลือกเดียว', 'นับเฉพาะสมาชิกที่ยังใส่หรือไม่ใส่ได้อิสระ']

[[wrong]]
answer = "64"
message = "64 คือจำนวนสับเซตทั้งหมดของ A ยังไม่ได้ใช้เงื่อนไขว่าต้องมี 2 และ 3 แต่ไม่มี 6"

[[wrong]]
answer = "16"
message = "ตัดทางเลือกของ 2 กับ 3 แล้ว แต่ 6 ถูกห้ามจึงไม่มีทางเลือกเหมือนกัน เหลือตัวที่เลือกได้อิสระแค่ 3 ตัว"
