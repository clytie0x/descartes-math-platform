solution = '''เซตไม่นับรายการที่เขียนซ้ำ $2$ เขียนสองครั้งและ $4$ เขียนสองครั้ง ตัดส่วนที่ซ้ำออกเหลือ $A=\{2,4,6\}$ จึงได้ $n(A)=3$ รายการที่เขียนมีห้ารายการ แต่สมาชิกที่ต่างกันมีสามตัว'''
