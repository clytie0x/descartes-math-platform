title = "คอมพลีเมนต์"
level = 1
type = "set"
statement = '''ให้ $U=\{1,2,3,4,5,6\}$ และ $A=\{2,4,6\}$ หา $A\prime$'''
solution = '''คอมพลีเมนต์เริ่มจาก $U$ ไม่ใช่จาก $A$ ไล่ $1$ ถึง $6$ แล้วตัดตัวที่อยู่ใน $A$ คือ $2,4,6$ ออก เหลือ $A\prime=\{1,3,5\}$ ตรวจได้ว่า $A$ กับ $A\prime$ รวมกันได้ $U$ พอดีและไม่มีตัวซ้ำกัน'''
answer = ["1", "3", "5"]
truth = "[1,3,5]"
hints = ["เริ่มจากรายการใน U แล้วตัดสมาชิกของ A ออก"]

[[wrong]]
answer = ["2", "4", "6"]
message = "คำตอบนี้เป็น A เดิม คอมพลีเมนต์ต้องเลือกส่วนที่อยู่นอก A ภายใน U"
