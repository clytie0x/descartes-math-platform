title = "ส่วนจินตภาพของราก"
level = 3
type = "set"
track = "adv"
answer = ["-2", "2"]
truth = '''[-2,2]'''
hints = ['แก้สมการหารากก่อนแยกส่วนจินตภาพ']
statement = '''
รากทั้งสองของ $x^2+4=0$ มีส่วนจินตภาพเป็นค่าใดบ้าง
'''
solution = '''
ย้ายข้างได้ $x^2 = -4$ ไม่มีจำนวนจริงใดยกกำลังสองแล้วติดลบ แต่ในจำนวนเชิงซ้อน $x = \pm\sqrt{-4} = \pm 2i$

รากคือ $2i = 0 + 2i$ และ $-2i = 0 - 2i$ ส่วนจินตภาพคือสัมประสิทธิ์ของ $i$ จึงเป็น $2$ และ $-2$

ตรวจ $(2i)^2 + 4 = -4 + 4 = 0$ และ $(-2i)^2 + 4 = 0$
'''

[[wrong]]
answer = ["0"]
message = "สมการนี้ไม่มีรากจริง แต่มีรากเชิงซ้อนสองตัว"
