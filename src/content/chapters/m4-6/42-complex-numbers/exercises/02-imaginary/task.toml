title = "ส่วนจินตภาพ"
level = 1
type = "choice"
track = "adv"
choices = ['''$-7$''', '''$-7i$''', '''$5$''']
answer = 0
hints = ['ส่วนจินตภาพเป็นสัมประสิทธิ์ของ i']
statement = '''
ส่วนจินตภาพของ $5-7i$ เท่ากับเท่าไร
'''
solution = '''
จำนวน $a + bi$ มีส่วนจริง $a$ และส่วนจินตภาพ $b$ ซึ่งเป็นจำนวนจริงทั้งคู่

$5 - 7i = 5 + (-7)i$ ส่วนจินตภาพคือสัมประสิทธิ์ของ $i$ จึงเท่ากับ $-7$ ส่วน $-7i$ คือพจน์จินตภาพ ไม่ใช่ส่วนจินตภาพ และ $5$ คือส่วนจริง
'''

