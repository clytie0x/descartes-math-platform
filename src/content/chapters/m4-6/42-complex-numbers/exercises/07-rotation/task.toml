title = "หมุนจุดในโปรแกรม"
level = 2
type = "number"
track = "adv"
answer = "-4"
truth = '''re(I*(3+4*I))'''
hints = ['กระจาย i เข้าทั้งสองพจน์แล้วใช้ i² เท่ากับลบหนึ่ง']
statement = '''
โปรแกรมหมุนจุด $3+4i$ รอบจุดกำเนิดด้วยการคูณ $i$ ส่วนจริงของจุดใหม่เป็นเท่าไร
'''
solution = '''
การคูณด้วย $i$ หมุนจุดทวนเข็มนาฬิกา $90^\circ$ รอบจุดกำเนิด คำนวณได้โดยกระจาย

$i(3+4i) = 3i + 4i^2 = 3i - 4 = -4+3i$

ส่วนจริงของจุดใหม่เป็น $-4$ ตรวจขนาด $|-4 + 3i| = 5 = |3 + 4i|$ การหมุนไม่เปลี่ยนระยะจากจุดกำเนิดจริง
'''

[[wrong]]
answer = "4"
message = "คูณ i แล้วพจน์ 4i กลายเป็น 4i² เท่ากับ −4"
