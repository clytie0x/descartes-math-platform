title = "อาร์กิวเมนต์เป็นองศา"
level = 2
type = "number"
track = "adv"
label = '$\theta =$'
unit = "องศา"
answer = "240"
truth = '''(arg(-1 - sqrt(3)*I) + 2*pi)*180/pi'''
hints = ['ดูเครื่องหมายของส่วนจริงและส่วนจินตภาพก่อนว่าจุดอยู่จตุภาคไหน', 'หามุมอ้างอิงจากค่าสัมบูรณ์ของส่วนจินตภาพหารด้วยค่าสัมบูรณ์ของส่วนจริง']
statement = '''
เขียน $-1 - \sqrt{3}i = r(\cos\theta + i\sin\theta)$ โดย $r > 0$ และ $0^\circ \le \theta < 360^\circ$ หา $\theta$ เป็นองศา
'''
solution = '''
ขนาด $r = \sqrt{(-1)^2 + (-\sqrt{3})^2} = \sqrt{4} = 2$

ส่วนจริงและส่วนจินตภาพลบทั้งคู่ จุด $(-1, -\sqrt{3})$ จึงอยู่จตุภาคที่สาม

มุมอ้างอิงจาก $\tan\alpha = \dfrac{\sqrt{3}}{1} = \sqrt{3}$ ได้ $\alpha = 60^\circ$ มุมในจตุภาคที่สามคือ $\theta = 180^\circ + 60^\circ = 240^\circ$

ตรวจ $2\cos 240^\circ = 2\left(-\tfrac{1}{2}\right) = -1$ และ $2\sin 240^\circ = 2\left(-\tfrac{\sqrt{3}}{2}\right) = -\sqrt{3}$ ถูกต้อง
'''

