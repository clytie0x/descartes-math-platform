answer = "60"
message = "60° เป็นแค่มุมอ้างอิง ชี้ไปจตุภาคที่หนึ่ง แต่จุดนี้ส่วนจริงและส่วนจินตภาพลบทั้งคู่ จึงอยู่จตุภาคที่สาม"

