truth = '''Abs(5-12*I)'''
hints = ['ใช้พีทาโกรัสกับส่วนจริงและส่วนจินตภาพ']
statement = '''
หา $|5-12i|$
'''
solution = '''
$|a + bi|$ คือระยะจากจุดกำเนิดถึงจุด $(a, b)$ ใช้ทฤษฎีบทพีทาโกรัส $|a + bi| = \sqrt{a^2 + b^2}$

ที่นี่ $a = 5$ และ $b = -12$ จึงได้ $|5 - 12i| = \sqrt{5^2 + (-12)^2} = \sqrt{25+144} = \sqrt{169} = 13$
'''

