title = "จุดบนแผนที่จำลอง"
level = 2
type = "number"
track = "adv"
answer = "10"
truth = '''Abs((8+9*I)-(2+I))'''
hints = ['หาระยะจากขนาดของผลต่างเชิงซ้อน']
statement = '''
แผนที่แทนจุดรับส่งเป็น $2+i$ และ $8+9i$ แต่ละหน่วยแทนหนึ่งกิโลเมตร ระยะตรงกี่กิโลเมตร
'''
solution = '''
ระยะตรงระหว่างสองจุดบนระนาบเชิงซ้อนคือขนาดของผลต่าง

ผลต่าง $(8 + 9i) - (2 + i) = 6+8i$

ขนาด $|6 + 8i| = \sqrt{36 + 64} = \sqrt{100} = 10$ จึงห่าง $10$ กิโลเมตร
'''

