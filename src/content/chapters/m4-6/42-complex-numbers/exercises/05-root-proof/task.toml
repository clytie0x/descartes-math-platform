title = "ตรวจราก"
level = 1
type = "self"
track = "adv"
checks = ['''expand((x-1-I)*(x-1+I))==x**2-2*x+2''']
hints = ['คูณตัวประกอบที่เกิดจากรากทั้งสองกลับ']
statement = '''
แสดงว่า $1+i$ กับ $1-i$ เป็นรากของ $x^2-2x+2=0$
'''
solution = '''
วิธีที่หนึ่ง แทนค่าตรงๆ $(1 + i)^2 = 1 + 2i + i^2 = 2i$ จึงได้ $(1+i)^2 - 2(1+i) + 2 = 2i - 2 - 2i + 2 = 0$ ทำแบบเดียวกันกับ $1 - i$ ได้ $(1 - i)^2 = -2i$ และ $-2i - 2 + 2i + 2 = 0$

วิธีที่สอง คูณตัวประกอบที่เกิดจากรากทั้งสองกลับ $(x-1-i)(x-1+i)=(x-1)^2 - i^2 = (x-1)^2+1=x^2-2x+2$ พหุนามเดิมจึงมีทั้งสองค่าเป็นราก
'''
