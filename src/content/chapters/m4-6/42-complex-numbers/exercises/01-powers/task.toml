hints = ['ลดเลขชี้กำลังด้วยเศษจากการหารสี่']
statement = '''
หา $i^{18}$
'''
solution = '''
กำลังของ $i$ วนทุกสี่ขั้น $i^1 = i$ แล้ว $i^2 = -1$ แล้ว $i^3 = -i$ แล้ว $i^4 = 1$ จึงหารเลขชี้กำลังด้วยสี่แล้วดูเศษ

$18=4(4)+2$ เขียนได้ $i^{18} = (i^4)^4 \cdot i^2 = 1 \cdot i^2$

จึงได้ $i^{18}=i^2=-1$
'''

[[wrong]]
answer = "1"
