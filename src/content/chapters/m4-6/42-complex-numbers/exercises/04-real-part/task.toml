title = "ส่วนจริงของผลหาร"
level = 2
type = "number"
track = "adv"
answer = "3"
truth = '''re((2+4*I)/(1+I))'''
hints = ['คูณเศษและส่วนด้วยสังยุคของตัวส่วน']
statement = '''
ส่วนจริงของ $\dfrac{2+4i}{1+i}$ คือเท่าไร
'''
solution = '''
ตัวส่วน $1 + i$ มีสังยุค $1 - i$ คูณทั้งเศษและส่วนด้วย $1 - i$ ค่าไม่เปลี่ยนเพราะคูณด้วยหนึ่ง

ตัวส่วน $(1 + i)(1 - i) = 1 + 1 = 2$

ตัวเศษ $(2 + 4i)(1 - i) = 2 - 2i + 4i - 4i^2 = 6 + 2i$

จึงได้ $\dfrac{6 + 2i}{2} = 3 + i$ ส่วนจริงจึงเป็น $3$
'''

[[wrong]]
answer = "2"
message = "หารจำนวนเชิงซ้อนด้วยการคูณสังยุค ไม่แยกหารเฉพาะส่วนจริง"
