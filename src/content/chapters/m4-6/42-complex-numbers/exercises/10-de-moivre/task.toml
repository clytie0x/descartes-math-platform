title = "ยกกำลังด้วยเดอมัวฟวร์"
level = 3
type = "number"
track = "adv"
answer = "-512"
truth = '''re(expand((1 + sqrt(3)*I)**9))'''
hints = ['เขียน 1 + √3 i ในรูปเชิงขั้วก่อน', 'ยกขนาดกำลังเก้า และคูณมุมด้วยเก้า']
statement = '''
ส่วนจริงของ $(1 + \sqrt{3}i)^9$ เท่ากับเท่าไร
'''
solution = '''
เปลี่ยนเป็นรูปเชิงขั้วก่อน ขนาด $\sqrt{1 + 3} = 2$ จุดอยู่จตุภาคที่หนึ่ง และ $\cos\theta = \tfrac{1}{2}$ จึงได้มุม $60^\circ$ เขียน $1 + \sqrt{3}i = 2(\cos 60^\circ + i\sin 60^\circ)$

ทฤษฎีบทเดอมัวฟวร์ให้ขนาด $2^9 = 512$ และมุม $9 \times 60^\circ = 540^\circ$ ซึ่งชี้ทางเดียวกับ $540^\circ - 360^\circ = 180^\circ$

ได้ $(1 + \sqrt{3}i)^9 = 512(\cos 180^\circ + i\sin 180^\circ) = 512(-1 + 0i) = -512$ ส่วนจริงจึงเป็น $-512$

ตรวจด้วย $(1 + \sqrt{3}i)^3 = 8(\cos 180^\circ + i\sin 180^\circ) = -8$ แล้ว $(-8)^3 = -512$ ตรงกัน
'''

[[wrong]]
answer = "512"
message = "512 เป็นแค่ขนาด ต้องคูณมุมด้วยเก้าด้วย มุม 540° ชี้ไปทางแกนจริงด้านลบ"
