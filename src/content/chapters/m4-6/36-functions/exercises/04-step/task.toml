title = "ค่าจอดรถขั้นบันได"
level = 2
type = "number"
statement = "จอดรถชั่วโมงละ $30$ บาท เศษชั่วโมงปัดขึ้น ถ้าจอด $2.1$ ชั่วโมงต้องจ่ายเท่าไร"
solution = '''ค่าจอดเป็นฟังก์ชันขั้นบันได แบ่งช่วงก่อน $0 \lt t \le 1$ จ่าย $30$ บาท $1 \lt t \le 2$ จ่าย $60$ บาท และ $2 \lt t \le 3$ จ่าย $90$ บาท เวลา $2.1$ มากกว่า $2$ แต่ไม่เกิน $3$ จึงอยู่ช่วงที่สาม จ่าย $3 \times 30 = 90$ บาท การคิด $2.1 \times 30$ เป็นการคิดตามสัดส่วนซึ่งไม่ใช่กติกานี้'''
answer = "90"
truth = "30*ceiling(Rational(21,10))"
hints = ["เวลาเกินสองชั่วโมงแม้เพียงเล็กน้อย ต้องคิดชั่วโมงที่สามเต็ม"]

