title = "ชุดคู่อันดับ"
level = 1
type = "choice"
statement = "ชุดใดไม่เป็นฟังก์ชันของตัวหน้า"
solution = '''ฟังก์ชันห้ามตัวหน้าตัวเดียวคู่กับตัวหลังหลายค่า จึงไล่ดูตัวหน้าทีละชุด ชุดแรกตัวหน้า $1$ กับ $2$ ไม่ซ้ำกัน แม้ตัวหลังเป็น $2$ เหมือนกันก็ยังเป็นฟังก์ชัน ชุดที่สองตัวหน้า $1$ ปรากฏสองครั้งและคู่กับ $2$ กับ $3$ ถ้าถามค่าที่ $1$ จะตอบไม่ได้ จึงไม่เป็นฟังก์ชัน ชุดที่สามตัวหน้าไม่ซ้ำ เป็นฟังก์ชัน'''
choices = ['''$\{(1,2),(2,2)\}$''', '''$\{(1,2),(1,3)\}$''', '''$\{(1,3),(2,4)\}$''']
