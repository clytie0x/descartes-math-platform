title = "เลือกโดเมนสำหรับผกผัน"
level = 3
type = "self"
statement = '''จำกัด $f(x)=x^2$ ที่ $x\le0$ จงหาสูตรผกผันพร้อมโดเมนและเรนจ์'''
solution = '''เรนจ์เดิมคือ $[0,\infty)$ เมื่อแก้ $y=x^2$ ต้องเลือกรากลบเพราะโดเมนเดิมไม่บวก จึงได้ $f^{-1}(x)=-\sqrt x$ โดเมน $[0,\infty)$ เรนจ์ $(-\infty,0]$ เกณฑ์ตรวจคือรากลบ การสลับโดเมนเรนจ์ และตรวจที่ $f(-3)=9$ แล้วผกผัน $9$ คืน $-3$'''
checks = ["-sqrt((-3)**2)==-3"]
track = "adv"
hints = ["เมื่อโดเมนเดิมไม่บวก ต้องเลือกรากด้านลบตอนย้อนกำลังสอง", "โดเมนของผกผันคือเรนจ์เดิม"]
