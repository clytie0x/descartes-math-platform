title = "ตัวคูณคงที่"
level = 2
type = "number"
statement = "ข้อมูลที่เวลา $t=0,1,2$ มีค่า $5,15,45$ ถ้าใช้แบบจำลองที่อัตราส่วนคงที่ ที่ $t=3$ มีค่าเท่าไร"
solution = '''ผลต่างคือ $10$ กับ $30$ ไม่คงที่ จึงไม่ใช่เชิงเส้น แต่อัตราส่วน $15 \div 5 = 45 \div 15 = 3$ คงที่ ได้แบบจำลอง $f(t) = 5 \cdot 3^t$ ที่ $t = 3$ จึงได้ $5 \cdot 27 = 135$ ซึ่งเท่ากับคูณค่าล่าสุดด้วย $3$ อีกครั้ง $45 \times 3 = 135$'''
answer = "135"
truth = "5*3**3"
hints = ["หารค่าติดกันเพื่อหาตัวคูณคงที่", "ใช้ตัวคูณเดิมคูณค่าสุดท้ายอีกครั้ง"]

