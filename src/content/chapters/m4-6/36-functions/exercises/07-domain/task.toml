title = "โดเมนพร้อมเงื่อนไข"
level = 1
type = "choice"
statement = '''จำนวนใดอยู่ในโดเมน $f(x)=\sqrt{x-2}/(x-5)$'''
solution = '''ข้อมูลเข้าต้องผ่านสองเงื่อนไขพร้อมกัน ข้างในรากไม่ติดลบ คือ $x - 2 \ge 0$ หรือ $x \ge 2$ และตัวส่วนไม่เป็นศูนย์ คือ $x \ne 5$ ตัวเลือก $1$ ให้ $\sqrt{-1}$ ไม่เป็นจำนวนจริง ตัวเลือก $5$ ทำให้ตัวส่วนเป็นศูนย์ เหลือ $3$ ที่ให้ $\sqrt{1}/(-2) = -\tfrac{1}{2}$ คำนวณได้'''
choices = ["$1$", "$3$", "$5$"]
checks = ["3>=2 and 3!=5"]
answer = 1
track = "adv"
hints = ["ข้างในรากต้องไม่ติดลบและตัวส่วนต้องไม่เป็นศูนย์", "ทดสอบแต่ละตัวเลือกกับทั้งสองเงื่อนไข"]

[[wrong]]
answer = 0
message = "หนึ่งทำให้ข้างในรากติดลบ จึงไม่อยู่ในโดเมนจำนวนจริง"
