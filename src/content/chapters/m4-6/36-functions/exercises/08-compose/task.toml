title = "ฟังก์ชันประกอบ"
level = 2
type = "expr"
statement = '''ให้ $f(x)=3x+2$ และ $g(x)=x^2-1$ หา $(f\circ g)(x)$'''
solution = '''$(f \circ g)(x) = f(g(x))$ ทำ $g$ ก่อน จึงแทน $g(x) = x^2 - 1$ ลงในช่องของ $f$ ทั้งก้อนพร้อมวงเล็บ ได้ $3(x^2 - 1) + 2$ แล้วกระจาย $3x^2 - 3 + 2 = 3x^2 - 1$'''
answer = "3x^2-1"
truth = "expand(3*(x**2-1)+2)"
track = "adv"
hints = ["ทำ g ก่อน แล้วนำผลทั้งก้อนใส่แทน x ใน f", "กระจายสามและรวมค่าคงตัวหลังแทนเสร็จ"]

[[wrong]]
answer = "(3x+2)^2-1"
message = "คำตอบนี้ทำ g หลัง f แต่ f ประกอบ g ต้องทำ g ก่อนแล้ว f"
