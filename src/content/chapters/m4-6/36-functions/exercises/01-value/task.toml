title = "แทนค่าฟังก์ชัน"
level = 1
type = "number"
statement = "ให้ $f(x)=x^2-2x+3$ หา $f(-1)$"
solution = '''แทน $x = -1$ ลงในทุกตำแหน่งของ $x$ พร้อมวงเล็บ ได้ $(-1)^2 - 2(-1) + 3$ พจน์แรก $(-1)^2 = 1$ พจน์กลางเป็นลบคูณลบจึงได้ $+2$ รวมเป็น $1 + 2 + 3 = 6$'''
answer = "6"
truth = "(x**2-2*x+3).subs(x,-1)"
hints = ["แทนลบหนึ่งในทุกตำแหน่งของ x พร้อมวงเล็บ", "ระวังลบสองคูณลบหนึ่งเป็นบวก"]

[[wrong]]
answer = "2"
message = "พจน์ −2x เมื่อแทน −1 ให้ +2 ต้องระวังลบคูณลบ"
