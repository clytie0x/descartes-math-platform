title = "ผกผันเชิงเส้น"
level = 2
type = "expr"
statement = "ให้ $f(x)=4x-8$ บนจำนวนจริง หา $f^{-1}(x)$"
solution = '''ตั้ง $y = 4x - 8$ ฟังก์ชันนี้คูณ $4$ แล้วลบ $8$ การย้อนจึงบวก $8$ ก่อน ได้ $y + 8 = 4x$ แล้วหารด้วย $4$ ได้ $x = \dfrac{y + 8}{4}$ สลับชื่อตัวแปรได้ $f^{-1}(x) = \dfrac{x + 8}{4}$ ตรวจ $f^{-1}(f(x)) = \dfrac{(4x - 8) + 8}{4} = x$'''
answer = "(x+8)/4"
truth = "(x+8)/4"
track = "adv"
hints = ["ตั้ง y เท่ากับสี่ x ลบแปด แล้วแก้หา x", "สลับชื่อ x กับ y หลังแยกตัวแปรได้แล้ว"]

[[wrong]]
answer = "1/(4x-8)"
message = "ผกผันย้อนการคูณและลบ ไม่ใช่ส่วนกลับของค่าฟังก์ชัน"
