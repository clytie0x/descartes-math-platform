title = "ค่ารถรับส่ง"
level = 1
type = "number"
statement = "รถรับส่งคิดค่าตั้งต้น $15$ บาทและกิโลเมตรละ $4$ บาท ระยะ $7$ กิโลเมตรคิดเท่าไร"
solution = '''ค่ารถแยกเป็นสองส่วน ค่าตั้งต้นที่จ่ายแน่นอน $15$ บาท กับค่าตามระยะกิโลเมตรละ $4$ บาท จึงได้ $C(d) = 15 + 4d$ เมื่อ $d \ge 0$ แทน $d = 7$ ได้ $C(7) = 15 + 28 = 43$ บาท'''
answer = "43"
truth = "15+4*7"
hints = ["คำนวณค่าตามระยะเจ็ดกิโลเมตรก่อน แล้วบวกค่าตั้งต้น"]

[[wrong]]
answer = "28"
message = "28 นับเฉพาะค่าตามระยะ ยังต้องบวกค่าตั้งต้นสิบห้าบาท"
