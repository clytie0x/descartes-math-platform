title = "เรนจ์ของฟังก์ชันกำลังสอง"
level = 2
type = "choice"
statement = '''เรนจ์ของ $f(x)=x^2-6x+11$ บนจำนวนจริงคือข้อใด'''
solution = '''ทำกำลังสองสมบูรณ์ ครึ่งหนึ่งของ $-6$ คือ $-3$ จึงได้ $f(x) = (x-3)^2 - 9 + 11 = (x-3)^2 + 2$ ด้านจำกัด $(x-3)^2 \ge 0$ จึงได้ $f(x) \ge 2$ ด้านเกิดได้จริง ทุก $y \ge 2$ มี $x = 3 + \sqrt{y-2}$ ที่ให้ $f(x) = y$ เรนจ์จึงเป็น $[2,\infty)$'''
choices = ['$[11,\infty)$', '$[2,\infty)$', '$\mathbb R$', '$[3,\infty)$']
checks = ["vertex(x**2-6*x+11) == (3, 2)", "simplify((3+sqrt(y-2))**2 - 6*(3+sqrt(y-2)) + 11) == y"]
answer = 1
track = "adv"
hints = ['ทำกำลังสองสมบูรณ์ให้อยู่ในรูป $(x-h)^2+k$', 'กำลังสองไม่ติดลบ ค่าน้อยที่สุดเกิดเมื่อวงเล็บเป็นศูนย์']

[[wrong]]
answer = 0
message = "11 คือค่าเมื่อ x = 0 ไม่ใช่ค่าต่ำสุด ต้องหาจุดยอดก่อน"

[[wrong]]
answer = 2
message = "กราฟเป็นพาราโบลาเปิดขึ้น จึงมีค่าต่ำสุด ค่าที่น้อยกว่านั้นเกิดไม่ได้"

[[wrong]]
