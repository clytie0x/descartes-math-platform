title = "การเดินในโรงเรียน"
level = 2
type = "number"
track = "adv"
answer = "8"
truth = '''sqrt((6-6)**2+8**2)'''
hints = ['รวมองค์ประกอบตะวันออกตะวันตกก่อนหาขนาด']
statement = '''
เดินตะวันออก $6$ เมตร เหนือ $8$ เมตร แล้วตะวันตก $6$ เมตร ขนาดการกระจัดกี่เมตร
'''
solution = '''
ตั้งทิศตะวันออกเป็นแกน $x$ และทิศเหนือเป็นแกน $y$ สามช่วงที่เดินคือ $\langle6,0\rangle$ $\langle0,8\rangle$ และ $\langle-6,0\rangle$

บวกทีละองค์ประกอบ $\langle6+0-6,\ 0+8+0\rangle=\langle0,8\rangle$ ช่วงตะวันออกกับตะวันตกหักล้างกันพอดี

ขนาดการกระจัดคือ $\sqrt{0^2+8^2}=8$ เมตร ส่วนระยะเดินคือ $6+8+6=20$ เมตร ซึ่งตอบคนละคำถาม
'''

[[wrong]]
answer = "20"
message = "20 คือระยะเดิน การกระจัดดูจากจุดเริ่มถึงจุดจบ"
