title = "ลากรถเข็น"
level = 2
type = "number"
track = "adv"
answer = "48"
truth = '''Matrix([12,5]).dot(Matrix([4,0]))'''
hints = ['งานเท่ากับแรงดอตการกระจัด']
statement = '''
แรง $\langle12,5\rangle$ นิวตันทำให้รถเคลื่อน $\langle4,0\rangle$ เมตร งานกี่จูล
'''
solution = '''
งานของแรงคงที่คือดอตโปรดักต์ของแรงกับการกระจัด $W=\mathbf F\cdot\mathbf s$

$W=\langle12,5\rangle\cdot\langle4,0\rangle=12(4)+5(0)=48$ จูล

องค์ประกอบแนวตั้ง $5$ นิวตันตั้งฉากกับการเคลื่อนที่แนวนอน จึงไม่ทำงาน มีแต่ส่วนแนวนอน $12$ นิวตันที่ลากรถไป $4$ เมตร
'''

[[wrong]]
answer = "68"
message = "แรงแนวตั้งไม่ทำงานเมื่อไม่มีการกระจัดแนวตั้ง"
