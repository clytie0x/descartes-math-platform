statement = '''
หา $\langle1,2,3\rangle\cdot\langle4,0,-1\rangle$
'''
solution = '''
คูณองค์ประกอบตำแหน่งเดียวกันแล้วบวกกัน

$\langle1,2,3\rangle\cdot\langle4,0,-1\rangle=1(4)+2(0)+3(-1)=4+0-3=1$

ผลลัพธ์เป็นจำนวน ไม่ใช่เวกเตอร์ ค่าเป็นบวกจึงบอกด้วยว่ามุมระหว่างสองเวกเตอร์เป็นมุมแหลม
'''

