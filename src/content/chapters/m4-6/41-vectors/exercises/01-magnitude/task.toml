ขนาดของเวกเตอร์สามมิติคือรากที่สองของผลบวกกำลังสองขององค์ประกอบทั้งสาม

$\|\langle2,-3,6\rangle\|=\sqrt{2^2+(-3)^2+6^2}=\sqrt{4+9+36}=\sqrt{49}=7$

องค์ประกอบ $-3$ ยกกำลังสองได้ $9$ ซึ่งเป็นบวก ขนาดจึงไม่ขึ้นกับว่าองค์ประกอบติดลบหรือไม่
'''

