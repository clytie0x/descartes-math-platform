title = "พื้นที่สามเหลี่ยม"
level = 3
type = "number"
track = "adv"
answer = "6"
truth = '''Matrix([3,0,0]).cross(Matrix([0,4,0])).norm()/2'''
hints = ['พื้นที่สามเหลี่ยมเป็นครึ่งหนึ่งของขนาดครอสโปรดักต์']
statement = '''
ด้านจากมุมเดียวกันคือ $\langle3,0,0\rangle$ กับ $\langle0,4,0\rangle$ หาพื้นที่สามเหลี่ยม
'''
solution = '''
หาครอสโปรดักต์ของสองด้าน องค์ประกอบแรก $0(0)-0(4)=0$ องค์ประกอบกลาง $0(0)-3(0)=0$ องค์ประกอบที่สาม $3(4)-0(0)=12$ ได้ $\langle0,0,12\rangle$

ขนาด $12$ คือพื้นที่สี่เหลี่ยมด้านขนานที่มีสองด้านนี้ สามเหลี่ยมเป็นครึ่งหนึ่งของสี่เหลี่ยมด้านขนาน จึงได้ $\tfrac{12}{2}=6$ ตารางหน่วย

ตรวจ สองด้านตั้งฉากกันตามแกน $x$ และแกน $y$ สามเหลี่ยมมุมฉากมีพื้นที่ $\tfrac12\times3\times4=6$ ตรงกัน
'''

[[wrong]]
answer = "12"
message = "ขนาดครอสโปรดักต์คือพื้นที่สี่เหลี่ยมด้านขนาน ต้องหารสอง"
