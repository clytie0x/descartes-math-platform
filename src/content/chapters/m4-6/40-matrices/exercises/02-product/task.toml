title = "สมาชิกของผลคูณ"
level = 1
type = "number"
statement = '''ให้ $A=\begin{bmatrix}1&2\\3&4\end{bmatrix}$ $B=\begin{bmatrix}2&0\\1&5\end{bmatrix}$ สมาชิกแถวหนึ่งคอลัมน์สองของ $AB$ เท่าไร'''
solution = '''
มิติ $(2 \times 2)(2 \times 2)$ คูณได้ สมาชิกแถวหนึ่งคอลัมน์สองของ $AB$ ใช้แถวหนึ่งของ $A$ คือ $1, 2$ จับคู่กับคอลัมน์สองของ $B$ คือ $0, 5$

คูณคู่แล้วบวก $1(0) + 2(5) = 0 + 10 = 10$
'''
answer = "10"
truth = "(Matrix([[1,2],[3,4]])*Matrix([[2,0],[1,5]]))[0,1]"
