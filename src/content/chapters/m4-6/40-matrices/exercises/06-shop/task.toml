title = "ราคาสินค้าสองชนิด"
level = 2
type = "number"
statement = "สมุดสามเล่มกับปากกาหนึ่งด้าม $85$ บาท สมุดหนึ่งเล่มกับปากกาหนึ่งด้าม $35$ บาท จงหาราคาสมุดหนึ่งเล่ม"
solution = '''
ให้สมุดเล่มละ $x$ บาท ปากกาด้ามละ $y$ บาท ได้ระบบ $3x + y = 85$ และ $x + y = 35$ เขียนเป็น $AX = B$ เมื่อ $A = \begin{bmatrix}3&1\\1&1\end{bmatrix}$ และ $B = \begin{bmatrix}85\\35\end{bmatrix}$

$\det A = 3(1) - 1(1) = 2$ ไม่เป็นศูนย์ ใช้กฎของคราเมอร์ แทนคอลัมน์แรกด้วย $B$ ได้ $\det A_x = 85(1) - 1(35) = 50$ จึงได้ $x = \dfrac{50}{2} = 25$

สมุดเล่มละ $25$ บาท แทนกลับใน $x + y = 35$ ได้ปากกาด้ามละ $10$ บาท ตรวจ $3(25) + 10 = 85$ ถูกต้อง
'''
answer = "25"
truth = "(Matrix([[3,1],[1,1]]).inv()*Matrix([85,35]))[0]"
track = "adv"
hints = ["ตั้ง x เป็นราคาสมุด y เป็นราคาปากกา และเรียงตัวแปรเหมือนกันทั้งสองแถว", "ลบสมการที่สองจากสมการแรกเพื่อตัด y หรือใช้กฎของคราเมอร์"]

[[wrong]]
answer = "10"
