title = "ตั๋วกิจกรรม"
level = 2
type = "number"
statement = "ขายตั๋วนักเรียนใบละ $20$ บาท ผู้ใหญ่ใบละ $35$ บาท รวม $40$ ใบได้เงิน $1010$ บาท ขายตั๋วผู้ใหญ่กี่ใบ"
solution = '''
ให้ขายตั๋วนักเรียน $s$ ใบ ตั๋วผู้ใหญ่ $a$ ใบ สมการจำนวนตั๋ว $s + a = 40$ สมการเงิน $20s + 35a = 1010$

เมทริกซ์สัมประสิทธิ์ $\begin{bmatrix}1&1\\20&35\end{bmatrix}$ มีดีเทอร์มิแนนต์ $35 - 20 = 15$ ใช้กฎของคราเมอร์กับตัวแปรที่สอง แทนคอลัมน์ของ $a$ ด้วยด้านขวา ได้ $\det\begin{bmatrix}1&40\\20&1010\end{bmatrix} = 1010 - 800 = 210$ จึงได้ $a = \dfrac{210}{15} = 14$ ใบ

ตั๋วนักเรียนจึงเป็น $40 - 14 = 26$ ใบ ตรวจ $20(26) + 35(14) = 520 + 490 = 1010$ ถูกต้อง
'''
answer = "14"
truth = "(Matrix([[1,1],[20,35]]).inv()*Matrix([40,1010]))[1]"
track = "adv"
hints = ["ตั้งจำนวนนักเรียนกับผู้ใหญ่รวมกันเป็นสี่สิบ", "ลบยี่สิบเท่าของสมการจำนวนออกจากสมการรายรับเพื่อตัดจำนวนนักเรียน"]

[[wrong]]
answer = "26"
message = "ยี่สิบหกคือจำนวนนักเรียน คำถามต้องการตั๋วผู้ใหญ่"
