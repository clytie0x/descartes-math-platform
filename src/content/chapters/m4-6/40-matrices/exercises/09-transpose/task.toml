title = "สลับเปลี่ยนของผลคูณ"
level = 2
type = "number"
statement = '''ให้ $A=\begin{bmatrix}2&1\\0&3\end{bmatrix}$ และ $B=\begin{bmatrix}1&4\\2&-1\end{bmatrix}$ สมาชิกแถวหนึ่งคอลัมน์สองของ $(AB)^t$ เท่าไร'''
solution = '''
การสลับเปลี่ยนย้ายสมาชิกตำแหน่ง $(2, 1)$ ไปไว้ที่ $(1, 2)$ สมาชิกแถวหนึ่งคอลัมน์สองของ $(AB)^t$ จึงเท่ากับสมาชิกแถวสองคอลัมน์หนึ่งของ $AB$

สมาชิกนั้นใช้แถวสองของ $A$ คือ $0, 3$ คู่กับคอลัมน์หนึ่งของ $B$ คือ $1, 2$ ได้ $0(1) + 3(2) = 6$

ตรวจด้วย $(AB)^t = B^tA^t$ แถวหนึ่งของ $B^t$ คือ $1, 2$ คอลัมน์สองของ $A^t$ คือ $0, 3$ ได้ $1(0) + 2(3) = 6$ เท่ากัน
'''
answer = "6"
truth = "(Matrix([[2,1],[0,3]])*Matrix([[1,4],[2,-1]])).T[0,1]"
track = "adv"
hints = ["สมาชิกแถว i คอลัมน์ j ของเมทริกซ์สลับเปลี่ยน คือสมาชิกแถว j คอลัมน์ i ของเมทริกซ์เดิม", "หาสมาชิกแถวสองคอลัมน์หนึ่งของ AB"]

