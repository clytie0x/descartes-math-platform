title = "ระบบที่ไม่มีผกผัน"
level = 3
type = "self"
statement = "ระบบ $x+3y=9$ และ $2x+6y=18$ ไม่มีเมทริกซ์ผกผัน จงอธิบายจำนวนคำตอบและเขียนคำตอบทั่วไป"
solution = '''
เมทริกซ์สัมประสิทธิ์ $\begin{bmatrix}1&3\\2&6\end{bmatrix}$ มีดีเทอร์มิแนนต์ $6 - 6 = 0$ จึงใช้ผกผันหรือกฎของคราเมอร์ไม่ได้ ต้องดูสมการเอง

สมการที่สองคือสมการแรกคูณสองทั้งด้านซ้ายและด้านขวา $2(x + 3y) = 2(9)$ จึงไม่ได้ให้ข้อมูลใหม่ เหลือสมการเดียวคือ $x + 3y = 9$ ระบบจึงมีคำตอบมากมายไม่จำกัด กราฟเป็นเส้นตรงสองเส้นที่ทับกัน

ตั้ง $y = t$ แล้ว $x = 9 - 3t$ เมื่อ $t\in\mathbb R$ เช่น $t = 0$ ได้ $(9, 0)$ และ $t = 1$ ได้ $(6, 1)$

เกณฑ์ตรวจคือไม่สรุปว่าไม่มีคำตอบเพียงเพราะ det เป็นศูนย์ และแทนรูปทั่วไปแล้วผ่านทั้งสองสมการ
'''
checks = ["expand((9-3*t)+3*t)==9", "expand(2*(9-3*t)+6*t)==18"]
track = "adv"
hints = ["ตรวจว่าสมการที่สองเป็นกี่เท่าของสมการแรกทั้งสองข้าง", "ตั้ง y เป็นพารามิเตอร์แล้วเขียน x ตาม y เพื่อแสดงทุกคำตอบ"]
