title = "ตำแหน่งสมาชิก"
level = 1
type = "number"
statement = '''ให้ $A=\begin{bmatrix}2&5&7\\3&4&8\end{bmatrix}$ หา $a_{23}$'''
solution = '''
$A$ มีสองแถวสามคอลัมน์ ตัวห้อยของ $a_{23}$ อ่านแถวก่อนคอลัมน์ ตัวแรกคือแถวที่สอง ตัวหลังคือคอลัมน์ที่สาม

แถวที่สองคือ $3, 4, 8$ สมาชิกตัวที่สามของแถวนี้คือ $8$ จึงได้ $a_{23} = 8$
'''
answer = "8"
truth = "Matrix([[2,5,7],[3,4,8]])[1,2]"
track = "adv"
hints = ["ดัชนีแรกบอกแถวที่สอง ดัชนีหลังบอกคอลัมน์ที่สาม"]

