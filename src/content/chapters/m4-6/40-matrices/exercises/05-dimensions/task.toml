title = "มิติผลคูณ"
level = 1
type = "choice"
statement = '''ถ้า $A$ ขนาด $2\times3$ และ $B$ ขนาด $3\times4$ ผลคูณ $AB$ มีมิติใด'''
solution = '''
เขียนมิติเรียงกัน $(2 \times 3)(3 \times 4)$ ตัวเลขด้านในคือ $3$ กับ $3$ เท่ากัน จึงคูณได้ เพราะแต่ละแถวของ $A$ มีสามตัว จับคู่กับแต่ละคอลัมน์ของ $B$ ที่มีสามตัวได้ครบ

ผลคูณมีแถวเท่ากับจำนวนแถวของ $A$ คือ $2$ และคอลัมน์เท่ากับจำนวนคอลัมน์ของ $B$ คือ $4$ จึงได้มิติ $2\times4$
'''
choices = ['''$3\times3$''', '''$2\times4$''', '''$4\times2$''']
checks = ["Matrix.zeros(2,3).__mul__(Matrix.zeros(3,4)).shape==(2,4)"]
answer = 1
track = "adv"
hints = ["มิติด้านในสามเท่ากันจึงคูณได้", "ผลลัพธ์ใช้จำนวนแถวตัวหน้าและคอลัมน์ตัวหลัง"]

