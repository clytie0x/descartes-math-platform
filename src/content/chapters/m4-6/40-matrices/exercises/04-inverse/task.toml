title = "สมาชิกผกผัน"
level = 2
type = "number"
statement = '''ให้ $A=\begin{bmatrix}3&1\\2&1\end{bmatrix}$ สมาชิกแถวหนึ่งคอลัมน์สองของ $A^{-1}$ คืออะไร'''
solution = '''
หาดีเทอร์มิแนนต์ก่อน $\det A = 3(1) - 1(2) = 1$ ไม่เป็นศูนย์ จึงมีผกผัน

สลับสมาชิกบนแนวทแยงหลัก $3$ กับ $1$ เปลี่ยนเครื่องหมายสมาชิกบนแนวทแยงรอง แล้วหารทุกตัวด้วย $1$ ได้ $A^{-1}=\begin{bmatrix}1&-1\\-2&3\end{bmatrix}$

ตรวจ $AA^{-1}$ ช่องแถวหนึ่งคอลัมน์หนึ่งได้ $3(1) + 1(-2) = 1$ ช่องแถวหนึ่งคอลัมน์สองได้ $3(-1) + 1(3) = 0$ ถูกต้อง สมาชิกที่ถามคือ $-1$
'''
answer = "-1"
truth = "Matrix([[3,1],[2,1]]).inv()[0,1]"
track = "adv"
hints = ["หาดีเทอร์มิแนนต์ก่อนเพื่อยืนยันว่ามีผกผัน", "สมาชิกนอกทแยงของผกผันเปลี่ยนเครื่องหมายแล้วหาร det"]

[[wrong]]
answer = "1"
message = "สมาชิกนอกทแยงหลักต้องเปลี่ยนเครื่องหมายก่อนหารด้วยดีเทอร์มิแนนต์"
