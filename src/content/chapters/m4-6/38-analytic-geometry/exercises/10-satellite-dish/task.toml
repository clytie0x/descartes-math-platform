title = "หัวรับสัญญาณของจาน"
level = 3
type = "number"
unit = "เซนติเมตร"
statement = '''จานรับสัญญาณรูปพาราโบลากว้าง $80$ เซนติเมตร ลึก $20$ เซนติเมตร ต้องติดหัวรับสัญญาณที่โฟกัส หัวรับสัญญาณอยู่ห่างจากก้นจานกี่เซนติเมตร'''
solution = '''วางก้นจานที่จุดกำเนิดให้จานเปิดขึ้น สมการคือ $x^2 = 4py$ ขอบจานอยู่ห่างแกน $40$ เซนติเมตร ซึ่งเป็นครึ่งหนึ่งของความกว้าง และสูง $20$ เซนติเมตร จุด $(40, 20)$ จึงอยู่บนพาราโบลา แทนค่าได้ $1600 = 4p(20) = 80p$ จึงได้ $p = 20$ โฟกัสอยู่ห่างก้นจาน $20$ เซนติเมตร ซึ่งพอดีกับระดับขอบจาน'''
answer = "20"
truth = "Rational(40**2, 4*20)"
track = "adv"
hints = ["วางจุดยอดที่จุดกำเนิด ใช้ x² = 4py", "ขอบจานอยู่ที่ x เท่ากับครึ่งหนึ่งของความกว้าง"]

[[wrong]]
answer = "80"
message = "แปดสิบคือ 4p ต้องหารด้วยสี่ก่อนจึงได้ระยะถึงโฟกัส"
