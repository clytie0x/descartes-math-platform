title = "รัศมีจากรูปทั่วไป"
level = 2
type = "number"
statement = "วงกลม $x^2 + y^2 + 4x - 10y + 20 = 0$ มีรัศมีเท่าไร"
solution = '''จับกลุ่มทีละตัวแปรแล้วย้ายค่าคงตัว $(x^2 + 4x) + (y^2 - 10y) = -20$ เติมกำลังสองของครึ่งหนึ่งของสัมประสิทธิ์ คือ $4$ และ $25$ ทั้งสองข้าง ได้ $(x + 2)^2 + (y - 5)^2 = -20 + 4 + 25 = 9$ ขวามือคือ $r^2$ รัศมีจึงเป็น $\sqrt9 = 3$ และศูนย์กลางคือ $(-2, 5)$'''
answer = "3"
truth = "sqrt(-20 + 4 + 25)"
track = "adv"
hints = ["จับกลุ่ม x กับ x และ y กับ y แล้วย้าย 20 ไปขวามือ", "เติม 4 และ 25 ทั้งสองข้าง แล้วถอดรากขวามือ"]

[[wrong]]
answer = "9"
message = "เก้าคือรัศมีกำลังสอง ต้องถอดรากอีกครั้ง"

[[wrong]]
answer = "sqrt(20)"
message = "ยี่สิบเป็นค่าคงตัวในรูปทั่วไป ไม่ใช่รัศมีกำลังสอง ต้องทำกำลังสองสมบูรณ์ก่อน"
