title = "พิกัดกึ่งกลาง"
level = 1
type = "number"
statement = "จุดกึ่งกลางของ $(-4,3)$ กับ $(6,7)$ มีพิกัด $x$ เท่าไร"
solution = '''พิกัด $x$ ของจุดกึ่งกลางคือค่าเฉลี่ยของพิกัด $x$ สองปลาย $\dfrac{-4 + 6}{2} = \dfrac{2}{2} = 1$ ตรวจได้ว่า $1$ อยู่ห่างจาก $-4$ และ $6$ เท่ากันคือ $5$ หน่วย'''
answer = "1"
truth = "Rational(-4+6,2)"
track = "adv"
hints = ["พิกัด x ของจุดกึ่งกลางคือค่าเฉลี่ยของพิกัด x สองปลาย"]

