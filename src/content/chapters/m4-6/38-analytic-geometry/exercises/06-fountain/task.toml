title = "รัศมีน้ำพุ"
level = 1
type = "number"
statement = "ขอบน้ำพุบนแผนที่มีสมการ $(x-2)^2+(y+1)^2=49$ หน่วยเป็นเมตร รัศมีเท่าไร"
solution = '''เทียบกับ $(x - h)^2 + (y - k)^2 = r^2$ ขวามือคือรัศมีกำลังสอง $r^2 = 49$ จึงมี $r=\sqrt{49}=7$ เมตร ส่วน $(2, -1)$ คือศูนย์กลาง ไม่เกี่ยวกับรัศมี'''
answer = "7"
truth = "sqrt(49)"
track = "adv"
hints = ["สมการวงกลมขวามือคือรัศมีกำลังสอง"]

