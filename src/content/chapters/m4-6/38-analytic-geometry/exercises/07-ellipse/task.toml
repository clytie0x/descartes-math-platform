title = "โฟกัสวงรี"
level = 2
type = "number"
statement = "วงรี $x^2/36+y^2/20=1$ มีโฟกัสห่างจากศูนย์กลางเท่าไร"
solution = '''ตัวส่วนที่ใหญ่กว่าคือ $36$ จึงเป็น $a^2$ และ $b^2 = 20$ วงรีใช้ $c^2 = a^2 - b^2 = 36 - 20 = 16$ จึงได้ $c = 4$ โฟกัสอยู่ห่างศูนย์กลาง $4$ หน่วย ซึ่งน้อยกว่า $a = 6$ ตามที่ควร'''
answer = "4"
truth = "sqrt(36-20)"
track = "adv"
hints = ["วงรีใช้ c กำลังสองเท่ากับผลต่างกำลังสองกึ่งแกน", "ถอดรากหลังลบตัวส่วนทั้งสองแล้ว"]

