title = "โฟกัสพาราโบลา"
level = 1
type = "choice"
statement = "พาราโบลา $y^2=12x$ มีโฟกัสข้อใด"
solution = '''$y$ ยกกำลังสอง จึงเทียบกับ $y^2 = 4px$ ได้ $4p = 12$ หารสี่ได้ $p = 3$ เป็นบวก กราฟเปิดขวา โฟกัสอยู่บนแกน $x$ ห่างจุดยอด $(0, 0)$ ไป $3$ หน่วย คือ $(3, 0)$'''
choices = ["$(12,0)$", "$(3,0)$", "$(0,3)$"]
checks = ["12/4==3"]
answer = 1
track = "adv"
hints = ["เทียบสัมประสิทธิ์สิบสองกับสี่ p", "รูป y กำลังสองบอกว่าแกนเปิดเป็นแนวนอน"]

[[wrong]]
answer = 0
message = "สิบสองคือ 4p ต้องหารด้วยสี่ก่อนหาโฟกัส"
