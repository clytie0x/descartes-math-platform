title = "สมการเส้นตรง"
level = 1
type = "expr"
statement = "เขียน $y$ ในรูปนิพจน์ของ $x$ สำหรับเส้นผ่าน $(0,2)$ และ $(3,8)$"
solution = '''ความชัน $\dfrac{8-2}{3-0} = \dfrac{6}{3} = 2$ เส้นผ่าน $(0, 2)$ ซึ่งอยู่บนแกน $y$ จุดตัดแกน $y$ จึงเป็น $2$ ได้ $y = 2x + 2$ ตรวจจุด $(3, 8)$ ได้ $2(3) + 2 = 8$ ถูกต้อง'''
answer = "2x+2"
truth = "2*x+2"
track = "adv"
hints = ["หาความชันจากผลต่าง y หารผลต่าง x", "จุดที่ x เป็นศูนย์บอกค่าคงตัวในรูปความชัน"]

[[wrong]]
answer = "2x-2"
message = "เส้นผ่าน (0,2) จึงมีค่าคงตัวบวกสอง ตรวจด้วยแทน x เป็นศูนย์"
