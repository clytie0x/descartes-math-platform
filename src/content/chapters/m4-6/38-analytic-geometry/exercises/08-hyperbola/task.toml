title = "ตรวจกราฟไฮเพอร์โบลา"
level = 3
type = "self"
statement = "วาดกราฟคร่าวๆ ของ $y^2/9-x^2/16=1$ พร้อมจุดยอด โฟกัส และเส้นกำกับ"
solution = '''ศูนย์กลาง $(0,0)$ เปิดขึ้นลงเพราะพจน์ $y$ เป็นบวก จุดยอด $(0,\pm3)$ โฟกัส $(0,\pm5)$ จาก $c^2=9+16$ เส้นกำกับ $y=\pm3x/4$ เกณฑ์ตรวจคือทิศเปิดถูก จุดยอดอยู่แกน y โฟกัสอยู่นอกจุดยอด และเส้นกำกับสองเส้นผ่านศูนย์กลาง'''
checks = ["sqrt(9+16)==5", "Rational(3,4)*4==3"]
track = "adv"
hints = ["พจน์ y เป็นบวกจึงเปิดขึ้นลง", "ใช้ c กำลังสองเป็นผลบวก และหาความชันเส้นกำกับตามทิศนี้"]
