title = "ระยะถึงถนน"
level = 2
type = "number"
statement = "แผนที่หน่วยกิโลเมตรแทนบ้านด้วย $(1,2)$ และถนนด้วย $3x+4y-1=0$ ระยะตรงที่สั้นที่สุดจากบ้านถึงถนนเท่าไร"
solution = '''ระยะสั้นที่สุดคือระยะตั้งฉาก ใช้สูตร $\dfrac{|Ax_0 + By_0 + C|}{\sqrt{A^2 + B^2}}$ แทน $(1, 2)$ ได้ตัวเศษ $|3(1) + 4(2) - 1| = |10| = 10$ ตัวส่วน $\sqrt{9+16} = 5$ ระยะ $\dfrac{10}{5} = 2$ กิโลเมตร'''
answer = "2"
truth = "abs(3*1+4*2-1)/sqrt(9+16)"
track = "adv"
hints = ["แทนพิกัดบ้านในสาม x บวกสี่ y ลบหนึ่งแล้วหาค่าสัมบูรณ์", "หารด้วยรากที่สองของสามกำลังสองบวกสี่กำลังสอง"]

