title = "ผลสำรวจโรงอาหาร"
level = 2
type = "number"
answer = "25"
truth = '''Rational(80-32-28,80)*100'''
hints = ['หาจำนวนที่เหลือก่อนแปลงเป็นร้อยละ']
statement = '''
ผู้ตอบ $80$ คน เลือกข้าว $32$ คน เลือกเส้น $28$ คน ที่เหลือเลือกเมนูอื่นและแต่ละคนเลือกหนึ่งข้อ เมนูอื่นคิดเป็นร้อยละเท่าไร
'''
solution = '''
แต่ละคนเลือกหนึ่งข้อ หมวดจึงไม่ทับซ้อน จำนวนคนในทุกหมวดรวมกันต้องได้ $80$ คน

หาจำนวนผู้เลือกเมนูอื่นก่อน $80-32-28=20$ คน

แปลงเป็นร้อยละของผู้ตอบ $\frac{20}{80}\times100=25\%$

ตรวจ ข้าว $\frac{32}{80}\times100=40\%$ เส้น $\frac{28}{80}\times100=35\%$ เมนูอื่น $25\%$ รวม $40+35+25=100$ พอดี
'''

[[wrong]]
answer = "20"
message = "ยี่สิบเป็นจำนวนคน โจทย์ถามร้อยละ"
