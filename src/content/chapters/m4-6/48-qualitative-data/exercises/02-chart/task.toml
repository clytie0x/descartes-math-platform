statement = '''
คำถามเลือกได้หลายข้อเหมาะกับแผนภูมิใดมากกว่าเพื่อเทียบจำนวนผู้เลือกแต่ละข้อ
'''
solution = '''
คำถามแบบเลือกได้หลายข้อทำให้หนึ่งคนถูกนับได้หลายประเภท ประเภทจึงทับซ้อนกัน และผลรวมร้อยละมักเกิน $100$

แผนภูมิวงกลมสัญญาว่าทุกชิ้นรวมกันเป็นทั้งหมดพอดี ถ้าร้อยละรวมเกิน $100$ จะวาดตามจริงไม่ได้ ต้องย่อทุกชิ้นลงจนผู้อ่านเข้าใจสัดส่วนผิด

แผนภูมิแท่งไม่มีเงื่อนไขนี้ แต่ละแท่งแสดงจำนวนหรือร้อยละของผู้ตอบที่เลือกข้อนั้นแยกกัน จึงใช้แผนภูมิแท่ง โดยระบุฐานเป็นจำนวนผู้ตอบ และเขียนกำกับว่าเลือกได้หลายข้อ
'''

[[wrong]]
answer = 1
message = "ข้อมูลหลายคำตอบมีประเภททับซ้อน ไม่เหมาะกับวงกลมส่วนของทั้งหมด"
