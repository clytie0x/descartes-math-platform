title = "ตรวจแกนกราฟ"
level = 1
type = "self"
hints = ['เปรียบเทียบความยาวแท่งจากฐานที่ถูกตัดออก']
statement = '''
กราฟแท่งแสดงจำนวน 98 กับ 100 โดยแกนเริ่มที่ 97 ทำให้แท่งที่สองสูงสามเท่า จงวิจารณ์และเสนอวิธีแก้
'''
solution = '''
**หาจุดที่หลอกตา** แกนเริ่มที่ $97$ ส่วนที่มองเห็นของแท่งแรกจึงยาว $98-97=1$ หน่วย แท่งที่สองยาว $100-97=3$ หน่วย ภาพบอกว่าแท่งที่สองยาว $3$ เท่า

**เทียบกับข้อมูลจริง** อัตราส่วนจริงคือ $100/98$ ประมาณ $1.02$ เท่า มากกว่ากันเพียงราว $2\%$ ภาพจึงขยายความต่างจาก $1.02$ เท่าเป็น $3$ เท่า เพราะแผนภูมิแท่งใช้ความยาวทั้งแท่งแทนค่า เมื่อตัดฐานทิ้ง ความยาวจึงไม่เป็นสัดส่วนกับค่าอีกต่อไป

**วิธีแก้** เริ่มแกนที่ $0$ ให้ความยาวเป็นสัดส่วนกับข้อมูล แล้วเขียนค่า $98$ และ $100$ บนแท่ง ถ้าความต่างสองหน่วยสำคัญจริง ให้บอกเป็นตัวเลขในข้อความ หากจำเป็นต้องตัดแกนต้องมีรอยหยักที่แกนบอกชัด และไม่ชวนอ่านเป็นอัตราส่วนความยาว
'''
