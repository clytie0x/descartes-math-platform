answer = "15"
truth = '''45-30'''
hints = ['จุดร้อยละใช้การลบตรงๆ ไม่หารฐานเดิม']
statement = '''
สัดส่วนสองกลุ่มเป็น $45\%$ และ $30\%$ กลุ่มแรกมากกว่ากี่จุดร้อยละ
'''
solution = '''
จุดร้อยละใช้เทียบร้อยละสองค่าด้วยการลบตรงๆ เพราะทั้งสองค่ามีหน่วยเป็นร้อยละอยู่แล้ว

$$45-30=15 \text{ จุดร้อยละ}$$

ระวังอย่าสับสนกับร้อยละที่มากกว่าเมื่อเทียบฐาน ซึ่งคิดจาก $\frac{45-30}{30}\times100=50\%$ ค่านี้ตอบคำถามว่ากลุ่มแรกมากกว่ากลุ่มที่สองกี่เปอร์เซ็นต์ของกลุ่มที่สอง เป็นคนละคำถามกับจำนวนจุดร้อยละ
'''

