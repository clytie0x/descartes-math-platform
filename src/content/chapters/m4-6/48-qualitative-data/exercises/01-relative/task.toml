title = "ความถี่สัมพัทธ์"
level = 1
type = "number"
answer = "1/4"
truth = '''Rational(12,48)'''
hints = ['ความถี่สัมพัทธ์คือความถี่หารจำนวนรวม']
statement = '''
มีผู้เลือกเมนูหนึ่ง $12$ จาก $48$ คน ความถี่สัมพัทธ์เท่าไร
'''
solution = '''
ความถี่สัมพัทธ์คือความถี่หารด้วยจำนวนรวม ในที่นี้ความถี่ของเมนูนี้คือ $12$ และจำนวนรวมคือ $48$

$$\frac{12}{48}=\frac{1}{4}$$

ตรวจความหมาย $48$ คนแบ่งเป็นสี่ส่วนเท่าๆ กัน ส่วนละ $12$ คน ผู้เลือกเมนูนี้จึงเป็นหนึ่งในสี่ของทั้งหมด ถ้าโจทย์ถามร้อยละจะได้ $\frac{1}{4}\times100=25\%$ แต่ความถี่สัมพัทธ์ตอบเป็นสัดส่วน $\frac{1}{4}$ หรือ $0.25$
'''

[[wrong]]
answer = "25"
message = "25 เป็นร้อยละ แต่ความถี่สัมพัทธ์ต้องเป็นหนึ่งในสี่"
