title = "มุมในวงกลม"
level = 1
type = "number"
answer = "126"
truth = '''Rational('0.35')*360'''
hints = ['เปลี่ยนร้อยละเป็นสัดส่วนแล้วคูณสามร้อยหกสิบ']
statement = '''
ประเภทหนึ่งมี $35\%$ มุมกี่องศา
'''
solution = '''
ทั้งวงกลมคือ $360$ องศาแทน $100\%$ ประเภทที่มี $35\%$ จึงได้มุม $35\%$ ของ $360$ องศา

เปลี่ยนร้อยละเป็นสัดส่วนก่อน $35\%=0.35$ แล้วคูณ $360$

$$0.35\times360=126 \text{ องศา}$$

หรือใช้ข้อที่ว่าร้อยละ $1$ เท่ากับ $3.6$ องศา ได้ $35\times3.6=126$ องศาเช่นกัน ตรวจด้วยตา $126$ องศามากกว่ามุมฉากเล็กน้อย สอดคล้องกับ $35\%$ ที่มากกว่าหนึ่งในสี่เล็กน้อย
'''

[[wrong]]
answer = "35"
message = "ร้อยละต้องแปลงเป็นส่วนของ 360 องศา"
