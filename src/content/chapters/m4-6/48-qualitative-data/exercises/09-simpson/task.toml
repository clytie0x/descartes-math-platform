title = "ภาพรวมกลับด้าน"
level = 3
type = "number"
unit = "%"
answer = "58"
truth = '''Rational(8+21,10+40)*100'''
hints = ['อัตรารวมทั้งปีคิดจากจำนวนลูกที่ลงรวมหารด้วยจำนวนลูกที่ชู้ตรวม', 'อย่าเฉลี่ยร้อยละของสองภาคเรียนตรงๆ เพราะจำนวนลูกที่ชู้ตไม่เท่ากัน']
statement = '''
นักบาสเกตบอลของโรงเรียนสองคนบันทึกการชู้ตลูกโทษไว้ดังนี้

| ผู้เล่น | ภาคเรียนที่ 1 ลง/ชู้ต | ภาคเรียนที่ 2 ลง/ชู้ต |
|---|---|---|
| ต้น | $8/10$ | $21/40$ |
| บอล | $30/40$ | $5/10$ |

ต้นมีอัตราลงห่วงสูงกว่าบอลทั้งสองภาคเรียน อัตราลงห่วงรวมทั้งปีของต้นเป็นร้อยละเท่าไร
'''
solution = '''
**ตรวจทีละภาคเรียน** ภาคเรียนที่ 1 ต้น $\frac{8}{10}=80\%$ บอล $\frac{30}{40}=75\%$ ภาคเรียนที่ 2 ต้น $\frac{21}{40}=52.5\%$ บอล $\frac{5}{10}=50\%$ ต้นสูงกว่าทั้งสองภาคเรียนจริง

**อัตรารวมทั้งปีของต้น** รวมลูกที่ลง $8+21=29$ ลูก จากที่ชู้ตทั้งหมด $10+40=50$ ลูก ได้

$$\frac{29}{50}\times100=58\%$$

**เทียบกับบอล** บอลลง $30+5=35$ จาก $50$ ลูก หรือ $70\%$ ภาพรวมทั้งปีบอลกลับสูงกว่าต้น ทั้งที่แพ้ทุกภาคเรียน นี่คือปรากฏการณ์ซิมป์สัน

**เหตุผล** อัตรารวมคือค่าเฉลี่ยถ่วงน้ำหนักด้วยจำนวนลูกที่ชู้ต ต้นชู้ตส่วนใหญ่ $40$ ลูกในภาคเรียนที่ 2 ซึ่งผู้เล่นทั้งสองมีอัตราลงห่วงต่ำกว่าภาคเรียนแรก ได้ $0.2(80)+0.8(52.5)=58$ ส่วนบอลชู้ตส่วนใหญ่ในภาคเรียนที่ 1 ได้ $0.8(75)+0.2(50)=70$ ถ้าเฉลี่ยสองภาคเรียนตรงๆ ของต้นจะได้ $66.25\%$ ซึ่งผิด เพราะให้น้ำหนัก $10$ ลูกเท่ากับ $40$ ลูก
'''
checks = ['''Rational(8,10)*100==80 and Rational(30,40)*100==75 and Rational(21,40)*100==Rational(105,2) and Rational(5,10)*100==50''', '''Rational(30+5,50)*100==70''', '''Rational(2,10)*80+Rational(8,10)*Rational(105,2)==58 and Rational(8,10)*75+Rational(2,10)*50==70''', '''(80+Rational(105,2))/2==Rational(265,4)''']

