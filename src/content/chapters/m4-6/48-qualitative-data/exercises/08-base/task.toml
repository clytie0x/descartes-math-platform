title = "ตรวจตัวหาร"
level = 3
type = "self"
checks = ['''Rational(10,25)*100==40''', '''Rational(10,20)*100==50''']
hints = ['เขียนชื่อกลุ่มที่เป็นตัวหารของแต่ละเศษส่วน']
statement = '''
ในนักเรียนหญิง 25 คน มีผู้ใช้รถรับส่ง 10 คน และผู้ใช้รถรับส่งทั้งหมด 20 คน จงอธิบายความต่างระหว่าง 10/25 กับ 10/20
'''
solution = '''
เศษส่วนสองตัวมีตัวเศษเท่ากันคือ $10$ คน ซึ่งเป็นนักเรียนหญิงที่ใช้รถรับส่ง แต่ตัวส่วนต่างกัน จึงตอบคนละคำถาม

$\frac{10}{25}\times100=40\%$ ตัวส่วนคือนักเรียนหญิง $25$ คน ค่านี้บอกว่า ในกลุ่มนักเรียนหญิง มีผู้ใช้รถรับส่ง $40\%$

$\frac{10}{20}\times100=50\%$ ตัวส่วนคือผู้ใช้รถรับส่งทั้งหมด $20$ คน ค่านี้บอกว่า ในกลุ่มผู้ใช้รถรับส่ง เป็นนักเรียนหญิง $50\%$

ถ้าเขียนแค่ว่า นักเรียนหญิงกับรถรับส่ง $50\%$ ผู้อ่านจะไม่รู้ว่าหมายถึงแบบไหน จึงต้องเขียนคำว่า ในกลุ่ม... นำหน้าทุกครั้ง
'''
