title = "ขยายรูปให้ซื่อตรง"
level = 2
type = "number"
label = 'ขยายด้าน'
unit = "เท่า"
answer = "4/3"
truth = '''sqrt(Rational(1600,900))'''
tolerance = 0.01
hints = ['หาก่อนว่าจำนวนผู้เข้าชมเพิ่มกี่เท่า', 'พื้นที่ของสี่เหลี่ยมจัตุรัสเพิ่มเป็นกำลังสองของตัวคูณด้าน']
statement = '''
งานนิทรรศการวิทยาศาสตร์ของโรงเรียนมีผู้เข้าชมปีที่แล้ว $900$ คน ปีนี้ $1{,}600$ คน ฝ่ายประชาสัมพันธ์จะวาดรูปสี่เหลี่ยมจัตุรัสแทนผู้เข้าชมแต่ละปี โดยให้พื้นที่เป็นสัดส่วนกับจำนวนคน ด้านของรูปปีนี้ต้องยาวกี่เท่าของด้านรูปปีที่แล้ว
'''
solution = '''
**อัตราส่วนของข้อมูล** ผู้เข้าชมเพิ่ม $\frac{1600}{900}=\frac{16}{9}$ เท่า พื้นที่ของรูปปีนี้จึงต้องเป็น $\frac{16}{9}$ เท่าของรูปปีที่แล้ว

**แปลงเป็นด้าน** ถ้าขยายด้านของสี่เหลี่ยมจัตุรัส $k$ เท่า พื้นที่จะเพิ่ม $k^2$ เท่า จึงต้องการ $k^2=\frac{16}{9}$ และ $k$ เป็นบวก ได้

$$k=\sqrt{\frac{16}{9}}=\frac{4}{3}$$

ประมาณ $1.33$ เท่า

**ตรวจ** $\left(\frac{4}{3}\right)^2=\frac{16}{9}$ ตรงกับอัตราส่วนผู้เข้าชม ถ้าขยายด้าน $\frac{16}{9}$ เท่าตามตัวเลขตรงๆ พื้นที่จะเพิ่ม $\frac{256}{81}$ ประมาณ $3.16$ เท่า ภาพจะบอกว่าผู้เข้าชมเพิ่มเกินสามเท่าทั้งที่เพิ่มไม่ถึงสองเท่า
'''
checks = ['''Rational(4,3)**2==Rational(16,9)''', '''Rational(16,9)**2==Rational(256,81) and abs(N(Rational(256,81))-3.16)<0.01''']

