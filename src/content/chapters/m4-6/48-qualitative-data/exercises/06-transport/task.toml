title = "เปรียบเทียบรถรับส่ง"
level = 2
type = "number"
answer = "60"
truth = '''Rational(18,30)*100'''
hints = ['ใช้จำนวนผู้ใช้รถหารจำนวนคนในห้อง']
statement = '''
ห้องหนึ่งใช้รถรับส่ง $18$ จาก $30$ คน คิดเป็นร้อยละเท่าไร
'''
solution = '''
ร้อยละคิดจากจำนวนผู้ใช้รถรับส่งหารด้วยจำนวนคนทั้งห้อง เพราะคำถามคือส่วนของห้อง

$$\frac{18}{30}\times100=60\%$$

ตรวจ $60\%$ ของ $30$ คนคือ $0.6\times30=18$ คน ตรงกับโจทย์ ผู้ที่ไม่ใช้รถรับส่งมี $12$ คน หรือ $40\%$ รวมกันได้ $100\%$
'''

[[wrong]]
answer = "18"
message = "สิบแปดคือจำนวนคน ต้องหารด้วยจำนวนทั้งห้อง"
