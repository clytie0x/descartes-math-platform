hints = ['มีสามตำแหน่งที่หัวครั้งเดียวเกิดได้']
statement = '''
โยนเหรียญยุติธรรมสามครั้ง โอกาสหัวหนึ่งครั้งเท่าไร
'''
solution = '''
1. ให้ $X$ เป็นจำนวนหัว การโยนเป็นอิสระ จำนวนครั้งคงที่ และโอกาสหัวเท่ากัน จึงได้ $X\sim B(3,1/2)$
2. ลำดับที่มีหัวพอดีหนึ่งครั้งคือ HTT THT TTH มี $\binom31=3$ ลำดับ แต่ละลำดับมีโอกาส $(1/2)^1(1/2)^2=1/8$
3. $P(X=1)=\binom31(1/2)^1(1/2)^2=3\times\dfrac18=\dfrac38$
'''

