choices = ['''นับหัวจากโยนเหรียญอิสระสิบครั้ง''', '''นับแดงจากหยิบสองลูกไม่คืน''', '''เวลารอรถ''']
answer = 0
hints = ['ตรวจจำนวนครั้งคงที่ สองผล อิสระ และโอกาสคงที่']
statement = '''
ข้อใดเข้ากับทวินามโดยตรง
'''
solution = '''
ตรวจสี่เงื่อนไขของทวินามทีละตัวเลือก คือจำนวนครั้งคงที่ แต่ละครั้งมีสองผล โอกาสสำเร็จเท่ากันทุกครั้ง และแต่ละครั้งเป็นอิสระ

1. โยนเหรียญอิสระสิบครั้งแล้วนับหัว จำนวนครั้งคงที่ $n=10$ แต่ละครั้งได้หัวหรือก้อย โอกาสหัวเท่ากันทุกครั้ง และการโยนไม่ขึ้นต่อกัน ครบทั้งสี่ข้อ จึงเป็น $B(10,p)$
2. หยิบสองลูกไม่คืนแล้วนับแดง โอกาสได้แดงในครั้งที่สองขึ้นกับว่าครั้งแรกได้แดงหรือไม่ จึงขาดเงื่อนไขโอกาสคงที่และความเป็นอิสระ
3. เวลารอรถเป็นค่าที่วัดได้ต่อเนื่อง ไม่ใช่จำนวนครั้งที่สำเร็จ จึงไม่ใช่ทวินาม

คำตอบคือข้อแรก
'''

[[wrong]]
answer = 1
message = "หยิบไม่คืนทำให้โอกาสเปลี่ยนและไม่เป็นอิสระ"
