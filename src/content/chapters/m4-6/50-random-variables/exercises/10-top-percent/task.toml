title = "คะแนนติดกลุ่มบนสุด"
level = 3
type = "number"
track = "adv"
unit = "คะแนน"
answer = "79.4"
tolerance = 0.1
truth = '''50 + Rational('1.96')*15'''
hints = ['กลุ่มร้อยละ $2.5$ บนสุดคือหางขวาพื้นที่ $0.025$ จึงต้องการ $z$ ที่พื้นที่ซ้ายเป็น $0.975$', 'แปลงกลับด้วย $x=\mu+z\sigma$']
statement = '''
คะแนนสอบคัดเลือกตามแบบจำลอง $N(50,15^2)$ ผู้ที่อยู่ในกลุ่มร้อยละ $2.5$ บนสุดจะได้ทุน ต้องได้อย่างน้อยกี่คะแนน กำหนด $\Phi(1.96)=0.9750$ ตอบเป็นทศนิยมหนึ่งตำแหน่ง
'''
solution = '''
1. กลุ่มร้อยละ $2.5$ บนสุดคือพื้นที่หางขวา $0.025$ พื้นที่ทางซ้ายของคะแนนตัดจึงเป็น $1-0.025=0.975$
2. ตารางให้ $\Phi(1.96)=0.9750$ คะแนนตัดจึงมีคะแนนมาตรฐาน $z=1.96$ เป็นบวกเพราะอยู่เหนือค่าเฉลี่ย
3. แปลงกลับจาก $z=\dfrac{x-\mu}{\sigma}$ ได้ $x=\mu+z\sigma=50+1.96(15)=50+29.4=79.4$ คะแนน
4. ตรวจความสมเหตุสมผล ตามกฎ 68 95 99.7 ราว $95\%$ อยู่ใน $\mu\pm2\sigma$ หางขวาจึงมีราว $2.5\%$ เหนือ $50+2(15)=80$ คำตอบ $79.4$ ใกล้ $80$ ตรงกัน
'''

