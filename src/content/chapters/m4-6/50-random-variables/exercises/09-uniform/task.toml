title = "จับสลากเลขที่"
level = 2
type = "number"
track = "adv"
answer = "11/40"
accept = ["0.275"]
truth = '''Rational(len([k for k in range(1, 41) if k % 5 == 0 or k > 36]), 40)'''
hints = ['ทุกเลขที่มีโอกาส $1/40$ เท่ากัน นับจำนวนเลขที่ที่เข้าเงื่อนไข', 'ระวังเลขที่ที่เป็นทั้งพหุคูณของ $5$ และมากกว่า $36$ อย่านับซ้ำ']
statement = '''
ครูจับสลากเลขที่ $1$ ถึง $40$ หนึ่งใบ ทุกใบมีโอกาสเท่ากัน ให้ $X$ เป็นเลขที่ที่ได้ จงหาโอกาสที่ $X$ หารด้วย $5$ ลงตัว หรือ $X$ มากกว่า $36$ ตอบเป็นเศษส่วนหรือทศนิยม
'''
solution = '''
1. ทุกเลขที่มีโอกาส $1/40$ เท่ากัน $X$ จึงมีการแจกแจงเอกรูป โอกาสของเหตุการณ์เท่ากับจำนวนค่าที่เข้าเงื่อนไขหารด้วย $40$
2. หารด้วย $5$ ลงตัวคือ $5,10,\ldots,40$ มี $40/5=8$ ค่า
3. มากกว่า $36$ คือ $37,38,39,40$ มี $4$ ค่า
4. ค่า $40$ อยู่ในทั้งสองกลุ่ม ใช้หลักการบวกแบบหักส่วนซ้ำ ได้ $8+4-1=11$ ค่า ไม่ใช่ $12$ ค่า
5. ตรวจด้วยการไล่ค่า $5,10,15,20,25,30,35,37,38,39,40$ ได้ $11$ ค่า โอกาสจึงเป็น $11/40=0.275$
'''

