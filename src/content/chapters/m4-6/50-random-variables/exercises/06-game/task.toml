title = "เกมงานโรงเรียน"
level = 2
type = "number"
track = "adv"
answer = "-1"
truth = '''20*Rational(1,4)-6'''
hints = ['คำนวณรายรับคาดหมายก่อนหักค่าเล่น']
statement = '''
เกมสมมติมีโอกาส $1/4$ ได้ $20$ บาท นอกนั้นได้ศูนย์ ค่าเล่น $6$ บาท กำไรคาดหมายกี่บาท
'''
solution = '''
1. ให้ $X$ เป็นรางวัล $X=20$ ด้วยโอกาส $1/4$ และ $X=0$ ด้วยโอกาส $3/4$
2. รางวัลคาดหมาย $E(X)=20\cdot\dfrac14+0\cdot\dfrac34=5$ บาท
3. กำไรสุทธิคือ $X-6$ ใช้สมบัติ $E(X+b)=E(X)+b$ ได้ $5-6=-1$ บาท
4. เกมนี้เสียเปรียบผู้เล่นเฉลี่ยครั้งละ $1$ บาท จะเป็นเกมยุติธรรมเมื่อค่าเล่นเท่ากับ $5$ บาท
'''

[[wrong]]
answer = "5"
message = "ห้าบาทเป็นรายรับคาดหมาย ต้องหักค่าเล่นหกบาท"
