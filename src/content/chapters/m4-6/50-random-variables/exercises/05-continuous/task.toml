title = "จุดกับช่วง"
level = 1
type = "self"
track = "adv"
hints = ['แยกความสูงของโค้งกับพื้นที่ใต้โค้ง']
statement = '''
อธิบายว่าทำไมความสูงของโค้งปกติที่จุดหนึ่งไม่ใช่ความน่าจะเป็น ณ จุดนั้น
'''
solution = '''
1. ความสูงของโค้งปกติที่จุดหนึ่งคือความหนาแน่น บอกว่าค่าแถวนั้นเกิดหนาแน่นแค่ไหน แต่ยังไม่ใช่ความน่าจะเป็น
2. ความน่าจะเป็นของตัวแปรต่อเนื่องคือพื้นที่ใต้โค้งบนช่วง ซึ่งเท่ากับความสูงโดยประมาณคูณความกว้างของช่วง
3. จุดเดี่ยวมีความกว้างศูนย์ พื้นที่จึงเป็นศูนย์ ความน่าจะเป็นที่ได้ค่าใดค่าหนึ่งพอดีจึงเป็นศูนย์ แม้ค่านั้นเป็นไปได้และความสูงของโค้งตรงนั้นเป็นบวก
4. ผลที่ตามมาคือ $P(a\le X\le b)=P(a<X<b)$ สำหรับตัวแปรต่อเนื่อง
'''
