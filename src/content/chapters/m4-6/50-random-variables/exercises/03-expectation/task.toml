answer = "2"
truth = '''0*Rational('0.6')+5*Rational('0.4')'''
hints = ['คูณแต่ละค่าด้วยโอกาสแล้วบวก']
statement = '''
$X=0,5$ ด้วยโอกาส $0.6,0.4$ จงหา $E(X)$
'''
solution = '''
1. ค่าคาดหมายคือผลบวกของค่าแต่ละค่าคูณโอกาสของค่านั้น $E(X)=\sum xp(x)$
2. $E(X)=0(0.6)+5(0.4)=0+2=2$
3. ค่า $2$ อยู่ใกล้ $0$ มากกว่า $5$ เพราะ $X=0$ มีโอกาสมากกว่า สมเหตุสมผล
'''

