title = "ตรวจชิ้นงาน"
level = 2
type = "number"
track = "adv"
answer = "3"
truth = '''30*Rational('0.1')'''
hints = ['ใช้ค่าคาดหมายของทวินาม n คูณ p']
statement = '''
ชิ้นงานอิสระแต่ละชิ้นเสียด้วยโอกาส $0.1$ ตรวจ $30$ ชิ้น คาดหมายชิ้นเสียกี่ชิ้น
'''
solution = '''
1. นับชิ้นเสีย จึงให้ชิ้นเสียเป็นสำเร็จ ชิ้นงานอิสระกัน จำนวนชิ้นคงที่ และโอกาสเสียเท่ากันทุกชิ้น ได้ $X\sim B(30,0.1)$
2. ค่าคาดหมายของทวินามคือ $E(X)=np=30(0.1)=3$ ชิ้น
3. ค่านี้เป็นค่าเฉลี่ยระยะยาว การตรวจแต่ละรอบอาจพบเสียมากหรือน้อยกว่า $3$ ชิ้นได้
'''

[[wrong]]
answer = "27"
message = "ยี่สิบเจ็ดคือจำนวนชิ้นดีคาดหมาย โจทย์ถามชิ้นเสีย"
