title = "ช่วงกำไร"
level = 2
type = "number"
statement = "แบบจำลองกำไร $P(x)=(x-3)(9-x)$ เป็นบวกเมื่อ $x$ เป็นจำนวนเต็มกี่ค่า"
solution = '''รากคือ $3$ และ $9$ ทดสอบ $x=0$ ได้ $(-3)(9)$ ลบ $x=5$ ได้ $(2)(4)$ บวก $x=10$ ได้ $(7)(-1)$ ลบ กำไรจึงเป็นบวกเฉพาะ $3<x<9$ ไม่รวมรากเพราะที่รากกำไรเป็นศูนย์ จำนวนเต็มในช่วงนี้คือ $4,5,6,7,8$ รวม $5$ ค่า'''
answer = "5"
truth = "len([v for v in range(0,15) if (v-3)*(9-v)>0])"
track = "adv"
hints = ["หารากสามกับเก้าแล้วดูเครื่องหมายระหว่างราก", "เลือกเฉพาะจำนวนเต็มที่ทำให้กำไรบวกอย่างเคร่งครัด"]

[[wrong]]
answer = "7"
message = "ที่รากกำไรเป็นศูนย์ ไม่ใช่บวก จึงไม่รวมสามกับเก้า"
