title = "คำตอบแปลกปลอม"
level = 2
type = "set"
statement = '''แก้สมการ $\frac{x^2}{x+3}=\frac{9}{x+3}$ ตอบทุกค่า'''
solution = '''ตัวส่วน $x+3$ เป็นศูนย์ที่ $x=-3$ จดไว้ก่อนว่า $x\ne-3$ คูณ $x+3$ ทั้งสองข้างได้ $x^2=9$ จึงได้ $x=3$ หรือ $x=-3$ แต่ $-3$ เป็นค่าต้องห้าม แทนแล้วตัวส่วนเป็นศูนย์ ต้องตัดทิ้ง ตรวจ $x=3$ ได้ $\frac{9}{6}=\frac{9}{6}$ จริง คำตอบมีตัวเดียวคือ $3$'''
answer = ["3"]
truth = "solve(x**2/(x+3) - 9/(x+3), x)"
track = "adv"
hints = ["หาค่าที่ทำให้ตัวส่วนเป็นศูนย์ก่อน", "คูณตัวส่วนทั้งสองข้างแล้วแก้ จากนั้นตัดค่าต้องห้ามออก"]

[[wrong]]
answer = ["-3", "3"]
message = "x = −3 ทำให้ตัวส่วนเป็นศูนย์ นิพจน์ไม่มีความหมาย จึงเป็นคำตอบแปลกปลอม ต้องตัดทิ้ง"
