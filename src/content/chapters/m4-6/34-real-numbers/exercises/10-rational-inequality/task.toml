title = "อสมการเศษส่วน"
level = 2
type = "choice"
statement = '''เซตคำตอบของอสมการ $\frac{x+3}{x-1}\le0$ คือข้อใด'''
solution = '''ห้ามคูณ $x-1$ ข้ามไป เพราะไม่รู้เครื่องหมาย ใช้ตารางเครื่องหมายแทน จุดแบ่งคือ $-3$ จากตัวเศษ และ $1$ จากตัวส่วน ทดสอบ $x=-4$ ได้ $\frac{-1}{-5}$ บวก $x=0$ ได้ $\frac{3}{-1}$ ลบ $x=2$ ได้ $\frac{5}{1}$ บวก ต้องการลบหรือศูนย์จึงเลือกช่วงกลาง รวม $-3$ เพราะทำให้ตัวเศษเป็นศูนย์ แต่ไม่รวม $1$ เพราะตัวส่วนเป็นศูนย์ ได้ $[-3,1)$'''
choices = ['''$[-3,1]$''', '''$[-3,1)$''', '''$(-\infty,-3]\cup(1,\infty)$''', '''$(-\infty,-3]$''']
checks = ["solve_univariate_inequality((x+3)/(x-1)<=0, x, relational=False) == Interval.Ropen(-3, 1)"]
answer = 1
track = "adv"
hints = ["หาจุดที่ตัวเศษเป็นศูนย์และจุดที่ตัวส่วนเป็นศูนย์", "จุดที่ตัวส่วนเป็นศูนย์ไม่มีวันอยู่ในคำตอบ แม้มีเครื่องหมายเท่ากับ"]

[[wrong]]
answer = 0
message = "x = 1 ทำให้ตัวส่วนเป็นศูนย์ ต้องเป็นวงเล็บโค้งเสมอ"

[[wrong]]
answer = 3
message = "คูณ x − 1 ข้ามไปโดยถือว่าเป็นบวก จึงได้ x + 3 ≤ 0 แต่เมื่อ x น้อยกว่า 1 ตัวคูณนี้ติดลบ ทิศต้องกลับ ลองแทน x = −4 จะได้ผลหารเป็นบวก"
