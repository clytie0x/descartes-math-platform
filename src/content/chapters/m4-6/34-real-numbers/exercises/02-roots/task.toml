title = "คำตอบพหุนาม"
level = 2
type = "set"
statement = "แก้ $x^3-4x=0$ ตอบทุกค่า"
solution = '''ห้ามหารด้วย $x$ เพราะ $x$ อาจเป็นศูนย์ ให้ดึง $x$ เป็นตัวร่วมแทน ได้ $x(x^2-4)=0$ แล้วแยกผลต่างกำลังสอง $x^2-4=(x-2)(x+2)$ ได้ $x(x-2)(x+2)=0$ ผลคูณเป็นศูนย์เมื่ออย่างน้อยหนึ่งตัวประกอบเป็นศูนย์ จึงได้ $x=0$ หรือ $x=2$ หรือ $x=-2$'''
answer = ["-2", "0", "2"]
truth = "roots(x**3-4*x)"
track = "adv"
hints = ["ดึง x เป็นตัวร่วมก่อน แล้วแยกผลต่างกำลังสอง", "ผลคูณเป็นศูนย์เมื่ออย่างน้อยหนึ่งตัวประกอบเป็นศูนย์"]

[[wrong]]
answer = ["-2", "2"]
message = "อย่าหารด้วย x ทันที เพราะศูนย์ก็เป็นคำตอบ ต้องแยกตัวประกอบครบ"
