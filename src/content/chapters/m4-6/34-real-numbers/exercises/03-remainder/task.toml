title = "เศษจากการหาร"
level = 1
type = "number"
statement = "หาเศษของ $x^3+2x^2-5$ เมื่อหารด้วย $x-2$"
solution = '''ตามทฤษฎีบทเศษเหลือ เศษจากการหารด้วย $x-2$ คือค่าของพหุนามที่ $x=2$ ซึ่งทำให้ตัวหารเป็นศูนย์ แทนทุกพจน์ได้ $2^3+2(2^2)-5=8+8-5=11$'''
answer = "11"
truth = "(x**3+2*x**2-5).subs(x,2)"
track = "adv"
hints = ["ตัวหาร x ลบสองเป็นศูนย์เมื่อใด", "แทนค่านั้นในพหุนามทุกพจน์"]

[[wrong]]
answer = "-5"
message = "พจน์คงตัวอย่างเดียวไม่ใช่เศษ ต้องแทนค่าที่ทำให้ตัวหารเป็นศูนย์ทุกพจน์"
