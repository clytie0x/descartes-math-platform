statement = '''ถุงข้าวเป้าหมาย $1000$ กรัม ยอมให้ $|w-1000|\le8$ ถุงที่หนักมากที่สุดที่ยอมรับได้หนักกี่กรัม'''
solution = '''$|w-1000|\le8$ แปลว่า $w$ อยู่ห่าง $1000$ ไม่เกิน $8$ จึงได้ $-8\le w-1000\le8$ บวก $1000$ ทุกส่วนได้ $992\le w\le1008$ ถุงที่หนักที่สุดที่ยอมรับได้คือขอบบน $1008$ กรัม'''
answer = "1008"
truth = "1000+8"
