statement = "แก้ $|x-4|=3$ ตอบทุกค่า"
solution = '''$|x-4|$ คือระยะจาก $x$ ถึง $4$ จุดที่ห่างจาก $4$ สามหน่วยมีสองด้าน ทางซ้ายคือ $4-3=1$ ทางขวาคือ $4+3=7$ ตรวจ $|1-4|=3$ และ $|7-4|=3$'''
answer = ["1", "7"]
truth = "[1,7]"
