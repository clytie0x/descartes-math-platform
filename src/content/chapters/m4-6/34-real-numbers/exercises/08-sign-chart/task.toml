statement = '''แก้ $(x+1)(x-2)^2\ge0$ ด้วยตารางเครื่องหมายและเขียนคำตอบเป็นช่วง'''
solution = '''รากคือ $-1,2$ ตัวกำลังสองไม่ติดลบ ผลคูณเป็นบวกเมื่อ $x>-1$ ยกเว้น $2$ ที่เป็นศูนย์ แต่เครื่องหมายอนุญาตศูนย์ จึงได้ $[-1,\infty)$ เกณฑ์ตรวจคือระบุรากทั้งคู่ ไม่สลับเครื่องหมายที่รากกำลังคู่ และรวมจุดศูนย์'''
checks = ["solve_univariate_inequality((x+1)*(x-2)**2>=0,x,relational=False)==Interval(-1,oo)"]
