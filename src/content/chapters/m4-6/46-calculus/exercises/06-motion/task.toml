title = "รถจำลอง"
level = 2
type = "number"
track = "adv"
answer = "10"
truth = '''diff(t**2+4*t,t).subs(t,3)'''
hints = ['ความเร็วคืออนุพันธ์ของตำแหน่งตามเวลา']
statement = '''
รถเคลื่อนที่ตาม $s(t)=t^2+4t$ เมตร ความเร็วเมื่อ $t=3$ วินาทีเท่าไร
'''
solution = '''
ความเร็วคืออนุพันธ์ของตำแหน่งตามเวลา หาอนุพันธ์ทีละพจน์ $v(t) = s'(t) = 2t + 4$ เมตรต่อวินาที

แทน $t = 3$ ได้ $v(3) = 2(3) + 4 = 10$ เมตรต่อวินาที

ค่า $s(3) = 9 + 12 = 21$ เป็นตำแหน่งเมื่อเวลา $3$ วินาที มีหน่วยเป็นเมตร ไม่ใช่ความเร็ว
'''

[[wrong]]
answer = "21"
message = "21 เป็นตำแหน่ง ไม่ใช่ความเร็ว ต้องหาอนุพันธ์"
