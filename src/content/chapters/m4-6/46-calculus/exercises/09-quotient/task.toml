title = "กฎผลหาร"
level = 2
type = "expr"
track = "adv"
answer = "5/(x+1)^2"
truth = '''diff((3*x-2)/(x+1),x)'''
hints = ['''ให้ $u = 3x - 2$ และ $v = x + 1$ แล้วหา $u'$ กับ $v'$''', '''ตัวเศษเริ่มจาก $u'v$ แล้วลบ $uv'$''']
statement = '''
หาอนุพันธ์ของ $f(x) = \dfrac{3x-2}{x+1}$ เมื่อ $x \ne -1$
'''
solution = '''
ให้ $u = 3x - 2$ และ $v = x + 1$ ได้ $u' = 3$ และ $v' = 1$

กฎผลหารให้ตัวเศษ $u'v - uv' = 3(x + 1) - (3x - 2)(1) = 3x + 3 - 3x + 2 = 5$

จึงได้ $f'(x) = \dfrac{5}{(x+1)^2}$ เมื่อ $x \ne -1$ ตัวส่วนเป็นกำลังสองจึงบวกเสมอ ความชันเป็นบวกทุกจุดในโดเมน
'''

[[wrong]]
answer = "-5/(x+1)^2"
message = "สลับลำดับในตัวเศษ ต้องเริ่มจาก u′v แล้วลบ uv′"

[[wrong]]
answer = "3"
message = "อนุพันธ์ของผลหารไม่ใช่อนุพันธ์ตัวบนหารอนุพันธ์ตัวล่าง ต้องใช้กฎผลหาร"
