title = "ปริพันธ์จำกัดเขต"
level = 2
type = "number"
track = "adv"
answer = "9"
truth = '''integrate(2*x,(x,0,3))'''
hints = ['หาปฏิยานุพันธ์แล้วแทนปลายลบต้น']
statement = '''
หา $\int_0^3 2x\,dx$
'''
solution = '''
หาปฏิยานุพันธ์ของ $2x$ ก่อน เพิ่มเลขชี้กำลังจาก $1$ เป็น $2$ แล้วหารด้วย $2$ ได้ $\dfrac{2x^2}{2} = x^2$ ตรวจ อนุพันธ์ของ $x^2$ คือ $2x$ ถูกต้อง

ใช้ทฤษฎีบทหลักมูล แทนปลายบนลบปลายล่าง $\int_0^3 2x\,dx = \big[x^2\big]_0^3 = 3^2 - 0^2 = 9$

ตรวจด้วยรูป กราฟ $y = 2x$ บนช่วง $[0, 3]$ กับแกน $x$ เป็นสามเหลี่ยมฐาน $3$ สูง $6$ มีพื้นที่ $\tfrac{1}{2}(3)(6) = 9$ ตรงกัน
'''

[[wrong]]
answer = "6"
message = "หกเป็นค่าฟังก์ชันที่ปลายช่วง ไม่ใช่ปริพันธ์"
