title = "เงื่อนไขต่อเนื่อง"
level = 1
type = "choice"
track = "adv"
choices = ['''$7$''', '''$2$''', '''$0$''']
answer = 0
hints = ['ความต่อเนื่องต้องมีค่าฟังก์ชันเท่าลิมิต']
statement = '''
ถ้า $\lim_{x\to2}f(x)=7$ ต้องกำหนด $f(2)$ เท่าไรจึงต่อเนื่อง
'''
solution = '''
$f$ ต่อเนื่องที่ $2$ เมื่อครบสามเงื่อนไข คือ $f(2)$ นิยาม ลิมิตที่ $2$ มีค่า และลิมิตเท่ากับ $f(2)$

โจทย์บอกว่าลิมิตมีค่าเท่ากับ $7$ แล้ว เงื่อนไขที่เหลือคือต้องกำหนด $f(2)$ ให้เท่ากับลิมิต จึงต้องกำหนด $f(2) = 7$

ตัวเลือก $2$ เป็นค่าของตัวแปรต้น $x$ ไม่ใช่ค่าฟังก์ชัน ส่วน $0$ ไม่เกี่ยวกับเงื่อนไขใดเลย
'''

[[wrong]]
answer = 1
message = "เลขสองเป็นค่าตัวแปรต้น ไม่ใช่ค่าฟังก์ชัน"
