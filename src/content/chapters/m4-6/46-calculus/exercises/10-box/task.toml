title = "กล่องไม่มีฝา"
level = 3
type = "number"
track = "adv"
answer = "1024"
truth = '''(x*(24-2*x)**2).subs(x,4)'''
unit = "ลูกบาศก์เซนติเมตร"
hints = ['เขียนปริมาตรเป็นฟังก์ชันของความยาว $x$ ที่ตัดออก แล้วหาโดเมนที่ทำกล่องได้จริง', 'แยกตัวประกอบอนุพันธ์ แล้วตัดคำตอบที่ทำให้ก้นกล่องยาวศูนย์']
statement = '''
แผ่นกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสยาวด้านละ $24$ เซนติเมตร ตัดสี่เหลี่ยมจัตุรัสยาวด้านละ $x$ เซนติเมตร ออกจากมุมทั้งสี่ แล้วพับขอบขึ้นเป็นกล่องไม่มีฝา กล่องจุได้มากที่สุดกี่ลูกบาศก์เซนติเมตร
'''
solution = '''
ก้นกล่องยาวด้านละ $24 - 2x$ และกล่องสูง $x$ ปริมาตรคือ $V(x) = x(24 - 2x)^2$ ความยาวต้องเป็นบวก จึงมีโดเมน $0 < x < 12$

ใช้กฎผลคูณและกฎลูกโซ่ $V'(x) = (24 - 2x)^2 + x \cdot 2(24 - 2x)(-2) = (24 - 2x)(24 - 6x)$

$V'(x) = 0$ ได้ $x = 12$ ซึ่งทำให้ก้นกล่องยาวศูนย์ อยู่นอกโดเมน หรือ $x = 4$ ซึ่งอยู่ในโดเมน ที่ $x$ เข้าใกล้ $0$ หรือ $12$ ปริมาตรเข้าใกล้ศูนย์ จึงเทียบได้ว่า $V(4) = 4 \cdot 16^2 = 1024$ เป็นค่ามากที่สุด

กล่องจุได้มากที่สุด $1024$ ลูกบาศก์เซนติเมตร เมื่อตัดมุมยาว $4$ เซนติเมตร
'''

[[wrong]]
answer = "4"
message = "4 คือความยาวที่ต้องตัด แต่โจทย์ถามปริมาตร ต้องแทนกลับใน V(x)"

[[wrong]]
answer = "0"
message = "x = 12 ทำให้ก้นกล่องยาวศูนย์ ไม่ใช่กล่องจริง ต้องใช้ x = 4"
