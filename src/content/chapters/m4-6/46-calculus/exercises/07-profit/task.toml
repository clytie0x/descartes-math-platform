title = "กำไรของร้าน"
level = 2
type = "number"
track = "adv"
answer = "64"
truth = '''(-x**2+20*x-36).subs(x,10)'''
hints = ['หาจุดวิกฤตแล้วเปรียบเทียบกำไรกับปลายช่วง']
statement = '''
กำไร $P(x)=-x^2+20x-36$ บาท เมื่อ $0\le x\le20$ กำไรสูงสุดกี่บาท
'''
solution = '''
$P(x)$ ต่อเนื่องบนช่วงปิด $[0, 20]$ ค่าสูงสุดจึงเกิดที่จุดวิกฤตภายในช่วงหรือที่ปลายช่วง

หาจุดวิกฤต $P'(x) = -2x + 20 = 0$ ได้ $x = 10$ ซึ่งอยู่ในช่วง และ $P(10) = -100 + 200 - 36 = 64$

เทียบปลายช่วง $P(0) = -36$ และ $P(20) = -400 + 400 - 36 = -36$ ค่าที่มากที่สุดคือ $64$ กำไรสูงสุดจึงเป็น $64$ บาท เกิดเมื่อ $x = 10$
'''

[[wrong]]
answer = "10"
message = "สิบเป็นจำนวนที่ทำให้กำไรสูงสุด แต่โจทย์ถามค่ากำไร"
