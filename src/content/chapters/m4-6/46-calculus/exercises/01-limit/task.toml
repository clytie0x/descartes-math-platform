title = "ลิมิตที่รู"
level = 1
type = "number"
track = "adv"
answer = "6"
truth = '''limit((x**2-9)/(x-3),x,3)'''
hints = ['แยกผลต่างกำลังสองแล้วตัดเมื่อ x ไม่เท่ากับสาม']
statement = '''
หา $\lim_{x\to3}(x^2-9)/(x-3)$
'''
solution = '''
แทน $x = 3$ ตรงๆ ได้ $\dfrac{9-9}{3-3} = \dfrac{0}{0}$ ซึ่งยังไม่ใช่คำตอบ แปลว่าเศษกับส่วนมีตัวประกอบ $x - 3$ ร่วมกัน

แยกตัวประกอบเศษด้วยผลต่างกำลังสอง $x^2 - 9 = (x-3)(x+3)$ เมื่อ $x \ne 3$ ตัด $x - 3$ ได้ $\dfrac{x^2-9}{x-3} = x + 3$

ลิมิตดูเฉพาะค่า $x \ne 3$ จึงหาลิมิตของ $x + 3$ แทนได้ แทน $x = 3$ ได้ $3 + 3 = 6$ ลิมิตจึงเท่ากับ $6$ แม้ฟังก์ชันเดิมไม่นิยามที่ $x = 3$
'''

[[wrong]]
answer = "0"
message = "0/0 ไม่ใช่คำตอบ ต้องจัดรูปก่อน"
