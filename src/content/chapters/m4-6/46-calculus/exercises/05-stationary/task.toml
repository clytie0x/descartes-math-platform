title = "จุดวิกฤต"
level = 1
type = "self"
track = "adv"
checks = ['''diff(x**3,x).subs(x,0)==0''', '''diff(x**3,x).subs(x,-1)>0 and diff(x**3,x).subs(x,1)>0''']
hints = ['ตรวจเครื่องหมายอนุพันธ์ทั้งซ้ายและขวาของศูนย์']
statement = '''
แสดงว่า $f(x)=x^3$ มีอนุพันธ์ศูนย์ที่ศูนย์แต่ไม่มีค่าสูงสุดหรือต่ำสุดที่จุดนี้
'''
solution = '''
$f'(x)=3x^2$ จึงได้ $f'(0) = 0$ เส้นสัมผัสที่ศูนย์ขนานแกนนอน ศูนย์จึงเป็นจุดวิกฤต

ตรวจเครื่องหมายของ $f'$ สองข้าง $f'(-1) = 3$ และ $f'(1) = 3$ เป็นบวกทั้งคู่ ที่จริง $3x^2$ เป็นบวกทุก $x \ne 0$ ฟังก์ชันจึงเพิ่มทั้งซ้ายและขวาของศูนย์

อนุพันธ์ไม่เปลี่ยนเครื่องหมายเมื่อผ่านศูนย์ จึงไม่มีค่าสูงสุดหรือต่ำสุดสัมพัทธ์ที่ศูนย์ ยืนยันด้วยค่าจริงก็ได้ $f(-0.1)$ ติดลบ $f(0) = 0$ และ $f(0.1)$ เป็นบวก กราฟผ่านศูนย์ขึ้นไปโดยไม่กลับทิศ
'''
