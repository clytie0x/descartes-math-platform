title = "พื้นที่ข้ามแกน"
level = 3
type = "number"
track = "adv"
answer = "5/2"
truth = '''-integrate(x-1,(x,0,1))+integrate(x-1,(x,1,3))'''
hints = ['แบ่งช่วงตรงจุดตัดแกนแล้วรวมขนาดพื้นที่']
statement = '''
หาพื้นที่ระหว่าง $y=x-1$ กับแกน $x$ บนช่วง $[0,3]$
'''
solution = '''
หารากในช่วงก่อน $x - 1 = 0$ ได้ $x = 1$ บนช่วง $[0, 1]$ กราฟอยู่ใต้แกน บนช่วง $[1, 3]$ อยู่เหนือแกน จึงต้องแบ่งช่วงที่ $x = 1$

ปฏิยานุพันธ์คือ $\dfrac{x^2}{2} - x$ ช่วงแรก $\int_0^1(x-1)\,dx = \left(\tfrac{1}{2} - 1\right) - 0 = -\tfrac{1}{2}$ ช่วงหลัง $\int_1^3(x-1)\,dx = \left(\tfrac{9}{2} - 3\right) - \left(\tfrac{1}{2} - 1\right) = \tfrac{3}{2} + \tfrac{1}{2} = 2$

พื้นที่คือผลรวมของขนาด $\tfrac{1}{2} + 2 = \tfrac{5}{2}$ ตารางหน่วย ถ้าอินทิเกรตทั้งช่วงทีเดียวจะได้ $-\tfrac{1}{2} + 2 = \tfrac{3}{2}$ ซึ่งเป็นปริพันธ์มีเครื่องหมาย ไม่ใช่พื้นที่
'''

[[wrong]]
answer = "3/2"
message = "3/2 เป็นปริพันธ์มีเครื่องหมาย ต้องบวกขนาดของพื้นที่ใต้แกน"
