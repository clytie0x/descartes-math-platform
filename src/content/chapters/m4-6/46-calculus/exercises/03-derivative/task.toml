answer = "6*(2*x+1)^2"
truth = '''diff((2*x+1)**3,x)'''
hints = ['หาอนุพันธ์ชั้นนอกแล้วคูณอนุพันธ์ชั้นใน']
statement = '''
หาอนุพันธ์ของ $(2x+1)^3$
'''
solution = '''
$(2x+1)^3$ เป็นฟังก์ชันประกอบ ชั้นในคือ $u = 2x + 1$ ชั้นนอกคือ $u^3$ จึงใช้กฎลูกโซ่ $\dfrac{dy}{dx} = \dfrac{dy}{du}\cdot\dfrac{du}{dx}$

อนุพันธ์ชั้นนอกโดยปล่อยชั้นในไว้ตามเดิมคือ $3(2x+1)^2$ อนุพันธ์ชั้นในคือ $\dfrac{d}{dx}(2x+1) = 2$

คูณกันได้ $3(2x+1)^2 \cdot 2 = 6(2x+1)^2$ ถ้าหยุดที่ $3(2x+1)^2$ คือลืมคูณอนุพันธ์ชั้นใน
'''

[[wrong]]
answer = "3*(2*x+1)^2"
message = "ลืมคูณอนุพันธ์ของ 2x + 1 ซึ่งเท่ากับสอง"
