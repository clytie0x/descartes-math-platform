title = "อธิบายการหาร"
level = 1
type = "self"
checks = ['''binomial(4,2)==6''']
hints = ['เขียนคู่ที่สลับลำดับแล้วดูว่าถูกนับกี่ครั้ง']
statement = '''
อธิบายว่าทำไมเลือกสองคนจากสี่คนจึงมี $6$ คู่ ไม่ใช่ $12$ คู่
'''
solution = '''
ให้สี่คนคือ A B C D ถ้านับแบบสนลำดับ คนแรกเลือกได้ $4$ คน คนที่สองเหลือ $3$ คน ได้ $4\times3=12$ แบบ คือ AB BA AC CA AD DA BC CB BD DB CD DC แต่การเลือกสองคนที่ไม่มีตำแหน่ง AB กับ BA เป็นคู่เดียวกัน ทุกคู่จึงปรากฏสองครั้งพอดี คือ $2!$ ครั้ง จำนวนคู่จริงคือ $12\div2=6$ คู่ ได้แก่ AB AC AD BC BD CD ตรงกับ $\binom{4}{2}=\dfrac{4\times3}{2!}=6$
'''
