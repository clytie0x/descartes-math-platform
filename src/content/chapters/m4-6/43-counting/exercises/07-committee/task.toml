title = "คณะจัดกีฬาสี"
level = 2
type = "number"
answer = "60"
truth = '''binomial(5,2)*binomial(4,2)'''
hints = ['เลือกคู่ของแต่ละฝ่ายแล้วจับคู่ทุกกลุ่มเข้าด้วยกัน']
statement = '''
ห้องหนึ่งมีนักเรียนฝ่ายศิลป์ $5$ คน ฝ่ายกีฬา $4$ คน เลือกกรรมการฝ่ายละ $2$ คน ได้กี่คณะ
'''
solution = '''
งานแบ่งเป็นสองขั้น ขั้นแรกเลือกกรรมการฝ่ายศิลป์ $2$ คนจาก $5$ คน ไม่มีตำแหน่งจึงได้ $\binom{5}{2}=\dfrac{5\times4}{2}=10$ วิธี ขั้นที่สองเลือกฝ่ายกีฬา $2$ คนจาก $4$ คน ได้ $\binom{4}{2}=\dfrac{4\times3}{2}=6$ วิธี คณะหนึ่งต้องมีครบทั้งสองฝ่าย จึงจับคู่ทุกแบบของฝ่ายศิลป์กับทุกแบบของฝ่ายกีฬา ตามหลักการคูณได้ $10\times6=60$ คณะ
'''

[[wrong]]
answer = "16"
message = "ต้องจับคู่ทุกกลุ่มจากสองฝ่าย จึงคูณ ไม่บวก"
