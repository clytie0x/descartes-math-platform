title = "รหัสตู้เก็บของ"
level = 2
type = "number"
answer = "720"
truth = '''10*9*8'''
hints = ['ศูนย์นำหน้าได้ แต่แต่ละหลักห้ามซ้ำ']
statement = '''
รหัสมีตัวเลข $3$ หลัก ใช้ $0$ ถึง $9$ ห้ามซ้ำและขึ้นต้นด้วยศูนย์ได้ ตั้งได้กี่รหัส
'''
solution = '''
รหัสไม่ใช่จำนวน จึงขึ้นต้นด้วยศูนย์ได้ หลักแรกเลือกได้ทั้ง $10$ ตัวคือ $0$ ถึง $9$ หลักที่สองห้ามซ้ำหลักแรกจึงเหลือ $9$ ตัว หลักที่สามเหลือ $8$ ตัว ตามหลักการคูณได้ $10\times9\times8=720$ รหัส ถ้าเป็นจำนวนสามหลักจะต้องตัดศูนย์ออกจากหลักแรกและได้ $9\times9\times8=648$ ซึ่งไม่ใช่คำถามนี้
'''

[[wrong]]
answer = "648"
message = "โจทย์อนุญาตศูนย์นำหน้า หลักแรกจึงมีสิบทาง"
