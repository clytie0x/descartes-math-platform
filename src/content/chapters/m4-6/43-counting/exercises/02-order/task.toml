statement = '''
กรณีใดใช้การจัดหมู่โดยตรง
'''
solution = '''
ถามทีละข้อว่าสลับคนแล้วได้ผลลัพธ์ใหม่หรือไม่ เลือกประธานกับรอง ถ้าสลับสองคนหน้าที่จะเปลี่ยน จึงเป็นการเรียงสับเปลี่ยน จัดแถวถ่ายรูป สลับคนแล้วแถวเปลี่ยน จึงเป็นการเรียงสับเปลี่ยนเช่นกัน ส่วนทีมสามคนที่ไม่มีตำแหน่ง สลับลำดับการเรียกชื่อแล้วยังเป็นทีมเดิม ลำดับไม่มีผล จึงใช้การจัดหมู่โดยตรง
'''

