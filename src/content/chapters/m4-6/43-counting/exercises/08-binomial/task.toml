title = "สัมประสิทธิ์ทวินาม"
level = 3
type = "number"
track = "adv"
answer = "20"
truth = '''expand((1+x)**6).coeff(x,3)'''
hints = ['เลือกสามวงเล็บที่จะหยิบ x']
statement = '''
สัมประสิทธิ์ของ $x^3$ ใน $(1+x)^6$ เท่ากับเท่าไร
'''
solution = '''
เขียน $(1+x)^6$ เป็นผลคูณของวงเล็บ $(1+x)$ หกวง พจน์ $x^3$ เกิดเมื่อหยิบ $x$ จากสามวงเล็บและหยิบ $1$ จากอีกสามวงเล็บ จำนวนวิธีเลือกสามวงเล็บที่จะหยิบ $x$ คือ $\binom{6}{3}=\dfrac{6\times5\times4}{3\times2\times1}=20$ หรือใช้พจน์ทั่วไป $T_{r+1}=\binom{6}{r}1^{6-r}x^r$ กับ $r=3$ ก็ได้ $\binom{6}{3}=20$ เช่นกัน ตรงกับเลขกลางของแถว $n=6$ ในสามเหลี่ยมปาสคาล
'''

[[wrong]]
answer = "6"
message = "ต้องเลือกสามวงเล็บที่จะหยิบ x ไม่ใช่เลือกหนึ่งวงเล็บ"
