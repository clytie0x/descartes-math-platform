title = "จัดชุดอาหาร"
level = 1
type = "number"
answer = "12"
truth = '''4*3'''
hints = ['เลือกอาหารแล้วเลือกน้ำเป็นสองขั้นต่อเนื่อง']
statement = '''
มีข้าว $4$ แบบกับน้ำ $3$ แบบ เลือกอย่างละหนึ่งได้กี่ชุด
'''
solution = '''
การจัดชุดทำเป็นสองขั้นต่อกัน ขั้นแรกเลือกข้าวได้ $4$ แบบ ขั้นที่สองเลือกน้ำได้ $3$ แบบ และน้ำทั้งสามแบบเลือกได้กับข้าวทุกแบบ ตามหลักการคูณจึงได้ $4\times3=12$ ชุด ถ้าบวกเป็น $4+3=7$ จะเป็นการเลือกข้าวหรือน้ำอย่างใดอย่างหนึ่ง ซึ่งไม่ได้ชุดที่มีครบทั้งสองอย่าง
'''

[[wrong]]
answer = "7"
message = "ต้องจับคู่ครบทุกข้าวกับน้ำ จึงคูณ"
