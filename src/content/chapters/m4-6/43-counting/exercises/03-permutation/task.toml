title = "เลือกตำแหน่ง"
level = 1
type = "number"
answer = "42"
truth = '''factorial(7)/factorial(5)'''
hints = ['ตำแหน่งแรกมีเจ็ดทาง ตำแหน่งหลังเหลือหก']
statement = '''
มี $7$ คน เลือกประธานกับเลขาคนละคนได้กี่วิธี
'''
solution = '''
สองตำแหน่งมีหน้าที่ต่างกัน ลำดับจึงมีผล ตำแหน่งประธานเลือกได้ $7$ คน เมื่อได้ประธานแล้ว เลขาต้องเป็นคนอื่นจึงเหลือ $6$ คน ตามหลักการคูณได้ $7\times6=42$ วิธี ซึ่งก็คือ $P_{7,2}=\dfrac{7!}{5!}=42$
'''

