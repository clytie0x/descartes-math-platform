title = "ตั้งทีม"
level = 2
type = "number"
answer = "84"
truth = '''binomial(9,3)'''
hints = ['เลือกกลุ่มสามคนโดยไม่สนลำดับ']
statement = '''
เลือก $3$ คนจาก $9$ คนโดยไม่มีตำแหน่ง ได้กี่ทีม
'''
solution = '''
ทีมไม่มีตำแหน่ง สลับคนในทีมแล้วยังเป็นทีมเดิม จึงใช้การจัดหมู่ ถ้านับแบบสนลำดับจะได้ $9\times8\times7=504$ แต่ทีมหนึ่งทีมถูกนับซ้ำ $3!=6$ ครั้งตามลำดับการเรียกชื่อ จึงหารด้วย $6$ ได้ $\binom{9}{3}=\dfrac{9\times8\times7}{3\times2\times1}=84$ ทีม
'''

[[wrong]]
answer = "504"
message = "504 ยังนับทีมเดิมซ้ำตามลำดับ ต้องหาร 3!"
