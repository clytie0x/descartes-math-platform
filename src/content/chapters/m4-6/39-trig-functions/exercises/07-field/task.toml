title = "ด้านของแปลงสามเหลี่ยม"
level = 2
type = "number"
statement = '''แปลงที่ดินมีสองด้านยาว $6$ กับ $10$ เมตร มุมระหว่าง $60^\circ$ ด้านที่สามยาวเท่าไร'''
solution = '''
รู้สองด้านกับมุมระหว่างด้าน (ด.ม.ด.) จึงใช้กฎของโคไซน์ ให้ $a = 6$ $b = 10$ $C = 60^\circ$

$c^2 = 6^2 + 10^2 - 2(6)(10)\cos 60^\circ = 36 + 100 - 120 \cdot \tfrac{1}{2} = 76$

ความยาวต้องเป็นบวก $c = \sqrt{76} = \sqrt{4 \cdot 19} = 2\sqrt{19}$ ประมาณ $8.72$ เมตร สั้นกว่า $\sqrt{136}$ ที่จะได้ถ้ามุมเป็นมุมฉาก สอดคล้องกับมุม $60^\circ$ ที่แคบกว่า
'''
answer = "2sqrt(19)"
truth = "sqrt(6**2+10**2-2*6*10*cos(pi/3))"
track = "adv"
hints = ["ใช้กฎโคไซน์เพราะรู้สองด้านและมุมระหว่าง", "หากำลังสองของด้านที่สามก่อน แล้วเลือกรากบวก"]

[[wrong]]
answer = "sqrt(136)"
message = "มุมไม่ใช่มุมฉาก ต้องมีพจน์ลบสอง ab โคไซน์ของมุมด้วย"
