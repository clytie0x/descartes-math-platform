title = "ระยะบนขอบล้อ"
level = 2
type = "number"
statement = '''ล้อรัศมี $10$ เซนติเมตรหมุน $120^\circ$ จุดขอบล้อเคลื่อนตามส่วนโค้งเท่าไร'''
solution = '''
สูตร $s = r\theta$ ใช้มุมเรเดียน จึงแปลงก่อน $120^\circ = 120 \cdot \tfrac{\pi}{180} = \tfrac{2\pi}{3}$ เรเดียน

ส่วนโค้ง $s = 10 \cdot \tfrac{2\pi}{3} = \tfrac{20\pi}{3}$ เซนติเมตร ประมาณ $20.9$ เซนติเมตร

ตรวจ $120^\circ$ คือหนึ่งในสามรอบ เส้นรอบวง $20\pi$ หารสามได้ $\tfrac{20\pi}{3}$ ตรงกัน
'''
answer = "20pi/3"
truth = "10*120*pi/180"
track = "adv"
hints = ["แปลงหนึ่งร้อยยี่สิบองศาเป็นเรเดียนก่อน", "ใช้ส่วนโค้งเท่ากับรัศมีคูณมุมเรเดียน"]

[[wrong]]
answer = "1200"
message = "สูตรส่วนโค้งใช้เรเดียน ต้องแปลงองศาก่อนคูณรัศมี"
