title = "ทุกคำตอบในช่วง"
level = 2
type = "self"
statement = '''หา $x$ ทุกค่าเมื่อ $\sin x=-1/2$ และ $0\le x<2\pi$ พร้อมอธิบายจตุภาค'''
solution = '''
ขั้นแรกหามุมอ้างอิง ค่า $\tfrac{1}{2}$ มาจาก $\sin\tfrac{\pi}{6}$ มุมอ้างอิงจึงเป็น $\tfrac{\pi}{6}$

ขั้นสองหาจตุภาค ไซน์ลบเมื่อจุดปลายอยู่ใต้แกน $x$ คือจตุภาคที่ 3 และ 4 ได้ $\pi + \tfrac{\pi}{6} = \tfrac{7\pi}{6}$ และ $2\pi - \tfrac{\pi}{6} = \tfrac{11\pi}{6}$

ช่วง $[0, 2\pi)$ คือหนึ่งรอบพอดี บวกหรือลบ $2\pi$ จะออกนอกช่วง คำตอบจึงมีสองค่า $x = \tfrac{7\pi}{6}$ และ $x = \tfrac{11\pi}{6}$

เกณฑ์ตรวจ มีครบสองมุม ทั้งสองอยู่ในช่วง และอธิบายจตุภาคถูก ค่าหลัก $\arcsin\left(-\tfrac{1}{2}\right) = -\tfrac{\pi}{6}$ ไม่ใช่คำตอบ เพราะอยู่นอกช่วงที่โจทย์กำหนด
'''
checks = ["sin(7*pi/6)==Rational(-1,2)", "sin(11*pi/6)==Rational(-1,2)"]
track = "adv"
hints = ["ไซน์ลบในจตุภาคสามและสี่", "ใช้มุมอ้างอิงพายส่วนหกแล้วตรวจช่วงที่โจทย์กำหนด"]
