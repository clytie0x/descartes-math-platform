title = "คาบของกราฟ"
level = 1
type = "number"
statement = '''คาบของ $y=2\sin(4x)-3$ เท่ากับเท่าไร'''
solution = '''
เทียบกับรูป $y = a\sin(bx + c) + d$ ได้ $a = 2$ $b = 4$ $c = 0$ $d = -3$

กราฟครบหนึ่งรอบเมื่อมุมภายใน $4x$ เพิ่มขึ้น $2\pi$ คือเมื่อ $x$ เพิ่มขึ้น $\tfrac{2\pi}{4} = \tfrac{\pi}{2}$ คาบจึงเป็น $\tfrac{\pi}{2}$

ตัวคูณ $2$ ภายนอกเปลี่ยนแอมพลิจูด และ $-3$ เลื่อนเส้นกึ่งกลาง ทั้งสองไม่เปลี่ยนคาบ
'''
answer = "pi/2"
truth = "2*pi/4"
track = "adv"
hints = ["คาบไซน์คือสองพายหารขนาดสัมประสิทธิ์ของ x"]

[[wrong]]
answer = "8pi"
message = "สัมประสิทธิ์ของ x ทำให้คาบหารด้วยสี่ ไม่ใช่คูณสี่"
