title = "แปลงองศา"
level = 1
type = "number"
statement = '''เปลี่ยน $240^\circ$ เป็นเรเดียน'''
solution = '''
ครึ่งรอบคือ $180^\circ = \pi$ เรเดียน หนึ่งองศาจึงเท่ากับ $\tfrac{\pi}{180}$ เรเดียน

คูณด้วย $240$ ได้ $240 \cdot \tfrac{\pi}{180} = \tfrac{240\pi}{180}$ ตัดตัวร่วม $60$ ได้ $\tfrac{4\pi}{3}$ เรเดียน

ตรวจ $240^\circ$ คือ $180^\circ + 60^\circ$ ส่วน $\tfrac{4\pi}{3} = \pi + \tfrac{\pi}{3}$ ตรงกัน
'''
answer = "4pi/3"
truth = "240*pi/180"
track = "adv"
hints = ["คูณองศาด้วยพายส่วนร้อยแปดสิบแล้วตัดเศษส่วน"]

[[wrong]]
answer = "3pi/4"
message = "ต้องคูณองศาด้วย π/180 และรักษาทิศของเศษส่วน"
