title = "เครื่องหมายจากจตุภาค"
level = 1
type = "number"
statement = '''หา $\cos(4\pi/3)$'''
solution = '''
$\tfrac{4\pi}{3} = \pi + \tfrac{\pi}{3}$ หมุนเลยครึ่งรอบไปอีก $\tfrac{\pi}{3}$ จุดปลายจึงอยู่จตุภาคที่ 3 (ซ้ายล่าง)

มุมอ้างอิงคือ $\tfrac{4\pi}{3} - \pi = \tfrac{\pi}{3}$ ขนาดของโคไซน์จึงเป็น $\cos\tfrac{\pi}{3} = \tfrac{1}{2}$

โคไซน์คือพิกัด $x$ ของจุดปลาย จุดอยู่ซ้ายแกน $y$ จึงติดลบ ได้ $\cos\tfrac{4\pi}{3} = -\tfrac{1}{2}$
'''
answer = "-1/2"
truth = "cos(4*pi/3)"
track = "adv"
hints = ["มุมสี่พายส่วนสามอยู่จตุภาคสาม", "ใช้มุมอ้างอิงพายส่วนสามและเติมเครื่องหมายของพิกัด x"]

