title = "สามเหลี่ยมได้กี่รูป"
level = 3
type = "choice"
track = "adv"
statement = '''
สามเหลี่ยม $ABC$ มี $A = 40^\circ$ ด้าน $b = 10$ เซนติเมตร และด้าน $a = 7$ เซนติเมตร สร้างสามเหลี่ยมที่ต่างกันได้กี่รูป (ใช้ $\sin 40^\circ$ ประมาณ $0.643$)
'''
choices = ["ไม่มีเลย", "หนึ่งรูป", "สองรูป"]
answer = 2
checks = ["N(10*sin(2*pi/9)) < 7 and 7 < 10", "abs(N(asin(10*sin(2*pi/9)/7)*180/pi) - 66.7) < 0.05 and N(40 + 180 - asin(10*sin(2*pi/9)/7)*180/pi) < 180"]
hints = ['ข้อมูลเป็นสองด้านกับมุมที่ไม่อยู่ระหว่างด้าน เป็นกรณีคลุมเครือ', 'หาความสูง $h = b\sin A$ แล้วเทียบกับ $a$ และ $b$']
solution = '''
ข้อมูลคือด้าน $a$ $b$ กับมุม $A$ ซึ่งไม่อยู่ระหว่างสองด้านนี้ จึงเป็นกรณีคลุมเครือ ด.ด.ม.

วิธีที่หนึ่ง เทียบกับความสูง $h = b\sin A = 10 \times 0.643 = 6.43$ เซนติเมตร ด้าน $a = 7$ ยาวกว่า $h$ จึงยื่นถึงฐาน และสั้นกว่า $b = 10$ จึงตัดฐานได้สองจุดทางเดียวกับ $A$ ได้สองรูป

วิธีที่สอง ใช้กฎของไซน์ $\sin B = \dfrac{b\sin A}{a} = \dfrac{10 \times 0.643}{7}$ ประมาณ $0.918$ ได้ $B$ ประมาณ $66.7^\circ$ หรือ $180^\circ - 66.7^\circ = 113.3^\circ$ ตรวจผลรวมมุม $40^\circ + 66.7^\circ$ และ $40^\circ + 113.3^\circ = 153.3^\circ$ น้อยกว่า $180^\circ$ ทั้งคู่ จึงเป็นสามเหลี่ยมได้ทั้งสองรูป
'''

[[wrong]]
answer = 1
message = "เครื่องคิดเลขให้ค่าหลักเพียงมุมเดียว แต่มุมป้านที่มีไซน์เท่ากันก็ใช้ได้ถ้าผลรวมมุมไม่เกิน 180°"

[[wrong]]
answer = 0
message = "ด้าน a ยาวกว่าความสูง b sin A ประมาณ 6.43 จึงยื่นถึงฐานได้ สามเหลี่ยมจึงมีอยู่จริง"
