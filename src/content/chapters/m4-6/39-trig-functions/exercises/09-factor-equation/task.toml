title = "สมการที่ต้องแยกตัวประกอบ"
level = 3
type = "set"
label = '$x =$'
answer = ["0", "pi", "2pi/3", "4pi/3"]
truth = "[0, 2*pi/3, pi, 4*pi/3]"
accept = ["0, 2pi/3, pi, 4pi/3"]
track = "adv"
hints = ['ย้ายทุกพจน์มาข้างเดียว แล้วดึง $\sin x$ เป็นตัวร่วม ห้ามหารด้วย $\sin x$', 'แก้ $\sin x = 0$ และ $\cos x = -\tfrac{1}{2}$ แยกกัน']
statement = '''
หาคำตอบทั้งหมดของสมการ $2\sin x\cos x + \sin x = 0$ เมื่อ $0 \le x < 2\pi$ ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
ดึงตัวร่วม $\sin x$ ออก ได้ $\sin x\,(2\cos x + 1) = 0$ ผลคูณเป็นศูนย์เมื่อตัวใดตัวหนึ่งเป็นศูนย์

กรณี $\sin x = 0$ จุดปลายอยู่บนแกน $x$ ได้ $x = 0$ และ $x = \pi$

กรณี $2\cos x + 1 = 0$ คือ $\cos x = -\tfrac{1}{2}$ มุมอ้างอิง $\tfrac{\pi}{3}$ โคไซน์ลบในจตุภาคที่ 2 และ 3 ได้ $\pi - \tfrac{\pi}{3} = \tfrac{2\pi}{3}$ และ $\pi + \tfrac{\pi}{3} = \tfrac{4\pi}{3}$

รวมสี่คำตอบ $0$ $\tfrac{2\pi}{3}$ $\pi$ และ $\tfrac{4\pi}{3}$ ถ้าหารด้วย $\sin x$ ตั้งแต่ต้นจะเหลือแค่ $\tfrac{2\pi}{3}$ กับ $\tfrac{4\pi}{3}$ เพราะการหารตัดกรณี $\sin x = 0$ ทิ้งไป
'''

[[wrong]]
answer = ["2pi/3", "4pi/3"]
message = "หารด้วย sin x ทำให้คำตอบที่ sin x = 0 หายไป คือ 0 กับ π ให้ดึงตัวร่วมแทนการหาร"

