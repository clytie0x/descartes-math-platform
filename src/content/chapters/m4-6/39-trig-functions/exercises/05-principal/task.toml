title = "ค่าหลักของผกผัน"
level = 1
type = "choice"
statement = '''ค่า $\arcsin(\sin(5\pi/6))$ คือข้อใด'''
solution = '''
คำนวณจากข้างในออกมา $\tfrac{5\pi}{6}$ อยู่จตุภาคที่ 2 มุมอ้างอิง $\tfrac{\pi}{6}$ ไซน์บวก จึงได้ $\sin\tfrac{5\pi}{6} = \tfrac{1}{2}$

ต่อไปหา $\arcsin\tfrac{1}{2}$ ซึ่งต้องเป็นมุมในช่วงหลัก $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ ที่มีไซน์เท่ากับ $\tfrac{1}{2}$ มุมนั้นคือ $\tfrac{\pi}{6}$

ดังนั้น $\arcsin\left(\sin\tfrac{5\pi}{6}\right) = \tfrac{\pi}{6}$ ไม่ใช่ $\tfrac{5\pi}{6}$ เพราะ $\tfrac{5\pi}{6}$ อยู่นอกช่วงหลัก และไม่ใช่ $-\tfrac{\pi}{6}$ เพราะ $\sin\left(-\tfrac{\pi}{6}\right) = -\tfrac{1}{2}$
'''
choices = ['''$\pi/6$''', '''$5\pi/6$''', '''$-\pi/6$''']
checks = ["asin(sin(5*pi/6))==pi/6"]
answer = 0
track = "adv"
hints = ["หาค่าไซน์ของมุมด้านในก่อน", "อาร์กไซน์ต้องคืนมุมที่อยู่ระหว่างลบพายส่วนสองกับพายส่วนสอง"]

[[wrong]]
answer = 1
message = "มุมห้าพายส่วนหกอยู่นอกช่วงค่าหลักของอาร์กไซน์ ต้องเลือกมุมที่ให้ไซน์เดียวกันในช่วงหลัก"
