title = "เรนจ์ของกราฟเลื่อน"
level = 1
type = "choice"
statement = "หาเรนจ์ของ $f(x)=3^x+2$"
solution = '''
เริ่มจากส่วนที่เป็นกำลัง $3^x>0$ ทุกค่า $x$ บวก $2$ ทั้งสองข้างได้ $f(x)>2$

$3^x$ เล็กลงเข้าใกล้ศูนย์ได้เรื่อยๆ เมื่อ $x$ ติดลบมาก แต่ไม่เคยเป็นศูนย์ $f(x)$ จึงเข้าใกล้สองแต่ไม่เท่ากับสอง และใหญ่ได้ไม่จำกัด เรนจ์คือ $(2,\infty)$ เส้นกำกับแนวนอนคือ $y=2$
'''
choices = ['''$(2,\infty)$''', '''$[2,\infty)$''', '''$\mathbb R$''']
checks = ["3**0+2==3"]
answer = 0
track = "adv"
hints = ["ค่ากำลังฐานสามบวกเสมอและเข้าใกล้ศูนย์ได้แต่ไม่ถึง", "บวกสองแล้วขอบล่างยังไม่ถูกรวม"]

[[wrong]]
answer = 1
message = "สองเป็นเส้นกำกับ ไม่ใช่ค่าที่กราฟรับได้ เพราะค่ากำลังไม่มีทางเป็นศูนย์"
