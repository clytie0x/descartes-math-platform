title = "เทียบความเป็นกรดด้วย pH"
level = 2
type = "number"
label = 'น้ำมะนาวเข้มข้นกว่า'
unit = "เท่า"
answer = "1000"
truth = "Integer(10)**-2 / Integer(10)**-5"
track = "adv"
hints = ['$\text{pH} = -\log[\text{H}^+]$ จึงได้ $[\text{H}^+] = 10^{-\text{pH}}$', 'หารความเข้มข้นของสองสารด้วยกัน แล้วใช้กฎการหารเลขยกกำลัง']
statement = '''
ค่า pH นิยามจาก $\text{pH} = -\log[\text{H}^+]$ น้ำมะนาวตัวอย่างหนึ่งมี pH เท่ากับ $2$ ส่วนกาแฟดำตัวอย่างหนึ่งมี pH เท่ากับ $5$ น้ำมะนาวมีไฮโดรเจนไอออนเข้มข้นกว่ากาแฟกี่เท่า
'''
solution = '''
เปลี่ยน pH กลับเป็นความเข้มข้นตามนิยามลอการิทึม $\text{pH} = 2$ แปลว่า $\log[\text{H}^+] = -2$ จึงได้ $[\text{H}^+] = 10^{-2}$ ส่วนกาแฟได้ $10^{-5}$

อัตราส่วนคือ $\dfrac{10^{-2}}{10^{-5}} = 10^{-2-(-5)} = 10^3 = 1000$ เท่า

pH ต่างกัน $3$ หน่วย แต่ละหน่วยคือสิบเท่า สามหน่วยจึงเป็น $10 \times 10 \times 10$ ไม่ใช่ $3$ เท่า และไม่ใช่ $\tfrac{5}{2}$ เท่า
'''

[[wrong]]
answer = "3"
message = "3 คือผลต่างของ pH ซึ่งเป็นเลขชี้กำลัง ต้องเปลี่ยนเป็นอัตราส่วนความเข้มข้น 10 ยกกำลัง 3"

[[wrong]]
answer = "30"
message = "pH ต่างกันหนึ่งหน่วยคือคูณ 10 สามหน่วยจึงเป็น 10 × 10 × 10 ไม่ใช่ 10 × 3"

[[wrong]]
answer = "2.5"
message = "อย่าหาร pH ตรงๆ pH เป็นลอการิทึม ต้องเปลี่ยนกลับเป็นความเข้มข้นก่อน"
