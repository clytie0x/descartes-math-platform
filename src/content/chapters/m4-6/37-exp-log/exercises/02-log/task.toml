title = "ค่าลอการิทึม"
level = 1
type = "number"
statement = '''หา $\log_5(1/125)$'''
solution = '''
ถามว่ายก $5$ กำลังเท่าไรจึงได้ $\tfrac{1}{125}$ เขียน $125=5^3$ แล้วใช้เลขชี้กำลังลบ $\tfrac{1}{125}=5^{-3}$

จึงได้ $\log_5(1/125)=-3$ คำตอบติดลบได้ เพราะอาร์กิวเมนต์ $\tfrac{1}{125}$ น้อยกว่า $1$ ขณะที่ฐานมากกว่า $1$
'''
answer = "-3"
truth = "log(Rational(1,125),5)"
track = "adv"
hints = ["เขียนหนึ่งส่วนร้อยยี่สิบห้าเป็นกำลังฐานห้า"]

