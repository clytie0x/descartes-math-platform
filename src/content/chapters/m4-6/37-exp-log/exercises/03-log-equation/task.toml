title = "ตรวจโดเมนก่อนรับราก"
level = 2
type = "number"
statement = '''แก้ $\log_3(x-2)+\log_3(x+2)=2$'''
solution = '''
ขั้นแรกหาโดเมน ต้องมี $x-2>0$ และ $x+2>0$ พร้อมกัน จึงได้ $x>2$

รวมเป็นลอการิทึมของผลคูณ $\log_3\big((x-2)(x+2)\big)=2$ แล้วเปลี่ยนเป็นรูปกำลัง $x^2-4=3^2=9$ ได้ $x^2=13$ จึงมีราก $\pm\sqrt{13}$

$-\sqrt{13}$ ทำให้ $x-2$ ติดลบ ไม่ผ่านโดเมน รับเพียง $\sqrt{13}$ ซึ่งประมาณ $3.61$ มากกว่า $2$ จริง
'''
answer = "sqrt(13)"
truth = "sqrt(13)"
track = "adv"
hints = ["ตรวจว่า x ต้องมากกว่าสองก่อนรวมลอการิทึม", "รวมเป็นลอการิทึมของผลคูณ แล้วย้อนเป็นกำลังฐานสาม"]

[[wrong]]
answer = "-sqrt(13)"
message = "รากลบทำให้อาร์กิวเมนต์ทั้งสองติดลบ จึงไม่ผ่านโดเมนเดิม"
