title = "ตรวจสูตรที่ใช้ไม่ได้"
level = 3
type = "self"
statement = '''ใช้ค่าตัวเลขหักล้างข้อความ $\log_a(M+N)=\log_a M+\log_a N$ แม้ $a,M,N$ ผ่านโดเมน'''
solution = '''เลือก $a=2$ และ $M=N=2$ จะได้ข้างซ้าย $\log_2 4=2$ และข้างขวา $1+1=2$ ซึ่งยังไม่หักล้าง จึงเลือก $M=2,N=4$ แทน ข้างซ้าย $\log_2 6$ แต่ขวา $3$ และ $2^3=8\ne6$ เกณฑ์ตรวจคือต้องได้ค่าต่างกันจริงและทุกอาร์กิวเมนต์บวก'''
checks = ["log(2,2)+log(4,2)==3", "2**3 != 2+4"]
track = "adv"
hints = ["เลือกฐานสองและอาร์กิวเมนต์สองค่าที่บวกกันไม่เท่าผลคูณ", "ตรวจว่าค่าลอการิทึมสองข้างต่างกันจริงก่อนใช้เป็นตัวอย่างค้าน"]
