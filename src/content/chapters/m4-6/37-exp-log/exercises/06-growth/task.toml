title = "เป้าหมายการเติบโต"
level = 2
type = "number"
statement = "แบบจำลองเริ่ม $150$ หน่วยและเพิ่มสองเท่าทุกชั่วโมง จะถึง $2400$ หน่วยหลังผ่านไปกี่ชั่วโมง"
solution = '''
ตั้งแบบจำลอง $150(2^t)=2400$ เมื่อ $t$ นับเป็นชั่วโมง

หารด้วยค่าเริ่ม $150$ ก่อน ให้กำลังอยู่ลำพัง ได้ $2^t=16=2^4$ จึงมี $t=4$ ชั่วโมง

ตรวจ $150 \to 300 \to 600 \to 1200 \to 2400$ คูณสองสี่ครั้งพอดี
'''
answer = "4"
truth = "log(Rational(2400,150),2)"
track = "adv"
hints = ["หารปริมาณเป้าหมายด้วยปริมาณเริ่มต้นก่อน", "หาเลขชี้กำลังของสองที่ให้สัดส่วนนั้น"]

[[wrong]]
answer = "16"
message = "สิบหกเป็นอัตราส่วนของปริมาณ ต้องหาจำนวนครั้งที่คูณสองจึงได้สิบหก"
