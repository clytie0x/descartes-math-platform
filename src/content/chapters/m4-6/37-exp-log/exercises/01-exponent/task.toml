title = "สมการฐานเดียวกัน"
level = 1
type = "number"
statement = "แก้ $2^{x+1}=32$"
solution = '''
เขียนทั้งสองข้างเป็นกำลังของฐานเดียวกันก่อน $32=2^5$ สมการจึงเป็น $2^{x+1}=2^5$

ฟังก์ชัน $2^x$ เป็นหนึ่งต่อหนึ่ง ฐานเท่ากันแล้วเลขชี้กำลังต้องเท่ากัน ได้ $x+1=5$ แล้ว $x=4$

ตรวจ $2^{4+1}=2^5=32$ ถูกต้อง
'''
answer = "4"
truth = "5-1"
track = "adv"
hints = ["เขียนสามสิบสองเป็นกำลังฐานสอง", "เทียบเลขชี้กำลังแล้วแก้หา x"]

[[wrong]]
answer = "5"
message = "ห้าเป็นค่า x + 1 ต้องลบหนึ่งเพื่อหา x"
