title = "อสมการฐานลด"
level = 2
type = "choice"
statement = "จาก $(1/2)^{x-1}<(1/2)^3$ คำตอบคือข้อใด"
solution = '''
ฐาน $\tfrac{1}{2}$ อยู่ระหว่างศูนย์กับหนึ่ง ฟังก์ชัน $(1/2)^x$ จึงลด ค่าที่น้อยกว่ามาจากเลขชี้กำลังที่มากกว่า

จึงต้องกลับทิศเมื่อเทียบเลขชี้กำลัง ได้ $x-1>3$ หรือ $x>4$

ตรวจด้วย $x=5$ ทางซ้ายได้ $(1/2)^4=\tfrac{1}{16}$ ซึ่งน้อยกว่า $(1/2)^3=\tfrac{1}{8}$ จริง
'''
choices = ["$x<4$", "$x>4$", "$x>2$"]
checks = ["Rational(1,2)**4 < Rational(1,2)**3"]
answer = 1
track = "adv"
hints = ["ฐานหนึ่งส่วนสองเป็นฟังก์ชันลด", "กลับทิศอสมการเมื่อเปรียบเทียบเลขชี้กำลัง"]

[[wrong]]
answer = 0
message = "ฐานน้อยกว่าหนึ่งทำให้ต้องกลับทิศเมื่อเปรียบเทียบเลขชี้กำลัง"
