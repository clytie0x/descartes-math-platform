title = "จำนวนรอบครึ่งชีวิต"
level = 2
type = "number"
statement = "แบบจำลองวัสดุเริ่ม $96$ กรัม ลดครึ่งหนึ่งทุก $3$ วัน จะเหลือ $12$ กรัมหลังผ่านไปกี่วัน"
solution = '''
ตั้งแบบจำลองครึ่งชีวิต $96(1/2)^{t/3}=12$ เมื่อ $t$ นับเป็นวัน

หารด้วย $96$ ได้ $(1/2)^{t/3}=\tfrac{12}{96}=\tfrac{1}{8}=(1/2)^3$ ฐานเดียวกันจึงได้ $t/3=3$ คือผ่านไปสามรอบครึ่งชีวิต

แต่ละรอบยาว $3$ วัน จึงได้ $t=9$ วัน ตรวจ $96 \to 48 \to 24 \to 12$
'''
answer = "9"
truth = "3*3"
track = "adv"
hints = ["หารสิบสองด้วยเก้าสิบหกเพื่อหาสัดส่วนคงเหลือ", "นับรอบครึ่งชีวิตแล้วคูณเวลาต่อรอบสามวัน"]

[[wrong]]
answer = "3"
message = "สามเป็นจำนวนรอบครึ่งชีวิต แต่แต่ละรอบกินเวลาสามวัน"
