title = "ปีเต็มแรกที่ราคาเพิ่มเป็นสองเท่า"
level = 3
type = "number"
unit = "ปี"
answer = "8"
truth = "ceiling(log(2) / log(Rational(11, 10)))"
track = "adv"
hints = ['ตั้งอสมการ $100(1.1)^n \ge 200$ แล้วหารด้วย $100$', 'ใส่ $\log$ ทั้งสองข้าง ได้จุดแบ่ง $\dfrac{\log 2}{\log 1.1}$', 'ตรวจจำนวนเต็มสองค่าที่อยู่รอบจุดแบ่ง']
statement = '''
ราคาสินค้าชิ้นหนึ่งตอนนี้ $100$ บาท ปรับขึ้นปีละ $10\%$ จากราคาของปีก่อน ปรับปีละครั้ง ต้องผ่านไปอย่างน้อยกี่ปีเต็ม ราคาจึงเป็นอย่างน้อย $200$ บาท
'''
solution = '''
ขึ้น $10\%$ คือคูณด้วย $1.1$ หลัง $n$ ปีราคาเป็น $100(1.1)^n$ ต้องการ $100(1.1)^n \ge 200$ หรือ $(1.1)^n \ge 2$

ใส่ $\log$ ทั้งสองข้างแล้วย้ายกำลังลงมา $n\log 1.1 \ge \log 2$ เพราะ $\log 1.1$ เป็นบวก หารแล้วทิศเดิม ได้ $n \ge \dfrac{\log 2}{\log 1.1}$ ประมาณ $7.27$

ราคาเปลี่ยนปีละครั้ง จึงตรวจจำนวนเต็มข้างเคียง $(1.1)^7$ ประมาณ $1.949$ ยังไม่ถึง $2$ ส่วน $(1.1)^8$ ประมาณ $2.144$ ถึงแล้ว คำตอบคือ $8$ ปี

ถ้าคิดว่าขึ้นปีละ $10$ บาทเท่ากันทุกปีจะได้ $10$ ปี ซึ่งผิด เพราะการขึ้นเป็นร้อยละของราคาใหม่ ไม่ใช่ของราคาเดิม
'''

[[wrong]]
answer = "7"
message = "จุดแบ่งประมาณ 7.27 ปัดลงไม่ได้ เพราะหลัง 7 ปีราคายังไม่ถึง 200 บาท ต้องปัดขึ้นเป็นปีเต็มถัดไป"

[[wrong]]
answer = "10"
message = "10 ปีมาจากการบวกปีละ 10 บาท แต่ราคาขึ้น 10% ของราคาปีก่อน จึงเป็นการคูณด้วย 1.1 ซ้ำ"
