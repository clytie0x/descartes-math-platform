title = "เงินฝากรายงวด"
level = 2
type = "number"
answer = "4060"
truth = '''2000*Rational(103,100)+2000'''
hints = ['เงินฝากครั้งสุดท้ายยังไม่มีเวลาได้ดอกเบี้ย']
statement = '''
ฝากปลายปีปีละ $2000$ บาทสองครั้ง อัตราปีละ $3\%$ ปลายปีที่สองมียอดเท่าไร
'''
solution = '''
วาดเส้นเวลา เงินฝากอยู่ที่ปลายปีที่หนึ่งและปลายปีที่สอง วันประเมินคือปลายปีที่สอง

ก้อนแรกอยู่ในบัญชีหนึ่งปี โตเป็น $2000(1.03) = 2060$ บาท

ก้อนหลังเพิ่งฝากวันประเมิน ยังเป็น $2000$ บาท

รวม $2060 + 2000 = 4060$ บาท ตรงกับสูตร $2000\dfrac{(1.03)^2 - 1}{0.03} = 4060$
'''

