title = "ชนิดลำดับ"
level = 1
type = "choice"
choices = ['''$3,6,9,12$''', '''$3,6,12,24$''', '''$1,2,4,7$''']
answer = 1
hints = ['ลองหารพจน์ติดกันแล้วตรวจอัตราส่วน']
statement = '''
ลำดับใดเป็นเรขาคณิต
'''
solution = '''
ตรวจอัตราส่วนของพจน์ติดกันทุกคู่ในแต่ละตัวเลือก

$3,6,9,12$ มีอัตราส่วน $6/3 = 2$ แต่ $9/6 = 1.5$ ไม่คงที่ ลำดับนี้มีผลต่างคงที่ $3$ จึงเป็นเลขคณิต

$3,6,12,24$ มีอัตราส่วน $6/3 = 12/6 = 24/12 = 2$ ทุกคู่ จึงเป็นเรขาคณิต

$1,2,4,7$ มีอัตราส่วน $2/1 = 2$ แต่ $7/4$ ไม่เท่ากับ $2$ และผลต่าง $1, 2, 3$ ก็ไม่คงที่ จึงไม่ใช่ทั้งสองชนิด คู่แรกที่หารได้ $2$ หลอกให้เดาผิดได้
'''

[[wrong]]
answer = 0
message = "ลำดับนี้เพิ่มทีละสาม เป็นเลขคณิต"

[[wrong]]
answer = 2
message = "สองคู่แรกคูณสองก็จริง แต่ 7 ÷ 4 ไม่ใช่ 2 ต้องตรวจทุกคู่"
