title = "ผลรวมเลขคณิต"
level = 1
type = "number"
answer = "210"
truth = '''sum(range(1,21))'''
hints = ['จับคู่พจน์แรกกับพจน์สุดท้าย']
statement = '''
หา $1+2+\cdots+20$
'''
solution = '''
เป็นอนุกรมเลขคณิต $a_1 = 1$ และ $a_{20} = 20$ มี $20$ พจน์

จับคู่หัวท้าย $1 + 20 = 21$, $2 + 19 = 21$ ไปเรื่อยๆ ได้ $10$ คู่ ทุกคู่รวม $21$

$S_{20} = \dfrac{20}{2}(1 + 20) = 10 \times 21 = 210$
'''

