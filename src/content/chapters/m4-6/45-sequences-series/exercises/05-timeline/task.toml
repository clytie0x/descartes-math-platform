title = "ตรวจเส้นเวลา"
level = 1
type = "self"
checks = ['''expand((1+x)**2+(1+x)+1)==x**2+3*x+3''']
hints = ['วาดวันฝากสามวันและวันประเมินเงิน']
statement = '''
อธิบายเหตุใดเงินฝากปลายปี $3$ ครั้งจึงมีตัวคูณดอกเบี้ย $(1+i)^2,(1+i),1$ ณ ปลายปีที่สาม
'''
solution = '''
วาดเส้นเวลาจุด $0$ ถึง $3$ เงินฝากอยู่ที่จุด $1$, $2$ และ $3$ ส่วนวันประเมินคือจุด $3$

ก้อนแรกฝากที่จุด $1$ อยู่ในบัญชีจนถึงจุด $3$ ครบสองปี จึงคูณ $1+i$ สองครั้ง ได้ตัวคูณ $(1+i)^2$

ก้อนที่สองฝากที่จุด $2$ อยู่หนึ่งปี ได้ตัวคูณ $1+i$

ก้อนสุดท้ายเพิ่งฝากที่จุด $3$ ยังไม่มีเวลาได้ดอกเบี้ย ตัวคูณจึงเป็น $1$

รวมกันได้ $R\big(1 + (1+i) + (1+i)^2\big)$ เป็นอนุกรมเรขาคณิตสามพจน์ที่มีอัตราส่วน $1+i$
'''
