title = "ลิมิตของเศษส่วนพหุนาม"
level = 2
type = "number"
track = "adv"
label = '$\lim\limits_{n\to\infty} a_n =$'
answer = "2"
truth = '''limit((4*x**2-3*x)/(2*x**2+5),x,oo)'''
hints = ['หารทั้งเศษและส่วนด้วยกำลังสูงสุดของ $n$ ในตัวส่วน']
statement = '''
หาลิมิตของลำดับ $a_n = \dfrac{4n^2 - 3n}{2n^2 + 5}$
'''
solution = '''
1. เศษและส่วนโตไม่สิ้นสุดทั้งคู่ ใช้ทฤษฎีบทผลหารตรงๆ ไม่ได้ ต้องจัดรูปก่อน
2. กำลังสูงสุดในตัวส่วนคือ $n^2$ หารทุกพจน์ด้วย $n^2$ ได้ $a_n = \dfrac{4 - 3/n}{2 + 5/n^2}$
3. $\tfrac3n \to 0$ และ $\tfrac{5}{n^2} \to 0$ เศษเข้าใกล้ $4$ ส่วนเข้าใกล้ $2$ ซึ่งไม่ใช่ศูนย์
4. ทฤษฎีบทผลหารให้ลิมิต $\dfrac{4}{2} = 2$
'''

[[wrong]]
answer = "1"
message = "อนันต์หารอนันต์ไม่ใช่ 1 ต้องหารเศษและส่วนด้วย n² ก่อน"

[[wrong]]
answer = "0"
message = "ลิมิตเป็น 0 เมื่อดีกรีเศษน้อยกว่าส่วน ข้อนี้ดีกรีเท่ากัน"
