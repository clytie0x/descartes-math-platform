title = "พจน์เรขาคณิต"
level = 2
type = "number"
answer = "96"
truth = '''3*2**5'''
hints = ['ใช้พจน์แรกคูณอัตราส่วนยกกำลังห้า']
statement = '''
ลำดับเริ่ม $3$ มีอัตราส่วน $2$ พจน์ที่หกเป็นเท่าไร
'''
solution = '''
ลำดับเรขาคณิต $a_1 = 3$ และ $r = 2$ พจน์ทั่วไปคือ $a_n = 3(2)^{n-1}$

พจน์ที่หกคูณ $r$ ไป $6 - 1 = 5$ ครั้ง จึงได้ $a_6 = 3(2)^5 = 3 \times 32 = 96$

ตรวจโดยไล่พจน์ $3, 6, 12, 24, 48, 96$ พจน์ที่หกคือ $96$ ตรงกัน
'''

[[wrong]]
answer = "192"
message = "พจน์ที่หกคูณอัตราส่วนห้าครั้ง"
