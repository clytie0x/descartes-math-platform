title = "ค่าผ่อนมือถือ"
level = 3
type = "number"
label = '$R \approx$'
unit = "บาท"
answer = "120*101^12/(101^12-100^12)"
truth = '''Rational(120*101**12, 101**12-100**12)'''
tolerance = 0.01
accept = ["1066.19"]
hints = ['ยอดกู้เท่ากับมูลค่าปัจจุบันของค่างวดทุกงวด', 'ใช้ $R = \dfrac{Pi}{1-(1+i)^{-n}}$ กับ $P = 12000$ $i = 0.01$ และ $n = 12$']
statement = '''
กู้เงิน $12000$ บาทซื้อโทรศัพท์ ผ่อนเท่ากันทุกสิ้นเดือน $12$ งวด อัตราดอกเบี้ยแบบลดต้นลดดอกร้อยละ $1$ ต่อเดือน ค่างวดเท่าไร ตอบเป็นบาททศนิยมสองตำแหน่ง
'''
solution = '''
1. อัตราให้มาเป็นต่อเดือนแล้ว จึงใช้ $i = 0.01$ ได้ทันที และ $n = 12$ งวด
2. ยอดกู้วันนี้เท่ากับมูลค่าปัจจุบันของค่างวด $12$ งวด $12000 = R\dfrac{1-(1.01)^{-12}}{0.01}$
3. แก้หา $R$ ได้ $R = \dfrac{12000(0.01)}{1-(1.01)^{-12}} = \dfrac{120}{1-(1.01)^{-12}}$
4. $(1.01)^{-12}$ ประมาณ $0.887449$ ตัวส่วนประมาณ $0.112551$ จึงได้ $R$ ประมาณ $1066.19$ บาท
5. ตรวจความสมเหตุสมผล ถ้าไม่มีดอกเบี้ยจะผ่อนเดือนละ $1000$ บาท ค่างวดจริงต้องมากกว่านั้น แต่น้อยกว่าแบบอัตราคงที่ที่คิดดอกเบี้ยจากยอดเต็มทุกเดือน $\dfrac{12000 + 12000(0.01)(12)}{12} = 1120$ บาท
'''

[[wrong]]
answer = "1120"
message = "1120 คิดดอกเบี้ยจาก 12000 เต็มทุกเดือน แบบลดต้นลดดอกคิดจากหนี้ที่เหลือซึ่งลดลงทุกงวด"

