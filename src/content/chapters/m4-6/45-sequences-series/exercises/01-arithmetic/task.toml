title = "พจน์เลขคณิต"
level = 1
type = "number"
answer = "37"
truth = '''4+11*3'''
hints = ['พจน์ที่สิบสองผ่านการเพิ่มจากพจน์แรกสิบเอ็ดครั้ง']
statement = '''
ลำดับ $4,7,10,\ldots$ พจน์ที่ $12$ เท่าไร
'''
solution = '''
ผลต่างของคู่แรกคือ $7 - 4 = 3$ และคู่ถัดไป $10 - 7 = 3$ เท่ากัน จึงเป็นลำดับเลขคณิตที่มี $a_1 = 4$ และ $d = 3$

จากพจน์แรกถึงพจน์ที่ $12$ บวก $d$ ไป $12 - 1 = 11$ ครั้ง เพราะพจน์แรกยังไม่ได้บวกเลย

$a_{12} = a_1 + 11d = 4 + 11(3) = 37$
'''

[[wrong]]
answer = "40"
message = "จากพจน์แรกถึงพจน์ที่สิบสองเพิ่มเพียงสิบเอ็ดครั้ง"
