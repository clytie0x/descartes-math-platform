title = "เงินออมทบต้น"
level = 2
type = "number"
answer = "5408"
truth = '''5000*Rational(104,100)**2'''
hints = ['คูณเงินต้นด้วยหนึ่งบวกอัตราสองครั้ง']
statement = '''
ฝาก $5000$ บาท อัตราทบต้นปีละ $4\%$ ครบสองปีได้เงินกี่บาท
'''
solution = '''
ทบต้นปีละครั้ง อัตราต่องวด $i = 0.04$ และ $n = 2$ งวด

ปีแรก $5000(1.04) = 5200$ บาท ปีที่สองคิดดอกเบี้ยจาก $5200$ ไม่ใช่ $5000$ ได้ $5200(1.04) = 5408$ บาท

หรือใช้สูตร $F = P(1+i)^n = 5000(1.04)^2 = 5408$ บาท
'''

