title = "ผลรวมอนันต์"
level = 3
type = "number"
track = "adv"
answer = "8"
truth = '''4/(1-Rational(1,2))'''
hints = ['ตรวจว่าอัตราส่วนขนาดน้อยกว่าหนึ่งแล้วใช้สูตรผลรวมอนันต์']
statement = '''
หา $4+2+1+\tfrac12+\cdots$
'''
solution = '''
อัตราส่วนของทุกคู่คือ $\tfrac12$ เช่น $2 \div 4$ และ $1 \div 2$ จึงเป็นอนุกรมเรขาคณิต $a_1 = 4$ และ $r = \tfrac12$

$|r| = \tfrac12$ น้อยกว่าหนึ่ง อนุกรมจึงลู่เข้า ใช้สูตร $S = \dfrac{a_1}{1-r} = \dfrac{4}{1 - 1/2} = 8$

ตรวจด้วยผลรวมย่อย $4, 6, 7, 7.5, 7.75, \ldots$ เข้าใกล้ $8$ จริง
'''

[[wrong]]
answer = "0"
message = "พจน์เข้าใกล้ศูนย์ แต่ผลรวมย่อยเข้าใกล้แปด"
