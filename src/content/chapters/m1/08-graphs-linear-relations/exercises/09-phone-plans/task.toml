title = "เลือกแพ็กเกจโทรศัพท์"
level = 3
type = "number"
unit = "นาที"
answer = "300"
truth = "solve(150 + x - (300 + Rational(1, 2)*x), x)[0]"
hints = ['ให้ $x$ แทนจำนวนนาทีที่โทร เขียนค่าบริการของแต่ละแพ็กเกจในรูป $y = ax + b$', 'ค่าบริการเท่ากันเมื่อ $x + 150 = 0.5x + 300$']
statement = '''
แพ็กเกจโทรศัพท์รายเดือนมีสองแบบ แบบ A ค่ารายเดือน 150 บาท โทรนาทีละ 1 บาท แบบ B ค่ารายเดือน 300 บาท โทรนาทีละ 50 สตางค์ ถ้าในหนึ่งเดือนโทรกี่นาที ค่าบริการของสองแบบจะเท่ากัน
'''
solution = '''
1. ให้ $x$ แทนจำนวนนาที แบบ A $y = x + 150$ แบบ B $y = 0.5x + 300$
2. ค่าบริการเท่ากัน $x + 150 = 0.5x + 300$
3. ลบ $0.5x$ และลบ $150$ ทั้งสองข้าง ได้ $0.5x = 150$ จึงได้ $x = 300$ นาที
4. ตรวจ แบบ A $300 + 150 = 450$ บาท แบบ B $0.5(300) + 300 = 450$ บาท เท่ากัน

ถ้าเขียนกราฟ เส้นของแบบ A ชันกว่าเพราะนาทีละ 1 บาท ทางขวาของจุดตัด $(300, 450)$ เส้น A อยู่สูงกว่า คนที่โทรเกิน 300 นาทีต่อเดือนจึงควรเลือกแบบ B
'''

[[wrong]]
