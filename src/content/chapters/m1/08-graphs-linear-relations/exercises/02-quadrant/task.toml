statement = '''
จุดใดอยู่ในจตุภาคที่ 4
'''
solution = '''
จตุภาคที่ 4 อยู่ทางขวาล่างของจุดกำเนิด จุดในจตุภาคนี้มีพิกัด $x$ เป็นบวก และพิกัด $y$ เป็นลบ มีเพียง $(3, -2)$ ที่เป็นแบบนี้ ส่วน $(0, -2)$ อยู่บนแกน $y$ จึงไม่อยู่ในจตุภาคใด
'''

