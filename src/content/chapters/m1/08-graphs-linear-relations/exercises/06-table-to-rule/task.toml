title = "เขียนความสัมพันธ์จากตาราง"
level = 2
type = "expr"
label = '$y =$'
form = "expanded"
answer = "3x+5"
truth = "3*x + 5"
accept = ["5+3x", "3x + 5"]
hints = ['$x$ เพิ่มขึ้นทีละ $1$ แล้ว $y$ เพิ่มขึ้นทีละเท่าไร ค่านั้นคือ $a$', 'ค่า $b$ คือค่า $y$ เมื่อ $x = 0$ ย้อนจากช่อง $x = 1$ ไปหนึ่งช่อง']
statement = '''
ความสัมพันธ์ระหว่าง $x$ กับ $y$ ในตารางเป็นความสัมพันธ์เชิงเส้น เขียนให้อยู่ในรูป $y = ax + b$

| $x$ | $1$ | $2$ | $3$ | $4$ |
|---|---|---|---|---|
| $y$ | $8$ | $11$ | $14$ | $17$ |
'''
solution = '''
1. $x$ เพิ่มขึ้นทีละ $1$ ค่า $y$ เพิ่มขึ้นทีละ $3$ จึงได้ $a = 3$
2. ตารางไม่มีช่อง $x = 0$ ย้อนจาก $x = 1$ ไปหนึ่งช่อง $y$ ต้องลดลง $3$ ได้ $8 - 3 = 5$ จึงได้ $b = 5$
3. $y = 3x + 5$ ตรวจ $x = 4$ ได้ $3(4) + 5 = 17$ ตรงกับตาราง
'''

[[wrong]]
answer = "3x+8"
message = "8 คือค่า y เมื่อ x = 1 แต่ b คือค่า y เมื่อ x = 0 ย้อนจาก 8 ลงไป 3 ได้ 5"

[[wrong]]
answer = "x+7"
message = "x เพิ่ม 1 แล้ว y เพิ่ม 3 ตัวคูณของ x จึงเป็น 3 ไม่ใช่ 1 ลองแทน x = 2 ใน x + 7 ได้ 9 ไม่ใช่ 11"

[[wrong]]
answer = "5x+3"
message = "สลับ a กับ b ตัวคูณของ x คือค่าที่ y เพิ่มขึ้นในแต่ละช่อง ซึ่งเป็น 3"
