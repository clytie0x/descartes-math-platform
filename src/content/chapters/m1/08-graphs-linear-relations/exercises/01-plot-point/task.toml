title = "ลากจุดตามคำบอก"
level = 1
type = "point"
board = "ex-drag-point"
board_label = "ระนาบพิกัดที่มีจุดหนึ่งจุด ลากไปวางตามคำบอกในโจทย์"
answer = "-4, 2"
truth = "(-4, 2)"
hints = ['อยู่ทางซ้ายของแกน $y$ แปลว่าพิกัด $x$ ติดลบ', 'ระยะห่างจากแกน $y$ บอกพิกัด $x$ ระยะห่างจากแกน $x$ บอกพิกัด $y$']
statement = '''
ลากจุดสีส้มไปที่จุดซึ่งอยู่ทางซ้ายของแกน $y$ เป็นระยะ 4 หน่วย และอยู่เหนือแกน $x$ เป็นระยะ 2 หน่วย จุดจะติดอยู่บนจุดตัดของเส้นตาราง
'''
solution = '''
ทางซ้ายของแกน $y$ 4 หน่วย คือเดินจากจุดกำเนิดไปทางซ้าย 4 หน่วย พิกัด $x$ เป็น $-4$ เหนือแกน $x$ 2 หน่วย คือขึ้นไป 2 หน่วย พิกัด $y$ เป็น $2$ จุดนี้คือ $(-4, 2)$ อยู่ในจตุภาคที่ 2
'''

[[wrong]]
answer = "2, -4"
message = "สลับตัวหน้ากับตัวหลัง ตัวหน้าคือพิกัด x ซึ่งบอกซ้ายขวา ทางซ้าย 4 หน่วยจึงได้ x = −4"

[[wrong]]
answer = "4, 2"
message = "อยู่ทางซ้ายของแกน y พิกัด x ต้องติดลบ จุดที่ลากอยู่ทางขวา"

[[wrong]]
answer = "-2, 4"
message = "ระยะห่างจากแกน y บอกพิกัด x ไม่ใช่พิกัด y ห่างแกน y ไปทางซ้าย 4 หน่วยจึงได้ x = −4"
