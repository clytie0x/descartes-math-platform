title = "เดินไปโรงเรียน"
level = 2
type = "number"
label = 'นาทีละ'
unit = "เมตร"
answer = "120"
truth = "Rational(1400 - 800, 20 - 15)"
hints = ['ท่อนที่ชันที่สุดคือท่อนที่เดินเร็วที่สุด', 'อัตราเร็วของแต่ละท่อน คือระยะทางที่เพิ่มขึ้นในท่อนนั้นหารด้วยเวลาของท่อนนั้น']
statement = '''
กราฟแสดงระยะทางที่ใบเตยเดินจากบ้านไปโรงเรียน เทียบกับเวลาตั้งแต่ออกจากบ้าน ระหว่างทางใบเตยแวะซื้อขนมครั้งหนึ่ง

<div class="figure"><div class="board" data-board="c8-walk" role="img" aria-label="กราฟเส้นหักสี่จุด จาก 0 นาที 0 เมตร ขึ้นไป 10 นาที 800 เมตร เส้นนอนถึง 15 นาที แล้วขึ้นไป 20 นาที 1400 เมตร"></div></div>

ช่วงที่ใบเตยเดินเร็วที่สุด ใบเตยเดินได้นาทีละกี่เมตร
'''
solution = '''
1. ท่อนแรก นาทีที่ $0$ ถึง $10$ เดินได้ $800$ เมตร ได้นาทีละ $800 \div 10 = 80$ เมตร
2. ท่อนที่สอง นาทีที่ $10$ ถึง $15$ เป็นเส้นแนวนอน ระยะทางไม่เพิ่ม คือหยุดซื้อขนม
3. ท่อนสุดท้าย นาทีที่ $15$ ถึง $20$ เดินจาก $800$ ไปถึง $1400$ เมตร ได้ $600$ เมตรใน $5$ นาที คือนาทีละ $120$ เมตร
4. ท่อนสุดท้ายเร็วที่สุด เดินได้นาทีละ $120$ เมตร ซึ่งในกราฟเป็นท่อนที่ชันที่สุด
'''

[[wrong]]
answer = "80"
message = "80 เมตรต่อนาทีคือท่อนแรก ท่อนสุดท้ายชันกว่า ลองคิดท่อนนาทีที่ 15 ถึง 20"

[[wrong]]
answer = "70"
message = "1400 ÷ 20 = 70 คืออัตราเฉลี่ยทั้งทาง ซึ่งรวมเวลาที่หยุดซื้อขนมด้วย ข้อนี้ถามเฉพาะช่วงที่เร็วที่สุด"

