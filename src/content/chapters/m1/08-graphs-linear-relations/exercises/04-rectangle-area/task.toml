title = "พื้นที่จากพิกัด"
level = 2
type = "number"
unit = "ตารางหน่วย"
answer = "24"
truth = "(4 - (-2)) * (3 - (-1))"
hints = ['$A$ กับ $B$ มีพิกัด $y$ เท่ากัน ด้าน $AB$ ยาวเท่ากับผลต่างของพิกัด $x$', 'ผลต่างของ $4$ กับ $-2$ คือ $4 - (-2)$']
statement = '''
จุด $A(-2, -1)$ $B(4, -1)$ $C(4, 3)$ และ $D(-2, 3)$ เป็นจุดยอดของรูปสี่เหลี่ยมผืนผ้า $ABCD$ จงหาพื้นที่ของรูปสี่เหลี่ยมนี้
'''
solution = '''
1. $A$ กับ $B$ อยู่บนเส้นแนวนอนเดียวกัน ด้าน $AB$ ยาว $4 - (-2) = 6$ หน่วย
2. $B$ กับ $C$ อยู่บนเส้นแนวตั้งเดียวกัน ด้าน $BC$ ยาว $3 - (-1) = 4$ หน่วย
3. พื้นที่ $6 \times 4 = 24$ ตารางหน่วย
'''

[[wrong]]
answer = "4"
message = "ด้าน AB ยาว 4 − (−2) = 6 และด้าน BC ยาว 3 − (−1) = 4 ลบด้วยจำนวนลบคือการบวก"

[[wrong]]
answer = "8"
message = "มีด้านหนึ่งที่ลืมเครื่องหมายลบ ตรวจว่า AB = 4 − (−2) = 6 และ BC = 3 − (−1) = 4"

[[wrong]]
answer = "20"
message = "20 คือความยาวรอบรูป 2 × (6 + 4) ข้อนี้ถามพื้นที่ คือกว้างคูณยาว"
