title = "จุดบนเส้นตรง"
level = 1
type = "choice"
choices = ['$(4, 2)$', '$(0, 2)$', '$(2, 4)$', '$(-1, 1)$']
answer = 2
checks = ["3*2 - 2 == 4", "3*4 - 2 != 2", "3*0 - 2 != 2", "3*(-1) - 2 != 1"]
hints = ['แทนพิกัด $x$ ของจุดลงใน $3x - 2$ แล้วดูว่าได้พิกัด $y$ ของจุดนั้นหรือไม่']
statement = '''
จุดใดอยู่บนกราฟของ $y = 3x - 2$
'''
solution = '''
แทน $x = 2$ ได้ $y = 3(2) - 2 = 4$ ตรงกับจุด $(2, 4)$ ส่วนจุดอื่นแทนแล้วไม่ตรง เช่น $x = 4$ ได้ $y = 10$ ไม่ใช่ $2$ และ $x = 0$ ได้ $y = -2$ ไม่ใช่ $2$
'''

