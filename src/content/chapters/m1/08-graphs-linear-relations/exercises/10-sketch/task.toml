title = "วาดกราฟเส้นตรงในกระดาษ"
level = 2
type = "self"
checks = [
  "(-2*x + 4).subs(x, 0) == 4",
  "solve(-2*x + 4, x) == [2]",
  "(-2*x + 4).subs(x, 1) == 2",
  "(-2*x + 4).subs(x, 3) == -2",
]
hints = ['หาจุดตัดแกน $y$ จากการแทน $x = 0$ และจุดตัดแกน $x$ จากการให้ $y = 0$', 'หาจุดที่สามไว้ตรวจ เช่นแทน $x = 1$']
statement = '''
วาดกราฟของ $y = -2x + 4$ ในกระดาษ ให้กราฟแสดงจุดตัดแกน $x$ จุดตัดแกน $y$ และจุดอื่นอีกอย่างน้อยหนึ่งจุด เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์
'''
solution = '''
<div class="figure"><div class="board" data-board="c8-sketch-check" role="img" aria-label="เส้นตรงเอียงลงไปทางขวา ผ่านจุด 0 ลูกน้ำ 4 จุด 1 ลูกน้ำ 2 จุด 2 ลูกน้ำ 0 และจุด 3 ลูกน้ำ ลบ 2"></div></div>

ตรวจกราฟของตัวเองทีละข้อ ได้ครบห้าข้อถือว่าผ่าน

- ตัดแกน $y$ ที่ $(0, 4)$ เพราะแทน $x = 0$ ได้ $y = 4$
- ตัดแกน $x$ ที่ $(2, 0)$ เพราะ $0 = -2x + 4$ ได้ $x = 2$
- มีจุดอื่นที่อยู่บนเส้นจริง เช่น $(1, 2)$ หรือ $(3, -2)$
- เส้นเอียงลงไปทางขวา เพราะ $a = -2$ ติดลบ ทุกครั้งที่ $x$ เพิ่ม $1$ ค่า $y$ ลดลง $2$
- ลากเป็นเส้นตรงเส้นเดียวผ่านทุกจุด และลากเลยออกไปทั้งสองข้าง
'''
