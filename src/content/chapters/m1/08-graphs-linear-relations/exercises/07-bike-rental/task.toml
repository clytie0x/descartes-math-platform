title = "เช่าจักรยาน"
level = 2
type = "number"
unit = "ชั่วโมง"
answer = "6"
truth = "solve(15*x + 30 - 120, x)[0]"
hints = ['ให้ $x$ แทนจำนวนชั่วโมง ค่าเช่าคือ $y = 15x + 30$', 'แก้สมการ $15x + 30 = 120$']
statement = '''
ร้านให้เช่าจักรยานริมหาดคิดค่าแรกเข้าครั้งละ 30 บาท และค่าเช่าชั่วโมงละ 15 บาท ถ้าแป้งจ่ายค่าเช่าทั้งหมด 120 บาท แป้งเช่าจักรยานกี่ชั่วโมง
'''
solution = '''
1. ให้ $x$ แทนจำนวนชั่วโมง และ $y$ แทนค่าเช่าเป็นบาท ได้ $y = 15x + 30$
2. จ่าย $120$ บาท จึงได้ $15x + 30 = 120$
3. ลบ $30$ ทั้งสองข้าง $15x = 90$ จึงได้ $x = 6$ คือเช่า 6 ชั่วโมง
4. ตรวจ $15(6) + 30 = 120$ บาท ถูกต้อง
'''

[[wrong]]
answer = "8"
message = "120 ÷ 15 = 8 ลืมหักค่าแรกเข้า 30 บาทก่อน เงินที่เป็นค่าเช่ารายชั่วโมงมีแค่ 120 − 30 = 90 บาท"

[[wrong]]
answer = "10"
message = "ค่าแรกเข้าต้องลบออก ไม่ใช่บวกเพิ่ม 120 − 30 = 90 แล้วจึงหารด้วย 15"
