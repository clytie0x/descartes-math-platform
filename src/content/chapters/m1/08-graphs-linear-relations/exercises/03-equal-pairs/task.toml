title = "คู่อันดับที่เท่ากัน"
level = 1
type = "number"
label = '$x + y =$'
answer = "7"
truth = "solve(2*x - 1 - 5, x)[0] + solve(y + 3 - 7, y)[0]"
hints = ['ตัวหน้าเท่ากับตัวหน้า ได้ $2x - 1 = 5$', 'ตัวหลังเท่ากับตัวหลัง ได้ $7 = y + 3$']
statement = '''
ถ้า $(2x - 1, 7) = (5, y + 3)$ แล้ว $x + y$ เท่ากับเท่าใด
'''
solution = '''
1. ตัวหน้าเท่ากัน $2x - 1 = 5$ ได้ $2x = 6$ จึงได้ $x = 3$
2. ตัวหลังเท่ากัน $7 = y + 3$ จึงได้ $y = 4$
3. $x + y = 3 + 4 = 7$
'''

[[wrong]]
answer = "6"
message = "จับคู่ข้ามตำแหน่ง 2x − 1 เป็นตัวหน้า ต้องเท่ากับ 5 ซึ่งเป็นตัวหน้าเหมือนกัน ไม่ใช่ 7"

[[wrong]]
