title = "ร้านน้ำปั่นบนแผนที่"
level = 2
type = "number"
unit = "เซนติเมตร"
answer = "9"
truth = "Rational(12, 2) + Rational(12, 4)"
hints = ['$M$ เป็นจุดกึ่งกลางของ $\overline{AB}$ จึงได้ $AM = 6$ เซนติเมตร', '$N$ เป็นจุดกึ่งกลางของ $\overline{MB}$ แล้ว $MN$ ยาวเท่าไร']
statement = '''
บนแผนที่ ทางตรงจากบ้าน $A$ ไปโรงเรียน $B$ เป็น $\overline{AB}$ ยาว $12$ เซนติเมตร เบียร์แบ่งครึ่ง $\overline{AB}$ ด้วยวงเวียนได้จุด $M$ แล้วแบ่งครึ่ง $\overline{MB}$ ได้จุด $N$ ร้านน้ำปั่นอยู่ที่จุด $N$ บนแผนที่ ร้านอยู่ห่างจากบ้าน $A$ กี่เซนติเมตร
'''
solution = '''
1. $M$ เป็นจุดกึ่งกลางของ $\overline{AB}$ ได้ $AM = MB = 12 \div 2 = 6$ เซนติเมตร
2. $N$ เป็นจุดกึ่งกลางของ $\overline{MB}$ ได้ $MN = NB = 6 \div 2 = 3$ เซนติเมตร
3. $AN = AM + MN = 6 + 3 = 9$ เซนติเมตร

ตรวจอีกทาง $N$ อยู่ห่างจาก $B$ เป็นระยะหนึ่งในสี่ของ $AB$ คือ $3$ เซนติเมตร จึงห่างจาก $A$ เป็นระยะ $12 - 3 = 9$ เซนติเมตร
'''

[[wrong]]
answer = "3"
message = "3 เซนติเมตรคือ MN หรือ NB ข้อนี้ถามระยะจากบ้าน A ไปถึง N"

[[wrong]]
answer = "6"
message = "6 เซนติเมตรคือ AM ร้านอยู่เลย M ไปทาง B อีก 3 เซนติเมตร"

[[wrong]]
answer = "4"
message = "การแบ่งครึ่งสองครั้งแบ่ง AB เป็นสี่ส่วน ไม่ใช่สามส่วน ลองหา AM กับ MN ทีละขั้น"
