hints = ['หัวลูกศรด้านเดียวบอกว่าเป็นรังสี ตัวอักษรตัวแรกคือจุดเริ่มต้น']
statement = '''
$\overrightarrow{PQ}$ หมายถึงรูปใด
'''
solution = '''
ลูกศรด้านเดียวหมายถึงรังสี ซึ่งยาวต่อไปไม่สิ้นสุดทางเดียว ตัวอักษรตัวแรกคือจุดเริ่มต้น $\overrightarrow{PQ}$ จึงเป็นรังสีที่เริ่มที่ $P$ แล้วพุ่งผ่าน $Q$ ออกไป

เทียบกับสัญลักษณ์อื่น $\overrightarrow{QP}$ เริ่มที่ $Q$ $\overline{PQ}$ เป็นส่วนของเส้นตรง และ $\overleftrightarrow{PQ}$ เป็นเส้นตรง
'''

