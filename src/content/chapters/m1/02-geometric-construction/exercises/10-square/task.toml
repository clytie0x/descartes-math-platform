1. ลากเส้นตรงแล้วสร้าง $\overline{AB}$ ยาว $5$ เซนติเมตรบนเส้นนั้น
2. สร้างเส้นตั้งฉากกับ $\overline{AB}$ ที่จุด $A$ และที่จุด $B$ ด้วยวิธีเส้นตั้งฉากที่จุดบนเส้นตรง
3. กางวงเวียนยาวเท่า $AB$ ใช้ $A$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัดเส้นตั้งฉากที่ $A$ ได้จุด $D$ แล้วทำแบบเดียวกันที่ $B$ ได้จุด $C$
4. ลาก $\overline{DC}$

