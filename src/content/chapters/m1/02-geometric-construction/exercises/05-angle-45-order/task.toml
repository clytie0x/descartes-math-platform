title = "ลำดับการสร้างมุม 45 องศา"
level = 2
type = "order"
steps = [
  'ใช้ $P$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัด $\ell$ ทั้งสองข้างของ $P$ ที่ $A$ และ $B$',
  'ใช้ $A$ และ $B$ เป็นจุดศูนย์กลาง รัศมีเท่ากัน เขียนส่วนโค้งตัดกันที่ $Q$ เหนือ $\ell$',
  'ลาก $\overrightarrow{PQ}$ ได้ $Q\hat{P}B = 90^\circ$',
  'ใช้ $P$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัด $\overrightarrow{PQ}$ ที่ $R$ และตัด $\overrightarrow{PB}$ ที่ $S$',
  'ใช้ $R$ และ $S$ เป็นจุดศูนย์กลาง รัศมีเท่ากัน เขียนส่วนโค้งตัดกันที่ $T$ ในมุม $Q\hat{P}B$',
  'ลาก $\overrightarrow{PT}$ ได้ $T\hat{P}B = 45^\circ$',
]
hints = ['$45^\circ$ คือครึ่งหนึ่งของ $90^\circ$ ต้องมีมุมฉากก่อนจึงจะแบ่งครึ่งได้', 'สามขั้นแรกคือการสร้างเส้นตั้งฉากที่จุดบนเส้นตรง']
statement = '''
กำหนดเส้นตรง $\ell$ และจุด $P$ บน $\ell$ เรียงขั้นตอนการสร้างมุม $45^\circ$ ที่จุด $P$
'''
solution = '''
แบ่งเป็นสองช่วง ช่วงแรกสร้างมุมฉาก ช่วงที่สองแบ่งครึ่งมุมฉาก

1. ส่วนโค้งจาก $P$ ตัด $\ell$ ที่ $A$ และ $B$ ทำให้ $PA = PB$
2. ส่วนโค้งจาก $A$ และ $B$ รัศมีเท่ากัน ตัดกันที่ $Q$
3. $\overrightarrow{PQ}$ ตั้งฉากกับ $\ell$ ได้ $Q\hat{P}B = 90^\circ$
4. ส่วนโค้งจาก $P$ ตัดแขนทั้งสองของมุมฉากที่ $R$ และ $S$
5. ส่วนโค้งจาก $R$ และ $S$ รัศมีเท่ากัน ตัดกันที่ $T$
6. $\overrightarrow{PT}$ แบ่งครึ่งมุมฉาก ได้ $T\hat{P}B = 90^\circ \div 2 = 45^\circ$
'''

[[wrong]]
answer = [3, 4, 5, 0, 1, 2]
message = "ขั้นที่แบ่งครึ่งใช้รังสี PQ ซึ่งยังไม่มี ต้องสร้างมุมฉากก่อนแล้วจึงแบ่งครึ่ง"

[[wrong]]
answer = [1, 0, 2, 3, 4, 5]
message = "จุด A กับ B เกิดจากส่วนโค้งรอบ P ต้องมี A กับ B ก่อนจึงใช้เป็นจุดศูนย์กลางได้"
