title = "ถ่ายความยาวต่อกัน"
level = 1
type = "number"
unit = "เซนติเมตร"
answer = "11"
truth = "2*7 - 3"
hints = ['ถ่ายความยาวต่อไปทางเดิมคือการบวก ถ่ายย้อนกลับเข้าหาจุดเริ่มคือการลบ', 'ถ่าย $AB$ สองครั้งได้ $7 + 7$ เซนติเมตร']
statement = '''
กำหนด $\overline{AB}$ ยาว $7$ เซนติเมตร และ $\overline{CD}$ ยาว $3$ เซนติเมตร ฝ้ายลากรังสีจากจุด $P$ แล้วทำดังนี้

1. ถ่ายความยาว $AB$ จาก $P$ ได้จุด $X$
2. ถ่ายความยาว $AB$ ต่อจาก $X$ ไปทางเดิม ได้จุด $Y$
3. ใช้ $Y$ เป็นจุดศูนย์กลาง ถ่ายความยาว $CD$ ย้อนกลับเข้าหา $P$ ได้จุด $Q$

$\overline{PQ}$ ยาวเท่าใด
'''
solution = '''
1. $PX = 7$ และ $XY = 7$ จึงได้ $PY = 7 + 7 = 14$ เซนติเมตร
2. ถ่าย $CD$ ย้อนกลับเข้าหา $P$ คือหักออก $PQ = PY - QY = 14 - 3 = 11$ เซนติเมตร

สรุปเป็นสูตรได้ $PQ = 2AB - CD$
'''

[[wrong]]
answer = "17"
