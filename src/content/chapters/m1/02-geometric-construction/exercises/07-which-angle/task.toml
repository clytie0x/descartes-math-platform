title = "มุมที่สร้างไม่ได้"
level = 2
type = "choice"
choices = ['$75^\circ$', '$135^\circ$', '$22.5^\circ$', '$50^\circ$']
answer = 3
checks = [
  "60 + Rational(30, 2) == 75",
  "90 + 45 == 135",
  "Rational(90, 4) == Rational('22.5')",
]
hints = ['มุมที่สร้างได้ในบทนี้เริ่มจาก $60^\circ$ กับ $90^\circ$ แล้วแบ่งครึ่ง บวก หรือลบกัน', 'ลองเขียนแต่ละตัวเลือกเป็นผลบวกหรือผลต่างของ $60^\circ$ $30^\circ$ $15^\circ$ $90^\circ$ $45^\circ$']
statement = '''
ถ้าใช้แค่วิธีในบทนี้ คือสร้างมุม $60^\circ$ สร้างมุมฉาก แบ่งครึ่งมุม และนำมุมมาต่อกันหรือหักออกจากกัน มุมใดต่อไปนี้สร้างไม่ได้
'''
solution = '''
- $75^\circ = 60^\circ + 15^\circ$ โดย $15^\circ$ ได้จากการแบ่งครึ่ง $30^\circ$ สร้างได้
- $135^\circ = 90^\circ + 45^\circ$ หรือ $180^\circ - 45^\circ$ สร้างได้
- $22.5^\circ = 90^\circ \div 4$ แบ่งครึ่งมุมฉากสองครั้ง สร้างได้
- $50^\circ$ เขียนเป็นผลบวกหรือผลต่างของมุมเหล่านี้ไม่ได้ จึงสร้างไม่ได้

นักคณิตศาสตร์พิสูจน์ไว้แล้วว่ามุม $50^\circ$ สร้างด้วยวงเวียนกับสันตรงไม่ได้เลย ไม่ว่าจะใช้วิธีใด
'''

