hints = ['สร้าง $\overline{PQ}$ ก่อน แล้วสร้างมุม $60^\circ$ ที่ $P$ และแบ่งครึ่ง', 'ถ่ายความยาว $5$ เซนติเมตรลงบนแขนของมุม $30^\circ$']
statement = '''
จงสร้างรูปสามเหลี่ยม $PQR$ ที่มี $PQ = 6$ เซนติเมตร $Q\hat{P}R = 30^\circ$ และ $PR = 5$ เซนติเมตร ด้วยวงเวียนและสันตรง แล้ววัดความยาวของ $\overline{QR}$ เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์
'''
solution = '''
<figure class="figure"><svg class="fig" viewBox="0 0 330 185" role="img" aria-label="รูปสามเหลี่ยม PQR ฐาน PQ ยาว 6 เซนติเมตร มุมที่ P เท่ากับ 30 องศา ส่วนโค้งรัศมี 5 เซนติเมตรตัดแขนของมุมที่ R"><line class="line" x1="40" y1="150" x2="280" y2="150" /><line class="thin" x1="40" y1="150" x2="268.6" y2="18" /><path class="teal" d="M222.7 68.7 A200 200 0 0 0 201.8 32.4" /><line class="accent" x1="40" y1="150" x2="213.2" y2="50" /><line class="accent" x1="280" y1="150" x2="213.2" y2="50" /><path class="thin" d="M80 150 A40 40 0 0 0 74.6 130" /><text class="label" x="88" y="140">30°</text><circle class="dot" cx="40" cy="150" r="4" /><circle class="dot" cx="280" cy="150" r="4" /><circle class="dot-accent" cx="213.2" cy="50" r="4" /><text class="label-math" x="22" y="156">P</text><text class="label-math" x="288" y="156">Q</text><text class="label-math" x="207.2" y="38">R</text><text class="label" x="160" y="172" text-anchor="middle">6 ซม.</text></svg></figure>

ขั้นตอน

1. สร้าง $\overline{PQ}$ ยาว $6$ เซนติเมตร
2. สร้างมุม $60^\circ$ ที่ $P$ ด้วยส่วนโค้งรัศมีเท่ากันจาก $P$ และจากจุดบน $\overline{PQ}$ แล้วแบ่งครึ่งได้มุม $30^\circ$
3. กางวงเวียน $5$ เซนติเมตร ใช้ $P$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัดแขนของมุม $30^\circ$ ที่ $R$
4. ลาก $\overline{QR}$

ตรวจงานของตัวเองทีละข้อ ได้ครบสี่ข้อถือว่าผ่าน

- มีร่องรอยการสร้างมุม $60^\circ$ และการแบ่งครึ่งมุม ไม่ได้ใช้ไม้โปรแทรกเตอร์วาด
- $PQ = 6$ เซนติเมตร และ $PR = 5$ เซนติเมตร
- วัด $Q\hat{P}R$ ด้วยไม้โปรแทรกเตอร์เพื่อตรวจ ได้ $30^\circ$ คลาดไม่เกิน $1^\circ$
- วัด $QR$ ได้ประมาณ $3$ เซนติเมตร ถ้าได้ต่างจากนี้เกิน $2$ มิลลิเมตร ให้ตรวจขั้นแบ่งครึ่งมุมอีกครั้ง
'''
