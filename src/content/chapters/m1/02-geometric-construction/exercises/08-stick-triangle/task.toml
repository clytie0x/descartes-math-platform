title = "ไม้ท่อนที่สาม"
level = 2
type = "number"
unit = "เซนติเมตร"
answer = "6"
truth = "Min(*[n for n in range(1, 30) if n + 4 > 9 and 4 + 9 > n])"
hints = ['ผลบวกของสองด้านที่สั้นกว่าต้องมากกว่าด้านที่ยาวที่สุด', 'ให้ท่อนที่สามยาว $n$ เซนติเมตร ถ้า $n$ สั้น ด้านที่ยาวที่สุดคือ $9$ จึงต้องได้ $4 + n$ มากกว่า $9$']
statement = '''
แพรมีไม้ไอศกรีมยาว $4$ เซนติเมตรกับ $9$ เซนติเมตร จะตัดไม้อีกท่อนหนึ่งให้ยาวเป็นจำนวนเต็มเซนติเมตร แล้วต่อปลายไม้ทั้งสามเป็นรูปสามเหลี่ยม ไม้ท่อนที่สามสั้นที่สุดได้กี่เซนติเมตร
'''
solution = '''
1. ให้ไม้ท่อนที่สามยาว $n$ เซนติเมตร ถ้า $n$ สั้น ด้านที่ยาวที่สุดคือ $9$
2. ต้องได้ $4 + n$ มากกว่า $9$ คือ $n$ มากกว่า $5$
3. $n$ เป็นจำนวนเต็ม จึงสั้นที่สุดคือ $6$ เซนติเมตร ตรวจ $4 + 6 = 10$ มากกว่า $9$ ใช้ได้

ถ้า $n = 5$ จะได้ $4 + 5 = 9$ พอดี ส่วนโค้งแตะกันบนเส้นตรง ได้แค่ไม้วางต่อกันเป็นเส้นเดียว ไม่ใช่รูปสามเหลี่ยม
'''

