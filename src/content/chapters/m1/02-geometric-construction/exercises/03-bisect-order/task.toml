title = "ลำดับการแบ่งครึ่งส่วนของเส้นตรง"
level = 1
type = "order"
steps = [
  'กางวงเวียนให้ยาวมากกว่าครึ่งหนึ่งของ $AB$',
  'ใช้ $A$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งทั้งด้านบนและด้านล่างของ $\overline{AB}$',
  'ใช้รัศมีเดิม ใช้ $B$ เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัดส่วนโค้งแรกที่ $P$ และ $Q$',
  'ลาก $\overleftrightarrow{PQ}$ ตัด $\overline{AB}$ ที่ $M$',
  'สรุปได้ว่า $AM = MB$',
]
hints = ['ขั้นไหนต้องมีจุด $P$ และ $Q$ อยู่แล้วจึงจะทำได้']
statement = '''
เรียงขั้นตอนการหาจุดกึ่งกลาง $M$ ของ $\overline{AB}$ ด้วยวงเวียนและสันตรง
'''
solution = '''
1. กางวงเวียนให้ยาวมากกว่าครึ่งหนึ่งของ $AB$ ก่อน ถ้าสั้นกว่านี้ส่วนโค้งจะไม่ตัดกัน
2. เขียนส่วนโค้งจาก $A$ ทั้งบนและล่าง
3. ใช้รัศมีเดิมเขียนส่วนโค้งจาก $B$ ได้จุดตัด $P$ และ $Q$
4. ลากเส้นผ่าน $P$ และ $Q$ ตัด $\overline{AB}$ ที่ $M$
5. $M$ เป็นจุดกึ่งกลาง เพราะ $P$ และ $Q$ ห่างจาก $A$ และ $B$ เท่ากัน
'''

[[wrong]]
answer = [1, 0, 2, 3, 4]
message = "ต้องกางวงเวียนให้ได้รัศมีที่ยาวพอก่อน แล้วจึงเขียนส่วนโค้งจาก A"

[[wrong]]
answer = [0, 1, 3, 2, 4]
message = "ลากเส้นผ่าน P กับ Q ได้ก็ต่อเมื่อมีจุด P กับ Q แล้ว ซึ่งเกิดจากส่วนโค้งจาก B"
