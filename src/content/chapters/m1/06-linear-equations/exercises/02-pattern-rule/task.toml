title = "พจน์ที่ n ของแบบรูป"
level = 1
type = "expr"
label = 'พจน์ที่ $n$ $=$'
answer = "4n+3"
truth = "4*symbols('n') + 3"
accept = ["3+4n", "4*n+3"]
hints = ['แต่ละพจน์เพิ่มขึ้นทีละเท่าไร ถ้าเพิ่มทีละ $d$ นิพจน์จะมี $dn$', 'เทียบ $4n$ กับพจน์จริงที่ $n = 1$ ต่างกันเท่าไร']
statement = '''
แบบรูป $7, 11, 15, 19, \ldots$ มีพจน์ที่ $n$ เป็นนิพจน์ใด เขียนในรูปของ $n$
'''
solution = '''
แต่ละพจน์เพิ่มทีละ $4$ จึงมี $4n$ ที่ $n = 1$ ค่า $4n$ คือ $4$ แต่พจน์จริงคือ $7$ ต้องบวก $3$ ได้พจน์ที่ $n$ เป็น $4n + 3$


ตรวจ $n = 2$ ได้ $11$ และ $n = 4$ ได้ $19$ ตรงกับแบบรูป
'''

[[wrong]]
answer = "n+4"
message = "เพิ่มทีละ 4 แปลว่ามี 4n ไม่ใช่ n + 4 ลองแทน n = 1 ใน n + 4 ได้ 5 ไม่ใช่ 7"

[[wrong]]
answer = "4n+7"
message = "แทน n = 1 ใน 4n + 7 ได้ 11 ซึ่งเป็นพจน์ที่ 2 ต้องได้ 7 ที่ n = 1"

[[wrong]]
answer = "7n+4"
message = "สัมประสิทธิ์ของ n คือค่าที่เพิ่มทีละเท่ากัน ซึ่งเป็น 4 ไม่ใช่ 7"
