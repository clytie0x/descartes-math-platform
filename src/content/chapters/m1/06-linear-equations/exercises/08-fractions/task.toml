title = "สมการเศษส่วน"
level = 3
type = "number"
label = '$x =$'
answer = "10"
truth = "solve(Eq((x - 1)/3 - (x - 4)/6, 2), x)[0]"
hints = ['ค.ร.น. ของ $3$ กับ $6$ คือ $6$ คูณทุกพจน์ทั้งสองข้างด้วย $6$', 'เครื่องหมายลบหน้า $\dfrac{x - 4}{6}$ คูณเข้าไปทั้งก้อน ได้ $-(x - 4)$']
statement = '''
แก้สมการ $\dfrac{x - 1}{3} - \dfrac{x - 4}{6} = 2$
'''
solution = '''
1. คูณทั้งสองข้างด้วย $6$ ได้ $2(x - 1) - (x - 4) = 12$
2. กระจาย $2x - 2 - x + 4 = 12$ รวมพจน์ได้ $x + 2 = 12$
3. ลบ $2$ ทั้งสองข้าง ได้ $x = 10$


ตรวจ $\tfrac{10 - 1}{3} - \tfrac{10 - 4}{6} = 3 - 1 = 2$ จริง
'''

