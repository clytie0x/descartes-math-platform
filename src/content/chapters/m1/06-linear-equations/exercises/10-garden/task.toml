title = "แปลงผักสี่เหลี่ยมผืนผ้า"
level = 3
type = "number"
unit = "เมตร"
answer = "25"
truth = "2*solve(Eq(2*(x + (2*x + 3)), 72), x)[0] + 3"
hints = ['ให้ด้านกว้างยาว $x$ เมตร ด้านยาวคือ $2x + 3$ เมตร', 'ความยาวรอบรูปเท่ากับ $2 \times (\text{กว้าง} + \text{ยาว})$']
statement = '''
แปลงผักของโรงเรียนเป็นรูปสี่เหลี่ยมผืนผ้า ด้านยาวยาวกว่าสองเท่าของด้านกว้างอยู่ 3 เมตร ล้อมรั้วรอบแปลงได้ยาว 72 เมตรพอดี ด้านยาวของแปลงยาวกี่เมตร
'''
solution = '''
1. ให้ด้านกว้างยาว $x$ เมตร ด้านยาวคือ $2x + 3$ เมตร
2. ความยาวรอบรูป $2\big(x + (2x + 3)\big) = 72$ ได้ $6x + 6 = 72$
3. ลบ $6$ ทั้งสองข้าง ได้ $6x = 66$ จึงได้ $x = 11$
4. ด้านยาวคือ $2(11) + 3 = 25$ เมตร


ตรวจกับโจทย์ $25$ มากกว่าสองเท่าของ $11$ อยู่ $3$ จริง และรอบรูป $2(11 + 25) = 72$ เมตร ตรงกับโจทย์
'''

[[wrong]]
answer = "11"
message = "11 เมตรคือด้านกว้าง ข้อนี้ถามด้านยาว แทน x = 11 ใน 2x + 3 อีกขั้น"

