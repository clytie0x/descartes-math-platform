title = "สมการที่ไม่มีคำตอบ"
level = 2
type = "choice"
choices = ['$3(x + 2) = 3x + 6$', '$3(x + 2) = 3x + 5$', '$3(x + 2) = 6$', '$3(x + 2) = 2x + 6$']
answer = 1
checks = [
  "solve(Eq(3*(x + 2), 3*x + 5), x) == []",
  "expand(3*(x + 2) - (3*x + 6)) == 0",
  "solve(Eq(3*(x + 2), 6), x) == [0]",
  "solve(Eq(3*(x + 2), 2*x + 6), x) == [0]",
]
hints = ['กระจาย $3(x + 2)$ ก่อน แล้วเทียบกับข้างขวา', 'ไม่มีคำตอบเมื่อตัวแปรหักล้างกันหมดแล้วเหลือประโยคที่เท็จ']
statement = '''
สมการใดไม่มีคำตอบ
'''
solution = '''
$3(x + 2) = 3x + 6$ ทุกตัว สมการ $3x + 6 = 3x + 5$ ลบ $3x$ ทั้งสองข้างแล้วเหลือ $6 = 5$ ซึ่งเท็จ ไม่ว่า $x$ เป็นจำนวนใด สมการนี้จึงไม่มีคำตอบ


ตัวเลือกอื่น $3x + 6 = 3x + 6$ ทุกจำนวนเป็นคำตอบ ส่วน $3x + 6 = 6$ และ $3x + 6 = 2x + 6$ มีคำตอบคือ $0$ ทั้งคู่
'''

[[wrong]]
answer = 0
message = "สองข้างเหมือนกันทุกตัวหลังกระจาย แทนจำนวนใดก็จริง สมการนี้ทุกจำนวนเป็นคำตอบ"

[[wrong]]
answer = 2
message = "3x + 6 = 6 ได้ x = 0 ซึ่งเป็นคำตอบ คำตอบเป็นศูนย์ไม่ใช่ไม่มีคำตอบ"

[[wrong]]
answer = 3
message = "3x + 6 = 2x + 6 ลบ 2x และลบ 6 ได้ x = 0 สมการนี้มีคำตอบ"
