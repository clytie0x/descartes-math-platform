title = "จำนวนไหนเป็นคำตอบ"
level = 1
type = "choice"
choices = ['$3$', '$6$', '$-6$', '$2$']
answer = 1
checks = [
  "solve(Eq(4*x - 3, 2*x + 9), x) == [6]",
  "[4*v - 3 == 2*v + 9 for v in (3, 6, -6, 2)] == [False, True, False, False]",
]
hints = ['แทนแต่ละตัวเลือกลงไป คำนวณข้างซ้ายกับข้างขวาแยกกัน แล้วดูว่าเท่ากันไหม']
statement = '''
จำนวนใดเป็นคำตอบของสมการ $4x - 3 = 2x + 9$
'''
solution = '''
แทน $x = 6$ ข้างซ้ายได้ $4(6) - 3 = 21$ ข้างขวาได้ $2(6) + 9 = 21$ เท่ากัน $6$ จึงเป็นคำตอบ


ตรวจด้วยการแก้สมการก็ได้ ลบ $2x$ ทั้งสองข้างได้ $2x - 3 = 9$ บวก $3$ ได้ $2x = 12$ จึงได้ $x = 6$
'''

