title = "เรียงขั้นการแก้สมการ"
level = 2
type = "order"
checks = ["solve(Eq(2*(x + 3) - 4, 12), x) == [5]"]
steps = [
  '$2(x + 3) - 4 = 12$',
  '$2x + 6 - 4 = 12$ กระจายวงเล็บ',
  '$2x + 2 = 12$ รวมค่าคงตัวทางซ้าย',
  '$2x = 10$ บวก $-2$ ทั้งสองข้าง ใช้สมบัติการบวก',
  '$x = 5$ คูณ $\tfrac{1}{2}$ ทั้งสองข้าง ใช้สมบัติการคูณ',
  'ตรวจ $2(5 + 3) - 4 = 12$ เป็นจริง',
]
hints = ['เริ่มจากสมการที่โจทย์ให้ ขั้นต่อไปแต่ละขั้นต้องได้จากขั้นก่อนหน้าโดยตรง', 'กำจัดจำนวนที่บวกลบอยู่ก่อน แล้วจึงกำจัดจำนวนที่คูณอยู่']
statement = '''
เรียงขั้นตอนการแก้สมการ $2(x + 3) - 4 = 12$ ให้ถูกลำดับ
'''
solution = '''
1. $2(x + 3) - 4 = 12$
2. $2x + 6 - 4 = 12$ กระจายวงเล็บ
3. $2x + 2 = 12$ รวมค่าคงตัวทางซ้าย
4. $2x = 10$ บวก $-2$ ทั้งสองข้าง
5. $x = 5$ คูณ $\tfrac{1}{2}$ ทั้งสองข้าง
6. ตรวจในสมการเดิม $2(8) - 4 = 12$ เป็นจริง
'''

[[wrong]]
answer = [0, 1, 2, 4, 3, 5]
message = "ขั้น x = 5 ต้องมาจาก 2x = 10 ต้องกำจัด +2 ก่อน แล้วจึงคูณ ½"

[[wrong]]
answer = [0, 2, 1, 3, 4, 5]
message = "ต้องกระจายวงเล็บก่อน จึงจะเห็นค่าคงตัว 6 − 4 ที่รวมกันได้"
