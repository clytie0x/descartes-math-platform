title = "ตั๋วละครเวที"
level = 2
type = "number"
unit = "ใบ"
answer = "30"
truth = "solve(Eq(100*x + 160*(50 - x), 6200), x)[0]"
hints = ['ให้ขายตั๋วนักเรียน $x$ ใบ ตั๋วผู้ใหญ่จึงขายได้ $50 - x$ ใบ', 'เงินจากตั๋วนักเรียนบวกเงินจากตั๋วผู้ใหญ่เท่ากับ $6200$ บาท']
statement = '''
ชมรมการแสดงขายตั๋วละครเวที ตั๋วนักเรียนใบละ 100 บาท ตั๋วผู้ใหญ่ใบละ 160 บาท ขายได้ทั้งหมด 50 ใบ เป็นเงิน 6,200 บาท ขายตั๋วนักเรียนได้กี่ใบ
'''
solution = '''
1. ให้ขายตั๋วนักเรียน $x$ ใบ ตั๋วผู้ใหญ่ $50 - x$ ใบ
2. ได้สมการ $100x + 160(50 - x) = 6200$
3. กระจาย $100x + 8000 - 160x = 6200$ รวมพจน์ได้ $8000 - 60x = 6200$
4. ลบ $8000$ ทั้งสองข้าง ได้ $-60x = -1800$ หารด้วย $-60$ ได้ $x = 30$


ตรวจกับโจทย์ ตั๋วนักเรียน 30 ใบเป็นเงิน 3,000 บาท ตั๋วผู้ใหญ่ 20 ใบเป็นเงิน 3,200 บาท รวม 50 ใบ 6,200 บาท ตรงกับโจทย์
'''

[[wrong]]
