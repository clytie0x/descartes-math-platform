title = "ลบหน้าวงเล็บ"
level = 2
type = "number"
label = '$x =$'
answer = "4"
truth = "solve(Eq(4 - 3*(x - 2), 2*x - 10), x)[0]"
hints = ['$-3$ ต้องคูณทั้ง $x$ และ $-2$ ในวงเล็บ ลบคูณลบเป็นบวก', 'กระจายแล้วได้ $10 - 3x = 2x - 10$']
statement = '''
แก้สมการ $4 - 3(x - 2) = 2x - 10$
'''
solution = '''
1. กระจาย $-3(x - 2) = -3x + 6$ ได้ $4 - 3x + 6 = 2x - 10$ หรือ $10 - 3x = 2x - 10$
2. บวก $3x$ ทั้งสองข้าง ได้ $10 = 5x - 10$
3. บวก $10$ ทั้งสองข้าง ได้ $20 = 5x$ หารด้วย $5$ ได้ $x = 4$


ตรวจ ข้างซ้าย $4 - 3(4 - 2) = -2$ ข้างขวา $2(4) - 10 = -2$ เท่ากัน
'''

[[wrong]]
answer = "1.6"
message = "−3 × (−2) = +6 ไม่ใช่ −6 กระจายแล้วข้างซ้ายต้องเป็น 4 − 3x + 6"

