title = "ทางเดินกระเบื้อง"
level = 1
type = "number"
unit = "แผ่น"
answer = "35"
truth = "solve(Eq(2*x + 6, 76), x)[0]"
hints = ['ทางเดินที่มีกระเบื้องขาว $n$ แผ่น ใช้กระเบื้องเขียว $2n + 6$ แผ่น', 'แก้สมการ $2n + 6 = 76$']
statement = '''
ทางเดินในหน้า 6.1 มีกระเบื้องขาวเรียงแถวเดียว $n$ แผ่น ล้อมด้วยกระเบื้องเขียว $2n + 6$ แผ่น ถ้าใช้กระเบื้องเขียวไป $76$ แผ่นพอดี ทางเดินนี้มีกระเบื้องขาวกี่แผ่น
'''
solution = '''
ได้สมการ $2n + 6 = 76$ ลบ $6$ ทั้งสองข้างได้ $2n = 70$ หารด้วย $2$ ได้ $n = 35$


ตรวจ $2(35) + 6 = 76$ จริง ทางเดินมีกระเบื้องขาว 35 แผ่น
'''

