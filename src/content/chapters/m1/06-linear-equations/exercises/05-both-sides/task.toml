title = "ตัวแปรสองข้าง"
level = 2
type = "number"
label = '$x =$'
answer = "5"
truth = "solve(Eq(7*x - 4, 3*x + 16), x)[0]"
hints = ['ลบ $3x$ ทั้งสองข้างให้ตัวแปรเหลือข้างเดียว', 'จาก $4x - 4 = 16$ บวก $4$ ทั้งสองข้าง']
statement = '''
แก้สมการ $7x - 4 = 3x + 16$
'''
solution = '''
1. ลบ $3x$ ทั้งสองข้าง ได้ $4x - 4 = 16$
2. บวก $4$ ทั้งสองข้าง ได้ $4x = 20$
3. หารด้วย $4$ ทั้งสองข้าง ได้ $x = 5$


ตรวจ ข้างซ้าย $7(5) - 4 = 31$ ข้างขวา $3(5) + 16 = 31$ เท่ากัน
'''

[[wrong]]
answer = "3"
message = "ย้าย −4 ไปอีกข้างต้องบวก 4 ทั้งสองข้าง ได้ 4x = 20 ไม่ใช่ 4x = 12"

[[wrong]]
answer = "2"
message = "ต้องลบ 3x ทั้งสองข้าง ได้ 7x − 3x = 4x ไม่ใช่ 7x + 3x = 10x"

[[wrong]]
answer = "20"
message = "20 คือ 4x ยังต้องหารด้วย 4 อีกครั้ง"
