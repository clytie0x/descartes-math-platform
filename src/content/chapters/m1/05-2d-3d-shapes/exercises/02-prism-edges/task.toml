title = "ติดเทปตามขอบกล่อง"
level = 1
type = "number"
unit = "เส้น"
answer = "24"
truth = "3*8"
hints = ['ปริซึมมีขอบอยู่สามกลุ่ม ขอบของฐานล่าง ขอบของฐานบน และขอบตั้งที่เชื่อมสองฐาน', 'ฐานเป็นรูปแปดเหลี่ยม แต่ละกลุ่มมีกี่เส้น']
statement = '''
กล่องขนมใบหนึ่งเป็นรูปปริซึมแปดเหลี่ยม ถ้าจะติดเทปสีตามขอบของกล่องทุกเส้น เส้นละหนึ่งชิ้น ต้องใช้เทปกี่ชิ้น
'''
solution = '''
ฐานเป็นรูปแปดเหลี่ยม จึงได้ $n = 8$ ขอบของฐานล่าง 8 เส้น ฐานบน 8 เส้น และขอบตั้งอีก 8 เส้น รวม $3n = 3 \times 8 = 24$ เส้น ต้องใช้เทป 24 ชิ้น
'''

[[wrong]]
