title = "ชื่อของรูปทรง"
level = 1
type = "choice"
choices = ['ปริซึมห้าเหลี่ยม', 'พีระมิดฐานห้าเหลี่ยม', 'พีระมิดฐานสามเหลี่ยม', 'กรวย']
answer = 1
hints = ['รูปที่มีฐานเดียวและหน้าข้างเป็นรูปสามเหลี่ยมที่มีจุดร่วมกันคือรูปแบบไหน', 'เรียกชื่อตามรูปของฐาน']
statement = '''
รูปสามมิติรูปหนึ่งมีฐานหนึ่งฐานเป็นรูปห้าเหลี่ยม และมีหน้าข้างเป็นรูปสามเหลี่ยม 5 หน้า ซึ่งมีจุดยอดร่วมกันหนึ่งจุด รูปนี้คือรูปใด
'''
solution = '''
มีฐานเดียว และหน้าข้างเป็นรูปสามเหลี่ยมที่มียอดร่วมกัน จึงเป็นพีระมิด พีระมิดเรียกชื่อตามรูปของฐาน ฐานเป็นรูปห้าเหลี่ยม จึงเป็นพีระมิดฐานห้าเหลี่ยม
'''

[[wrong]]
answer = 0
message = "ปริซึมมีฐานสองฐานที่ขนานกัน และหน้าข้างเป็นรูปสี่เหลี่ยม แต่รูปนี้มีฐานเดียวกับหน้าข้างที่เป็นสามเหลี่ยม"

