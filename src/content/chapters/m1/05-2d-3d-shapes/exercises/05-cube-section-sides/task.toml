title = "หน้าตัดของลูกบาศก์มีกี่ด้าน"
level = 2
type = "set"
label = 'จำนวนด้าน'
answer = ["3", "4", "5", "6"]
truth = "[3, 4, 5, 6]"
accept = ["6, 5, 4, 3"]
hints = ['ด้านแต่ละด้านของหน้าตัดอยู่บนหน้าหนึ่งหน้าของลูกบาศก์ ระนาบตัดหน้าเดียวได้รอยไม่เกินหนึ่งเส้น', 'ลองใช้กราฟในหน้า 5.2 ตั้งรูปทรงเป็น 0 แล้วลองแนวระนาบทุกแบบ']
statement = '''
ตัดลูกบาศก์ด้วยระนาบหนึ่งระนาบ ให้หน้าตัดเป็นรูปหลายเหลี่ยม หน้าตัดนั้นมีจำนวนด้านเป็นเท่าใดได้บ้าง ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
ตัดเฉียดมุมได้รูปสามเหลี่ยม ตัดขนานกับฐานได้รูปสี่เหลี่ยมจัตุรัส ตัดเฉียงโดยปรับแนวและตำแหน่งให้ระนาบผ่านห้าหน้าหรือหกหน้าได้รูปห้าเหลี่ยมหรือหกเหลี่ยมตามลำดับ หน้าตัดห้าเหลี่ยมต้องไม่ผ่านจุดศูนย์กลางลูกบาศก์ ด้านแต่ละด้านของหน้าตัดอยู่บนหน้าคนละหน้าของลูกบาศก์ ลูกบาศก์มี 6 หน้า หน้าตัดจึงมีไม่เกิน 6 ด้าน คำตอบคือ 3 4 5 และ 6
'''

