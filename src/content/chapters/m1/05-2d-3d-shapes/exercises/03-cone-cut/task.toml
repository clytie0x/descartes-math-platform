title = "ผ่าดินน้ำมันรูปกรวย"
level = 1
type = "choice"
choices = ['วงกลม', 'รูปสามเหลี่ยมหน้าจั่ว', 'รูปสี่เหลี่ยมผืนผ้า', 'ครึ่งวงกลม']
answer = 1
hints = ['ระนาบผ่านยอดของกรวย หน้าตัดจึงมีมุมแหลมอยู่ที่ยอด', 'ด้านล่างของหน้าตัดอยู่บนฐานซึ่งเป็นพื้นเรียบ']
statement = '''
ก้อนดินน้ำมันรูปกรวยวางตั้งบนโต๊ะ ใช้เส้นเอ็นผ่าจากยอดลงมาตรงๆ ให้รอยผ่าตั้งฉากกับฐานและผ่านจุดศูนย์กลางของฐาน หน้าตัดเป็นรูปใด
'''
solution = '''
ระนาบตั้งฉากกับฐานและผ่านยอด ด้านล่างของหน้าตัดเป็นเส้นตรงบนฐานยาวเท่าเส้นผ่านศูนย์กลาง อีกสองด้านเป็นเส้นตรงจากปลายเส้นนั้นขึ้นไปหายอด ซึ่งยาวเท่ากันเพราะยอดอยู่ตรงกลาง หน้าตัดจึงเป็นรูปสามเหลี่ยมหน้าจั่ว
'''

[[wrong]]
answer = 0
message = "วงกลมได้จากการตัดขนานกับฐาน ข้อนี้ผ่าตั้งฉากกับฐาน"

[[wrong]]
answer = 2
message = "สี่เหลี่ยมผืนผ้าได้จากการผ่าทรงกระบอก กรวยแหลมขึ้นไปที่ยอด หน้าตัดจึงมีมุมแหลมที่ยอด"

[[wrong]]
answer = 3
message = "ผิวข้างของกรวยไล่จากฐานขึ้นไปหายอดเป็นเส้นตรง รอยผ่าที่ผ่านยอดจึงไม่มีด้านโค้ง"
