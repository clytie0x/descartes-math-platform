title = "เลื่อยท่อนไม้ตามยาว"
level = 2
type = "number"
unit = "ตารางเซนติเมตร"
answer = "300"
truth = "10*30"
hints = ['ตัดทรงกระบอกตั้งฉากกับฐานได้รูปอะไร', 'รอยเลื่อยผ่านแกนกลาง ด้านหนึ่งของหน้าตัดจึงยาวเท่าเส้นผ่านศูนย์กลาง อีกด้านยาวเท่าความยาวของท่อนไม้']
statement = '''
ท่อนไม้ทรงกระบอกมีเส้นผ่านศูนย์กลาง 10 เซนติเมตร ยาว 30 เซนติเมตร เลื่อยตามยาวให้รอยเลื่อยผ่านแกนกลางของท่อนไม้พอดี หน้าตัดมีพื้นที่กี่ตารางเซนติเมตร
'''
solution = '''
เลื่อยตามยาวคือตัดตั้งฉากกับฐานของทรงกระบอก หน้าตัดเป็นรูปสี่เหลี่ยมผืนผ้า ด้านหนึ่งยาวเท่าความยาวของท่อนไม้ 30 เซนติเมตร รอยเลื่อยผ่านแกนกลาง อีกด้านจึงยาวเท่าเส้นผ่านศูนย์กลาง 10 เซนติเมตร พื้นที่ $10 \times 30 = 300$ ตารางเซนติเมตร
'''

[[wrong]]
answer = "150"
message = "ใช้รัศมี 5 เซนติเมตรแทนเส้นผ่านศูนย์กลาง รอยเลื่อยผ่านแกนกลาง ตัดฐานวงกลมยาวเท่าเส้นผ่านศูนย์กลาง 10 เซนติเมตร"

[[wrong]]
answer = "80"
message = "80 คือความยาวรอบรูปของหน้าตัด 10 + 30 + 10 + 30 ข้อนี้ถามพื้นที่"
