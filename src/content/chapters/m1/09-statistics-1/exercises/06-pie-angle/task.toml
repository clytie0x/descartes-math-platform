title = "มุมในแผนภูมิวงกลม"
level = 2
type = "number"
unit = "องศา"
answer = "96"
truth = "Rational(12, 45)*360"
hints = ['ทั้งวงคือนักเรียน 45 คน และมีมุมรอบจุดศูนย์กลาง 360 องศา', 'มุม = จำนวนของส่วนนั้น ÷ จำนวนทั้งหมด × 360']
statement = '''
นักเรียน ม.1/5 จำนวน 45 คน เลือกเข้าชุมนุมคนละหนึ่งชุมนุม มีนักเรียนเลือกชุมนุมดนตรี 12 คน ถ้านำข้อมูลนี้ไปเขียนแผนภูมิวงกลม ชิ้นของชุมนุมดนตรีมีมุมกี่องศา
'''
solution = '''
ชุมนุมดนตรีเป็น $\tfrac{12}{45}$ ของทั้งห้อง มุมจึงเป็น $\tfrac{12}{45} \times 360 = 96$ องศา

คิดอีกทางก็ได้ นักเรียน 1 คนได้มุม $\tfrac{360}{45} = 8$ องศา นักเรียน 12 คนได้ $12 \times 8 = 96$ องศา
'''

