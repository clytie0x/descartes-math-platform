title = "ช่วงที่ฝนลดลงมากที่สุด"
level = 2
type = "number"
unit = "มิลลิเมตร"
answer = "35"
truth = "120 - 85"
hints = ['หาผลต่างของเดือนที่ติดกันทุกคู่ โดยเอาเดือนหลังลบเดือนก่อน', 'ผลต่างที่ติดลบคือช่วงที่ฝนลดลง เลือกตัวที่ติดลบมากที่สุด']
statement = '''
ปริมาณฝนที่วัดได้ในโรงเรียนช่วงต้นปีเป็นดังตาราง ถ้าเขียนเป็นกราฟเส้น ช่วงที่เส้นลงชันที่สุดคือฝนลดลงกี่มิลลิเมตร

| เดือน | ม.ค. | ก.พ. | มี.ค. | เม.ย. | พ.ค. | มิ.ย. |
|---|---|---|---|---|---|---|
| ปริมาณฝน (มิลลิเมตร) | 60 | 35 | 50 | 120 | 85 | 140 |
'''
solution = '''
ผลต่างของเดือนที่ติดกัน

- ม.ค. ไป ก.พ. $35 - 60 = -25$
- ก.พ. ไป มี.ค. $50 - 35 = 15$
- มี.ค. ไป เม.ย. $120 - 50 = 70$
- เม.ย. ไป พ.ค. $85 - 120 = -35$
- พ.ค. ไป มิ.ย. $140 - 85 = 55$

ช่วงที่ลดลงมีสองช่วง ลดลงมากที่สุดคือเมษายนไปพฤษภาคม ลดลง 35 มิลลิเมตร
'''

[[wrong]]
answer = "70"
message = "70 คือช่วงที่ฝนเพิ่มขึ้นมากที่สุด เส้นขึ้น ข้อนี้ถามช่วงที่เส้นลง"

