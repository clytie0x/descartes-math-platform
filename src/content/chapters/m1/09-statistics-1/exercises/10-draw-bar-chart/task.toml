title = "สร้างแผนภูมิแท่งในกระดาษ"
level = 2
type = "self"
checks = [
  "11 + 8 + 7 + 5 + 5 == 36",
  "Max(11, 8, 7, 5, 5) == 11 and 11 <= 12",
]
hints = ['หาค่ามากที่สุดก่อน แล้วเลือกให้แกนตั้งเพิ่มทีละเท่ากันจนเกินค่านั้นเล็กน้อย']
statement = '''
ถามนักเรียน 36 คนว่าชอบผลไม้ใดที่สุด ได้ มะม่วง 11 คน ทุเรียน 8 คน มังคุด 7 คน เงาะ 5 คน ส้มโอ 5 คน วาดแผนภูมิแท่งของข้อมูลนี้ในกระดาษ เสร็จแล้วเปิดเฉลยตรวจตามเกณฑ์
'''
solution = '''
ตรวจแผนภูมิของตัวเองทีละข้อ ได้ครบหกข้อถือว่าผ่าน

- มีชื่อแผนภูมิ เช่น ผลไม้ที่นักเรียน 36 คนชอบที่สุด
- แกนตั้งเริ่มที่ 0 และบอกหน่วยว่า คน
- ตัวเลขบนแกนตั้งเพิ่มทีละเท่ากัน เช่นทีละ 2 ไปจนถึง 12 ซึ่งเกินค่ามากที่สุด 11 เล็กน้อย
- แกนนอนมีชื่อผลไม้ครบห้าชนิด
- แท่งกว้างเท่ากันและห่างเท่ากัน แท่งเงาะกับแท่งส้มโอสูงเท่ากันพอดี
- ความสูงของแท่งรวมกันได้ $11 + 8 + 7 + 5 + 5 = 36$ คน เท่ากับจำนวนนักเรียนที่ถาม
'''
