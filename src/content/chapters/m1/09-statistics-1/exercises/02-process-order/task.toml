hints = ['ขั้นตอนทางสถิติมีสี่ขั้น ตั้งคำถาม เก็บข้อมูล วิเคราะห์ข้อมูล แปลความหมาย']
statement = '''
ชุมนุมสุขภาพอยากรู้เรื่องการนอนของนักเรียน ม.1 เรียงขั้นตอนต่อไปนี้ให้ถูกต้อง
'''
solution = '''
1. ตั้งคำถามทางสถิติก่อน จะได้รู้ว่าต้องเก็บข้อมูลอะไรจากใคร
2. เก็บข้อมูลด้วยแบบสอบถามให้ตรงกับคำถาม
3. วิเคราะห์ข้อมูล นับ จัดตาราง และนำเสนอเป็นแผนภูมิ
4. แปลความหมาย ตอบคำถามที่ตั้งไว้จากภาพรวมของข้อมูล
'''

