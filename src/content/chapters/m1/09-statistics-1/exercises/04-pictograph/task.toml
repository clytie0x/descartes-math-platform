title = "อ่านแผนภูมิรูปภาพ"
level = 1
type = "number"
unit = "เล่ม"
answer = "26"
truth = "6*4 + Rational(1, 2)*4"
hints = ['ครึ่งรูปแทนครึ่งหนึ่งของ 4 เล่ม']
statement = '''
แผนภูมิรูปภาพแสดงจำนวนหนังสือที่แต่ละห้องบริจาคให้ห้องสมุด ใช้รูปหนังสือ 1 รูปแทนหนังสือ 4 เล่ม แถวของห้อง ม.1/3 มีรูปหนังสือเต็ม 6 รูปกับอีกครึ่งรูป ห้อง ม.1/3 บริจาคหนังสือกี่เล่ม
'''
solution = '''
รูปเต็ม 6 รูปแทน $6 \times 4 = 24$ เล่ม ครึ่งรูปแทน $\tfrac{1}{2} \times 4 = 2$ เล่ม รวม $24 + 2 = 26$ เล่ม
'''

