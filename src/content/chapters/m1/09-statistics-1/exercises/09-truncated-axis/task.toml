อ่านตัวเลขบนแกน ร้าน ก ขายได้ 50 ชิ้น ร้าน ข ขายได้ 60 ชิ้น ต่างกัน $60 - 50 = 10$ ชิ้น และ $\tfrac{60}{50} = 1.2$ เท่า

แท่งของร้าน ข ดูสูงเป็น 2 เท่า เพราะแกนเริ่มที่ 40 ความสูงที่เห็นจึงเป็นแค่ $60 - 40 = 20$ กับ $50 - 40 = 10$ ส่วน 40 ชิ้นแรกของทั้งสองร้านถูกตัดทิ้งไป
