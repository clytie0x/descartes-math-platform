statement = '''
ข้อมูลใดเป็นข้อมูลเชิงปริมาณ
'''
solution = '''
จำนวนพี่น้องได้จากการนับ คนที่มีพี่น้อง 3 คนมีมากกว่าคนที่มี 1 คนอยู่ 2 คน เทียบกันได้จริง จึงเป็นข้อมูลเชิงปริมาณ

กรุ๊ปเลือดกับสีเป็นชื่อกลุ่ม ส่วนรหัสไปรษณีย์เป็นตัวเลขที่ใช้เป็นป้ายชื่อ เอามาบวกลบกันไม่มีความหมาย ทั้งสามจึงเป็นข้อมูลเชิงคุณภาพ
'''

