title = "จากมุมกลับเป็นจำนวนคน"
level = 2
type = "number"
unit = "คน"
answer = "36"
truth = "Rational(54, 360)*240"
hints = ['มุม 54 องศาคิดเป็นเศษส่วนเท่าไรของทั้งวง 360 องศา', 'ได้เศษส่วนแล้ว คูณด้วยจำนวนนักเรียนทั้งหมด']
statement = '''
แผนภูมิวงกลมแสดงวิชาที่นักเรียน ม.1 จำนวน 240 คนชอบที่สุด ชิ้นของวิชาคณิตศาสตร์มีมุม 54 องศา มีนักเรียนที่ชอบวิชาคณิตศาสตร์ที่สุดกี่คน
'''
solution = '''
1. มุม 54 องศาเป็น $\tfrac{54}{360} = \tfrac{3}{20}$ ของทั้งวง หรือร้อยละ 15
2. จำนวนนักเรียน $\tfrac{3}{20} \times 240 = 36$ คน
'''

[[wrong]]
answer = "15"
message = "15 คือร้อยละ ยังต้องคิดต่อว่าร้อยละ 15 ของ 240 คนเป็นกี่คน"

[[wrong]]
answer = "54"
message = "54 คือมุม ไม่ใช่จำนวนคน ทั้งวง 360 องศาแทนนักเรียน 240 คน"

[[wrong]]
answer = "81"
message = "54 ÷ 240 × 360 เอา 240 กับ 360 ไปใส่สลับที่กัน ต้องคิดว่า 54 องศาเป็นส่วนเท่าไรของ 360 องศา แล้วคูณ 240"
