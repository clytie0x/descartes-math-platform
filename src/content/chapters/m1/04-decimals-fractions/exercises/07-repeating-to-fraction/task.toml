title = "ทศนิยมซ้ำเป็นเศษส่วน"
level = 2
type = "number"
answer = "5/11"
truth = "Rational(45, 99)"
accept = ["45/99"]
checks = ["floor(Rational(5, 11) * 10**6) == 454545"]
hints = ['ชุดที่ซ้ำคือ $45$ ยาวสองตัว ให้ $N = 0.4545\ldots$ แล้วคูณด้วย $100$', '$100N - N = 45$']
statement = '''
เขียน $0.\dot{4}\dot{5}$ เป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. ให้ $N = 0.454545\ldots$ ได้ $100N = 45.4545\ldots$
2. $100N - N = 45$ จึงได้ $99N = 45$
3. $N = \tfrac{45}{99} = \tfrac{5}{11}$ หลังหารทั้งสองตัวด้วย $9$
4. ตรวจ $5 \div 11 = 0.4545\ldots$ ถูกต้อง
'''

