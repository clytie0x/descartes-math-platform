title = "กะทิสำหรับขนมครก"
level = 3
type = "number"
unit = "ถ้วย"
answer = "15/4"
truth = "(2 + Rational(1, 2)) * Rational(60, 40)"
accept = ["3.75", "3+3/4"]
hints = ['60 ชิ้นเป็นกี่เท่าของ 40 ชิ้น', '$\tfrac{60}{40} = \tfrac{3}{2}$ แล้วเปลี่ยน $2\tfrac{1}{2}$ เป็นเศษเกินก่อนคูณ']
statement = '''
สูตรขนมครกของแม่ใช้กะทิ $2\tfrac{1}{2}$ ถ้วย ทำได้ 40 ชิ้น ถ้าจะทำ 60 ชิ้นด้วยสูตรเดียวกัน ต้องใช้กะทิกี่ถ้วย ตอบเป็นเศษส่วนหรือทศนิยม
'''
solution = '''
1. 60 ชิ้นเป็น $\tfrac{60}{40} = \tfrac{3}{2}$ เท่าของ 40 ชิ้น กะทิจึงต้องเป็น $\tfrac{3}{2}$ เท่าด้วย
2. $2\tfrac{1}{2} \times \tfrac{3}{2} = \tfrac{5}{2} \times \tfrac{3}{2} = \tfrac{15}{4}$
3. ใช้กะทิ $\tfrac{15}{4} = 3\tfrac{3}{4}$ ถ้วย หรือ $3.75$ ถ้วย
4. ตรวจอีกทาง 40 ชิ้นใช้ $2\tfrac{1}{2}$ ถ้วย 20 ชิ้นจึงใช้ครึ่งหนึ่งคือ $1\tfrac{1}{4}$ ถ้วย รวมได้ $3\tfrac{3}{4}$ ถ้วย ตรงกัน
'''

[[wrong]]
answer = "5/3"
message = "ทำขนมมากขึ้นต้องใช้กะทิมากขึ้น ต้องคูณด้วย 60/40 ไม่ใช่ 40/60"

[[wrong]]
answer = "3/2"
message = "2½ คือ 2 + ½ = 5/2 ไม่ใช่ 2 × ½ = 1"

[[wrong]]
answer = "3"
message = "ทำเพิ่ม 20 ชิ้นคือเพิ่มครึ่งหนึ่งของสูตร กะทิต้องเพิ่มครึ่งหนึ่งของ 2½ ถ้วย คือ 1¼ ถ้วย ไม่ใช่ ½ ถ้วย"
