title = "หารจำนวนคละ"
level = 2
type = "number"
answer = "-3/2"
truth = "-(2 + Rational(1, 4)) / (1 + Rational(1, 2))"
accept = ["-1.5"]
hints = ['เปลี่ยนเป็นเศษเกินก่อน $-2\tfrac{1}{4} = -\tfrac{9}{4}$', 'หารด้วย $\tfrac{3}{2}$ คือคูณด้วยส่วนกลับ $\tfrac{2}{3}$']
statement = '''
หาค่า $-2\tfrac{1}{4} \div 1\tfrac{1}{2}$ ตอบเป็นเศษส่วนอย่างต่ำ
'''
solution = '''
1. $-2\tfrac{1}{4} = -\tfrac{9}{4}$ และ $1\tfrac{1}{2} = \tfrac{3}{2}$
2. $-\tfrac{9}{4} \div \tfrac{3}{2} = -\tfrac{9}{4} \times \tfrac{2}{3}$
3. ตัด $9$ กับ $3$ เหลือ $3$ กับ $1$ ตัด $2$ กับ $4$ เหลือ $1$ กับ $2$ ได้ $-\tfrac{3}{2}$ หรือ $-1\tfrac{1}{2}$
'''

