title = "ไฟดับ ช่องแช่แข็งอุ่นขึ้น"
level = 2
type = "number"
unit = "องศาเซลเซียส"
answer = "-7.5"
truth = "Rational('-18.5') + 4 * Rational('2.75')"
accept = ["-15/2"]
hints = ['สูงขึ้น 4 ชั่วโมง ชั่วโมงละ $2.75$ องศา รวมสูงขึ้นกี่องศา', 'สูงขึ้นคือการบวก เริ่มจาก $-18.5$']
statement = '''
ช่องแช่แข็งของตู้เย็นร้านค้าอุณหภูมิ $-18.5$ องศาเซลเซียส แล้วไฟดับ อุณหภูมิในช่องสูงขึ้นชั่วโมงละ $2.75$ องศาเท่ากันทุกชั่วโมง เมื่อไฟดับครบ 4 ชั่วโมง อุณหภูมิในช่องแช่แข็งเป็นเท่าใด
'''
solution = '''
1. 4 ชั่วโมงสูงขึ้น $4 \times 2.75 = 11$ องศา
2. $-18.5 + 11 = -7.5$
3. อุณหภูมิเป็น $-7.5$ องศาเซลเซียส ยังติดลบอยู่ เพราะสูงขึ้นไม่ถึง $18.5$ องศา
'''

