title = "เติมน้ำมันแล้วได้เงินทอน"
level = 2
type = "number"
unit = "บาท"
answer = "404.8"
truth = "1000 - Rational('38.4') * Rational('15.5')"
accept = ["404.80"]
hints = ['หาค่าน้ำมันก่อน $38.40 \times 15.5$', 'ประมาณคร่าวๆ $40 \times 15 = 600$ ค่าน้ำมันควรใกล้ $600$ บาท']
statement = '''
พ่อเติมน้ำมันเบนซินราคาลิตรละ 38.40 บาท ได้ 15.5 ลิตร แล้วจ่ายด้วยธนบัตร 1000 บาท พ่อได้เงินทอนเท่าใด
'''
solution = '''
1. ค่าน้ำมัน $38.40 \times 15.5$ คิดแบบจำนวนเต็ม $384 \times 155 = 59520$ มีทศนิยมรวมสามตำแหน่ง ได้ $595.20$ บาท
2. ใกล้กับที่ประมาณไว้ $600$ บาท
3. เงินทอน $1000 - 595.20 = 404.80$ บาท
'''

