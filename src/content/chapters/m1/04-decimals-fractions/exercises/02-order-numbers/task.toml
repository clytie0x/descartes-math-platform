hints = ['เปลี่ยนเศษส่วนทุกตัวเป็นทศนิยม $-\tfrac{2}{3}$ ใช้ทศนิยมสามตำแหน่งพอ', 'จำนวนลบอยู่ก่อนจำนวนบวกทั้งหมด']
statement = '''
เรียงจำนวนต่อไปนี้จากน้อยไปมาก
'''
solution = '''
1. เปลี่ยนเป็นทศนิยม $-\tfrac{3}{4} = -0.75$ และ $-\tfrac{2}{3} = -0.666\ldots$ และ $\tfrac{5}{8} = 0.625$
2. จำนวนลบ ระยะห่างจากศูนย์คือ $0.75 > 0.70 > 0.666\ldots$ จึงเรียงเป็น $-\tfrac{3}{4}$ $-0.7$ $-\tfrac{2}{3}$
3. จำนวนบวก $0.600 < 0.625$ จึงเป็น $0.6$ แล้ว $\tfrac{5}{8}$
'''

