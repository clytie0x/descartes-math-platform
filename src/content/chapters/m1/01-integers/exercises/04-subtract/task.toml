answer = "8"
truth = "(-6) - (-14)"
hints = ['เปลี่ยนการลบเป็นการบวกจำนวนตรงข้าม $a - b = a + (-b)$', 'จำนวนตรงข้ามของ $-14$ คือ $14$']
statement = '''
หาค่าของ $(-6) - (-14)$
'''
solution = '''
$(-6) - (-14) = (-6) + 14$ เครื่องหมายต่างกัน $14 - 6 = 8$ ตัวที่ค่าสัมบูรณ์มากกว่าคือ $14$ เป็นบวก จึงได้ $8$
'''

