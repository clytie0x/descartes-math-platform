title = "แข่งตอบปัญหา"
level = 2
type = "number"
unit = "คะแนน"
answer = "21"
truth = "9*5 + 8*(-3) + 3*0"
hints = ['เขียนคะแนนของแต่ละแบบเป็นจำนวนเต็ม ข้อถูกได้ $5$ ข้อผิดได้ $-3$ ข้อที่ไม่ตอบได้ $0$', 'คะแนนรวมคือ $9 \times 5 + 8 \times (-3) + 3 \times 0$']
statement = '''
ในการแข่งตอบปัญหากีฬาสี ตอบถูกได้ข้อละ 5 คะแนน ตอบผิดถูกหักข้อละ 3 คะแนน ข้อที่ไม่ตอบได้ 0 คะแนน ทีมสีฟ้าเจอคำถาม 20 ข้อ ตอบถูก 9 ข้อ ตอบผิด 8 ข้อ และไม่ตอบ 3 ข้อ ทีมสีฟ้าได้คะแนนรวมเท่าไร
'''
solution = '''
1. ข้อถูก $9 \times 5 = 45$ คะแนน
2. ข้อผิด $8 \times (-3) = -24$ คะแนน
3. ข้อที่ไม่ตอบ $3 \times 0 = 0$ คะแนน
4. รวม $45 + (-24) + 0 = 21$ คะแนน
'''

