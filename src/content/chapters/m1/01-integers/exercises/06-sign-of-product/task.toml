title = "ลบสามตัวคูณกัน"
level = 1
type = "number"
answer = "-60"
truth = "(-3)*(-4)*(-5)"
hints = ['นับก่อนว่ามีจำนวนลบกี่ตัว จำนวนคู่ได้บวก จำนวนคี่ได้ลบ']
statement = '''
หาค่าของ $(-3) \times (-4) \times (-5)$
'''
solution = '''
คูณทีละคู่ $(-3) \times (-4) = 12$ แล้ว $12 \times (-5) = -60$


หรือนับจำนวนลบ มีสามตัวซึ่งเป็นจำนวนคี่ ผลจึงเป็นลบ แล้วคูณค่าสัมบูรณ์ $3 \times 4 \times 5 = 60$ ได้ $-60$
'''

