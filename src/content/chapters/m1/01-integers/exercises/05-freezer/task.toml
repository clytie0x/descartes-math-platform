title = "ช่องแช่แข็ง"
level = 2
type = "number"
unit = "องศาเซลเซียส"
answer = "50"
truth = "32 - (-18)"
hints = ['ต่างกันเท่าไร คือเอาค่าที่มากกว่าลบด้วยค่าที่น้อยกว่า', 'ค่าที่น้อยกว่าคือ $-18$ จึงต้องคิด $32 - (-18)$']
statement = '''
ในห้องครัวมีอุณหภูมิ 32 องศาเซลเซียส ส่วนช่องแช่แข็งของตู้เย็นมีอุณหภูมิ $-18$ องศาเซลเซียส อุณหภูมิในห้องครัวกับในช่องแช่แข็งต่างกันกี่องศาเซลเซียส
'''
solution = '''
1. ต่างกันเท่ากับ $32 - (-18)$
2. $32 - (-18) = 32 + 18 = 50$
3. ตรวจด้วยเส้นจำนวน จาก $-18$ ขึ้นไปถึง $0$ ใช้ 18 องศา จาก $0$ ขึ้นไปถึง $32$ อีก 32 องศา รวม 50 องศา
'''

