title = "บวกต่างเครื่องหมาย"
level = 1
type = "number"
answer = "-8"
truth = "(-17) + 9"
hints = ['เครื่องหมายต่างกัน เอาค่าสัมบูรณ์ที่มากลบด้วยที่น้อย', 'ตัวที่มีค่าสัมบูรณ์มากกว่าคือ $-17$ คำตอบจึงมีเครื่องหมายแบบไหน']
statement = '''
หาค่าของ $(-17) + 9$
'''
solution = '''
เครื่องหมายต่างกัน นำค่าสัมบูรณ์มาลบกัน $17 - 9 = 8$ ตัวที่มีค่าสัมบูรณ์มากกว่าคือ $-17$ ซึ่งเป็นลบ จึงได้ $(-17) + 9 = -8$


คิดเป็นเงินคือเสีย 17 บาท ได้คืน 9 บาท ยังเสียอยู่ 8 บาท
'''

