statement = '''
จำนวนเต็ม $x$ ที่ทำให้ $|x| = 6$ มีค่าใดบ้าง ตอบทุกค่า คั่นด้วยจุลภาค
'''
solution = '''
$|x| = 6$ หมายถึง $x$ อยู่ห่างจาก $0$ หกหน่วย ทางขวาคือ $6$ ทางซ้ายคือ $-6$ จึงได้ $x = 6$ หรือ $x = -6$
'''

