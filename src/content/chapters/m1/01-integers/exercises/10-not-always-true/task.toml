title = "ข้อใดไม่จริงเสมอ"
level = 2
type = "choice"
choices = ['$a - b = b - a$', '$a + b = b + a$', '$a \times (b + c) = a \times b + a \times c$', '$a \times 1 = a$']
answer = 0
checks = ["3 - 8 != 8 - 3", "expand(a*(b + c)) == expand(a*b + a*c)"]
hints = ['ลองแทนตัวเลขจริง เช่น $a = 3$ และ $b = 8$ ดูว่าข้อไหนสองข้างไม่เท่ากัน']
statement = '''
ข้อใด**ไม่**เป็นจริงสำหรับจำนวนเต็ม $a$ $b$ และ $c$ ทุกจำนวน
'''
solution = '''
การลบสลับที่ไม่ได้ ลองแทน $a = 3$ $b = 8$ ได้ $3 - 8 = -5$ แต่ $8 - 3 = 5$ ไม่เท่ากัน


ข้ออื่นจริงเสมอ คือสมบัติการสลับที่ของการบวก สมบัติการแจกแจง และสมบัติของหนึ่ง
'''

[[wrong]]
answer = 1
message = "การบวกสลับที่ได้เสมอ เช่น (−2) + 7 = 7 + (−2) = 5"

[[wrong]]
answer = 2
message = "นี่คือสมบัติการแจกแจง จริงกับจำนวนเต็มทุกจำนวน รวมถึงจำนวนลบ"

[[wrong]]
answer = 3
message = "คูณด้วย 1 ได้ตัวเดิมเสมอ เช่น (−9) × 1 = −9"
