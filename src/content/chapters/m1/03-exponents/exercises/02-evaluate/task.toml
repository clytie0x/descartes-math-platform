answer = "243"
truth = "3**5"
hints = ['$3^5$ คือ $3$ คูณกันห้าตัว คูณทีละตัว $3$ แล้ว $9$ แล้ว $27$ ต่อไปเรื่อยๆ']
statement = '''
$3^5$ มีค่าเท่าใด
'''
solution = '''
$3^5 = 3 \times 3 \times 3 \times 3 \times 3$ คูณทีละตัวได้ $3$ $9$ $27$ $81$ และ $243$ จึงได้ $3^5 = 243$
'''

