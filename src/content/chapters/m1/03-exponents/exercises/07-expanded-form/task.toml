title = "เขียนในรูปการกระจาย"
level = 2
type = "self"
checks = [
  "4*10**6 + 7*10**4 + 5*10**2 == 4070500",
]
hints = ['แยกตัวเลขทีละหลัก หลักล้านคือ $10^6$ หลักแสนคือ $10^5$ ไล่ลงมาจนถึงหลักหน่วย']
statement = '''
เขียน $4{,}070{,}500$ ในรูปการกระจายโดยใช้เลขยกกำลังที่มีฐานเป็นสิบลงในกระดาษ เสร็จแล้วเปิดเฉลยเทียบตามเกณฑ์
'''
solution = '''
$$
4{,}070{,}500 = (4 \times 10^6) + (7 \times 10^4) + (5 \times 10^2)
$$

ตรวจของตัวเองทีละข้อ ได้ครบสามข้อถือว่าผ่าน

- $4$ อยู่หลักล้าน เขียนเป็น $4 \times 10^6$
- $7$ อยู่หลักหมื่น เขียนเป็น $7 \times 10^4$ ไม่ใช่ $10^5$ เพราะหลักแสนเป็น $0$
- $5$ อยู่หลักร้อย เขียนเป็น $5 \times 10^2$ หลักที่เป็นศูนย์ไม่ต้องมีพจน์ ถ้าเขียน $0 \times 10^5$ ไว้ด้วยก็ไม่ผิด แต่ไม่จำเป็น
'''
