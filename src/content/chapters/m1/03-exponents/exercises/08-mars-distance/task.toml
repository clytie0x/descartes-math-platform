title = "ระยะทางถึงดาวอังคาร"
level = 2
type = "number"
label = '$n =$'
answer = "8"
truth = "log(Integer(227900000) / Rational('2.279'), 10)"
hints = ['วางจุดทศนิยมหลังตัวเลขตัวแรกได้ $A = 2.279$', '$n$ เท่ากับจำนวนหลักทั้งหมดลบหนึ่ง']
statement = '''
ดาวอังคารอยู่ห่างจากดวงอาทิตย์โดยเฉลี่ยประมาณ $227{,}900{,}000$ กิโลเมตร เมื่อเขียนระยะนี้ในรูปสัญกรณ์วิทยาศาสตร์ $2.279 \times 10^n$ ค่า $n$ เป็นเท่าใด
'''
solution = '''
$227{,}900{,}000$ มีเก้าหลัก วางจุดทศนิยมหลังเลข $2$ ตัวแรก ต้องเลื่อนจุดไปทางขวาอีกแปดตำแหน่งจึงกลับเป็นจำนวนเดิม จึงได้ $227{,}900{,}000 = 2.279 \times 10^8$ และ $n = 8$
'''

[[wrong]]
answer = "5"
message = "5 คือจำนวนศูนย์ท้าย แต่ n ต้องนับทุกหลักหลังตัวเลขตัวแรก คือจำนวนหลักทั้งหมดลบหนึ่ง"

[[wrong]]
answer = "9"
message = "227,900,000 มีเก้าหลักก็จริง แต่ตัวเลขตัวแรกอยู่หน้าจุดทศนิยมแล้ว n จึงเป็นจำนวนหลักลบหนึ่ง"
