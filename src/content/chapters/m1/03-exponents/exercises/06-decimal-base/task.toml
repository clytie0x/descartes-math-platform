title = "ฐานเป็นทศนิยม"
level = 1
type = "number"
answer = "0.008"
truth = "Rational('0.2')**3"
accept = ["8/1000", "1/125"]
hints = ['$0.2^3 = 0.2 \times 0.2 \times 0.2$', 'แต่ละตัวมีทศนิยมหนึ่งตำแหน่ง คูณกันสามตัว ผลต้องมีทศนิยมกี่ตำแหน่ง']
statement = '''
$0.2^3$ มีค่าเท่าใด ตอบเป็นทศนิยม
'''
solution = '''
$0.2^3 = 0.2 \times 0.2 \times 0.2$ ตัวเลขคูณกันได้ $2 \times 2 \times 2 = 8$ แต่ละตัวมีทศนิยมหนึ่งตำแหน่ง รวมสามตำแหน่ง จึงได้ $0.008$
'''

