title = "เรียงจากน้อยไปมาก"
level = 2
type = "order"
steps = [
  '$8.5 \times 10^4$',
  '$2.1 \times 10^5$',
  '$7.4 \times 10^5$',
  '$1.3 \times 10^6$',
]
hints = ['ดูเลขชี้กำลังก่อน ตัวที่ $n$ มากกว่าจะมากกว่าเสมอ', 'ถ้า $n$ เท่ากัน ค่อยเทียบตัวเลขข้างหน้า']
statement = '''
จำนวนผู้ชมคลิปวิดีโอสี่คลิปเขียนเป็นสัญกรณ์วิทยาศาสตร์ได้ดังนี้ เรียงจากผู้ชมน้อยที่สุดไปมากที่สุด
'''
solution = '''
1. $8.5 \times 10^4$ มีเลขชี้กำลังน้อยที่สุด จึงน้อยที่สุด คือ $85{,}000$
2. $2.1 \times 10^5$ กับ $7.4 \times 10^5$ มี $n = 5$ เท่ากัน และ $2.1$ น้อยกว่า $7.4$ คือ $210{,}000$ และ $740{,}000$
3. $1.3 \times 10^6$ มีเลขชี้กำลังมากที่สุด จึงมากที่สุด คือ $1{,}300{,}000$
'''

[[wrong]]
answer = [3, 2, 1, 0]
message = "นี่คือเรียงจากมากไปน้อย โจทย์ให้เรียงจากน้อยไปมาก"

[[wrong]]
answer = [3, 1, 0, 2]
message = "อย่าดูแค่ตัวเลขข้างหน้า 1.3 × 10⁶ มีเลขชี้กำลังมากที่สุดจึงมากที่สุด ต้องเทียบเลขชี้กำลังก่อน"

[[wrong]]
answer = [0, 2, 1, 3]
message = "2.1 × 10⁵ กับ 7.4 × 10⁵ มีเลขชี้กำลังเท่ากัน ตัวที่ตัวเลขข้างหน้าน้อยกว่าจึงน้อยกว่า"
