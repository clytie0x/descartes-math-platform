title = "ฐานติดลบ"
level = 2
type = "number"
answer = "-23"
truth = "(-2)**5 + (-3)**2"
hints = ['ดูเครื่องหมายจากเลขชี้กำลังก่อน เลขชี้กำลังคี่ได้ผลลบ เลขชี้กำลังคู่ได้ผลบวก', '$(-2)^5 = -32$ แล้ว $(-3)^2$ ได้เท่าไร']
statement = '''
$(-2)^5 + (-3)^2$ มีค่าเท่าใด
'''
solution = '''
1. $(-2)^5$ เลขชี้กำลังเป็นคี่ ผลเป็นลบ ได้ $-32$
2. $(-3)^2$ เลขชี้กำลังเป็นคู่ ผลเป็นบวก ได้ $9$
3. $-32 + 9 = -23$
'''

