title = "แบคทีเรียแบ่งตัว"
level = 3
type = "number"
unit = "ตัว"
answer = "1536"
truth = "3*2**9"
hints = ['3 ชั่วโมงมีกี่ช่วง ช่วงละ 20 นาที', 'ทุกช่วงจำนวนแบคทีเรียถูกคูณด้วย $2$ แบ่ง $9$ ครั้งจึงคูณด้วย $2^9$']
statement = '''
ในนมที่ลืมไว้นอกตู้เย็นมีแบคทีเรีย $3$ ตัว แบคทีเรียแต่ละตัวแบ่งตัวเป็นสองตัวทุก $20$ นาที เมื่อผ่านไป $3$ ชั่วโมง จะมีแบคทีเรียกี่ตัว
'''
solution = '''
1. $3$ ชั่วโมงคือ $180$ นาที แบ่งตัวได้ $180 \div 20 = 9$ ครั้ง
2. ทุกครั้งที่แบ่งตัว จำนวนเป็นสองเท่า แบ่ง $9$ ครั้งจึงคูณด้วย $2^9 = 512$
3. เริ่มที่ $3$ ตัว จึงมี $3 \times 2^9 = 3 \times 512 = 1{,}536$ ตัว
'''

[[wrong]]
