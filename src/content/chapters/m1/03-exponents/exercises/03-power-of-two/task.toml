title = "หาเลขชี้กำลัง"
level = 1
type = "number"
label = '$n =$'
answer = "7"
truth = "log(128, 2)"
hints = ['หาร $128$ ด้วย $2$ ซ้ำๆ จนเหลือ $1$ แล้วนับว่าหารไปกี่ครั้ง']
statement = '''
ถ้า $2^n = 128$ แล้ว $n$ มีค่าเท่าใด
'''
solution = '''
หาร $128$ ด้วย $2$ ซ้ำๆ ได้ $64$ $32$ $16$ $8$ $4$ $2$ และ $1$ หารไปเจ็ดครั้ง จึงได้ $128 = 2^7$ และ $n = 7$
'''

