title = "แบ่งเงินตามอัตราส่วน"
level = 2
type = "number"
unit = "บาท"
answer = "900"
truth = "2400*Rational(3, 5 + 3)"
hints = ['พี่ได้ 5 ส่วน น้องได้ 3 ส่วน รวมทั้งหมดกี่ส่วน', 'หาว่าหนึ่งส่วนเท่ากับกี่บาท']
statement = '''
ป้าให้เงิน 2400 บาท แบ่งให้พี่กับน้องตามอัตราส่วน พี่ ต่อ น้อง เป็น $5 : 3$ น้องได้เงินกี่บาท
'''
solution = '''
1. ทั้งหมดมี $5 + 3 = 8$ ส่วน
2. หนึ่งส่วนเท่ากับ $2400 \div 8 = 300$ บาท
3. น้องได้ $3 \times 300 = 900$ บาท ส่วนพี่ได้ $5 \times 300 = 1500$ บาท รวมกัน $2400$ บาทพอดี
'''

[[wrong]]
answer = "1500"
message = "1500 บาทคือส่วนของพี่ซึ่งได้ 5 ส่วน น้องได้ 3 ส่วน"

[[wrong]]
answer = "1440"
message = "2400 บาทคือเงินทั้งหมด ซึ่งเท่ากับ 5 + 3 = 8 ส่วน ไม่ใช่ 5 ส่วน"

[[wrong]]
answer = "800"
message = "2400 ÷ 3 คือแบ่งเป็น 3 ส่วนเท่ากัน แต่เงินทั้งหมดมี 5 + 3 = 8 ส่วน"
