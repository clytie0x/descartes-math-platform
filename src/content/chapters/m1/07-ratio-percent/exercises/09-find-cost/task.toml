title = "หาต้นทุนจากราคาขาย"
level = 2
type = "order"
steps = [
  'ให้ต้นทุนของกระเป๋าเป็น $x$ บาท',
  'กำไรร้อยละ 20 คิดจากทุน ราคาขายจึงเป็นร้อยละ $120$ ของทุน',
  'ตั้งสัดส่วน $\dfrac{360}{x} = \dfrac{120}{100}$',
  'คูณไขว้ได้ $120x = 36000$',
  'ได้ $x = 300$ ต้นทุนคือ 300 บาท',
]
checks = ["solve(Eq(360/x, Rational(120, 100)), x) == [300]", "Rational(360 - 300, 300)*100 == 20"]
hints = ['ตัวเลข 120 ในสัดส่วนมาจากไหน ต้องรู้ข้อนั้นก่อนจึงจะตั้งสัดส่วนได้']
statement = '''
แม่ค้าขายกระเป๋าใบละ 360 บาท ได้กำไรร้อยละ 20 ของต้นทุน เรียงขั้นตอนการหาต้นทุนให้ถูกลำดับ
'''
solution = '''
1. ให้ต้นทุนเป็น $x$ บาท
2. ทุนคือร้อยละ 100 บวกกำไรร้อยละ 20 ราคาขายจึงเป็นร้อยละ 120 ของทุน
3. $\dfrac{360}{x} = \dfrac{120}{100}$
4. $120x = 36000$
5. $x = 300$ ตรวจ กำไร $360 - 300 = 60$ บาท และ $\tfrac{60}{300} \times 100 = 20$ ถูกต้อง
'''

[[wrong]]
answer = [0, 2, 1, 3, 4]
message = "ต้องรู้ก่อนว่าราคาขายเป็นร้อยละเท่าไรของทุน จึงจะเขียนเลข 120 ลงในสัดส่วนได้"

[[wrong]]
answer = [0, 1, 3, 2, 4]
message = "สมการ 120x = 36000 ได้จากการคูณไขว้สัดส่วน จึงต้องตั้งสัดส่วนก่อน"
