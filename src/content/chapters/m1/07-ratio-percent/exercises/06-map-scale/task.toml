title = "ระยะทางจากแผนที่"
level = 2
type = "number"
unit = "กิโลเมตร"
answer = "3.75"
truth = "Rational('7.5')*50000/100000"
accept = ["15/4"]
hints = ['1 เซนติเมตรบนแผนที่แทนระยะจริง 50000 เซนติเมตร', '1 กิโลเมตร เท่ากับ 100000 เซนติเมตร']
statement = '''
แผนที่ตำบลมีมาตราส่วน $1 : 50000$ วัดระยะจากบ้านถึงโรงเรียนบนแผนที่ได้ 7.5 เซนติเมตร ระยะทางจริงเป็นกี่กิโลเมตร
'''
solution = '''
1. ระยะจริง $7.5 \times 50000 = 375000$ เซนติเมตร
2. 1 กิโลเมตร $= 1000$ เมตร $= 100000$ เซนติเมตร
3. ระยะจริง $375000 \div 100000 = 3.75$ กิโลเมตร
'''

[[wrong]]
answer = "375000"
message = "375000 คือระยะทางเป็นเซนติเมตร โจทย์ถามเป็นกิโลเมตร หารด้วย 100000"

[[wrong]]
answer = "37.5"
message = "1 กิโลเมตรเท่ากับ 1000 เมตร และ 1 เมตรเท่ากับ 100 เซนติเมตร 1 กิโลเมตรจึงเท่ากับ 100000 เซนติเมตร ไม่ใช่ 10000"
