title = "กู้เงินไม่ครบปี"
level = 3
type = "number"
unit = "บาท"
answer = "6600"
truth = "6000 + 6000*Rational(15, 100)*Rational(8, 12)"
hints = ['หาดอกเบี้ย 1 ปีก่อน', '8 เดือนคือ $\tfrac{8}{12}$ ของปี', 'โจทย์ถามเงินที่ต้องคืนทั้งหมด ไม่ใช่แค่ดอกเบี้ย']
statement = '''
น้าเปิดร้านกาแฟโดยกู้เงินกองทุนหมู่บ้าน 6000 บาท อัตราดอกเบี้ยร้อยละ 15 ต่อปี คิดแบบดอกเบี้ยเชิงเดียว น้าคืนเงินทั้งหมดเมื่อครบ 8 เดือน ต้องคืนเงินรวมกี่บาท
'''
solution = '''
1. ดอกเบี้ย 1 ปี $6000 \times \dfrac{15}{100} = 900$ บาท
2. 8 เดือนคือ $\tfrac{8}{12}$ ปี ดอกเบี้ย $900 \times \dfrac{8}{12} = 600$ บาท
3. คืนทั้งหมด $6000 + 600 = 6600$ บาท
'''

[[wrong]]
answer = "600"
message = "600 บาทคือดอกเบี้ย โจทย์ถามเงินที่ต้องคืนทั้งหมด ต้องรวมเงินต้น 6000 บาทด้วย"

