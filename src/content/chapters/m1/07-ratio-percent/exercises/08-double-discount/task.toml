title = "ลดสองต่อ"
level = 2
type = "number"
unit = "บาท"
answer = "504"
truth = "800*Rational(70, 100)*Rational(90, 100)"
hints = ['ลดร้อยละ 30 เหลือจ่ายร้อยละ 70', 'การลดครั้งที่สองคิดจากราคาหลังลดครั้งแรก']
statement = '''
ชุดกีฬาราคาป้าย 800 บาท ช่วงเปิดเทอมร้านลดราคาร้อยละ 30 และนักเรียนที่ถือบัตรสมาชิกได้ลดเพิ่มอีกร้อยละ 10 จากราคาที่ลดแล้ว นักเรียนที่มีบัตรสมาชิกต้องจ่ายเงินกี่บาท
'''
solution = '''
1. ลดครั้งแรกร้อยละ 30 เหลือร้อยละ 70 ได้ $0.7 \times 800 = 560$ บาท
2. ลดครั้งที่สองร้อยละ 10 จาก 560 บาท เหลือร้อยละ 90 ได้ $0.9 \times 560 = 504$ บาท
3. ต้องจ่าย 504 บาท ลดไปทั้งหมด 296 บาท คิดเป็นร้อยละ 37 ของราคาป้าย ไม่ใช่ร้อยละ 40
'''

[[wrong]]
answer = "480"
message = "ลดร้อยละ 30 แล้วลดอีกร้อยละ 10 ไม่เท่ากับลดร้อยละ 40 เพราะครั้งที่สองคิดจากราคาที่ลดแล้ว 560 บาท"

[[wrong]]
answer = "560"
message = "560 บาทคือราคาหลังลดครั้งแรก ยังต้องลดอีกร้อยละ 10 สำหรับสมาชิก"

