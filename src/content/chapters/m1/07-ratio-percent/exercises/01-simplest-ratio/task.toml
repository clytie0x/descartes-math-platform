title = "อัตราส่วนอย่างต่ำ"
level = 1
type = "choice"
choices = ['$3 : 4$', '$9 : 12$', '$4 : 3$', '$15 : 20$']
answer = 0
checks = ["gcd(45, 60) == 15", "Rational(45, 60) == Rational(3, 4)"]
hints = ['หา ห.ร.ม. ของ $45$ กับ $60$ แล้วหารทั้งสองจำนวนด้วย ห.ร.ม.']
statement = '''
ชั้นหนังสือในห้องเรียนมีหนังสือการ์ตูน 45 เล่ม และหนังสือนิยาย 60 เล่ม อัตราส่วนอย่างต่ำของจำนวนหนังสือการ์ตูนต่อจำนวนหนังสือนิยายคือข้อใด
'''
solution = '''
การ์ตูนต่อนิยายคือ $45 : 60$ ห.ร.ม. ของ $45$ กับ $60$ คือ $15$ หารทั้งสองจำนวนด้วย $15$ ได้ $3 : 4$ ซึ่งหารต่อไม่ได้แล้ว
'''

