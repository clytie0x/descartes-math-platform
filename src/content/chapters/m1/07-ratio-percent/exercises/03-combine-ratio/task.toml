title = "รวมอัตราส่วนสองชุด"
level = 2
type = "number"
label = '$\square =$'
answer = "15"
truth = "Rational(3, 2)*10"
hints = ['ข อยู่ในทั้งสองคู่ ในคำตอบ ข เป็น $10$ คู่ที่สองต้องคูณด้วยเท่าไร ข จึงเป็น $10$']
statement = '''
เงินค่าขนมต่อวันของ ก ต่อ ข เป็น $3 : 5$ และของ ข ต่อ ค เป็น $2 : 3$ ถ้าเขียนเงินค่าขนมของ ก ต่อ ข ต่อ ค เป็น $6 : 10 : \square$ จำนวนในช่องว่างคือเท่าใด
'''
solution = '''
1. ค.ร.น. ของ $5$ กับ $2$ คือ $10$ จึงทำให้ ข เป็น $10$ ทั้งสองคู่
2. คู่แรก $3 : 5 = 6 : 10$ คูณด้วย $2$
3. คู่ที่สอง $2 : 3 = 10 : 15$ คูณด้วย $5$
4. ก ต่อ ข ต่อ ค เป็น $6 : 10 : 15$
'''

[[wrong]]
answer = "3"
message = "ข ในคู่แรกเป็น 5 แต่ในคู่ที่สองเป็น 2 ต่อกันเลยไม่ได้ ต้องคูณ 2 ต่อ 3 ด้วย 5 ให้ ข เป็น 10 ก่อน"

