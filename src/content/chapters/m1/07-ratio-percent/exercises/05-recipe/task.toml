title = "ขยายสูตรขนมครก"
level = 2
type = "number"
unit = "มิลลิลิตร"
answer = "1000"
truth = "solve(Eq(Rational(250, 400), Rational(625)/x), x)[0]"
hints = ['ให้ใช้กะทิ $x$ มิลลิลิตร เขียนแป้งต่อกะทิทั้งสองข้าง', '$\dfrac{250}{400} = \dfrac{625}{x}$']
statement = '''
สูตรขนมครกของแม่ใช้แป้ง 250 กรัม ต่อกะทิ 400 มิลลิลิตร วันนี้แม่จะทำขายในงานวัดโดยใช้แป้ง 625 กรัม ต้องใช้กะทิกี่มิลลิลิตร
'''
solution = '''
1. ให้ใช้กะทิ $x$ มิลลิลิตร ตั้งสัดส่วนแป้งต่อกะทิ $\dfrac{250}{400} = \dfrac{625}{x}$
2. คูณไขว้ $250x = 400 \times 625 = 250000$
3. $x = 1000$ ต้องใช้กะทิ 1000 มิลลิลิตร หรือ 1 ลิตร


ตรวจ แป้งเพิ่มเป็น $625 \div 250 = 2.5$ เท่า กะทิก็เพิ่มเป็น $2.5$ เท่า $400 \times 2.5 = 1000$
'''

[[wrong]]
answer = "390.625"
message = "ตั้งสัดส่วนหน่วยไม่ตรงกัน ข้างหนึ่งเป็นแป้งต่อกะทิ อีกข้างกลายเป็นกะทิต่อแป้ง แป้งเพิ่มขึ้นกะทิจึงต้องเพิ่มขึ้นด้วย"

