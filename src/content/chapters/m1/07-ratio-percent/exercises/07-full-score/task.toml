title = "หาคะแนนเต็ม"
level = 2
type = "number"
unit = "คะแนน"
answer = "40"
truth = "solve(Eq(34/x, Rational(85, 100)), x)[0]"
hints = ['34 คะแนนคือส่วน คะแนนเต็มคือทั้งหมด', '$\dfrac{34}{x} = \dfrac{85}{100}$']
statement = '''
ภูมิสอบเก็บคะแนนวิชาสังคมได้ 34 คะแนน ครูบอกว่าคิดเป็นร้อยละ 85 ของคะแนนเต็ม การสอบครั้งนี้มีคะแนนเต็มกี่คะแนน
'''
solution = '''
1. ให้คะแนนเต็มเป็น $x$ ส่วนคือ $34$ ทั้งหมดคือ $x$ ได้ $\dfrac{34}{x} = \dfrac{85}{100}$
2. คูณไขว้ $85x = 3400$ ได้ $x = 40$
3. คะแนนเต็ม 40 คะแนน ตรวจ $0.85 \times 40 = 34$
'''

