title = "อัตราส่วนที่เท่ากัน"
level = 1
type = "number"
label = '$\square =$'
answer = "48"
truth = "Rational(8*30, 5)"
hints = ['$5$ คูณด้วยเท่าไรจึงได้ $30$', 'คูณจำนวนที่สองด้วยจำนวนเดียวกัน']
statement = '''
น้ำมะนาวสูตรของร้านใช้น้ำมะนาว 5 ช้อนต่อน้ำเชื่อม 8 ช้อน ถ้าทำหม้อใหญ่ใช้น้ำมะนาว 30 ช้อน ต้องใช้น้ำเชื่อมกี่ช้อนจึงได้รสเท่าเดิม นั่นคือหาจำนวนที่ทำให้ $5 : 8 = 30 : \square$
'''
solution = '''
$5 \times 6 = 30$ จึงต้องคูณ $8$ ด้วย $6$ เช่นกัน ได้ $5 : 8 = 30 : 48$ ต้องใช้น้ำเชื่อม 48 ช้อน


ตรวจด้วยการคูณไขว้ $5 \times 48 = 240$ และ $8 \times 30 = 240$ เท่ากัน
'''

