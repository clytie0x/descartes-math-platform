# สารบัญของทั้งเว็บ แก้ที่ไฟล์นี้ที่เดียว
# เมนูซ้าย ปุ่มก่อนหน้าและถัดไป และแผนที่บทในหน้าแรก สร้างจากลำดับในไฟล์นี้
#
# slug    โฟลเดอร์ของบทใน src/content/chapters และที่อยู่บนเว็บ
# grade   ชั้นที่ขึ้นในแผนที่หน้าแรก
# book    เล่มและบทในหนังสือเรียน สสวท. ที่ตรงกัน
# topic   หมวดของเว็บ number ตัวเลขและสมการ shape รูปและการวัด data ข้อมูลและโอกาส
# levels  เฉพาะ ม.ปลาย บทนี้อยู่ในสายไหน basic พื้นฐาน adv เพิ่มเติม
#
# บทที่ยังไม่มีโฟลเดอร์ src/content/chapters/<slug>/index.mdx คือบทที่วางแผนไว้
# จะขึ้นในแผนที่หน้าแรกเป็นเส้นประ แต่ไม่อยู่ในเมนูซ้าย

